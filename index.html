// TOURNAMENT SERVICE
// ============================================================
const TournamentService = {
    create(data) {
        const t = {
            tournamentId: Utils.generateId('T'),
            tournamentName: data.tournamentName || '',
            shortName: data.shortName || '',
            organizerName: data.organizerName || '',
            venue: data.venue || '',
            province: data.province || '',
            country: data.country || 'Thailand',
            startDate: data.startDate || '',
            endDate: data.endDate || '',
            timezone: 'Asia/Bangkok',
            status: 'draft',
            defaultMaximumSpread: data.defaultMaximumSpread || 350,
            allowTies: data.allowTies !== false,
            defaultLanguage: 'th',
            notes: data.notes || '',
            createdAt: Utils.now(), updatedAt: Utils.now(),
            createdBy: 'admin', updatedBy: 'admin'
        };
        const errors = Validation.tournament(t);
        if (errors.length) return { errors };
        Storage.insert('tournaments', t);
        AuditService.log({ tournamentId: t.tournamentId, entityType: 'tournament', entityId: t.tournamentId, action: 'create', eventCode: 'TOURNAMENT_CREATED', after: t });
        return { data: t };
    },
    update(id, updates) {
        const before = Storage.getById('tournaments', 'tournamentId', id);
        if (!before) return { errors: ['Tournament not found'] };
        const merged = { ...before, ...updates };
        const errors = Validation.tournament(merged);
        if (errors.length) return { errors };
        const after = Storage.update('tournaments', 'tournamentId', id, updates);
        AuditService.log({ tournamentId: id, entityType: 'tournament', entityId: id, action: 'update', eventCode: 'TOURNAMENT_UPDATED', before, after });
        return { data: after };
    },
    getAll(filter = 'active') {
        const all = Storage.getAll('tournaments');
        if (filter === 'all') return all;
        if (filter === 'archived') return all.filter(t => t.status === 'archived');
        return all.filter(t => t.status !== 'archived');
    },
    archive(id) {
        const t = this.getById(id); if (!t) return { errors: ['Tournament not found'] };
        if (t.status !== 'approved') return { errors: ['Tournament must be APPROVED before it can be archived. Complete and approve official results first.'] };
        return TournamentCompletionService.archive(id);
    },
    restore(id) {
        const t = this.getById(id); if (!t) return { errors: ['Tournament not found'] };
        if (t.status !== 'archived') return { errors: ['Only an archived Tournament may be restored'] };

        // Archive is reversible. Restore the exact pre-archive lifecycle state.
        // TournamentCompletionService.archive() only archives APPROVED tournaments,
        // so APPROVED is the safe compatibility fallback for older archived records
        // that do not yet contain previousStatusBeforeArchive.
        const status = t.previousStatusBeforeArchive && t.previousStatusBeforeArchive !== 'archived'
            ? t.previousStatusBeforeArchive
            : 'approved';

        const after = Storage.update('tournaments', 'tournamentId', id, { status });

        // Restore archived Divisions belonging to this Tournament as well.
        // Archive never deletes competition records; it only changes operational status.
        DivisionService.getByTournament(id, 'all')
            .filter(d => d.status === 'archived')
            .forEach(d => {
                const divisionStatus = d.previousStatusBeforeArchive && d.previousStatusBeforeArchive !== 'archived'
                    ? d.previousStatusBeforeArchive
                    : 'approved';
                Storage.update('divisions', 'divisionId', d.divisionId, { status: divisionStatus });
            });

        AuditService.log({
            tournamentId: id,
            entityType: 'tournament',
            entityId: id,
            action: 'restore',
            eventCode: 'TOURNAMENT_RESTORED',
            before: t,
            after,
            reason: `Restored archived Tournament to pre-archive status: ${status}`
        });
        return { data: after };
    },
    repairLegacyRestoreDefects() {
        // Patch 01.3 compatibility repair:
        // Patch 01.2 restored archived tournaments to DRAFT because older archive records
        // did not save previousStatusBeforeArchive and child Divisions remained archived.
        // Repair only records that have an explicit ARCHIVED -> RESTORED audit trail.
        Storage.getAll('tournaments').forEach(t => {
            if (t.status !== 'draft') return;
            const logs = Storage.find('auditLogs', a => a.tournamentId === t.tournamentId);
            const hasArchive = logs.some(a => a.eventCode === 'TOURNAMENT_ARCHIVED');
            const hasRestore = logs.some(a => a.eventCode === 'TOURNAMENT_RESTORED');
            if (!hasArchive || !hasRestore) return;

            const divisions = DivisionService.getByTournament(t.tournamentId, 'all');
            const archivedDivisions = divisions.filter(d => d.status === 'archived');
            if (!archivedDivisions.length) return;

            const before = { ...t };
            const after = Storage.update('tournaments', 'tournamentId', t.tournamentId, { status: 'approved' });
            archivedDivisions.forEach(d => {
                const divisionStatus = d.previousStatusBeforeArchive && d.previousStatusBeforeArchive !== 'archived'
                    ? d.previousStatusBeforeArchive
                    : 'approved';
                Storage.update('divisions', 'divisionId', d.divisionId, { status: divisionStatus });
            });
            AuditService.log({
                tournamentId: t.tournamentId,
                entityType: 'tournament',
                entityId: t.tournamentId,
                action: 'repair',
                eventCode: 'TOURNAMENT_RESTORE_DEFECT_REPAIRED',
                before,
                after,
                reason: 'Patch 01.3 repaired legacy restore state without changing competition records.'
            });
        });
    },
    permanentDelete(id) {
        const t = this.getById(id); if (!t) return { errors: ['Tournament not found'] };
        const backup = Storage.exportAll(); backup.exportedAt = Utils.now();
        Utils.downloadJson(backup, `${(t.shortName || t.tournamentName || 'tournament').replace(/[^a-z0-9_-]+/gi,'_')}_pre_delete_backup_${new Date().toISOString().slice(0,10)}.json`);
        AuditService.log({ tournamentId: id, entityType: 'tournament', entityId: id, action: 'delete_request', eventCode: 'TOURNAMENT_PERMANENT_DELETE_REQUESTED', after: { dependencyCounts: this.dependencyCounts(id) } });
        const childCollections = ['divisions','registrations','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','rounds','pairings','matchResults','standingSnapshots'];
        childCollections.forEach(c => this._removeByTournament(c, id));
        Storage.remove('tournaments', 'tournamentId', id);
        return { data: true };
    },
    _removeByTournament(collection, id) { Storage._data[collection] = (Storage._data[collection] || []).filter(x => x.tournamentId !== id); Storage._save(); },
    dependencyCounts(id) {
        const names = ['divisions','registrations','rounds','pairings','matchResults','standingSnapshots','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','auditLogs'];
        return Object.fromEntries(names.map(c => [c, Storage.find(c, x => x.tournamentId === id).length]));
    },
    getById(id) { return Storage.getById('tournaments', 'tournamentId', id); }
};

// ============================================================
// RC4 — FINAL STAGE ENGINE
// Separate competition layer after Main Rounds.
// No Maximum Spread is applied to Final games.
// ============================================================

const FinalPlacementService = {
    getCurrent(divisionId) {
        return Storage.find('finalPlacementSnapshots', s =>
            s.divisionId === divisionId && s.status === 'current'
        ).sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0] || null;
    },

    buildRows(divisionId, stage) {
        const main = FinalStageService.mainStageState(divisionId);
        if (!main.snapshot) return { errors:['Final Main-Round Standing Snapshot is missing.'] };

        const ordered = (main.snapshot.rows || []).slice().sort((a,b)=>Number(a.rank)-Number(b.rank));
        const finalistIds = new Set([stage.player1Id, stage.player2Id]);
        const winnerId = stage.winnerId;
        const runnerUpId = stage.runnerUpId;
        if (!winnerId || !runnerUpId) return { errors:['Final Stage does not yet have an official winner and runner-up.'] };

        const byId = id => ordered.find(r=>r.playerId===id);
        const winnerMain = byId(winnerId);
        const runnerMain = byId(runnerUpId);
        if (!winnerMain || !runnerMain) return { errors:['A Finalist is missing from the final Main Standing snapshot.'] };

        const decorate = (mainRow, rank, placement, role) => {
            const reg = RegistrationService.getByDivision(divisionId).find(r =>
                r.registrationId === mainRow.registrationId || r.playerId === mainRow.playerId
            );
            const p = PlayerService.getById(mainRow.playerId);
            return {
                rank,
                finalRank:rank,
                placement,
                role,
                mainRank:Number(mainRow.rank)||null,
                registrationId:reg?.registrationId || mainRow.registrationId || null,
                tournamentPlayerCode:reg?.tournamentPlayerCode || TournamentPlayerCodeService.resolveCode(reg?.registrationId || mainRow.registrationId) || '',
                playerId:mainRow.playerId,
                playerName:reg ? CompetitionEntryService.compactName(reg) : (PlayerDisplayService.short(p) || mainRow.playerName || mainRow.playerId),
                schoolOrClub:reg ? CompetitionEntryService.affiliation(reg) : (p?.schoolOrClub || mainRow.schoolOrClub || ''),
                province:p?.province || '',
                country:p?.country || '',
                fromFinal:true
            };
        };

        const rows = [
            decorate(winnerMain, 1, 'Champion', 'winner'),
            decorate(runnerMain, 2, 'Runner-up', 'runner_up')
        ];

        ordered.filter(r=>!finalistIds.has(r.playerId)).forEach((mainRow, idx) => {
            const reg = RegistrationService.getByDivision(divisionId).find(r =>
                r.registrationId === mainRow.registrationId || r.playerId === mainRow.playerId
            );
            const p = PlayerService.getById(mainRow.playerId);
            const rank = idx + 3;
            rows.push({
                rank,
                finalRank:rank,
                placement: rank===3 ? '3rd' : rank===4 ? '4th' : `${rank}th`,
                role:'main_order',
                mainRank:Number(mainRow.rank)||null,
                registrationId:reg?.registrationId || mainRow.registrationId || null,
                tournamentPlayerCode:reg?.tournamentPlayerCode || TournamentPlayerCodeService.resolveCode(reg?.registrationId || mainRow.registrationId) || '',
                playerId:mainRow.playerId,
                playerName:reg ? CompetitionEntryService.compactName(reg) : (PlayerDisplayService.short(p) || mainRow.playerName || mainRow.playerId),
                schoolOrClub:reg ? CompetitionEntryService.affiliation(reg) : (p?.schoolOrClub || mainRow.schoolOrClub || ''),
                province:p?.province || '',
                country:p?.country || '',
                fromFinal:false
            });
        });
        return { data:rows, mainSnapshot:main.snapshot };
    },

    generate(divisionId, stage) {
        if (!stage || stage.status !== 'completed') return { errors:['Final Stage must be completed before Official Final Placement is generated.'] };
        const built = this.buildRows(divisionId, stage);
        if (built.errors) return built;

        Storage.find('finalPlacementSnapshots', s => s.divisionId === divisionId && s.status === 'current')
            .forEach(s => Storage.update('finalPlacementSnapshots','finalPlacementSnapshotId',s.finalPlacementSnapshotId,{status:'superseded',supersededAt:Utils.now()}));

        const snapshot = {
            finalPlacementSnapshotId:Utils.generateId('FPS'),
            tournamentId:stage.tournamentId,
            divisionId,
            finalStageId:stage.finalStageId,
            format:stage.format,
            mainStandingSnapshotId:built.mainSnapshot.snapshotId || null,
            status:'current',
            rows:built.data,
            createdAt:Utils.now(),
            createdBy:'admin'
        };
        Storage.insert('finalPlacementSnapshots', snapshot);
        AuditService.log({
            tournamentId:stage.tournamentId, divisionId,
            entityType:'finalPlacement', entityId:snapshot.finalPlacementSnapshotId,
            action:'create', eventCode:'FINAL_PLACEMENT_PUBLISHED',
            after:{
                finalStageId:stage.finalStageId,
                winnerId:stage.winnerId,
                runnerUpId:stage.runnerUpId,
                rowCount:snapshot.rows.length,
                principle:'Finalists occupy Rank 1-2; all non-Finalists preserve Main Standing relative order.'
            }
        });
        return { data:snapshot };
    },

    ensure(divisionId) {
        const current = this.getCurrent(divisionId);
        if (current) return { data:current };
        const stage = FinalStageService.getStage(divisionId);
        if (!stage || stage.status !== 'completed') return { errors:['Official Final Placement is not available until the Final Stage is completed.'] };
        return this.generate(divisionId,stage);
    },

    placementLabel(rank) {
        rank = Number(rank);
        if (rank === 1) return 'Champion';
        if (rank === 2) return 'Runner-up';
        if (rank === 3) return '3rd';
        if (rank === 4) return '4th';
        const mod100 = rank % 100, mod10 = rank % 10;
        const suffix = (mod100>=11 && mod100<=13) ? 'th' : mod10===1 ? 'st' : mod10===2 ? 'nd' : mod10===3 ? 'rd' : 'th';
        return `${rank}${suffix}`;
    },

    runSelfTest() {
        const sample = [
            {rank:1,playerId:'A'},{rank:2,playerId:'B'},{rank:3,playerId:'C'},{rank:4,playerId:'D'}
        ];
        const winner='B', runner='A';
        const finalists=new Set([winner,runner]);
        const output=[winner,runner,...sample.filter(r=>!finalists.has(r.playerId)).map(r=>r.playerId)];
        const ok = output.join(',') === 'B,A,C,D';
        return {ok,message:ok
            ? 'RC4.2 Final Placement Self-Test PASSED: Final winner/runner-up replace Rank 1-2 while non-Finalists preserve Main Standing order.'
            : 'RC4.2 Final Placement Self-Test FAILED.'};
    }
};

const FinalStageService = {
    formats: {
        none: { label:'No Final', winsNeeded:0, scheduledGames:0, type:'none' },
        aggregate2: { label:'2-Game Aggregate', winsNeeded:0, scheduledGames:2, type:'aggregate' },
        bo3: { label:'Best of 3', winsNeeded:2, scheduledGames:3, type:'series' },
        bo5: { label:'Best of 5', winsNeeded:3, scheduledGames:5, type:'series' },
        bo7: { label:'Best of 7', winsNeeded:4, scheduledGames:7, type:'series' }
    },

    configForDivision(divisionId) {
        const d = DivisionService.getById(divisionId);
        const key = d?.finalStageFormat || 'none';
        return { key, ...(this.formats[key] || this.formats.none) };
    },

    isConfigured(divisionId) {
        return this.configForDivision(divisionId).key !== 'none';
    },

    mainStageState(divisionId) {
        const d = DivisionService.getById(divisionId);
        if (!d) return { complete:false, errors:['Division not found'] };
        const rounds = RoundService.getByDivision(divisionId);
        const errors = [];
        for (let n=1; n<=Number(d.totalRounds||0); n++) {
            const r = rounds.find(x => Number(x.roundNumber) === n);
            if (!r) errors.push(`Round ${n} does not exist.`);
            else if (r.status !== 'locked') errors.push(`Round ${n} is not locked.`);
        }
        const snap = StandingService.getSnapshots(divisionId).find(s =>
            s.status === 'current' && Number(s.throughRound) === Number(d.totalRounds)
        ) || null;
        if (!snap) errors.push('Final Main-Round Standing Snapshot is missing.');
        return { complete:errors.length===0, errors, snapshot:snap };
    },

    getStage(divisionId) {
        return Storage.find('finalStages', s => s.divisionId === divisionId && s.status !== 'voided')
            .sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')))[0] || null;
    },

    getGames(finalStageId) {
        return Storage.find('finalGames', g => g.finalStageId === finalStageId && g.status !== 'voided')
            .sort((a,b)=>Number(a.gameNumber)-Number(b.gameNumber));
    },

    defaultQualifierRegistrations(divisionId) {
        const main = this.mainStageState(divisionId);
        if (!main.snapshot) return [];
        const regs = RegistrationService.getByDivision(divisionId);
        return (main.snapshot.rows || []).slice().sort((a,b)=>Number(a.rank)-Number(b.rank)).slice(0,2).map(row => {
            return regs.find(r => r.registrationId === row.registrationId) ||
                   regs.find(r => r.playerId === row.playerId) || null;
        }).filter(Boolean);
    },

    start(divisionId, registration1Id, registration2Id, source='standing') {
        const d = DivisionService.getById(divisionId);
        if (!d) return { errors:['Division not found'] };
        const cfg = this.configForDivision(divisionId);
        if (cfg.key === 'none') return { errors:['This Division is configured with No Final.'] };
        const t = TournamentService.getById(d.tournamentId);
        if (!t || t.status !== 'active') return { errors:[`Final Stage requires an ACTIVE Tournament. Current status: ${String(t?.status||'').toUpperCase()}.`] };
        const main = this.mainStageState(divisionId);
        if (!main.complete) return { errors:['Main Rounds are not complete.', ...main.errors] };

        const existing = this.getStage(divisionId);
        if (existing) return { errors:['Final Stage already exists for this Division.'] };

        const regs = RegistrationService.getByDivision(divisionId);
        const r1 = regs.find(r => r.registrationId === registration1Id);
        const r2 = regs.find(r => r.registrationId === registration2Id);
        if (!r1 || !r2) return { errors:['Both Finalists must be registered in this Division.'] };
        if (r1.registrationId === r2.registrationId) return { errors:['Finalists must be different competitors.'] };

        const p1 = PlayerService.getById(r1.playerId);
        const p2 = PlayerService.getById(r2.playerId);
        const stage = {
            finalStageId: Utils.generateId('FIN'),
            tournamentId: d.tournamentId,
            divisionId,
            format: cfg.key,
            formatLabel: cfg.label,
            scheduledGames: cfg.scheduledGames,
            winsNeeded: cfg.winsNeeded,
            qualifierSource: source,
            player1RegistrationId:r1.registrationId, player1Id:r1.playerId,
            player2RegistrationId:r2.registrationId, player2Id:r2.playerId,
            player1Name: CompetitionEntryService.compactName(r1),
            player2Name: CompetitionEntryService.compactName(r2),
            player1Wins:0, player2Wins:0,
            player1AggregateScore:0, player2AggregateScore:0,
            status:'in_progress',
            winnerRegistrationId:null, winnerId:null,
            runnerUpRegistrationId:null, runnerUpId:null,
            tieBreakRequired:false,
            createdAt:Utils.now(), createdBy:'admin', updatedAt:Utils.now()
        };
        Storage.insert('finalStages', stage);
        Storage.update('divisions','divisionId',divisionId,{status:'final_in_progress', finalStageId:stage.finalStageId});
        AuditService.log({
            tournamentId:d.tournamentId, divisionId, entityType:'finalStage', entityId:stage.finalStageId,
            action:'create', eventCode:'FINAL_STAGE_CREATED',
            after:{format:cfg.key, qualifierSource:source, finalist1:r1.playerId, finalist2:r2.playerId}
        });
        AuditService.log({
            tournamentId:d.tournamentId, divisionId, entityType:'finalStage', entityId:stage.finalStageId,
            action:'qualifiers_set', eventCode:'FINAL_QUALIFIERS_SELECTED',
            after:{source, player1RegistrationId:r1.registrationId, player2RegistrationId:r2.registrationId}
        });
        return { data:stage };
    },

    submitGame(finalStageId, score1, score2) {
        const stage = Storage.getById('finalStages','finalStageId',finalStageId);
        if (!stage) return { errors:['Final Stage not found'] };
        if (stage.status !== 'in_progress') return { errors:['Final Stage is not in progress.'] };
        const d = DivisionService.getById(stage.divisionId);
        const t = d ? TournamentService.getById(d.tournamentId) : null;
        if (!d || !t || t.status !== 'active') return { errors:['Final game entry requires an ACTIVE Tournament.'] };

        score1 = Number(score1); score2 = Number(score2);
        if (!Number.isInteger(score1) || !Number.isInteger(score2) || score1 < 0 || score2 < 0) {
            return { errors:['Final scores must be non-negative whole numbers.'] };
        }

        const games = this.getGames(finalStageId);
        const gameNumber = games.length + 1;
        const game = {
            finalGameId:Utils.generateId('FG'),
            finalStageId, tournamentId:stage.tournamentId, divisionId:stage.divisionId,
            gameNumber,
            player1RegistrationId:stage.player1RegistrationId, player1Id:stage.player1Id, player1Score:score1,
            player2RegistrationId:stage.player2RegistrationId, player2Id:stage.player2Id, player2Score:score2,
            actualSpreadPlayer1:score1-score2,
            actualSpreadPlayer2:score2-score1,
            winnerId:score1===score2 ? null : (score1>score2 ? stage.player1Id : stage.player2Id),
            isTie:score1===score2,
            spreadCapApplied:false,
            scoringMode:'actual_no_cap',
            status:'completed',
            createdAt:Utils.now(), createdBy:'admin'
        };
        Storage.insert('finalGames', game);
        AuditService.log({
            tournamentId:stage.tournamentId, divisionId:stage.divisionId,
            entityType:'finalGame', entityId:game.finalGameId, action:'record',
            eventCode:'FINAL_GAME_RECORDED',
            after:{gameNumber,score1,score2,actualSpreadPlayer1:score1-score2,spreadCapApplied:false}
        });

        const refreshed = this.recalculate(finalStageId);
        TournamentCompletionService.evaluate(stage.tournamentId);
        return { data:game, stage:refreshed };
    },

    recalculate(finalStageId) {
        const stage = Storage.getById('finalStages','finalStageId',finalStageId);
        if (!stage) return null;
        const cfg = this.formats[stage.format] || this.formats.none;
        const games = this.getGames(finalStageId);

        let p1Wins=0, p2Wins=0, p1Total=0, p2Total=0;
        games.forEach(g => {
            p1Total += Number(g.player1Score)||0;
            p2Total += Number(g.player2Score)||0;
            if (g.winnerId === stage.player1Id) p1Wins++;
            else if (g.winnerId === stage.player2Id) p2Wins++;
        });

        let completed=false, winnerId=null, tieBreakRequired=false;
        if (cfg.type === 'aggregate') {
            const regulation = games.slice(0,2);
            if (regulation.length >= 2) {
                const reg1 = regulation.reduce((s,g)=>s+(Number(g.player1Score)||0),0);
                const reg2 = regulation.reduce((s,g)=>s+(Number(g.player2Score)||0),0);
                if (reg1 !== reg2) {
                    completed=true; winnerId=reg1>reg2 ? stage.player1Id : stage.player2Id;
                } else {
                    const tieBreakGames = games.slice(2);
                    const decided = tieBreakGames.find(g => g.winnerId);
                    if (decided) { completed=true; winnerId=decided.winnerId; }
                    else tieBreakRequired=true;
                }
            }
        } else if (cfg.type === 'series') {
            if (p1Wins >= cfg.winsNeeded) { completed=true; winnerId=stage.player1Id; }
            else if (p2Wins >= cfg.winsNeeded) { completed=true; winnerId=stage.player2Id; }
        }

        const updates = {
            player1Wins:p1Wins, player2Wins:p2Wins,
            player1AggregateScore:p1Total, player2AggregateScore:p2Total,
            tieBreakRequired,
            status:completed ? 'completed' : 'in_progress'
        };
        if (completed) {
            updates.winnerId = winnerId;
            updates.winnerRegistrationId = winnerId === stage.player1Id ? stage.player1RegistrationId : stage.player2RegistrationId;
            updates.runnerUpId = winnerId === stage.player1Id ? stage.player2Id : stage.player1Id;
            updates.runnerUpRegistrationId = winnerId === stage.player1Id ? stage.player2RegistrationId : stage.player1RegistrationId;
            updates.completedAt = Utils.now();
        }
        const saved = Storage.update('finalStages','finalStageId',finalStageId,updates);

        if (completed && stage.status !== 'completed') {
            Storage.update('divisions','divisionId',stage.divisionId,{status:'final_completed', finalCompletedAt:Utils.now()});
            const placementResult = FinalPlacementService.generate(stage.divisionId, saved);
            if (placementResult.errors) {
                AuditService.log({
                    tournamentId:stage.tournamentId, divisionId:stage.divisionId,
                    entityType:'finalPlacement', entityId:stage.finalStageId,
                    action:'error', eventCode:'FINAL_PLACEMENT_GENERATION_FAILED',
                    reason:placementResult.errors.join(' ')
                });
            }
            AuditService.log({
                tournamentId:stage.tournamentId, divisionId:stage.divisionId,
                entityType:'finalStage', entityId:finalStageId, action:'complete',
                eventCode:'FINAL_STAGE_COMPLETED',
                after:{format:stage.format,winnerId,player1Wins:p1Wins,player2Wins:p2Wins,player1AggregateScore:p1Total,player2AggregateScore:p2Total}
            });
        }
        return saved;
    },

    stateForDivision(divisionId) {
        const configured = this.isConfigured(divisionId);
        const main = this.mainStageState(divisionId);
        const stage = this.getStage(divisionId);
        return {
            configured, mainComplete:main.complete, mainErrors:main.errors,
            stage, games:stage ? this.getGames(stage.finalStageId) : [],
            finalComplete:!!stage && stage.status === 'completed'
        };
    },

    runSelfTest() {
        const errors = [];
        const noCap = {score1:500,score2:100,spread:400};
        if (noCap.score1-noCap.score2 !== noCap.spread) errors.push('Actual Spread arithmetic failed.');
        const bo5 = this.formats.bo5;
        if (bo5.winsNeeded !== 3 || bo5.scheduledGames !== 5) errors.push('Best-of-5 threshold is wrong.');
        const agg = this.formats.aggregate2;
        if (agg.type !== 'aggregate' || agg.scheduledGames !== 2) errors.push('2-Game Aggregate config is wrong.');
        return {ok:errors.length===0,errors,message:errors.length?`RC4 Final Stage Self-Test FAILED: ${errors.join(' ')}`:'RC4 Final Stage Self-Test PASSED: formats, win thresholds, and uncapped Actual Spread rules are configured correctly.'};
    }
};

const TournamentCompletionService = {
    inspect(tournamentId) {
        const divisions = DivisionService.getByTournament(tournamentId, 'all').filter(d => d.status !== 'cancelled');
        const report = {
            readyForApproval: divisions.length > 0, divisions: [], completedDivisions: 0,
            totalDivisions: divisions.length, lockedRounds: 0, totalRounds: 0,
            pendingResults: 0, finalStandings: 0, configuredFinals:0, completedFinals:0
        };
        divisions.forEach(d => {
            const rounds = RoundService.getByDivision(d.divisionId);
            const issues = [], locked = rounds.filter(r => r.status === 'locked');
            report.totalRounds += Number(d.totalRounds) || 0; report.lockedRounds += locked.length;
            for (let n = 1; n <= Number(d.totalRounds || 0); n++) {
                const round = rounds.find(r => Number(r.roundNumber) === n);
                if (!round) { issues.push(`Round ${n} does not exist.`); continue; }
                if (round.status !== 'locked') issues.push(`Round ${n} is not locked.`);
                const pairings = PairingService.getByRound(round.roundId);
                const results = ResultService.getByRound(round.roundId);
                const pending = pairings.filter(p => p.pairingType === 'normal' && !results.some(x => x.pairingId === p.pairingId));
                report.pendingResults += pending.length;
                if (pending.length) issues.push(`Round ${n} has pending Match Results.`);
                if (pairings.some(p => p.status === 'confirmed' && !results.some(x => x.pairingId === p.pairingId))) issues.push(`Round ${n} has incomplete confirmed Pairings.`);
            }

            const finalStanding = StandingService.getSnapshots(d.divisionId).some(s => s.status === 'current' && Number(s.throughRound) === Number(d.totalRounds));
            if (finalStanding) report.finalStandings++;
            else issues.push('Final Official Standing Snapshot is missing.');

            const mainComplete = issues.length === 0 &&
                rounds.length >= Number(d.totalRounds || 0) &&
                locked.length >= Number(d.totalRounds || 0) &&
                finalStanding;

            const finalState = FinalStageService.stateForDivision(d.divisionId);
            let finalComplete = true;
            if (finalState.configured) {
                report.configuredFinals++;
                finalComplete = finalState.finalComplete;
                if (finalComplete) report.completedFinals++;
                else if (mainComplete) issues.push(finalState.stage ? 'Final Stage is still in progress.' : 'Final Stage is pending.');
            }

            const complete = mainComplete && finalComplete;
            if (complete) report.completedDivisions++;
            report.divisions.push({
                divisionId:d.divisionId, divisionCode:d.divisionCode,
                totalRounds:Number(d.totalRounds)||0, lockedRounds:locked.length,
                finalStandingExists:finalStanding, mainComplete,
                finalConfigured:finalState.configured,
                finalStageStatus:finalState.stage?.status || (finalState.configured && mainComplete ? 'pending' : 'not_started'),
                complete, issues
            });
        });
        report.readyForApproval = report.totalDivisions > 0 && report.completedDivisions === report.totalDivisions;
        return report;
    },

    evaluate(tournamentId) {
        const t = TournamentService.getById(tournamentId), report = this.inspect(tournamentId);
        report.divisions.forEach(d => {
            const current = DivisionService.getById(d.divisionId);
            if (!current) return;

            if (d.complete) {
                if (!['completed','approved','archived'].includes(current.status)) {
                    Storage.update('divisions','divisionId',d.divisionId,{ status:'completed', completedAt:Utils.now() });
                    AuditService.log({
                        tournamentId, divisionId:d.divisionId, entityType:'division', entityId:d.divisionId,
                        action:'status_change', eventCode:'DIVISION_COMPETITION_COMPLETED',
                        reason:d.finalConfigured ? 'Main Rounds and configured Final Stage completed' : 'All scheduled rounds locked and final official standing exists',
                        before:{beforeStatus:current.status}, after:{afterStatus:'completed'}
                    });
                }
                return;
            }

            if (d.mainComplete && d.finalConfigured) {
                const nextStatus = d.finalStageStatus === 'in_progress' ? 'final_in_progress' :
                                   d.finalStageStatus === 'completed' ? 'final_completed' : 'final_pending';
                if (current.status !== nextStatus) {
                    Storage.update('divisions','divisionId',d.divisionId,{status:nextStatus});
                    AuditService.log({
                        tournamentId, divisionId:d.divisionId, entityType:'division', entityId:d.divisionId,
                        action:'status_change', eventCode:'DIVISION_FINAL_STAGE_STATUS_CHANGED',
                        before:{beforeStatus:current.status}, after:{afterStatus:nextStatus}
                    });
                }
            }
        });

        if (t && t.status === 'active' && report.readyForApproval) {
            const beforeStatus = t.status;
            Storage.update('tournaments','tournamentId',tournamentId,{ status:'completed_pending_approval', competitionCompletedAt:Utils.now() });
            AuditService.log({
                tournamentId, entityType:'tournament', entityId:tournamentId, action:'status_change',
                eventCode:'TOURNAMENT_COMPETITION_COMPLETED',
                reason:'All non-cancelled divisions completed Main Rounds and any configured Final Stage',
                before:{beforeStatus}, after:{afterStatus:'completed_pending_approval'}
            });
        }
        return report;
    },

    reconcileAll() {
        TournamentService.getAll('all').filter(t => t.status === 'active').forEach(t => this.evaluate(t.tournamentId));
    },

    readiness(tournamentId) {
        const t = TournamentService.getById(tournamentId);
        if (!t) return { ready:false, errors:['Tournament not found'], divisions:[] };
        const divs = DivisionService.getByTournament(tournamentId, 'all').filter(d => d.status !== 'cancelled' && d.status !== 'archived');
        const errors = [], divisions = [];
        if (!divs.length) errors.push('Create at least one Division before starting the Tournament.');
        divs.forEach(d => {
            const issues = [];
            if (!String(d.divisionCode || '').trim()) issues.push('Division code is required.');
            if (!String(d.divisionName || '').trim()) issues.push('Division name is required.');
            if (!Number.isInteger(Number(d.totalRounds)) || Number(d.totalRounds) < 1) issues.push('Total rounds must be at least 1.');
            if (!Number.isFinite(Number(d.maximumSpread)) || Number(d.maximumSpread) <= 0) issues.push('Maximum Spread must be greater than 0.');
            if (!['none','aggregate2','bo3','bo5','bo7'].includes(d.finalStageFormat || 'none')) issues.push('Final Stage format is invalid.');
            const regs = RegistrationService.getByDivision(d.divisionId).filter(r => r.entryStatus !== 'cancelled');
            const minPlayers = Number(d.minimumPlayers) || 2;
            if (regs.length < minPlayers) issues.push(`At least ${minPlayers} registered player(s) are required; currently ${regs.length}.`);
            divisions.push({ divisionId:d.divisionId, divisionCode:d.divisionCode, issues, registrationCount:regs.length });
            issues.forEach(x => errors.push(`${d.divisionCode || d.divisionName || 'Division'}: ${x}`));
        });
        return { ready: errors.length === 0, errors, divisions };
    },
    requireActive(tournamentId, actionLabel='This competition action') {
        const t = TournamentService.getById(tournamentId);
        if (!t) return { errors:['Tournament not found'] };
        if (t.status !== 'active') return { errors:[`${actionLabel} requires an ACTIVE Tournament. Current status: ${String(t.status || '').toUpperCase()}.`] };
        return { data:t };
    },
    markReady(tournamentId) {
        const t = TournamentService.getById(tournamentId);
        if (!t || t.status !== 'draft') return { errors:['Tournament must be in draft status'] };
        const check = this.readiness(tournamentId);
        if (!check.ready) return { errors: check.errors };
        const before = t.status;
        Storage.update('tournaments','tournamentId',tournamentId,{status:'ready'});
        DivisionService.getByTournament(tournamentId, 'all').filter(d=>d.status==='draft').forEach(d=>Storage.update('divisions','divisionId',d.divisionId,{status:'ready'}));
        AuditService.log({tournamentId,entityType:'tournament',entityId:tournamentId,action:'status_change',eventCode:'TOURNAMENT_MARKED_READY',before:{beforeStatus:before},after:{afterStatus:'ready'},reason:'Readiness validation passed'});
        return {data:true, readiness:check};
    },
    start(tournamentId) {
        const t = TournamentService.getById(tournamentId);
        if (!t || t.status !== 'ready') return {errors:['Tournament must be ready to start']};
        const check = this.readiness(tournamentId);
        if (!check.ready) return { errors: check.errors };
        Storage.update('tournaments','tournamentId',tournamentId,{status:'active',startedAt:Utils.now()});
        DivisionService.getByTournament(tournamentId, 'all').filter(d=>['draft','ready'].includes(d.status)).forEach(d=>Storage.update('divisions','divisionId',d.divisionId,{status:'active'}));
        AuditService.log({tournamentId,entityType:'tournament',entityId:tournamentId,action:'status_change',eventCode:'TOURNAMENT_STARTED',before:{beforeStatus:'ready'},after:{afterStatus:'active'}});
        const completion = this.evaluate(tournamentId);
        return {data:TournamentService.getById(tournamentId), completion};
    },
    approve(tournamentId, reason='') {
        const t = TournamentService.getById(tournamentId), report = this.inspect(tournamentId);
        if (!t || t.status !== 'completed_pending_approval') return {errors:['Tournament is not awaiting approval']};
        if (!report.readyForApproval) return {errors:report.divisions.flatMap(d=>d.issues)};
        Storage.update('tournaments','tournamentId',tournamentId,{status:'approved',approvedAt:Utils.now(),approvedBy:'admin',approvalReason:reason});
        DivisionService.getByTournament(tournamentId,'all').filter(d=>d.status==='completed').forEach(d=>Storage.update('divisions','divisionId',d.divisionId,{status:'approved',approvedAt:Utils.now()}));
        AuditService.log({tournamentId,entityType:'tournament',entityId:tournamentId,action:'status_change',eventCode:'TOURNAMENT_RESULTS_APPROVED',reason,before:{beforeStatus:t.status},after:{afterStatus:'approved'}}); return {data:true};
    },
    rollbackForCorrection(tournamentId, divisionId, context = {}) {
        const t = TournamentService.getById(tournamentId);
        const d = DivisionService.getById(divisionId);
        if (!t || !d) throw new Error('Tournament or Division not found for correction rollback.');
        if (t.status === 'archived') throw new Error('Archived Tournament cannot enter correction workflow until restored.');

        const beforeTournamentStatus = t.status;
        const beforeDivisionStatus = d.status;

        if (['completed_pending_approval','approved'].includes(t.status)) {
            Storage.update('tournaments','tournamentId',tournamentId,{
                status:'active',
                competitionCompletedAt:null,
                approvedAt:null,
                approvedBy:null,
                approvalReason:null
            });
        }
        if (['completed','approved'].includes(d.status)) {
            Storage.update('divisions','divisionId',divisionId,{
                status:'active',
                completedAt:null,
                approvedAt:null
            });
        }

        const afterT = TournamentService.getById(tournamentId);
        const afterD = DivisionService.getById(divisionId);
        if (beforeTournamentStatus !== afterT.status || beforeDivisionStatus !== afterD.status) {
            AuditService.log({
                tournamentId,
                divisionId,
                roundId: context.roundId || null,
                entityType:'tournament',
                entityId:tournamentId,
                action:'lifecycle_rollback',
                eventCode:'COMPETITION_LIFECYCLE_ROLLED_BACK_FOR_CORRECTION',
                reason:context.reason || 'Historical round correction',
                before:{ tournamentStatus:beforeTournamentStatus, divisionStatus:beforeDivisionStatus },
                after:{ tournamentStatus:afterT.status, divisionStatus:afterD.status, correctionFromRound:Number(context.roundNumber)||null }
            });
        }
        return { tournamentStatus:afterT.status, divisionStatus:afterD.status };
    },
    archive(tournamentId) {
        const t = TournamentService.getById(tournamentId); if (!t || t.status !== 'approved') return {errors:['Only an approved Tournament may be archived']};
        Storage.update('tournaments','tournamentId',tournamentId,{status:'archived',previousStatusBeforeArchive:t.status});
        DivisionService.getByTournament(tournamentId,'all').filter(d=>d.status!=='archived').forEach(d=>Storage.update('divisions','divisionId',d.divisionId,{status:'archived',previousStatusBeforeArchive:d.status}));
        AuditService.log({tournamentId,entityType:'tournament',entityId:tournamentId,action:'status_change',eventCode:'TOURNAMENT_ARCHIVED',before:{beforeStatus:'approved'},after:{afterStatus:'archived'}}); return {data:true};
    }
};

        const pp = { pairingPlanId: Utils.generateId('PP'), tournamentId: d.tournamentId, divisionId: d.divisionId, planName: 'Manual', planType: 'custom_sequence', totalRounds: d.totalRounds, roundRules: [], engineSettings: {}, version: 1, status: 'active', createdAt: Utils.now(), updatedAt: Utils.now() };

        Storage.insert('rankingRuleSets', rrs);

        Storage.insert('byePolicies', bp);
        const rp = { resultPolicyId: Utils.generateId('RP'), tournamentId: d.tournamentId, divisionId: d.divisionId, normal: { countsAsGame: true, useEnteredScores: true, useOfficialSpread: true }, bye: { useByePolicy: true }, walkover: { countsAsGame: true, winnerGetsWin: true, scoreMode: 'policy_defined', scoreFor: 100, scoreAgainst: 0, officialSpreadAwarded: 100 }, forfeit: { countsAsGame: true, winnerGetsWin: true, scoreMode: 'entered_adjusted', useOfficialSpread: true }, void: { countsAsGame: false, countsForStanding: false }, version: 1, status: 'active' };
        Storage.insert('resultPolicies', rp);

    },
    update(id, updates) {
        const before = Storage.getById('divisions', 'divisionId', id);
        if (!before) return { errors: ['Division not found'] };
        const merged = { ...before, ...updates };
        const errors = Validation.division(merged);
        if (errors.length) return { errors };
        const after = Storage.update('divisions', 'divisionId', id, updates);
        AuditService.log({ tournamentId: before.tournamentId, divisionId: id, entityType: 'division', entityId: id, action: 'update', eventCode: 'DIVISION_UPDATED', before, after });
        return { data: after };
    },
    getByTournament(tid, filter = 'active') {
        const rows = Storage.find('divisions', d => d.tournamentId === tid);
        const filtered = filter === 'all' ? rows : filter === 'archived' ? rows.filter(d => d.status === 'archived') : rows.filter(d => d.status !== 'archived');
        return filtered.sort((a,b)=>a.sortOrder-b.sortOrder);
    },
    archive(id) {
        const d = this.getById(id); if (!d) return { errors: ['Division not found'] };
        const previousStatus = d.status === 'archived' ? (d.previousStatusBeforeArchive || 'draft') : d.status;
        const after = Storage.update('divisions', 'divisionId', id, { status: 'archived', previousStatusBeforeArchive: previousStatus });
        AuditService.log({ tournamentId: d.tournamentId, divisionId: id, entityType: 'division', entityId: id, action: 'archive', eventCode: 'DIVISION_ARCHIVED', before: d, after });
        return { data: after };
    },
    restore(id) {
        const d = this.getById(id); if (!d) return { errors: ['Division not found'] };
        const status = d.previousStatusBeforeArchive && d.previousStatusBeforeArchive !== 'archived' ? d.previousStatusBeforeArchive : 'draft';
        const after = Storage.update('divisions', 'divisionId', id, { status });
        AuditService.log({ tournamentId: d.tournamentId, divisionId: id, entityType: 'division', entityId: id, action: 'restore', eventCode: 'DIVISION_RESTORED', before: d, after });
        return { data: after };
    },
    safeDeleteCheck(id) {
        const d = this.getById(id);
        if (!d) return { ok:false, errors:['Division not found'], blocking:{} };
        const blockingCollections = ['registrations','rounds','pairings','matchResults','standingSnapshots','finalStages','finalGames','finalPlacementSnapshots'];
        const blocking = Object.fromEntries(blockingCollections.map(c=>[c,Storage.find(c,x=>x.divisionId===id).length]));
        const used = Object.values(blocking).some(n=>n>0);
        if (used) {
            const labels = {
                registrations:'Registration',
                rounds:'Round',
                pairings:'Pairing',
                matchResults:'Result',
                standingSnapshots:'Standing Snapshot',
                finalStages:'Final Stage',
                finalGames:'Final Game',
                finalPlacementSnapshots:'Final Placement'
            };
            const found = Object.entries(blocking).filter(([,n])=>n>0).map(([k,n])=>`${labels[k]} ${n}`).join(', ');
            return {
                ok:false,
                errors:[`Division has competition data and is protected from permanent deletion: ${found}`],
                blocking
            };
        }
        return { ok:true, errors:[], blocking };
    },
    permanentDelete(id) {
        const d = this.getById(id); if (!d) return { errors: ['Division not found'] };
        const check = this.safeDeleteCheck(id);
        if (!check.ok) return { errors: check.errors, blocking:check.blocking };
        const t = TournamentService.getById(d.tournamentId);
        const backup = Storage.exportAll(); backup.exportedAt = Utils.now();
        Utils.downloadJson(backup, `${(t?.shortName || t?.tournamentName || 'tournament').replace(/[^a-z0-9_-]+/gi,'_')}_${d.divisionCode}_pre_delete_backup_${new Date().toISOString().slice(0,10)}.json`);
        const deps = this.dependencyCounts(id);
        AuditService.log({ tournamentId: d.tournamentId, divisionId: id, entityType: 'division', entityId: id, action: 'delete_request', eventCode: 'DIVISION_PERMANENT_DELETE_REQUESTED', before:d, after:deps });
        ['registrations','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','rounds','pairings','matchResults','standingSnapshots','finalStages','finalGames','finalPlacementSnapshots'].forEach(c => {
            Storage._data[c] = (Storage._data[c] || []).filter(x => x.divisionId !== id);
        });
        Storage._data.divisions = Storage._data.divisions.filter(x => x.divisionId !== id);
        Storage._save();
        AuditService.log({ tournamentId: d.tournamentId, divisionId: id, entityType: 'division', entityId: id, action: 'delete', eventCode: 'DIVISION_PERMANENTLY_DELETED', before:d, after:{deleted:true,dependenciesBeforeDelete:deps} });
        return { data: true };
    },
    dependencyCounts(id) { const names=['registrations','rounds','pairings','matchResults','standingSnapshots','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','finalStages','finalGames','finalPlacementSnapshots']; return Object.fromEntries(names.map(c=>[c,Storage.find(c,x=>x.divisionId===id).length])); },
    getById(id) { return Storage.getById('divisions', 'divisionId', id); }
};

const levenshteinDistance = (a,b) => {
    a=String(a||''); b=String(b||'');
    if (a===b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
    let prev=Array.from({length:b.length+1},(_,i)=>i), curr=new Array(b.length+1);

        curr[0]=i;
        for (let j=1;j<=b.length;j++) curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));

    }
    return prev[b.length];
};
const ProvinceGuardService = {
    inspect(value, country='Thailand') {
        const raw=String(value||'').trim().replace(/\s+/g,' ');
        const countryEn=normalizeCountry(country||'Thailand');
        if (!raw) return { ok:false, raw, canonical:'', suggestion:'', reason:'required' };
        // Province/State outside Thailand remains free text.
        if (countryEn !== 'Thailand') return { ok:true, raw, canonical:raw, suggestion:'', reason:'foreign_free_text' };
        const canonical=provinceCanonicalExact(raw);
        if (canonical) return { ok:true, raw, canonical, suggestion:'', reason:'exact' };
        const source=provinceLookupCompact(raw);
        let best=null;
        THAILAND_PROVINCES.forEach((en,i)=>{
            [en,THAILAND_PROVINCES_TH[i]].forEach(alias=>{
                const target=provinceLookupCompact(alias);
                const distance=levenshteinDistance(source,target);
                const maxLen=Math.max(source.length,target.length,1);
                const ratio=distance/maxLen;

                if (!best || candidate.ratio<best.ratio || (candidate.ratio===best.ratio && candidate.distance<best.distance)) best=candidate;

        const threshold = source.length <= 5 ? 1 : (source.length <= 9 ? 2 : 3);
        const suggestion = best && best.distance <= threshold && best.ratio <= 0.34 ? best.en : '';

    }
};

            this.norm(normalizeProvince(p.province)) === province &&
            this.norm(normalizeCountry(p.country || 'Thailand')) === country
        ) || null;
    },
    inspectRow(player) {
        const allPlayers = Storage.getAll('players');
        const member1 = { thaiName:player.thaiName, schoolOrClub:player.schoolOrClub, province:player.province, country:player.country };
        const member2Present = !!String(player.thaiName2 || '').trim();
        const member2 = member2Present ? { thaiName:player.thaiName2, schoolOrClub:player.schoolOrClub2, province:player.province, country:player.country } : null;
        const existing1 = this.exactExisting(member1, allPlayers);
        const existing2 = member2 ? this.exactExisting(member2, allPlayers) : null;
        return { existing1, existing2, member2Present };
    }
};
const PlayerService = {
    create(data) {
        const p = {
            playerId: data.playerId || Utils.generateId('P'),
            firstName: data.firstName || '', lastName: data.lastName || '',
            displayName: data.displayName || '',
            firstNameTh: data.firstNameTh || '', lastNameTh: data.lastNameTh || '', thaiName: data.thaiName || '',
            nickname: data.nickname || '',
            schoolOrClub: data.schoolOrClub || '', province: normalizeProvince(data.province), country: normalizeCountry(data.country),
            entryGroupId: data.entryGroupId || null,
            entryGroupMemberIndex: data.entryGroupMemberIndex ? Number(data.entryGroupMemberIndex) : null,
            currentRating: data.currentRating ? parseInt(data.currentRating) : null,
            ratingSystem: data.ratingSystem || '',
            intendedDivisions: PlayerIntentService.normalizeTags(data.intendedDivisions || data.preferredDivisions || data.eligibleDivisions || ''),
            registrationNote: String(data.registrationNote || data.importNote || '').trim(),
            status: 'active', notes: data.notes || '',
            createdAt: Utils.now(), updatedAt: Utils.now(), createdBy: 'admin', updatedBy: 'admin'
        };
        const errors = Validation.player(p);
        if (errors.length) return { errors };
        // Duplicate warning
        const warnings = [];
        const similar = Storage.find('players', x => x.status !== 'archived' && ((x.firstName === p.firstName && x.lastName === p.lastName && x.schoolOrClub === p.schoolOrClub) || (x.firstNameTh === p.firstNameTh && x.lastNameTh === p.lastNameTh && x.schoolOrClub === p.schoolOrClub)));
        if (similar.length > 0 && !data._skipDuplicateCheck) warnings.push(`Possible duplicate: ${similar[0].playerId} - ${similar[0].firstName || similar[0].firstNameTh} ${similar[0].lastName || similar[0].lastNameTh}`);
        Storage.insert('players', p);
        AuditService.log({ entityType: 'player', entityId: p.playerId, action: 'create', eventCode: 'PLAYER_CREATED', after: p });
        return { data: p, warnings };
    },
    update(id, updates) {
        const before = Storage.getById('players', 'playerId', id);
        if (!before) return { errors: ['Player not found'] };
        const candidate = {
            ...before,
            ...updates,
            thaiName: String(updates.thaiName ?? before.thaiName ?? '').trim(),
            province: normalizeProvince(updates.province ?? before.province ?? ''),
            country: normalizeCountry(updates.country ?? before.country ?? 'Thailand'),
            intendedDivisions: PlayerIntentService.normalizeTags(updates.intendedDivisions ?? before.intendedDivisions ?? [])
        };
        const errors = Validation.player(candidate);
        if (errors.length) return { errors };
        const after = Storage.update('players', 'playerId', id, candidate);
        AuditService.log({ entityType: 'player', entityId: id, action: 'update', eventCode: 'PLAYER_UPDATED', before, after });
        return { data: after };
    },
    archive(id) { return this.update(id, { status: 'archived' }); },
    restore(id) { return this.update(id, { status: 'active' }); },
    getAll() { return Storage.find('players', p => p.status !== 'archived'); },
    getArchived() { return Storage.find('players', p => p.status === 'archived'); },
    getAllIncludeArchived() { return Storage.getAll('players'); },
    getById(id) { return Storage.getById('players', 'playerId', id); },
    search(q) {
        q = (q||'').toLowerCase();
        return this.getAll().filter(p => (p.firstName+' '+p.lastName+' '+p.firstNameTh+' '+p.lastNameTh+' '+p.nickname+' '+p.playerId+' '+p.schoolOrClub+' '+p.province+' '+p.country).toLowerCase().includes(q));
    },
    dependencies(id) {
        const player = this.getById(id);
        if (!player) return null;
        const registrations = Storage.find('registrations', r =>
            r.playerId === id || (Array.isArray(r.memberPlayerIds) && r.memberPlayerIds.includes(id))
        );
        return { player, registrations, inUse: registrations.length > 0 };
    },
    permanentDelete(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Player not found'] };
        if (d.registrations.length) {
            return { errors: ['This Player has tournament registration history and cannot be permanently deleted. Archive the Player instead.'] };
        }
        Storage.remove('players', 'playerId', id);
        AuditService.log({ entityType:'player', entityId:id, action:'delete', eventCode:'PLAYER_DELETED', before:d.player });
        return { data:true };
    }
};

const TournamentPlayerCodeService = {
    parseSequence(code) { const match = String(code || '').match(/-(\d+)$/); return match ? parseInt(match[1], 10) : 0; },
    getAssignedCodes(tournamentId, divisionId) {
        return Storage.find('registrations', r => r.tournamentId === tournamentId && r.divisionId === divisionId && r.tournamentPlayerCode).map(r => r.tournamentPlayerCode);
    },
    getNextCode(tournamentId, divisionId) {
        const division = DivisionService.getById(divisionId);
        const highest = this.getAssignedCodes(tournamentId, divisionId).reduce((max, code) => Math.max(max, this.parseSequence(code)), 0);
        return `${(division?.divisionCode || 'DIV').toUpperCase()}-${String(highest + 1).padStart(3, '0')}`;
    },
    assignCode(registration) {
        if (!registration || registration.tournamentPlayerCode) return registration?.tournamentPlayerCode || null;
        return this.getNextCode(registration.tournamentId, registration.divisionId);
    },
    resolveCode(registrationId) { return Storage.getById('registrations', 'registrationId', registrationId)?.tournamentPlayerCode || null; },
    validateCodeUniqueness(code, excludeId) { return !Storage.findOne('registrations', r => r.tournamentPlayerCode === code && r.registrationId !== excludeId); },
    getDisplay(registration, player) {
        const name = player ? (player.displayName || `${player.firstName || player.firstNameTh || ''} ${player.lastName || player.lastNameTh || ''}`.trim()) : (registration?.playerId || '—');
        return { code: registration?.tournamentPlayerCode || null, name, display: `${registration?.tournamentPlayerCode || 'Not Checked In'} — ${name}` };
    }
};

const PlayerIntentService = {
    normalizeTags(value) {
        const parts = Array.isArray(value) ? value : String(value || '').split(/[,;|/]+/);
        const seen = new Set();
        return parts.map(v => String(v || '').trim()).filter(Boolean).filter(v => {
            const key = v.toLowerCase();
            if (seen.has(key)) return false;
            seen.add(key);
            return true;
        });
    },
    tags(player) {
        if (!player) return [];
        return this.normalizeTags(player.intendedDivisions || player.preferredDivisions || player.eligibleDivisions || '');
    },
    tagsText(player) { return this.tags(player).join(', '); },
    note(player) { return String(player?.registrationNote || player?.importNote || '').trim(); },
    matchesDivision(player, division) {
        if (!player || !division) return false;
        const tags = this.tags(player).map(v => v.toLowerCase());
        if (!tags.length) return false;
        const candidates = [division.divisionCode, division.name, division.divisionName, division.ageGroup]
            .filter(Boolean).map(v => String(v).trim().toLowerCase());
        return candidates.some(c => tags.some(tag => tag === c || tag.includes(c) || c.includes(tag)));
    },
    badgeHtml(player) {
        const tags = this.tags(player);
        if (!tags.length) return '';
        return `<span class="inline-flex flex-wrap gap-1">${tags.map(tag => `<span class="px-1.5 py-0.5 rounded-full text-[10px] font-semibold bg-violet-100 text-violet-700 dark:bg-violet-950/50 dark:text-violet-300 border border-violet-200 dark:border-violet-800">${Utils.escHtml(tag)}</span>`).join('')}</span>`;
    }
};

const LiveIdentityResolver = {
    registration(registrationId, divisionId='', fallbackPlayerId='') {
        if (registrationId) {
            const r = Storage.getById('registrations','registrationId',registrationId);
            if (r) return r;
        }
        if (divisionId && fallbackPlayerId) {
            return Storage.findOne('registrations', r =>
                r.divisionId === divisionId &&
                (r.playerId === fallbackPlayerId ||
                 (Array.isArray(r.memberPlayerIds) && r.memberPlayerIds.includes(fallbackPlayerId)))
            );
        }
        return null;
    },

    resolve({registrationId='', divisionId='', playerId='', fallbackName='', fallbackClub='', fallbackProvince='', fallbackCountry=''}) {
        const reg = this.registration(registrationId, divisionId, playerId);
        if (reg) {
            const members = CompetitionEntryService.members(reg);
            const primary = members[0] || PlayerService.getById(reg.playerId);
            return {
                registration:reg,
                playerId:reg.playerId || playerId,
                memberPlayerIds:CompetitionEntryService.memberIds(reg),
                name:CompetitionEntryService.compactName(reg) || fallbackName || playerId || '—',
                fullName:CompetitionEntryService.fullName(reg) || fallbackName || playerId || '—',
                club:CompetitionEntryService.affiliation(reg) || fallbackClub || '',
                province:primary?.province || fallbackProvince || '',
                country:primary?.country || fallbackCountry || '',
                entryType:CompetitionEntryService.entryType(reg),
                tournamentPlayerCode:reg.tournamentPlayerCode || null
            };
        }
        const p = PlayerService.getById(playerId);
        return {
            registration:null,
            playerId:playerId || p?.playerId || '',
            memberPlayerIds:[playerId].filter(Boolean),
            name:p ? PlayerDisplayService.short(p) : (fallbackName || playerId || '—'),
            fullName:p ? PlayerDisplayService.primary(p) : (fallbackName || playerId || '—'),
            club:p?.schoolOrClub || fallbackClub || '',
            province:p?.province || fallbackProvince || '',
            country:p?.country || fallbackCountry || '',
            entryType:'single',
            tournamentPlayerCode:null
        };
    },

    standingRow(row, divisionId='') {
        const live = this.resolve({
            registrationId:row?.registrationId || '',
            divisionId,
            playerId:row?.playerId || '',
            fallbackName:row?.playerName || '',
            fallbackClub:row?.schoolOrClub || '',
            fallbackProvince:row?.province || '',
            fallbackCountry:row?.country || ''
        });
        return { ...row, playerName:live.name, schoolOrClub:live.club, province:live.province, country:live.country, _liveIdentity:live };
    },

    placementRow(row, divisionId='') {
        const live = this.resolve({
            registrationId:row?.registrationId || '',
            divisionId,
            playerId:row?.playerId || '',
            fallbackName:row?.playerName || '',
            fallbackClub:row?.schoolOrClub || '',
            fallbackProvince:row?.province || '',
            fallbackCountry:row?.country || ''
        });
        return { ...row, playerName:live.name, schoolOrClub:live.club, province:live.province, country:live.country, _liveIdentity:live };
    },

    runSelfTest() {
        const fake = {registrationId:'NO_REG',playerId:'NO_PLAYER',playerName:'Snapshot Name',schoolOrClub:'Snapshot Club'};
        const r = this.standingRow(fake,'NO_DIV');
        const ok = r.playerName === 'Snapshot Name' && r.schoolOrClub === 'Snapshot Club';
        return {ok,message:ok
            ? 'RC5.3 Live Identity Self-Test PASSED: snapshot fallback remains safe when no live master record exists.'
            : 'RC5.3 Live Identity Self-Test FAILED.'};
    }
};

const CompetitionEntryService = {
    memberIds(registration) {
        if (!registration) return [];
        const ids = Array.isArray(registration.memberPlayerIds) && registration.memberPlayerIds.length
            ? registration.memberPlayerIds
            : [registration.playerId];
        return [...new Set(ids.filter(Boolean))];
    },
    members(registration) {
        return this.memberIds(registration).map(id=>PlayerService.getById(id)).filter(Boolean);
    },
    compactMemberName(player) {
        if (!player) return '—';
        return String(player.firstNameTh || player.firstName || PlayerDisplayService.primary(player) || player.playerId).trim();
    },
    compactName(registration) {
        const members = this.members(registration);
        if (!members.length) return registration?.playerId || '—';
        return members.map(p=>this.compactMemberName(p)).join(' / ');
    },
    fullName(registration) {
        const members = this.members(registration);
        return members.length ? members.map(p=>PlayerDisplayService.primary(p)).join(' / ') : (registration?.playerId || '—');
    },
    affiliation(registration) {
        const values = this.members(registration).map(p=>String(p.schoolOrClub||'').trim()).filter(Boolean);
        return [...new Set(values)].join(' / ') || registration?.affiliationAtEntry || '';
    },
    isPair(registration) { return this.memberIds(registration).length > 1; },
    entryType(registration) { return this.isPair(registration) ? 'pair' : 'single'; },
    membersAlreadyRegistered(divisionId, memberIds, excludeRegistrationId='') {
        const target = new Set(memberIds || []);
        return RegistrationService.getByDivision(divisionId).some(r =>
            r.registrationId !== excludeRegistrationId &&
            this.memberIds(r).some(id=>target.has(id))
        );
    },
    runSelfTest() {
        const fake = {playerId:'P1',memberPlayerIds:['P1','P2']};
        const ok = this.memberIds(fake).join(',') === 'P1,P2' && this.entryType(fake) === 'pair';
        return {ok,message:ok?'RC5 Competition Entry Self-Test PASSED: member arrays resolve as one competition Entry.':'RC5 Competition Entry Self-Test FAILED.'};
    }
};

// ============================================================
// REGISTRATION ELIGIBILITY RESOLVER — Patch 02.8
// Single source of truth for CURRENT pairing eligibility.
// eligibleForPairing remains compatibility metadata only.
// ============================================================
const RegistrationEligibilityResolver = {
    resolve(registration) {
        const reasons = [];
        if (!registration) return { eligible:false, reasons:['Registration not found'], code:'registration_missing' };

        if (registration.entryStatus !== 'active')
            reasons.push(`entryStatus must be active (current: ${registration.entryStatus || 'unknown'})`);
        if (registration.checkInStatus !== 'checked_in')
            reasons.push(`checkInStatus must be checked_in (current: ${registration.checkInStatus || 'unknown'})`);
        if (!registration.tournamentPlayerCode)
            reasons.push('Tournament Player ID is not assigned');

        return {
            eligible: reasons.length === 0,
            reasons,
            code: reasons.length ? 'not_pairing_eligible' : 'pairing_eligible',
            registrationId: registration.registrationId,
            playerId: registration.playerId
        };
    },

    isEligible(registration) { return this.resolve(registration).eligible; },

    resolveDivision(divisionId) {
        const registrations = Storage.find('registrations', r => r.divisionId === divisionId);
        const eligible = [], ineligible = [], legacyMismatches = [];

        registrations.forEach(registration => {
            const decision = this.resolve(registration);
            const item = { registration, ...decision };
            (decision.eligible ? eligible : ineligible).push(item);

            if (Boolean(registration.eligibleForPairing) !== decision.eligible) {
                legacyMismatches.push({
                    registrationId: registration.registrationId,
                    playerId: registration.playerId,
                    storedEligibleForPairing: Boolean(registration.eligibleForPairing),
                    resolvedEligibleForPairing: decision.eligible
                });
            }
        });

        return {
            eligible, ineligible, legacyMismatches,
            counts: {
                registrations: registrations.length,
                eligible: eligible.length,
                ineligible: ineligible.length,
                legacyMismatches: legacyMismatches.length
            }
        };
    },

    getEligibleRegistrations(divisionId) {
        return this.resolveDivision(divisionId).eligible.map(x => x.registration);
    },

    runSelfTest() {
        const cases = [
            ['active + checked-in + code',
                {registrationId:'R1',playerId:'P1',entryStatus:'active',checkInStatus:'checked_in',tournamentPlayerCode:'CWO-001',eligibleForPairing:false}, true],
            ['registered not checked-in',
                {registrationId:'R2',playerId:'P2',entryStatus:'registered',checkInStatus:'not_checked_in',tournamentPlayerCode:null,eligibleForPairing:true}, false],
            ['withdrawn with old code',
                {registrationId:'R3',playerId:'P3',entryStatus:'withdrawn',checkInStatus:'checked_in',tournamentPlayerCode:'CWO-003',eligibleForPairing:true}, false],
            ['cancelled',
                {registrationId:'R4',playerId:'P4',entryStatus:'cancelled',checkInStatus:'not_checked_in',tournamentPlayerCode:null,eligibleForPairing:true}, false],
            ['active but not checked-in',
                {registrationId:'R5',playerId:'P5',entryStatus:'active',checkInStatus:'not_checked_in',tournamentPlayerCode:'CWO-005',eligibleForPairing:true}, false],
            ['active checked-in but missing code',
                {registrationId:'R6',playerId:'P6',entryStatus:'active',checkInStatus:'checked_in',tournamentPlayerCode:null,eligibleForPairing:true}, false],
            ['reactivated checked-in',
                {registrationId:'R7',playerId:'P7',entryStatus:'active',checkInStatus:'checked_in',tournamentPlayerCode:'CWO-007',eligibleForPairing:true}, true]
        ];

        const errors = [];
        cases.forEach(([name, registration, expected]) => {
            const actual = this.isEligible(registration);
            if (actual !== expected) errors.push(`${name}: expected ${expected}, got ${actual}.`);
        });

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Registration Eligibility Self-Test FAILED: ${errors.join(' ')}`
                : 'Registration Eligibility Self-Test PASSED: ACTIVE + CHECKED_IN + assigned Tournament Player ID is the single pairing-eligibility rule. Stale legacy eligibleForPairing flags cannot override lifecycle state. Live tournament data was not modified.'
        };
    }
};
