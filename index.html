        const ws = XLSX.utils.aoa_to_sheet(columns); ws['!freeze'] = { xSplit: 0, ySplit: 1 }; ws['!autofilter'] = { ref: `A1:O${columns.length}` }; ws['!cols'] = [18,16,16,20,18,18,16,24,16,14,12,16,12,24,24].map(w => ({ wch: w }));
        const header = columns[0]; header.forEach((_, i) => { const cell = ws[XLSX.utils.encode_cell({ r: 0, c: i })]; if (cell) cell.s = { font: { bold: true } }; });
        const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Players'); XLSX.writeFile(wb, filename);

const App = {
    currentPage: 'dashboard',
    publicResultRoundNumber: null,
    // PATCH 02.46.1 — Last Game defaults to the latest available round.
    // A historical round is kept only when the manager explicitly selects it.
    publicResultRoundPinned: false,
    publicResultRoundDivisionId: null,
    currentTournamentId: null,
    currentDivisionId: null,
    resultSearchQuery: '',
    currentRoundId: null,
    currentPairingProposal: null,
    lang: 'th',
    dark: false,
    testMode: false,

    init() {
        const storageStartup = Storage.init();
        if (!storageStartup || storageStartup.ok !== true) {
            this.renderStorageRecovery(storageStartup || {
                code: 'STORAGE_STARTUP_ERROR',
                message: 'KRUTAR Tournament data could not be loaded safely.'
            });
            return;
        }

        try {
            this.dark = localStorage.getItem('krutar_dark') === '1';
            const savedLang = localStorage.getItem('krutar_lang');
            if (savedLang === 'th' || savedLang === 'en') this.lang = savedLang;
            this.testMode = localStorage.getItem('krutar_test_mode') === '1';
        } catch (e) {
            this.dark = false;
            console.warn('Unable to read KRUTAR UI preference:', e);
        }
        if (this.dark) document.documentElement.classList.add('dark');
        // Patch 01.3: repair the legacy Archive -> Restore defect from Patch 01.2
        // before normal lifecycle reconciliation. This is intentionally narrow and only
        // acts on records with an explicit TOURNAMENT_ARCHIVED -> TOURNAMENT_RESTORED audit trail.
        TournamentService.repairLegacyRestoreDefects();

        // Lifecycle recovery/reconciliation: if an ACTIVE tournament was restored/imported
        // after all competition data already existed, re-evaluate completion on startup.
        VoidHistoryStatusRecovery.recoverAll();
        RoundResultCompletenessRecovery.recoverAll();
        const byeNormalization = LegacyByePolicyNormalizer.normalizeAll();
            GibsonByeMetadataIntegrityService.normalizeExisting();
        if (byeNormalization?.errors?.length) console.warn(byeNormalization.errors.join(' | '));
        TournamentCompletionService.reconcileAll();
        this.restoreTournamentContext();
        this.renderNav();
        this.navigate('dashboard');
        lucide.createIcons();
    },

    renderStorageRecovery(startup) {
        const app = document.getElementById('app');
        if (!app) return;
        const code = Utils.escHtml(startup?.code || 'STORAGE_STARTUP_ERROR');
        const message = Utils.escHtml(startup?.message || 'Existing KRUTAR Tournament data could not be loaded safely.');
        app.innerHTML = `
            <main class="min-h-screen w-full flex items-center justify-center p-6 bg-gray-50 dark:bg-gray-900">
                <section class="w-full max-w-2xl bg-white dark:bg-gray-800 border border-red-200 dark:border-red-900 rounded-xl shadow-lg p-6">
                    <div class="text-xs font-bold tracking-widest text-red-600 dark:text-red-400 mb-2">KRUTAR Tournament Manager</div>
                    <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-3">DATA RECOVERY REQUIRED</h1>
                    <p class="text-gray-700 dark:text-gray-200 mb-4">Existing KRUTAR Tournament data could not be loaded safely.</p>
                    <p class="font-semibold text-green-700 dark:text-green-400 mb-5">The stored data has NOT been deleted or overwritten.</p>
                    <div class="rounded-lg bg-gray-100 dark:bg-gray-900 p-4 font-mono text-sm break-words">
                        <div><strong>Error code:</strong> ${code}</div>
                        <div class="mt-2"><strong>Details:</strong> ${message}</div>
                    </div>
                    <p class="mt-5 text-sm text-gray-500 dark:text-gray-400">Automatic reset is disabled. Migration runs only when a complete registered path exists and validates successfully; otherwise live data is left unchanged.</p>
                </section>
            </main>`;
        try { lucide.createIcons(); } catch (e) { /* Recovery screen must remain usable even if icons fail. */ }
    },

    toggleDarkMode() {
        this.dark = !this.dark;
        document.documentElement.classList.toggle('dark', this.dark);
        localStorage.setItem('krutar_dark', this.dark ? '1' : '0');
    },

    // PATCH 02.49C — TH/EN UI completion.
    // Presentation-only helper. Competition data, pairing, results, standing,
    // audit and backup logic are not modified.
    ui(en, th) {
        return this.lang === 'th' ? th : en;
    },

    syncStaticChromeLanguage() {
        const themeLabel = document.getElementById('theme-label');
        if (themeLabel) themeLabel.textContent = this.ui('Dark Mode', 'โหมดมืด');
        const langLabel = document.getElementById('lang-label');
        if (langLabel) langLabel.textContent = 'TH / EN';
        const testLabel = document.getElementById('test-mode-label');
        if (testLabel) testLabel.textContent = `${this.ui('Test Mode','โหมดทดสอบ')}: ${this.testMode ? 'ON' : 'OFF'}`;
        document.documentElement.lang = this.lang;
    },

    toggleTestMode() {
        this.testMode = !this.testMode;
        try { localStorage.setItem('krutar_test_mode', this.testMode ? '1' : '0'); } catch (_) {}
        this.syncStaticChromeLanguage();
        this.applyTestModeVisibility();
    },

    isTestControl(el) {
        if (!el || el.tagName !== 'BUTTON') return false;
        const onclick = String(el.getAttribute('onclick') || '');
        const label = String(el.textContent || '').trim();

        // RC2.1: Standing has two maintenance actions living inside diagnostic
        // cards alongside Self-Test buttons. Treat those actions as Test Mode UI
        // too, so the whole maintenance card disappears when Test Mode is OFF.
        const maintenanceOnly =
            onclick.includes('normalizeLegacySnapshots') ||
            onclick.includes('repairLegacySnapshotLinks');

        return maintenanceOnly ||
            onclick.includes('SelfTest') ||
            /\bSelf[- ]?Test\b/i.test(label) ||
            /\bLive Test\b/i.test(label);
    },

    applyTestModeVisibility() {
        const content = document.getElementById('content');
        if (!content) return;

        content.querySelectorAll('.krutar-test-ui-hidden').forEach(el => el.classList.remove('krutar-test-ui-hidden'));

        const testButtons = Array.from(content.querySelectorAll('button')).filter(btn => this.isTestControl(btn));
        const targets = new Set();

        testButtons.forEach(btn => {
            let node = btn;
            let best = btn;

            while (node && node.parentElement && node.parentElement !== content) {
                const parent = node.parentElement;
                const formControls = parent.querySelectorAll('input,select,textarea');
                const buttons = Array.from(parent.querySelectorAll('button'));
                const links = parent.querySelectorAll('a[href]');
                const onlyTestButtons = buttons.length > 0 && buttons.every(b => this.isTestControl(b));

                if (formControls.length === 0 && links.length === 0 && onlyTestButtons) {
                    best = parent;
                    node = parent;
                    continue;
                }
                break;
            }
            targets.add(best);
        });

        if (!this.testMode) {
            targets.forEach(el => el.classList.add('krutar-test-ui-hidden'));
        }
    },

    toggleLang() {
        this.lang = this.lang === 'th' ? 'en' : 'th';
        try { localStorage.setItem('krutar_lang', this.lang); } catch (_) {}
        this.renderNav();
        this.navigate(this.currentPage);
    },

    toggleSidebar() {
        const sb = document.getElementById('sidebar');
        sb.classList.toggle('-translate-x-full');
    },

    goToMain() {
        this.navigate('dashboard');
    },

    navItems: [
        { id: 'tournaments', icon: 'trophy', label: 'Tournaments', labelTh: 'ทัวร์นาเมนต์' },
        { id: 'dashboard', icon: 'layout-dashboard', label: 'Dashboard', labelTh: 'แดชบอร์ด' },
        { id: 'players', icon: 'users', label: 'Players', labelTh: 'ผู้เล่น' },
        { id: 'registration', icon: 'clipboard-list', label: 'Registration', labelTh: 'ลงทะเบียน' },
        { id: 'rounds', icon: 'layers', label: 'Rounds', labelTh: 'รอบการแข่งขัน' },
        { id: 'pairings', icon: 'git-merge', label: 'Pairings', labelTh: 'จับคู่' },
        { id: 'results', icon: 'file-text', label: 'Results', labelTh: 'กรอกผล' },
        { id: 'standings', icon: 'bar-chart-2', label: 'Standings', labelTh: 'อันดับ' },
        { id: 'public-results', icon: 'monitor', label: 'Last Game', labelTh: 'ผลล่าสุด' },
        { id: 'audit', icon: 'shield', label: 'Audit Log', labelTh: 'บันทึก' },
        { id: 'backup', icon: 'database', label: 'Backup', labelTh: 'สำรองข้อมูล' },
    ],

    // ========================================================
    // PATCH 02.12.4 — TOURNAMENT SELECTION STATE
    // Tournament is the application context. Dashboard and all
    // tournament-scoped pages must honor this selection instead
    // of silently falling back to tournaments[0].
    // ========================================================
    _selectionStorageKey: 'krutar_current_tournament_id',

    setTournamentContext(tournamentId, options = {}) {
        const tournament = tournamentId ? TournamentService.getById(tournamentId) : null;
        if (tournamentId && !tournament) return { errors:['Tournament not found'] };

        const changed = this.currentTournamentId !== (tournament?.tournamentId || null);
        this.currentTournamentId = tournament?.tournamentId || null;

        // Child selections belong to the previous Tournament and must never leak
        // into the newly selected Tournament context.
        if (changed) {
            this.currentDivisionId = null;
            this.currentRoundId = null;
            this.currentPairingProposal = null;
        }

        try {
            if (this.currentTournamentId) localStorage.setItem(this._selectionStorageKey, this.currentTournamentId);
            else localStorage.removeItem(this._selectionStorageKey);
        } catch (e) {
            console.warn('Unable to persist tournament selection:', e);
        }

        if (options.navigate) this.navigate(options.navigate);
        return { data:tournament, changed };
    },

    restoreTournamentContext() {
        let storedId = null;
        try { storedId = localStorage.getItem(this._selectionStorageKey); } catch (_) {}
        const activeTournaments = TournamentService.getAll();
        const selected = (storedId && activeTournaments.find(t => t.tournamentId === storedId)) || activeTournaments[0] || null;
        this.setTournamentContext(selected?.tournamentId || null);
        return selected;
    },

    getCurrentTournament() {
        const activeTournaments = TournamentService.getAll();
        let selected = this.currentTournamentId
            ? activeTournaments.find(t => t.tournamentId === this.currentTournamentId)
            : null;
        if (!selected) {
            selected = activeTournaments[0] || null;
            this.setTournamentContext(selected?.tournamentId || null);
        }
        return selected;
    },

    selectTournament(tournamentId) {
        const result = this.setTournamentContext(tournamentId);
        if (result.errors) return this.showToast(result.errors[0], 'error');
        this.showTournamentDetail(tournamentId);
    },

    renderNav() {
        const nav = document.getElementById('main-nav');
        nav.innerHTML = this.navItems.map(item => `
            <button class="nav-item w-full text-left px-3 py-2 rounded text-sm flex items-center gap-2 ${this.currentPage===item.id?'active font-medium':''}" onclick="App.navigate('${item.id}')">
                <i data-lucide="${item.icon}" style="width:16px;height:16px"></i>
                ${this.lang==='th' ? item.labelTh : item.label}
            </button>
        `).join('');
        this.syncStaticChromeLanguage();
        lucide.createIcons();
    },

    getActiveDivision() {
        if (!this.currentTournamentId) return null;
        const divs = DivisionService.getByTournament(this.currentTournamentId);
        return this.currentDivisionId ? (divs.find(d=>d.divisionId===this.currentDivisionId) || null) : null;
    },

    divisionContextHtml(div) {
        if (!div) return '';
        const color = div.colorTag || '#f59e0b';
        const label = div.displayNameTh || div.divisionName || '';
        return `<div class="ktm-division-context mb-4 rounded-lg overflow-hidden bg-white dark:bg-gray-800 border dark:border-gray-700" style="border-top:5px solid ${Utils.escHtml(color)}">
            <div class="px-3 py-2 flex items-center gap-2 flex-wrap">
                <span class="inline-block w-3 h-3 rounded-full" style="background:${Utils.escHtml(color)}"></span>
                <span class="text-xs font-semibold text-gray-500">${this.ui('ACTIVE DIVISION','ดิวิชันที่กำลังใช้งาน')}</span>
                <span class="font-bold">${Utils.escHtml(div.divisionCode)}</span>
                ${label ? `<span class="text-sm text-gray-500">— ${Utils.escHtml(label)}</span>` : ''}
            </div>
        </div>`;
    },

    applyDivisionContext(page, content) {
        const pages = new Set(['registration','rounds','pairings','results','standings','public-results','audit']);
        const div = this.getActiveDivision();
        if (!pages.has(page) || !div || !content) return;
        content.insertAdjacentHTML('afterbegin', this.divisionContextHtml(div));
        content.style.borderTop = `3px solid ${div.colorTag || '#f59e0b'}`;
        content.style.borderRadius = '10px 10px 0 0';
    },

    navigate(page) {
        this.currentPage = page;
        this.renderNav();
        const content = document.getElementById('content');
        const title = document.getElementById('page-title');
        const item = this.navItems.find(n=>n.id===page);
        title.textContent = item ? (this.lang==='th' ? item.labelTh : item.label) : page;
        this.updateDivisionFilter();

        switch(page) {
            case 'dashboard': this.renderDashboard(content); break;
            case 'tournaments': this.renderTournaments(content); break;
            case 'players': this.renderPlayers(content); break;
            case 'registration': this.renderRegistration(content); break;
            case 'rounds': this.renderRounds(content); break;
            case 'pairings': this.renderPairings(content); break;
            case 'results': this.renderResults(content); break;
            case 'standings': this.renderStandings(content); break;
            case 'public-results': this.renderPublicResults(content); break;
            case 'audit': this.renderAudit(content); break;
            case 'backup': this.renderBackup(content); break;
            default: content.innerHTML = '<p>Page not found</p>';
        }
        this.applyDivisionContext(page, content);
        this.applyTestModeVisibility();
        lucide.createIcons();
    },

    updateDivisionFilter() {
        const filter = document.getElementById('division-filter');
        const needsFilter = ['registration','rounds','pairings','results','standings','public-results'].includes(this.currentPage);
        filter.classList.toggle('hidden', !needsFilter);
        if (needsFilter) {
            const tournament = this.getCurrentTournament();
            let divs = [];
            if (tournament) divs = DivisionService.getByTournament(tournament.tournamentId);
            if (this.currentDivisionId && !divs.some(d => d.divisionId === this.currentDivisionId)) {
                this.currentDivisionId = null;
                this.currentRoundId = null;
                this.currentPairingProposal = null;
            }
            filter.innerHTML = `<option value="">${this.ui('All Divisions','ทุกดิวิชัน')}</option>` + divs.map(d => `<option value="${d.divisionId}" ${d.divisionId===this.currentDivisionId?'selected':''}>${d.divisionCode}</option>`).join('');
            const activeDiv = this.currentDivisionId ? divs.find(d=>d.divisionId===this.currentDivisionId) : null;
            const accent = activeDiv?.colorTag || '';
            filter.style.borderColor = accent || '';
            filter.style.borderWidth = accent ? '2px' : '';
            filter.style.boxShadow = accent ? `0 0 0 2px ${accent}22` : '';
            filter.title = activeDiv ? `${this.ui('Active Division','ดิวิชันที่กำลังใช้งาน')}: ${activeDiv.divisionCode}` : '';
        }
    },

    onDivisionFilter(val) {
        this.currentDivisionId = val || null;
        this.navigate(this.currentPage);
    },

    showToast(msg, type='info') {
        const container = document.getElementById('toast-container');
        const colors = { success: 'bg-emerald-600', error: 'bg-red-600', info: 'bg-blue-600', warning: 'bg-amber-500' };
        const div = document.createElement('div');
        div.className = `toast ${colors[type]||colors.info} text-white px-4 py-3 rounded-lg shadow-lg text-sm max-w-sm`;
        div.textContent = msg;
        container.appendChild(div);
        setTimeout(() => div.remove(), 4000);
    },

    showModal(title, bodyHtml, actions='') {

            <div class="modal-overlay fixed inset-0 flex items-center justify-center p-4" onclick="if(event.target===this)App.closeModal()">

    },

    closeModal() { document.getElementById('modal-container').classList.add('hidden'); },

    runResultPolicyIntegritySelfTest(divisionId='') {
        const selfTest = ResultPolicyIntegrityService.runSelfTest();
        const live = divisionId
            ? ResultPolicyIntegrityService.inspectDivision(divisionId)
            : {ok:true,errors:[],warnings:[],version:1};
        const ok = selfTest.ok && live.ok;
        const el = document.getElementById('result-policy-integrity-self-test-result');
        const detail = [
            selfTest.message,
            divisionId ? `Live Division policy integrity: ${live.ok ? 'PASS' : 'FAIL'}.` : 'New Division uses pre-save configuration guard.',
            divisionId && live.ok ? `Resolved ResultPolicy version: ${live.version}.` : '',
            ...(live.errors || []),
            ...(live.warnings || []).map(w => `Warning: ${w}`),
            'Live tournament data was not modified.'
        ].filter(Boolean).join(' ');
        if (el) {
            el.className = `text-xs rounded-lg p-3 border mt-3 ${ok ? 'border-green-500 text-green-600' : 'border-red-500 text-red-600'}`;
            el.textContent = detail;
        }
        this.showToast(ok ? 'ResultPolicy Integrity Guard PASSED.' : 'ResultPolicy Integrity Guard FAILED.', ok ? 'success' : 'error');
    },

    runResultPolicyConfigSelfTest() {
        const result = ResultPolicyConfigurationService.runSelfTest();
        const el = document.getElementById('result-policy-config-self-test-result');
        if (el) {
            el.className = `text-xs rounded-lg p-3 border mt-3 ${result.ok ? 'border-green-500 text-green-600' : 'border-red-500 text-red-600'}`;
            el.textContent = result.message;
        }
        this.showToast(result.ok ? 'ResultPolicy Configuration Self-Test PASSED.' : 'ResultPolicy Configuration Self-Test FAILED.', result.ok ? 'success' : 'error');
    },

    addSpreadOverride() {
        const wrap = document.getElementById('df-overrides');
        if (!wrap) return;
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center';
        row.innerHTML = '<input data-override-round type="number" min="1" class="w-1/2 px-2 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" placeholder="Round"><input data-override-spread type="number" min="1" step="1" class="w-1/2 px-2 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" placeholder="Maximum Spread"><button type="button" class="text-red-600">×</button>';
        row.querySelector('button').onclick = () => row.remove();
        wrap.appendChild(row);
    },

    saveDivision(tournamentId, divisionId) {
        const proposedResultPolicy = {
            walkover: {
                scoreFor: Number(document.getElementById('df-walkover-score-for')?.value ?? 100),
                scoreAgainst: Number(document.getElementById('df-walkover-score-against')?.value ?? 0),
                officialSpreadAwarded: Number(document.getElementById('df-walkover-official-spread')?.value ?? 100)
            },
            forfeit: { scoreMode:'entered_adjusted' }
        };
        const resultPolicyConfigGuard = ResultPolicyIntegrityService.validateDivisionConfigInput(proposedResultPolicy);
        if (!resultPolicyConfigGuard.ok) {
            this.showToast(resultPolicyConfigGuard.errors[0], 'error');
            return;
        }

        const data = {
            tournamentId,
            divisionCode: document.getElementById('df-code').value,
            divisionName: document.getElementById('df-name').value,
            displayNameTh: document.getElementById('df-nameth').value,
            totalRounds: parseInt(document.getElementById('df-rounds').value),
            maximumSpread: parseInt(document.getElementById('df-spread').value),
            roundSpreadOverrides: [...document.querySelectorAll('#df-overrides > div')].map(row => ({ roundNumber: parseInt(row.querySelector('[data-override-round]').value), maximumSpread: parseInt(row.querySelector('[data-override-spread]').value) })),
            colorTag: document.getElementById('df-color').value
        };
        if (divisionId) data.divisionId = divisionId;
        const result = divisionId ? DivisionService.update(divisionId, data) : DivisionService.create(data);
        if (result.errors) { this.showToast(result.errors[0], 'error'); return; }
        const savedDivision = result.data;
        const savedByePolicy = savedDivision?.byePolicyId ? Storage.getById('byePolicies','byePolicyId',savedDivision.byePolicyId) : null;
        if (savedByePolicy) {
            Storage.update('byePolicies','byePolicyId',savedByePolicy.byePolicyId, {
                countsAsGame: true,
                countsAsWin: true,
                scoreFor: Math.max(0, parseInt(document.getElementById('df-bye-score-for').value) || 0),
                scoreAgainst: Math.max(0, parseInt(document.getElementById('df-bye-score-against').value) || 0),
                officialSpreadAwarded: Math.max(0, parseInt(document.getElementById('df-bye-official-spread').value) || 0),
                byeRulesConfiguredAt: Utils.now(),
                byeRulesConfiguredBy: 'admin',
                updatedAt: Utils.now()
            });
        }
        const resultPolicyUpdate = ResultPolicyConfigurationService.updateDivisionPolicy(savedDivision.divisionId, proposedResultPolicy);
        if (resultPolicyUpdate.errors) { this.showToast(resultPolicyUpdate.errors[0], 'error'); return; }

        const pairingPreset = document.getElementById('df-pairing-preset')?.value || '';
        if (pairingPreset) {
            const presetResult = PairingPlanPresetService.applyToDivision(savedDivision.divisionId, pairingPreset);
            if (presetResult.errors) { this.showToast(presetResult.errors[0], 'error'); return; }
        }
        this.closeModal();
        this.showToast('Division saved!', 'success');
        this.navigate('tournaments');
    },

    filterPlayers(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.player-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.playerSearch || '').includes(query));
        });
        const master = document.getElementById('player-select-all');
        if (master) master.checked = false;
    },

    toggleAllPlayerRows(master) {
        document.querySelectorAll('.player-row:not(.hidden) .player-select').forEach(cb => cb.checked = !!master.checked);
    },

    selectVisiblePlayers() {
        document.querySelectorAll('.player-row:not(.hidden) .player-select').forEach(cb => cb.checked = true);
        const master = document.getElementById('player-select-all');
        if (master) master.checked = true;
    },

    clearPlayerSelection() {
        document.querySelectorAll('.player-select').forEach(cb => cb.checked = false);
        const master = document.getElementById('player-select-all');
        if (master) master.checked = false;
    },

    selectedPlayerIds() {
        return Array.from(document.querySelectorAll('.player-select:checked')).map(cb => cb.value);
    },

    requestArchivePlayer(id) {
        const p = PlayerService.getById(id);
        if (!p) return this.showToast('Player not found.', 'error');
        if (!confirm(this.ui(`Archive ${p.displayName || p.playerId}? The Player will be hidden from active lists but tournament history remains intact.`,`เก็บ ${p.displayName || p.playerId} เข้าคลัง? ผู้เล่นจะถูกซ่อนจากรายชื่อใช้งาน แต่ประวัติการแข่งขันยังคงอยู่`))) return;
        PlayerService.archive(id);
        this.showToast(this.ui('Player archived.','เก็บผู้เล่นเข้าคลังแล้ว'), 'success');
        this.navigate('players');
    },

    requestRemovePlayer(id) {
        const p = PlayerService.getById(id);
        const d = PlayerService.dependencies(id);
        if (!p || !d) return this.showToast('Player not found.', 'error');
        if (d.registrations.length) return this.showToast(this.ui('This Player has tournament history. Archive instead.','ผู้เล่นนี้มีประวัติการแข่งขัน กรุณาเก็บเข้าคลังแทน'), 'error');
        if (!confirm(this.ui(`Permanently remove ${p.displayName || p.playerId}? This cannot be undone.`,`ลบ ${p.displayName || p.playerId} ออกจากฐานข้อมูลถาวร? ไม่สามารถย้อนกลับได้`))) return;
        const result = PlayerService.permanentDelete(id);
        if (result.errors) return this.showToast(result.errors[0], 'error');
        this.showToast(this.ui('Unused Player removed.','ลบผู้เล่นที่ไม่เคยใช้งานแล้ว'), 'success');
        this.navigate('players');
    },

    bulkArchivePlayers() {
        const ids = this.selectedPlayerIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one Player.','เลือกผู้เล่นอย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui(`Archive ${ids.length} selected Player(s)?`,`เก็บผู้เล่นที่เลือก ${ids.length} คนเข้าคลัง?`))) return;
        ids.forEach(id => PlayerService.archive(id));
        this.showToast(this.ui(`Archived ${ids.length} Player(s).`,`เก็บเข้าคลังแล้ว ${ids.length} คน`), 'success');
        this.navigate('players');
    },

    bulkRemoveUnusedPlayers() {
        const ids = this.selectedPlayerIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one Player.','เลือกผู้เล่นอย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui('Remove selected Players only when they have never been registered in a tournament?','ลบผู้เล่นที่เลือกเฉพาะคนที่ไม่เคยลงทะเบียนแข่งขันใช่หรือไม่?'))) return;
        let removed = 0, protectedCount = 0;
        ids.forEach(id => {
            const result = PlayerService.permanentDelete(id);
            if (result.errors) protectedCount++;
            else removed++;
        });
        this.showToast(this.ui(`Removed ${removed} unused · protected ${protectedCount} with history.`,`ลบผู้เล่นที่ไม่เคยใช้งาน ${removed} คน · ป้องกัน ${protectedCount} คนที่มีประวัติ`), protectedCount ? 'warning' : 'success');
        this.navigate('players');
    },

    removeAllUnusedPlayers() {
        const unused = PlayerService.getAll().filter(p => !PlayerService.dependencies(p.playerId)?.registrations?.length);
        if (!unused.length) return this.showToast(this.ui('No unused active Players to remove.','ไม่มีผู้เล่นที่ไม่เคยใช้งานให้ลบ'), 'warning');
        if (!confirm(this.ui(`Permanently remove all ${unused.length} active Players that have never been registered?`,`ลบผู้เล่นที่ใช้งานอยู่และไม่เคยลงทะเบียนทั้งหมด ${unused.length} คนแบบถาวร?`))) return;
        let removed = 0;
        unused.forEach(p => { if (!PlayerService.permanentDelete(p.playerId).errors) removed++; });
        this.showToast(this.ui(`Removed ${removed} unused Player(s).`,`ลบผู้เล่นที่ไม่เคยใช้งาน ${removed} คนแล้ว`), 'success');
        this.navigate('players');
    },

    savePlayer(id) {
        const firstName = document.getElementById('pf-fn')?.value.trim() || '';
        const lastName = document.getElementById('pf-ln')?.value.trim() || '';
        const firstNameTh = document.getElementById('pf-fnth')?.value.trim() || '';
        const lastNameTh = document.getElementById('pf-lnth')?.value.trim() || '';
        const ratingValue = document.getElementById('pf-rating')?.value.trim() || '';
        const data = {
            firstName, lastName, firstNameTh, lastNameTh,
            thaiName: [firstNameTh, lastNameTh].filter(Boolean).join(' '),
            displayName: firstName && lastName ? `${firstName} ${lastName}` : `${firstNameTh} ${lastNameTh}`.trim(),
            schoolOrClub: document.getElementById('pf-club')?.value.trim() || '',
            province: document.getElementById('pf-prov')?.value.trim() || '',
            country: normalizeCountry(document.getElementById('pf-country')?.value),
            currentRating: ratingValue === '' ? null : Number(ratingValue)
        };
        const result = id ? PlayerService.update(id, data) : PlayerService.create(data);
        const errorBox = document.getElementById('player-form-errors');
        if (result.errors) {
            if (errorBox) {
                errorBox.innerHTML = `<strong>Unable to save player:</strong><ul class="mt-1 list-disc pl-5">${result.errors.map(e => `<li>${Utils.escHtml(e)}</li>`).join('')}</ul>`;
                errorBox.classList.remove('hidden');
            }
            ['pf-fn','pf-ln','pf-fnth','pf-lnth'].forEach(field => document.getElementById(field)?.classList.toggle('border-red-500', !((firstName && lastName) || (firstNameTh && lastNameTh))));
            this.showToast(result.errors[0], 'error');
            return;
        }
        if (result.warnings?.length) this.showToast(result.warnings[0], 'warning');
        const saved = id ? PlayerService.getById(id) : result.data && PlayerService.getById(result.data.playerId);
        if (!saved) { this.showToast('Unable to verify saved player record.', 'error'); return; }
        this.closeModal();
        this.showToast('Player saved!', 'success');
        this.navigate('players');
    },

    showPlayerExcelImport() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.xlsx,.xls';
        input.onchange = async e => {
            const file = e.target.files[0]; if (!file) return;
            try {
                const parsed = await ExcelImportService.read(file);
                const preview = parsed.rows.map(({ rowNumber, player }) => {
                    const errors = [];
                    const hasThaiName = !!player.thaiName?.trim();
                    const hasName = !!player.firstName?.trim();
                    const hasLast = !!player.lastName?.trim();
                    if (!hasThaiName && !hasName) errors.push(this.ui('Missing first name or Thai name','ไม่มีชื่อภาษาอังกฤษหรือชื่อภาษาไทย'));
                    if (!hasThaiName && !hasLast) errors.push(this.ui('Missing last name or Thai name','ไม่มีนามสกุลภาษาอังกฤษหรือชื่อภาษาไทย'));
                    if (player.currentRating !== null && player.currentRating !== '' && !Number.isFinite(Number(player.currentRating))) errors.push(this.ui('Invalid Rating','เรตติ้งไม่ถูกต้อง'));
                    const displayName = player.displayName?.trim() || [player.firstName, player.lastName].filter(Boolean).join(' ') || [player.firstNameTh, player.lastNameTh].filter(Boolean).join(' ');
                    const country = String(player.country || '').trim();
                    player.country = !country || ['TH','THAILAND','ไทย'].includes(country.toUpperCase()) ? 'Thailand' : country;
                    player.displayName = displayName;
                    player.currentRating = player.currentRating === '' || player.currentRating == null ? null : Number(player.currentRating);
                    const existing = player.playerId && Storage.getById('players', 'playerId', player.playerId);
                    if (existing) errors.push(this.ui('Duplicate Player ID','รหัสผู้เล่นซ้ำ'));
                    if (!player.playerId) player.playerId = Utils.generateId('P');
                    return { rowNumber, player, status: errors.length ? 'INVALID' : 'NEW / VALID', error: errors.join('; ') || '—' };
                });
                const body = `<p class="text-sm text-gray-500 mb-3">${this.ui('Rows Read','จำนวนแถวที่อ่าน')}: ${preview.length} · ${this.ui('Only NEW / VALID rows will be committed.','จะบันทึกเฉพาะแถว NEW / VALID เท่านั้น')}</p><div class="table-container"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">${this.ui('Row','แถว')}</th><th class="p-2">${this.ui('First Name','ชื่อ')}</th><th class="p-2">${this.ui('Last Name','นามสกุล')}</th><th class="p-2">${this.ui('Thai Name','ชื่อไทย')}</th><th class="p-2">${this.ui('School / Club','โรงเรียน / ชมรม')}</th><th class="p-2">${this.ui('Province','จังหวัด')}</th><th class="p-2">${this.ui('Country','ประเทศ')}</th><th class="p-2">${this.ui('Rating','เรตติ้ง')}</th><th class="p-2">${this.ui('Status','สถานะ')}</th><th class="p-2">${this.ui('Error','ข้อผิดพลาด')}</th></tr></thead><tbody>${preview.map(x => `<tr class="border-b"><td class="p-2">${x.rowNumber}</td><td class="p-2">${Utils.escHtml(x.player.firstName)}</td><td class="p-2">${Utils.escHtml(x.player.lastName)}</td><td class="p-2">${Utils.escHtml(x.player.thaiName || '')}</td><td class="p-2">${Utils.escHtml(x.player.schoolOrClub)}</td><td class="p-2">${Utils.escHtml(x.player.province)}</td><td class="p-2">${Utils.escHtml(x.player.country)}</td><td class="p-2">${x.player.currentRating ?? '—'}</td><td class="p-2 ${x.status==='INVALID'?'text-red-600':'text-green-600'}">${x.status}</td><td class="p-2 text-red-600">${Utils.escHtml(x.error)}</td></tr>`).join('')}</tbody></table></div>`;
                this.showModal(this.ui('Preview Player Import','ตัวอย่างก่อนนำเข้าผู้เล่น'), body, `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.commitPlayerImport(window.__krutarPlayerPreview)" class="px-4 py-2 bg-amber-500 text-white rounded-lg">${this.ui('Commit Valid Rows','บันทึกแถวที่ถูกต้อง')}</button>`);
                window.__krutarPlayerPreview = preview;
            } catch (err) { this.showToast(`EXCEL_PARSE_ERROR: ${err.message || 'Unable to import workbook'}`, 'error'); }
        };
        input.click();
    },
    commitPlayerImport(preview) {
        const before = PlayerService.getAll().length, imported = [], errors = [];
        preview.filter(x => x.status === 'NEW / VALID').forEach(x => {
            const result = PlayerService.create({ ...x.player, _skipDuplicateCheck: true });
            if (result.data) imported.push(result.data.playerId); else errors.push(`Row ${x.rowNumber}: ${result.errors?.join('; ') || 'PLAYER_REPOSITORY_SAVE_ERROR'}`);
        });
        const verified = imported.filter(id => {
            const saved = Storage.getById('players', 'playerId', id);
            const source = preview.find(x => x.player.playerId === id)?.player;
            return !!saved && (!source?.thaiName || saved.thaiName === source.thaiName);
        });
        this.lastImportedPlayerIds = verified;
        if (verified.length !== imported.length || PlayerService.getAll().length < before + verified.length) return this.showToast(`REPOSITORY_SAVE_ERROR: verified ${verified.length}/${imported.length} players`, 'error');
        this.closeModal(); this.showToast(`Rows Read: ${preview.length} · Players Saved: ${verified.length} · Errors: ${errors.length + preview.filter(x => x.status === 'INVALID').length}`, errors.length ? 'warning' : 'success'); this.navigate('players');
    },
    exportPlayersExcel() { ExcelImportService.exportPlayers(PlayerService.getAll()); this.showToast(this.ui('Players exported to Excel','ส่งออกรายชื่อผู้เล่นเป็น Excel แล้ว'), 'success'); },

    importPlayersCsv() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.csv';
        input.onchange = async (e) => {

                    ${['registered','active'].includes(r.entryStatus)?`<button onclick="RegistrationService.cancel('${r.registrationId}');App.navigate('registration')" class="text-xs px-2 py-1 bg-yellow-100 text-yellow-700 rounded">${this.ui('Cancel','ยกเลิก')}</button><button onclick="RegistrationService.withdraw('${r.registrationId}');App.navigate('registration')" class="text-xs px-2 py-1 bg-red-100 text-red-700 rounded">${this.ui('Withdraw','ถอนตัว')}</button>`:''}
                    ${['cancelled','withdrawn'].includes(r.entryStatus)?`<button onclick="App.reactivateRegistration('${r.registrationId}')" class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">${this.ui('Reactivate','กลับเข้าแข่งขัน')}</button>`:''}
                    ${!RegistrationService.dependencies(r.registrationId)?.pairings.length&&!RegistrationService.dependencies(r.registrationId)?.results.length?`<button onclick="App.removeRegistration('${r.registrationId}')" class="text-xs px-2 py-1 border border-red-300 text-red-600 rounded">Remove</button>`:''}

    filterRegistrationRows(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.registration-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.registrationSearch || '').includes(query));
        });
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = false;
        this.updateRegistrationSelectionCount();
    },

    toggleAllRegistrationRows(master) {
        document.querySelectorAll('.registration-row:not(.hidden) .registration-select').forEach(cb => cb.checked = !!master.checked);
        this.updateRegistrationSelectionCount();
    },

    selectVisibleRegistrations() {
        document.querySelectorAll('.registration-row:not(.hidden) .registration-select').forEach(cb => cb.checked = true);
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = true;
        this.updateRegistrationSelectionCount();
    },

    clearRegistrationSelection() {
        document.querySelectorAll('.registration-select').forEach(cb => cb.checked = false);
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = false;
        this.updateRegistrationSelectionCount();
    },

    selectedRegistrationIds() {
        return Array.from(document.querySelectorAll('.registration-select:checked')).map(cb => cb.value);
    },

    updateRegistrationSelectionCount() {
        const count = this.selectedRegistrationIds().length;
        const el = document.getElementById('registration-selection-count');
        if (el) el.textContent = count ? this.ui(`${count} selected`, `เลือก ${count} คน`) : '';
    },

    bulkCheckInSelected() {
        const ids = this.selectedRegistrationIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one registration.','เลือกรายชื่ออย่างน้อย 1 คน'), 'warning');
        let saved = 0, skipped = 0, invalid = 0;
        const errors = [];
        ids.forEach(id => {
            const r = Storage.getById('registrations', 'registrationId', id);
            if (!r) { invalid++; return; }
            if (r.checkInStatus === 'checked_in') { skipped++; return; }
            if (['cancelled','withdrawn'].includes(r.entryStatus)) { invalid++; errors.push(r.tournamentPlayerCode || r.playerId); return; }
            const result = RegistrationService.checkIn(id);
            if (result.errors) { invalid++; errors.push(r.tournamentPlayerCode || r.playerId); }
            else saved++;
        });
        this.showToast(
            this.ui(
                `Bulk Check-in: ${saved} checked in · ${skipped} already checked in · ${invalid} skipped/invalid${errors.length ? ` (${errors.slice(0,5).join(', ')})` : ''}`,
                `เช็กอินแบบกลุ่ม: สำเร็จ ${saved} คน · เช็กอินแล้ว ${skipped} คน · ข้าม/มีปัญหา ${invalid} คน${errors.length ? ` (${errors.slice(0,5).join(', ')})` : ''}`
            ),
            invalid ? 'warning' : 'success'
        );
        this.navigate('registration');
    },

    bulkUndoCheckInSelected() {
        const ids = this.selectedRegistrationIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one registration.','เลือกรายชื่ออย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui('Undo check-in for selected Players only when they have no competition history? Assigned Tournament Player Codes will be preserved.','ยกเลิกเช็กอินผู้เล่นที่เลือกเฉพาะคนที่ยังไม่มีประวัติการแข่งขันใช่หรือไม่? รหัสผู้เล่นรายการเดิมจะยังคงไว้'))) return;
        let reversed = 0, skipped = 0, protectedCount = 0;
        ids.forEach(id => {
            const r = Storage.getById('registrations', 'registrationId', id);
            if (!r || r.checkInStatus !== 'checked_in') { skipped++; return; }
            const result = RegistrationService.uncheckIn(id);
            if (result.errors) protectedCount++;
            else reversed++;
        });
        this.showToast(
            this.ui(
                `Undo Check-in: ${reversed} reversed · ${skipped} not checked in · ${protectedCount} protected by history.`,
                `ยกเลิกเช็กอิน: สำเร็จ ${reversed} คน · ยังไม่ได้เช็กอิน ${skipped} คน · ป้องกันจากประวัติการแข่งขัน ${protectedCount} คน`
            ),
            protectedCount ? 'warning' : 'success'
        );
        this.navigate('registration');
    },

    showBulkRegForm(divisionId) {
        const div = DivisionService.getById(divisionId);
        if (!div) return this.showToast(this.ui('Division not found.','ไม่พบดิวิชัน'), 'error');

        const players = PlayerService.getAll();
        const existingRegs = RegistrationService.getByDivision(divisionId);
        const registeredIds = new Set(existingRegs.map(r => r.playerId));
        const available = players
            .filter(p => !registeredIds.has(p.playerId))
            .sort((a,b) => {
                const an = String(PlayerDisplayService.primary(a) || a.playerId);
                const bn = String(PlayerDisplayService.primary(b) || b.playerId);
                return an.localeCompare(bn, undefined, {numeric:true, sensitivity:'base'});
            });

        const maxSeed = existingRegs.reduce((m, r) => Math.max(m, Number(r.seed) || 0), 0);
        const startSeed = maxSeed + 1;

        if (!available.length) {
            return this.showToast(
                this.ui('All active Players are already registered in this Division.','ผู้เล่นที่ใช้งานทั้งหมดถูกลงทะเบียนในดิวิชันนี้แล้ว'),
                'warning'
            );
        }

        const playerRows = available.map(p => {
            const name = PlayerDisplayService.primary(p) || p.playerId;
            const thai = p.thaiName || [p.firstNameTh, p.lastNameTh].filter(Boolean).join(' ');
            const search = [p.playerId, name, thai, p.schoolOrClub, p.province, p.country].filter(Boolean).join(' ').toLowerCase();
            return `<label class="bulk-reg-row flex items-start gap-3 p-2 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer" data-bulk-reg-search="${Utils.escHtml(search)}">
                <input type="checkbox" class="bulk-reg-player mt-1" value="${Utils.escHtml(p.playerId)}" onchange="App.updateBulkRegCount()">
                <div class="min-w-0 flex-1">
                    <div class="font-medium">${Utils.escHtml(name)}</div>
                    <div class="text-xs text-gray-500">${Utils.escHtml(p.playerId)}${thai ? ` · ${Utils.escHtml(thai)}` : ''}${p.schoolOrClub ? ` · ${Utils.escHtml(p.schoolOrClub)}` : ''}</div>
                </div>
            </label>`;
        }).join('');

        const body = `<div class="space-y-3">
            <div class="rounded-lg border border-emerald-200 dark:border-emerald-900 p-3 bg-emerald-50/60 dark:bg-emerald-950/20">
                <p class="font-medium">${this.ui(`Bulk Register to ${div.divisionCode}`,`ลงทะเบียนหลายคนเข้า ${div.divisionCode}`)}</p>
                <p class="text-xs text-gray-500 mt-1">${this.ui(`${available.length} active Player(s) are available. Existing registrations are automatically excluded.`,`มีผู้เล่นที่ใช้งานและยังไม่ได้ลงทะเบียน ${available.length} คน รายชื่อที่ลงทะเบียนแล้วจะถูกตัดออกอัตโนมัติ`)}</p>
            </div>

            <div class="flex gap-2 flex-wrap items-center">
                <input id="bulk-reg-search" type="search" oninput="App.filterBulkRegPlayers(this.value)"
                    placeholder="${this.ui('Search name, Player ID, school/club, province...','ค้นหาชื่อ รหัสผู้เล่น โรงเรียน/คลับ จังหวัด...')}"
                    class="flex-1 min-w-[220px] px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
                <button type="button" onclick="App.selectVisibleBulkRegPlayers()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Select Visible','เลือกที่แสดง')}</button>
                <button type="button" onclick="App.selectAllBulkRegPlayers()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Select All','เลือกทั้งหมด')}</button>
                <button type="button" onclick="App.clearBulkRegSelection()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Clear','ล้าง')}</button>
            </div>

            <div class="flex items-center justify-between gap-3 flex-wrap">
                <span id="bulk-reg-count" class="text-sm font-medium text-emerald-700 dark:text-emerald-300">${this.ui('0 selected','เลือก 0 คน')}</span>
                <label class="text-sm flex items-center gap-2">
                    <span>${this.ui('Starting seed','Seed เริ่มต้น')}</span>
                    <input id="bulk-reg-start-seed" type="number" min="1" value="${startSeed}" class="w-24 px-2 py-1.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </label>
            </div>

            <div class="border rounded-lg max-h-[48vh] overflow-y-auto dark:border-gray-700">
                ${playerRows}
            </div>

            <p class="text-xs text-gray-500">${this.ui('Seeds are assigned sequentially in the order shown. Registration does not check players in automatically; use Check-in Selected afterward.','ระบบจะกำหนด Seed ต่อเนื่องตามลำดับรายชื่อที่แสดง การลงทะเบียนจะยังไม่เช็กอินอัตโนมัติ จากนั้นใช้ Check-in Selected ได้ตามปกติ')}</p>
        </div>`;

        const actions = `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button>
            <button onclick="App.saveBulkRegistrations('${divisionId}')" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-medium">${this.ui('Register Selected','ลงทะเบียนที่เลือก')}</button>`;

        this.showModal(this.ui(`Register Many — ${div.divisionCode}`,`ลงทะเบียนหลายคน — ${div.divisionCode}`), body, actions);
    },

    filterBulkRegPlayers(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.bulk-reg-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.bulkRegSearch || '').includes(query));
        });
        this.updateBulkRegCount();
    },

    selectVisibleBulkRegPlayers() {
        document.querySelectorAll('.bulk-reg-row:not(.hidden) .bulk-reg-player').forEach(cb => cb.checked = true);
        this.updateBulkRegCount();
    },

    selectAllBulkRegPlayers() {
        document.querySelectorAll('.bulk-reg-player').forEach(cb => cb.checked = true);
        this.updateBulkRegCount();
    },

    clearBulkRegSelection() {
        document.querySelectorAll('.bulk-reg-player').forEach(cb => cb.checked = false);
        this.updateBulkRegCount();
    },

    updateBulkRegCount() {
        const count = document.querySelectorAll('.bulk-reg-player:checked').length;
        const el = document.getElementById('bulk-reg-count');
        if (el) el.textContent = this.ui(`${count} selected`, `เลือก ${count} คน`);
    },

    saveBulkRegistrations(divisionId) {
        const div = DivisionService.getById(divisionId);
        if (!div) return this.showToast(this.ui('Division not found.','ไม่พบดิวิชัน'), 'error');

        const selected = Array.from(document.querySelectorAll('.bulk-reg-player:checked')).map(cb => cb.value);
        if (!selected.length) {
            return this.showToast(this.ui('Select at least one Player.','เลือกผู้เล่นอย่างน้อย 1 คน'), 'warning');
        }

        const startSeedRaw = String(document.getElementById('bulk-reg-start-seed')?.value || '').trim();
        const startSeed = Number(startSeedRaw);
        if (!Number.isInteger(startSeed) || startSeed < 1) {
            return this.showToast(this.ui('Starting seed must be a positive integer.','Seed เริ่มต้นต้องเป็นจำนวนเต็มบวก'), 'error');
        }

        // Preserve the visual list order, not click order.
        const orderedSelected = Array.from(document.querySelectorAll('.bulk-reg-player'))
            .filter(cb => cb.checked)
            .map(cb => cb.value);

        let registered = 0;
        let skipped = 0;
        const errors = [];

        orderedSelected.forEach(playerId => {
            const existing = RegistrationService.getByDivision(divisionId).find(r => r.playerId === playerId);
            if (existing) {
                skipped++;
                return;
            }

            const result = RegistrationService.create({
                tournamentId: div.tournamentId,
                divisionId,
                playerId,
                seed: startSeed + registered
            });

            if (result.errors) {
                errors.push(`${playerId}: ${result.errors[0]}`);
                skipped++;
            } else {
                registered++;
            }
        });

        this.closeModal();
        this.showToast(
            this.ui(
                `Bulk registration: ${registered} registered · ${skipped} skipped${errors.length ? ` · ${errors.slice(0,3).join(' | ')}` : ''}`,
                `ลงทะเบียนแบบกลุ่ม: สำเร็จ ${registered} คน · ข้าม ${skipped} คน${errors.length ? ` · ${errors.slice(0,3).join(' | ')}` : ''}`
            ),
            errors.length ? 'warning' : 'success'
        );
        this.navigate('registration');
    },

    showRegForm(divisionId) {
        const div = DivisionService.getById(divisionId);
        const players = PlayerService.getAll();
        const existingRegs = RegistrationService.getByDivision(divisionId);
        const registeredIds = new Set(existingRegs.map(r=>r.playerId));
        const available = players.filter(p => !registeredIds.has(p.playerId));

        const body = `<form id="reg-form" class="space-y-3">
            <div><label class="text-sm font-medium block mb-1" for="rf-player">Player *</label>
                <select id="rf-player" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                    <option value="">-- Select Player --</option>
                    ${available.map(p=>`<option value="${p.playerId}">${p.playerId} - ${p.firstName||p.firstNameTh} ${p.lastName||p.lastNameTh}</option>`).join('')}

    // ========== ROUNDS ==========
    renderRounds(el) {
        if (!this.currentTournamentId) { el.innerHTML = '<p class="text-gray-500 text-center py-8">Select a tournament first</p>'; return; }
        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d=>d.divisionId===this.currentDivisionId) : divs[0];
        if (!targetDiv) { el.innerHTML = '<p class="text-gray-500 py-8">No divisions</p>'; return; }
        const rounds = RoundService.getByDivision(targetDiv.divisionId);

        let html = `<div class="space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h3 class="font-semibold">${targetDiv.divisionCode} — Rounds (${rounds.length}/${targetDiv.totalRounds})</h3>
                <button onclick="App.createRound('${targetDiv.divisionId}')" class="px-3 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium">${this.ui('+ New Round','+ รอบใหม่')}</button>
            </div>
            <div class="card rounded-lg p-4 border border-cyan-700 bg-cyan-950/10">
                <h4 class="font-semibold">Round Lifecycle Centralization</h4>
                <p class="text-sm text-gray-500 mt-1">All Round status changes now pass through one lifecycle transition graph. Illegal jumps are blocked before status mutation.</p>
                <button onclick="App.runRoundLifecycleSelfTest()" class="mt-3 px-3 py-2 border border-cyan-600 text-cyan-500 rounded-lg text-sm">Run Round Lifecycle Self-Test</button>
                <div id="round-lifecycle-self-test-result" class="hidden"></div>
            </div>`;
        rounds.forEach(r => {
            const pairings = PairingService.getByRound(r.roundId);
            const results = ResultService.getByRound(r.roundId);
            // Patch 02.15.1 — BYE is an official result and must count toward round completeness.
            // Use all non-cancelled pairings/results here; do not compare against normal pairings only.
            const activePairings = pairings.filter(p=>p.status !== 'cancelled');
            const activeResults = results.filter(m=>m.status !== 'voided' && m.resultType !== 'void');
            const roundResultIntegrity = PairingResultIntegrityService.inspectRound(r.roundId);
            const allPairingResultsComplete = activePairings.length > 0 &&
                activeResults.length === activePairings.length &&
                activePairings.every(p => PairingResultIntegrityService.hasExactlyOneActiveResult(
                    p.pairingId,
                    p.pairingType === 'bye' ? 'bye' : 'normal'
                ));
            html += `<div class="card rounded-lg p-4 bg-white dark:bg-gray-800">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div>
                        <h4 class="font-bold">${r.roundLabel}</h4>
                        <p class="text-xs text-gray-500">Status: <span class="status-badge ${r.status==='locked'?'bg-purple-100 text-purple-800':r.status==='in_progress'?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-600'}">${r.status}</span>
                        · Maximum Spread: ±${SpreadLimitResolver.getSpreadLimit(targetDiv.divisionId, r.roundNumber)} ${SpreadLimitResolver.getRule(targetDiv.divisionId, r.roundNumber).overridden ? '<span class="status-badge bg-amber-100 text-amber-800">ROUND OVERRIDE</span>' : ''} · Pairings: ${activePairings.length} · Results: ${activeResults.length}/${activePairings.length}</p>
                    </div>
                    <div class="flex gap-1 flex-wrap">
                        <button onclick="App.openRoundPairings('${r.roundId}','${targetDiv.divisionId}')" class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">${this.ui('Pairings','คู่แข่งขัน')}</button>
                        ${r.status==='pairing_confirmed' && results.length===0?`<button onclick="App.reopenPairings('${r.roundId}')" class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded">${this.ui('Reopen Pairings','เปิดแก้ไขคู่แข่งขัน')}</button>`:''}
                        ${r.status==='pairing_confirmed'?`<button onclick="App.startRound('${r.roundId}')" class="text-xs px-2 py-1 bg-green-100 text-green-700 rounded">Start</button>`:''}
                        ${r.status==='draft'?`<button onclick="App.deleteRound('${r.roundId}')" class="text-xs px-2 py-1 bg-red-100 text-red-700 rounded">${this.ui('Delete Round','ลบรอบ')}</button>`:''}
                        ${r.status==='in_progress'||r.status==='results_pending'||r.status==='completed'?`<button onclick="App.currentDivisionId='${targetDiv.divisionId}';App.navigate('results')" class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">${this.ui('Results','ผลการแข่งขัน')}</button>`:''}
                        ${(r.status==='completed'||r.status==='in_progress')&&allPairingResultsComplete&&roundResultIntegrity.ok?`<button onclick="App.lockRound('${r.roundId}')" class="text-xs px-2 py-1 bg-purple-100 text-purple-700 rounded">Lock</button>`:''}
                        ${r.status==='locked'?`<button onclick="App.unlockRound('${r.roundId}')" class="text-xs px-2 py-1 bg-red-100 text-red-700 rounded">${this.ui('Unlock','ปลดล็อก')}</button>`:''}
                    </div>
                </div>
            </div>`;
        });
        html += `</div>`;
        el.innerHTML = html;
    },

    startRound(roundId) {
        const round = RoundService.getById(roundId);
        if (!round) return;
        const pairings = PairingService.getByRound(roundId);
        if (!pairings.length || !pairings.some(p => p.status === 'confirmed')) { this.showToast('Cannot start round. No pairings have been created.', 'error'); return; }
        const validation = PairingService.validateRound(roundId);
        if (validation.errors.length) { this.showToast(`Cannot start: ${validation.errors.join('; ')}`, 'error'); return; }
        const started = RoundService.startRound(roundId);
        if (started.errors) { this.showToast(started.errors.join('; '), 'error'); return; }
        this.showToast('Round started', 'success');
        this.navigate('rounds');
    },

        const round = RoundService.getById(roundId);

        const count = PairingService.getByRound(roundId).length;
        const body = `<p>This round contains ${count} draft pairing(s). Delete the round and its draft pairings?</p>`;
        this.showModal('Delete Round?', body, `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmDeleteRound('${roundId}')" class="px-4 py-2 bg-red-600 text-white rounded-lg">${this.ui('Delete Round','ลบรอบ')}</button>`);

            <div class="p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 text-sm text-amber-800 dark:text-amber-200"><b>Correction guard:</b> Official standing snapshots from Round ${round?.roundNumber || '?'} onward will be marked INVALIDATED, not deleted. If the Tournament is completed/approved, its lifecycle will return to ACTIVE until the correction is re-locked.</div>

    assignExplicitBye(roundId, divisionId, registrationId) {
        const round = RoundService.getById(roundId);
        if (!round || round.divisionId !== divisionId) { this.showToast('Round or Division not found.', 'error'); return; }
        if (!['draft','pairing_generated'].includes(round.status)) { this.showToast('BYE can only be assigned while pairings are editable.', 'error'); return; }
        if (ResultService.getByRound(roundId).length) { this.showToast('Cannot assign BYE after results exist.', 'error'); return; }
        const eligible = RegistrationService.getEligible(divisionId);
        const pairings = PairingService.getByRound(roundId);
        const pairedIds = new Set(pairings.flatMap(p=>[p.player1Id,p.player2Id].filter(Boolean)));
        const unpaired = eligible.filter(r=>!pairedIds.has(r.playerId));
        if (eligible.length % 2 === 0) { this.showToast('Even player pool must not receive a BYE.', 'error'); return; }
        if (pairings.some(p=>p.pairingType==='bye')) { this.showToast('This round already has a BYE.', 'error'); return; }
        if (unpaired.length !== 1 || unpaired[0].registrationId !== registrationId) { this.showToast('Assign BYE is allowed only for the sole remaining eligible player.', 'error'); return; }
        const reg = unpaired[0];
        const nextTable = TableAssignmentService.nextAvailable(roundId, divisionId);
        const result = PairingService.create({
            tournamentId: round.tournamentId, divisionId, roundId,
            roundNumber: round.roundNumber, tableNumber: nextTable,
            player1RegistrationId: reg.registrationId, player1Id: reg.playerId,
            pairingType: 'bye', generatedMethod: 'manual', manualOverride: true,
            engineMetadata: { assignmentMode:'explicit_manual_bye' }
        });
        if (result.errors) { this.showToast(result.errors.join('; '), 'error'); return; }
        AuditService.log({ tournamentId:round.tournamentId, divisionId, roundId, entityType:'pairing', entityId:result.data.pairingId, action:'assign_bye', eventCode:'MANUAL_BYE_ASSIGNED', after:{ pairingId:result.data.pairingId, registrationId:reg.registrationId, playerId:reg.playerId, tableNumber:nextTable } });
        this.currentPairingProposal = null;
        this.showToast('BYE assigned to the remaining player.', 'success');
        this.navigate('pairings');
    },

    syncPairingPlanByeUI(roundId, divisionId) {
        const context = PairingContextBuilder.build(divisionId, roundId);
        const engineName = document.getElementById('plan-engine')?.value;
        const byeWrap = document.getElementById('plan-bye-wrap');
        const byeSelect = document.getElementById('plan-bye');
        const rrInfo = document.getElementById('plan-rr-bye-info');
        const gibsonWrap = document.getElementById('plan-gibson-wrap');
        const gibsonSelect = document.getElementById('plan-gibson');
        const dualByeAdvisory = document.getElementById('plan-dual-bye-advisory');
        if (!byeWrap || !byeSelect || !rrInfo || !gibsonWrap || !gibsonSelect || context.errors) return;
        const previousBye = byeSelect.value;
        byeWrap.classList.add('hidden'); rrInfo.classList.add('hidden'); gibsonWrap.classList.add('hidden'); if (dualByeAdvisory) dualByeAdvisory.classList.add('hidden');
        if (engineName === 'round_robin') { if (context.registrations.length % 2 === 1) rrInfo.classList.remove('hidden'); return; }
        let excludedGibson = new Set();
        if (engineName === 'king_of_the_hill') {
            gibsonWrap.classList.remove('hidden');
            if (!gibsonSelect.options.length) gibsonSelect.innerHTML = context.registrations.map(r => `<option value="${r.registrationId}">${Utils.escHtml(TournamentPlayerDisplayService.label(r.registrationId,r.playerId))}</option>`).join('');
            excludedGibson = new Set([...gibsonSelect.selectedOptions].map(o => o.value));
        }
        const activePool = context.registrations.filter(r => !excludedGibson.has(r.registrationId));
        if (activePool.length % 2 === 1 && context.byePolicy?.selectionMethod === 'manual') {
            byeWrap.classList.remove('hidden');
            byeSelect.innerHTML = '<option value="">— Select player who receives ordinary BYE —</option>' + activePool.map(r => `<option value="${r.registrationId}">${Utils.escHtml(TournamentPlayerDisplayService.label(r.registrationId,r.playerId))}</option>`).join('');
            if ([...byeSelect.options].some(o => o.value === previousBye)) byeSelect.value = previousBye;
            if (dualByeAdvisory && engineName==='king_of_the_hill' && excludedGibson.size) dualByeAdvisory.classList.remove('hidden');
        } else { byeSelect.innerHTML = '<option value="">— No ordinary BYE required —</option>'; byeSelect.value = ''; }
    },

    detectAutomaticGibsonClinch(roundId, divisionId) {
        const engineName=document.getElementById('plan-engine')?.value;
        if(engineName!=='king_of_the_hill'){ this.showToast('Automatic Gibson detection applies to KOTH only.','error'); return; }
        const status=document.getElementById('plan-gibson-auto-status');
        const detection=AutomaticGibsonClinchDetectionService.detectForRound(divisionId,roundId);
        if(!detection.ok){ if(status) status.textContent=(detection.errors||[]).join(' '); this.showToast((detection.errors||['Detection failed.']).join(' '),'error'); return; }
        if(!detection.candidates.length){ this.currentAutomaticGibsonAcceptance=null; if(status) status.textContent=detection.status==='UNDETERMINED'?'UNDETERMINED — no automatic Gibson proposal.':'No player is mathematically proven clinched for this round.'; this.showToast(status?.textContent||'No proven Gibson candidate.','info'); return; }
        const labels=detection.candidates.map((c,i)=>`${i+1}. ${TournamentPlayerDisplayService.resolveByPlayerId(divisionId,c.playerId).displayLabel} | current #${c.currentRank} | worst bounded rank #${c.securedRank} | guaranteed Top ${c.qualificationCutoffRank}`).join('\n');
        const ok=confirm(`Gibson Qualification Preview — Patch 02.35.1\n\nThe following player(s) are mathematically guaranteed to remain inside the Final Top ${detection.qualificationCutoffRank}, even under conservative remaining-round bounds:\n\n${labels}\n\nThis is ONLY a preview. Manager may Gibsonize none, one, or several candidates.\n\nPress OK to mark these proven candidates in the selector for review. You may freely unselect any player to KEEP PLAYING before Preview + Confirm.`);
        if(!ok){ if(status) status.textContent='Qualified candidate(s) detected. Manager chose Keep Playing / no selection change.'; return; }
        const select=document.getElementById('plan-gibson');
        const ids=detection.candidates.map(c=>c.registrationId);
        [...select.options].forEach(o=>{ if(ids.includes(o.value)) o.selected=true; });
        const proofByRegistrationId={}; detection.candidates.forEach(c=>proofByRegistrationId[c.registrationId]=c);
        this.currentAutomaticGibsonAcceptance={roundId,divisionId,registrationIds:ids,proofByRegistrationId,acceptedAt:Utils.now()};
        const reason=document.getElementById('plan-reason');
        if(reason && !reason.value.trim()) reason.value=`Top-2 qualification proof reviewed by manager before Round ${RoundService.getById(roundId)?.roundNumber} (Patch 02.35.1)`;
        this.currentPairingProposal=null;
        this.syncPairingPlanByeUI(roundId,divisionId);
        if(status) status.textContent=`Detected ${ids.length} guaranteed Top-2 candidate(s). Manager may keep playing by unselecting any/all before Preview.`;
        this.showToast('Top-2 Gibson candidates marked for manager review. Unselect any player who should keep playing, then Preview.','success');

    previewPairingPlan(roundId, divisionId) {
        const round = RoundService.getById(roundId);
        const context = PairingContextBuilder.build(divisionId, roundId);
        const engineName = document.getElementById('plan-engine').value;
        const byeSelect = document.getElementById('plan-bye');
        if (byeSelect?.value) context.manualByeRegistrationId = byeSelect.value;
        const gibsonSelect = document.getElementById('plan-gibson');
        if (engineName === 'king_of_the_hill' && gibsonSelect) context.gibsonByeRegistrationIds = [...gibsonSelect.selectedOptions].map(o => o.value);
        if (engineName === 'king_of_the_hill' && this.currentAutomaticGibsonAcceptance?.roundId===roundId && this.currentAutomaticGibsonAcceptance?.divisionId===divisionId) { const accepted=new Set(this.currentAutomaticGibsonAcceptance.registrationIds||[]); const selected=new Set(context.gibsonByeRegistrationIds||[]); if ([...accepted].every(id=>selected.has(id))) { context.gibsonAssignmentSource='koth_gibson_auto_confirmed'; context.gibsonClinchProofByRegistrationId=this.currentAutomaticGibsonAcceptance.proofByRegistrationId||{}; } }
        const planReason = (document.getElementById('plan-reason')?.value || '').trim();
        context.gibsonizationReason = planReason;
        if (context.gibsonByeRegistrationIds?.length && !planReason) {
            const preview = document.getElementById('pairing-preview');
            preview.innerHTML = '<span class="text-red-600">Gibsonization reason is required when awarding a Gibson BYE.</span>';
            this.currentPairingProposal = null;
            return { errors:['Gibsonization reason is required.'], pairings:[], valid:false };
        }
        const engine = PairingEngineRegistry.get(engineName);
        const rawProposal = engine ? engine.generate(context) : { errors: ['Unknown pairing engine'], pairings: [], valid:false };
        const proposal = (rawProposal.errors || []).length ? rawProposal : TableAssignmentService.assignProposal(rawProposal, context);
        const engineErrors = proposal.errors || [];
        const validation = engineErrors.length ? { valid:false, errors:engineErrors, warnings:proposal.warnings || [] } : PairingValidationService.validate(proposal, context);
        const preview = document.getElementById('pairing-preview');
        const playerLabel = (playerId) => {
            const display = TournamentPlayerDisplayService.resolveByPlayerId(divisionId, playerId);
            return display.missingCode ? `<span class="text-red-600" title="${Utils.escHtml(display.warning)}">Player Code Missing — ${Utils.escHtml(display.playerName)}</span>` : Utils.escHtml(display.displayLabel);
        };
        this.currentPairingProposal = validation.valid ? { roundId, divisionId, engineName, proposal, generatedAt: Utils.now() } : null;
        if (this.currentPairingProposal) this.renderCurrentPairingProposalPreview(roundId, divisionId);
        else {
            const allWarnings = [...new Set([...(proposal.warnings||[]), ...(validation.warnings||[])])];
            preview.innerHTML = `<strong>${engineName==='swiss'?'SWISS PAIRING':engineName}</strong> — ${proposal.pairings?.length||0} pairings<br>${(proposal.pairings||[]).map(p=>`Table ${p.tableNumber}: ${playerLabel(p.player1Id)} ${p.pairingType==='bye'?`— ${(p.byeReason||p.engineMetadata?.byeReason)==='gibson'?'GIBSON BYE':'BYE'}`:'vs '+playerLabel(p.player2Id)}`).join('<br>')}<br>${allWarnings.length?`<span class="text-amber-600">${allWarnings.map(w=>'⚠ '+Utils.escHtml(w)).join('<br>')}</span><br>`:''}<span class="text-red-600">Validation failed: ${validation.errors.map(e=>Utils.escHtml(e)).join('; ')}</span>`;
        }
        return proposal;
    },

    renderCurrentPairingProposalPreview(roundId, divisionId) {
        const frozen=this.currentPairingProposal;
        const preview=document.getElementById('pairing-preview');
        if(!preview || !frozen || frozen.roundId!==roundId || frozen.divisionId!==divisionId) return;
        const context=PairingContextBuilder.build(divisionId,roundId);
        const proposal=frozen.proposal;
        const validation=PairingValidationService.validate(proposal,context);
        const playerLabel=(playerId)=>Utils.escHtml(TournamentPlayerDisplayService.resolveByPlayerId(divisionId,playerId).displayLabel);
        const rows=(proposal.pairings||[]).map(p=>{
            const same=PairingProposalOverrideService.sameAffiliation(p,context);
            const advisory=same?'border-l-4 border-orange-500 bg-orange-500/10':'';
            const tag=same?'<span class="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-orange-500" title="Same school / club — advisory only"></span>':'';
            const detail=p.pairingType==='bye'
                ? `${playerLabel(p.player1Id)} — ${(p.byeReason||p.engineMetadata?.byeReason)==='gibson'?'GIBSON BYE':'BYE'}`
                : `${playerLabel(p.player1Id)} <span class="text-gray-400">vs</span> ${playerLabel(p.player2Id)}`;
            return `<div class="px-2 py-1.5 rounded ${advisory}"><span class="font-mono text-xs text-gray-500">T${p.tableNumber}</span> · ${detail}${tag}${p.manualOverride?'<span class="ml-2 text-xs text-fuchsia-500">MANUAL SWAP</span>':''}</div>`;
        }).join('');
        const slots=PairingProposalOverrideService.swappableSlots(proposal);
        const options=slots.map(x=>`<option value="${Utils.escHtml(x.playerId)}">T${x.tableNumber} · ${playerLabel(x.playerId)}</option>`).join('');
        const sameCount=(proposal.pairings||[]).filter(p=>PairingProposalOverrideService.sameAffiliation(p,context)).length;
        const allWarnings=[...new Set([...(proposal.warnings||[]),...(validation.warnings||[])])];
        preview.innerHTML=`
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><strong>${frozen.engineName==='swiss'?'SWISS PAIRING':Utils.escHtml(frozen.engineName)} — ${proposal.pairings?.length||0} pairings</strong><span class="text-xs text-gray-500">Exact preview — no regeneration on Confirm</span></div>
            <div class="space-y-1">${rows}</div>
            ${sameCount?`<div class="mt-2 text-xs text-orange-500">Orange strip = same school / club advisory (${sameCount}). It does not block confirmation.</div>`:''}
            ${slots.length>=4?`<div class="mt-3 p-3 rounded-lg border border-fuchsia-500/40 bg-fuchsia-500/5"><div class="font-medium text-sm mb-2">Partial Manual Override — swap two players between NORMAL tables</div><div class="grid md:grid-cols-2 gap-2"><select id="override-player-a" class="px-2 py-2 border rounded dark:bg-gray-800 dark:border-gray-600"><option value="">Player A…</option>${options}</select><select id="override-player-b" class="px-2 py-2 border rounded dark:bg-gray-800 dark:border-gray-600"><option value="">Player B…</option>${options}</select></div><button type="button" onclick="App.swapPreviewPlayers('${roundId}','${divisionId}')" class="mt-2 px-3 py-2 border border-fuchsia-500 text-fuchsia-500 rounded-lg text-sm">Swap selected players</button><p class="mt-1 text-xs text-gray-500">BYE/Gibson BYE slots are protected. The whole proposal is revalidated after every swap.</p></div>`:''}
            ${allWarnings.length?`<div class="mt-2 text-amber-600">${allWarnings.map(w=>'⚠ '+Utils.escHtml(w)).join('<br>')}</div>`:''}
            <div class="mt-2 ${validation.valid?'text-green-600':'text-red-600'}">${validation.valid?'Ready to confirm — this exact preview will be saved':'Validation failed: '+validation.errors.map(e=>Utils.escHtml(e)).join('; ')}</div>`;
        frozen.validation=validation;
        return validation;
    },

    swapPreviewPlayers(roundId, divisionId) {
        const frozen=this.currentPairingProposal;
        if(!frozen || frozen.roundId!==roundId || frozen.divisionId!==divisionId){ this.showToast('Generate a valid preview first.','error'); return; }
        const a=document.getElementById('override-player-a')?.value || '';
        const b=document.getElementById('override-player-b')?.value || '';
        const swapped=PairingProposalOverrideService.swapPlayers(frozen.proposal,a,b);
        if(!swapped.ok){ this.showToast(swapped.errors.join('; '),'error'); return; }
        frozen.proposal=swapped.proposal;
        frozen.manualOverrideApplied=true;
        frozen.manualSwapHistory=Array.isArray(frozen.manualSwapHistory) ? frozen.manualSwapHistory : [];
        const swapRecord=PairingManualSwapAuditService.makeRecord(swapped.swapped,divisionId,frozen.manualSwapHistory.length+1);
        if (swapRecord) frozen.manualSwapHistory.push(swapRecord);
        const reason=document.getElementById('plan-reason');
        const previousAutoReason=frozen.autoSwapReason || '';
        const nextAutoReason=`Partial manual pairing swap: ${PairingManualSwapAuditService.summary(frozen.manualSwapHistory)}`;
        if(reason && (!reason.value.trim() || reason.value.trim()===previousAutoReason)) reason.value=nextAutoReason;
        frozen.autoSwapReason=nextAutoReason;
        const validation=this.renderCurrentPairingProposalPreview(roundId,divisionId);
        this.showToast(validation?.valid?'Players swapped. Whole proposal revalidated.':'Swap applied but proposal is not valid yet.',validation?.valid?'success':'error');
    },

            this.showToast('Preview this pairing plan first. Confirm will save only the exact valid preview.', 'error');
            return;

        const context = PairingContextBuilder.build(divisionId, roundId);

        if (!validation.valid) { this.currentPairingProposal = null; this.showToast('Pairing context changed. Generate a new preview.', 'error'); return; }
        // PATCH 02.41: frozen.proposal may contain manager swaps. Confirm persists this exact
        // revalidated proposal; it never calls the pairing engine again.
        const swapHistory=Array.isArray(frozen.manualSwapHistory) ? frozen.manualSwapHistory : [];
        const auditReason=PairingManualSwapAuditService.confirmationReason(document.getElementById('plan-reason').value,swapHistory);

    requestVoidResult(resultId) {
        const result = Storage.getById('matchResults', 'resultId', resultId);
        if (!result) {
            this.showToast('Result not found.', 'error');
            return;
        }
        const round = RoundService.getById(result.roundId);
        if (round?.status === 'locked') {
            this.showToast(`Round ${round.roundNumber} is LOCKED. Unlock the round first.`, 'error');
            return;
        }

        const reason = prompt(
            'Void this result for historical correction?\n\nA reason is required. The original result will be preserved as VOIDED and a replacement result can be entered afterward.',
            ''
        );
        if (reason === null) return;
        if (!reason.trim()) {
            this.showToast('Reason is required to void a result.', 'error');
            return;
        }

        const confirmed = confirm(
            `Void result ${result.player1Score}–${result.player2Score}?\n\nReason: ${reason.trim()}\n\nThe historical record will NOT be deleted.`
        );
        if (!confirmed) return;

        const response = ResultService.voidResult(resultId, reason.trim());
        if (response.errors?.length) {
            this.showToast(response.errors.join(' '), 'error');
            return;
        }
        this.showToast('Result voided safely. Enter the replacement result before locking the round.', 'success');
        this.navigate('results');
    },

    runResultEntryIntegritySelfTest() {
        const selfTest = ResultEntryIntegrityService.runSelfTest();
        const divisionId = this.currentDivisionId || DivisionService.getByTournament(this.currentTournamentId || '')[0]?.divisionId;
        const live = divisionId ? ResultEntryIntegrityService.inspectDivision(divisionId) : {ok:false,errors:['Select a Division first.'],warnings:[],normalResultCount:0,byeResultCount:0};
        const ok = selfTest.ok && live.ok;
        const el = document.getElementById('result-entry-integrity-self-test-result');
        if (el) {
            el.classList.remove('hidden');
            el.className = `text-sm rounded-lg p-3 border mt-3 ${ok?'border-green-600 text-green-400':'border-red-600 text-red-400'}`;
            el.textContent = ok
                ? `✓ PASS — ${selfTest.message} Live normal results checked: ${live.normalResultCount}; BYE results skipped as system-managed: ${live.byeResultCount}.`
                : `✗ FAIL — ${[...(selfTest.errors||[]),...(live.errors||[])].join(' ')}`;
        }
        this.showToast(ok?'Result Entry Integrity PASSED.':'Result Entry Integrity FAILED.',ok?'success':'error');
        return {ok,selfTest,live};
    },
