const RegistrationService = {
    create(data) {
        const division = DivisionService.getById(data.divisionId);
        if (!division) return { errors: ['Division not found'] };
        const memberIds = [...new Set((Array.isArray(data.memberPlayerIds) && data.memberPlayerIds.length ? data.memberPlayerIds : [data.playerId]).filter(Boolean))];
        if (!memberIds.length) return { errors:['At least one Player is required.'] };
        const maxMembers = Number(division.maxEntryMembers || ((division.entryMode||'individual_only')==='individual_or_pair' ? 2 : 1));
        if (memberIds.length > maxMembers) return { errors:[`This Division allows a maximum of ${maxMembers} member(s) per Entry.`] };
        if ((division.entryMode||'individual_only') === 'individual_only' && memberIds.length > 1) return { errors:['This Division is Individual only.'] };
        const members = memberIds.map(id=>PlayerService.getById(id));
        if (members.some(x=>!x)) return { errors:['One or more Players were not found.'] };
        if (CompetitionEntryService.membersAlreadyRegistered(data.divisionId, memberIds)) return { errors:['One or more selected members are already registered in this Division.'] };

        const player = members[0];
        const r = {
            registrationId: Utils.generateId('REG'),
            tournamentId: data.tournamentId, divisionId: data.divisionId,
            playerId: player.playerId,
            memberPlayerIds: memberIds,
            entryType: memberIds.length > 1 ? 'pair' : 'single',
            seed: data.seed ? parseInt(data.seed) : null,
            ratingAtEntry: player.currentRating,
            memberRatingsAtEntry: members.map(p=>p.currentRating),
            affiliationAtEntry: [...new Set(members.map(p=>p.schoolOrClub||'').filter(Boolean))].join(' / '),
            memberAffiliationsAtEntry: members.map(p=>p.schoolOrClub||''),
            entryStatus: 'registered', checkInStatus: 'not_checked_in',
            eligibleForPairing: false,
            tournamentPlayerCode: null,
            checkedInAt: null,
            notes: data.notes || '',
            registeredAt: Utils.now(), updatedAt: Utils.now(), createdBy: 'admin', updatedBy: 'admin'
        };
        const errors = Validation.registration(r);
        if (errors.length) return { errors };
        Storage.insert('registrations', r);
        AuditService.log({ tournamentId: r.tournamentId, divisionId: r.divisionId, entityType: 'registration', entityId: r.registrationId, action: 'create', eventCode: 'COMPETITION_ENTRY_CREATED', after: { ...r, memberNames: members.map(p=>PlayerDisplayService.primary(p)) } });
        return { data: r };
    },
    updateStatus(id, entryStatus, reason) {
        const before = Storage.getById('registrations', 'registrationId', id);
        if (!before) return { errors: ['Registration not found'] };
        const after = Storage.update('registrations', 'registrationId', id, { entryStatus });
        AuditService.log({ tournamentId: before.tournamentId, divisionId: before.divisionId, entityType: 'registration', entityId: id, action: 'update', eventCode: 'REGISTRATION_STATUS_CHANGED', before, after, reason });
        return { data: after };
    },
    checkIn(id) {
        const registration = Storage.getById('registrations', 'registrationId', id);
        if (!registration) return { errors: ['Registration not found'] };
        const division = DivisionService.getById(registration.divisionId);
        if (!division) return { errors: ['Division not found'] };
        // Preserve an existing code across re-check-in; otherwise derive the next
        // sequence from every previously assigned code in this tournament/division.
        let code = registration.tournamentPlayerCode || null;
        if (!code) {
            code = TournamentPlayerCodeService.getNextCode(registration.tournamentId, registration.divisionId);
            if (!TournamentPlayerCodeService.validateCodeUniqueness(code, registration.registrationId)) {
                return { errors: ['Unable to assign a unique Tournament Player ID. Please try again.'] };
            }
        }
        const before = Utils.deepClone(registration);
        const after = Storage.update('registrations', 'registrationId', id, { checkInStatus: 'checked_in', checkedInAt: registration.checkedInAt || Utils.now(), entryStatus: 'active', eligibleForPairing: true, tournamentPlayerCode: code });
        AuditService.log({ tournamentId: registration.tournamentId, divisionId: registration.divisionId, entityType: 'registration', entityId: id, action: 'check_in', eventCode: (CompetitionEntryService.isPair(registration) ? 'PAIR_ENTRY_CHECKED_IN' : 'PLAYER_CHECKED_IN'), before, after, reason: code });
        if (!before.tournamentPlayerCode) AuditService.log({ tournamentId: registration.tournamentId, divisionId: registration.divisionId, entityType: 'registration', entityId: id, action: 'assign_code', eventCode: 'TOURNAMENT_PLAYER_CODE_ASSIGNED', after: { registrationId: id, playerId: registration.playerId, divisionId: registration.divisionId, tournamentPlayerCode: code } });
        return { data: after };
    },
    uncheckIn(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Registration not found'] };
        const registration = d.registration;
        if (registration.checkInStatus !== 'checked_in') return { errors: ['Registration is not checked in.'] };
        if (d.pairings.length || d.results.length || d.snapshots.length || d.locked) {
            return { errors: ['Check-in cannot be reversed after competition history exists.'] };
        }
        const before = Utils.deepClone(registration);
        const nextEntryStatus = registration.entryStatus === 'active' ? 'registered' : registration.entryStatus;
        const after = Storage.update('registrations', 'registrationId', id, {
            checkInStatus: 'not_checked_in',
            checkedInAt: null,
            entryStatus: nextEntryStatus,
            eligibleForPairing: false
        });
        AuditService.log({
            tournamentId: registration.tournamentId,
            divisionId: registration.divisionId,
            entityType: 'registration',
            entityId: id,
            action: 'uncheck_in',
            eventCode: 'PLAYER_CHECKIN_REVERSED',
            before,
            after,
            reason: 'Bulk/manual check-in correction before competition history.'
        });
        return { data: after };
    },
    getByDivision(divId) { return Storage.find('registrations', r => r.divisionId === divId); },
    getByTournament(tid) { return Storage.find('registrations', r => r.tournamentId === tid); },
    getEligible(divId) { return RegistrationEligibilityResolver.getEligibleRegistrations(divId); },
    dependencies(id) {
        const r = Storage.getById('registrations', 'registrationId', id);
        if (!r) return null;
        const pairings = Storage.find('pairings', p => p.player1RegistrationId === id || p.player2RegistrationId === id);
        const results = Storage.find('matchResults', m => m.player1RegistrationId === id || m.player2RegistrationId === id);
        const rounds = pairings.map(p => RoundService.getById(p.roundId)).filter(Boolean);
        const snapshots = Storage.find('standingSnapshots', s => (s.rows || []).some(row => row.playerId === r.playerId));
        return { registration: r, pairings, results, rounds, snapshots, locked: rounds.some(round => round.status === 'locked') };
    },
    cancel(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Registration not found'] };
        if (d.results.length) return { errors: ['This registration has competition history. Use Withdraw instead.'] };
        const before = Utils.deepClone(d.registration);
        const after = Storage.update('registrations', 'registrationId', id, { entryStatus: 'cancelled', eligibleForPairing: false });
        AuditService.log({ tournamentId: before.tournamentId, divisionId: before.divisionId, entityType: 'registration', entityId: id, action: 'cancel', eventCode: 'REGISTRATION_CANCELLED', before, after });
        return { data: after };
    },
    withdraw(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Registration not found'] };
        const before = Utils.deepClone(d.registration);
        const after = Storage.update('registrations', 'registrationId', id, { entryStatus: 'withdrawn', eligibleForPairing: false });
        AuditService.log({ tournamentId: before.tournamentId, divisionId: before.divisionId, entityType: 'registration', entityId: id, action: 'withdraw', eventCode: 'REGISTRATION_WITHDRAWN', before, after });
        return { data: after };
    },
    reactivate(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Registration not found'] };

        const currentStatus = d.registration.entryStatus;
        if (!['withdrawn', 'cancelled'].includes(currentStatus)) {
            return { errors: ['Only withdrawn or cancelled registrations can be reactivated.'] };
        }

        // Historical references — including locked rounds — are NOT a reason to block
        // reactivation. Reactivation changes only the player's current participation
        // state; it does not rewrite past pairings, results, rounds or snapshots.
        const before = Utils.deepClone(d.registration);

        let nextEntryStatus = 'registered';
        let nextEligible = false;

        if (d.registration.checkInStatus === 'checked_in') {
            nextEntryStatus = 'active';
            nextEligible = true;
        }

        const after = Storage.update('registrations', 'registrationId', id, {
            entryStatus: nextEntryStatus,
            eligibleForPairing: nextEligible,
            reactivatedAt: Utils.now()
        });

        AuditService.log({
            tournamentId: before.tournamentId,
            divisionId: before.divisionId,
            entityType: 'registration',
            entityId: id,
            action: 'reactivate',
            eventCode: 'REGISTRATION_REACTIVATED',
            before,
            after,
            reason: d.locked
                ? 'Reactivated while preserving locked historical competition records.'
                : 'Registration reactivated.'
        });

        return { data: after };
    },
    permanentDelete(id) {
        const d = this.dependencies(id);
        if (!d) return { errors: ['Registration not found'] };
        if (d.pairings.length || d.results.length || d.snapshots.length || d.locked) return { errors: ['This registration has competition history and cannot be permanently deleted. Use Withdraw instead.'] };
        const r = d.registration;
        Storage.remove('registrations', 'registrationId', id);
        AuditService.log({ tournamentId: r.tournamentId, divisionId: r.divisionId, entityType: 'registration', entityId: id, action: 'delete', eventCode: 'REGISTRATION_DELETED', before: r });
        return { data: true };
    }
};

// ============================================================
// PATCH 02.18 — ROUND LIFECYCLE CENTRALIZATION
// One source of truth for legal Round status transitions.
// Operation-specific business guards (pairing completeness, result integrity,
// Tournament lifecycle, snapshot invalidation, etc.) remain in their owning
// services; all status mutation itself flows through this service.
// ============================================================
const RoundLifecycleService = {
    transitions: Object.freeze({
        draft: Object.freeze(['pairing_generated', 'pairing_confirmed']),
        pairing_generated: Object.freeze(['draft', 'pairing_confirmed']),
        pairing_confirmed: Object.freeze(['draft', 'in_progress']),
        in_progress: Object.freeze(['completed', 'locked']),
        results_pending: Object.freeze(['completed']),
        completed: Object.freeze(['results_pending', 'locked']),
        locked: Object.freeze(['completed'])
    }),
    knownStatuses: Object.freeze(['draft','pairing_generated','pairing_confirmed','in_progress','results_pending','completed','locked']),
    canTransition(fromStatus, toStatus) {
        if (!this.knownStatuses.includes(fromStatus) || !this.knownStatuses.includes(toStatus)) return false;
        if (fromStatus === toStatus) return true; // idempotent status writes are harmless.
        return (this.transitions[fromStatus] || []).includes(toStatus);
    },
    inspect(roundOrId, toStatus) {
        const round = typeof roundOrId === 'string' ? Storage.getById('rounds','roundId',roundOrId) : roundOrId;
        if (!round) return { ok:false, errors:['Round not found'] };
        if (!this.knownStatuses.includes(round.status)) return { ok:false, errors:[`Unknown current Round status: ${String(round.status)}`] };
        if (!this.knownStatuses.includes(toStatus)) return { ok:false, errors:[`Unknown target Round status: ${String(toStatus)}`] };
        if (!this.canTransition(round.status, toStatus)) {
            return { ok:false, errors:[`Illegal Round lifecycle transition: ${String(round.status).toUpperCase()} → ${String(toStatus).toUpperCase()}.`] };
        }
        return { ok:true, errors:[], fromStatus:round.status, toStatus };
    },
    transition(roundId, toStatus, options = {}) {
        const round = Storage.getById('rounds','roundId',roundId);
        const guard = this.inspect(round, toStatus);
        if (!guard.ok) return { errors:guard.errors };
        if (round.status === toStatus) return { data:round, unchanged:true };

        const now = Utils.now();
        const updates = { status:toStatus, updatedAt:now, updatedBy:options.updatedBy || 'admin' };
        if (toStatus === 'in_progress' && !round.actualStartAt) updates.actualStartAt = now;
        if (toStatus === 'completed') updates.completedAt = now;
        if (toStatus === 'locked') updates.lockedAt = now;

        const beforeStatus = round.status;
        Storage.update('rounds','roundId',roundId,updates);
        const after = Storage.getById('rounds','roundId',roundId);

        if (options.audit === true) {
            AuditService.log({
                tournamentId:round.tournamentId, divisionId:round.divisionId, roundId,
                entityType:'round', entityId:roundId, action:'status_change',
                eventCode:options.eventCode || 'ROUND_STATUS_TRANSITION',
                reason:options.reason,
                before:{status:beforeStatus}, after:{status:toStatus}
            });
        }
        return { data:after, fromStatus:beforeStatus, toStatus };
    },
    runSelfTest() {
        const errors=[];
        const yes=[
            ['draft','pairing_confirmed'], ['pairing_confirmed','in_progress'],
            ['in_progress','locked'], ['completed','locked'],
            ['locked','completed'], ['completed','results_pending'],
            ['results_pending','completed'], ['pairing_confirmed','draft']
        ];
        const no=[
            ['draft','locked'], ['draft','in_progress'], ['pairing_confirmed','locked'],
            ['locked','draft'], ['locked','in_progress'], ['results_pending','locked']
        ];
        yes.forEach(([a,b])=>{ if(!this.canTransition(a,b)) errors.push(`Expected ${a} → ${b} to be allowed.`); });
        no.forEach(([a,b])=>{ if(this.canTransition(a,b)) errors.push(`Expected ${a} → ${b} to be blocked.`); });
        const allTargets = new Set(Object.values(this.transitions).flat());
        [...allTargets].forEach(x=>{ if(!this.knownStatuses.includes(x)) errors.push(`Transition targets unknown status ${x}.`); });
        return {
            ok:errors.length===0, errors,
            message: errors.length
                ? `Round Lifecycle Self-Test FAILED: ${errors.join(' ')}`
                : 'Round Lifecycle Self-Test PASSED: legal forward transitions, correction rollback transitions, and illegal status jumps are centrally enforced. Live tournament data was not modified.'
        };
    }
};

// ============================================================
// PATCH 02.44.1 — ROUND START AUDIT FIX
// Starting a confirmed round now records an explicit ROUND_STARTED audit event
// through the centralized RoundLifecycleService transition. Pairings/results
// are not mutated by this patch.
// ============================================================
// ============================================================
// ROUND SERVICE
// ============================================================
const RoundService = {
    create(data) {
        const division = DivisionService.getById(data.divisionId);
        if (!division) return { errors: ['Division not found'] };
        const existingRounds = Storage.find('rounds', r => r.divisionId === data.divisionId);
        const roundNumber = existingRounds.length + 1;
        if (roundNumber > division.totalRounds) return { errors: [`Cannot exceed total rounds (${division.totalRounds})`] };
        const r = {
            roundId: Utils.generateId('RND'),
            tournamentId: data.tournamentId, divisionId: data.divisionId,
            pairingPlanId: division.pairingPlanId, pairingPlanVersion: 1,
            roundNumber, roundLabel: `Round ${roundNumber}`,
            plannedPairingMethod: 'manual', actualPairingMethod: 'manual',
            standingInputRound: roundNumber > 1 ? roundNumber - 1 : null,
            standingInputSnapshotId: null,
            status: 'draft',
            scheduledDate: '', scheduledStartTime: '',
            actualStartAt: null, completedAt: null, lockedAt: null,
            expectedPairingCount: 0,
            notes: '', createdAt: Utils.now(), updatedAt: Utils.now(), createdBy: 'admin', updatedBy: 'admin'
        };
        Storage.insert('rounds', r);
        Storage.update('divisions', 'divisionId', data.divisionId, { currentRound: roundNumber });
        AuditService.log({ tournamentId: r.tournamentId, divisionId: r.divisionId, roundId: r.roundId, entityType: 'round', entityId: r.roundId, action: 'create', eventCode: 'ROUND_CREATED', after: r });
        return { data: r };
    },
    getByDivision(divId) { return Storage.find('rounds', r => r.divisionId === divId).sort((a,b)=>a.roundNumber-b.roundNumber); },
    getById(id) { return Storage.getById('rounds', 'roundId', id); },
    deleteDraft(id, reason = 'Admin correction') {
        const round = this.getById(id);
        if (!round) return { errors: ['Round not found'] };
        const rounds = this.getByDivision(round.divisionId);
        if (round.roundId !== rounds[rounds.length - 1]?.roundId) return { errors: ['Only the latest round may be deleted'] };
        if (round.status !== 'draft') return { errors: ['Only draft rounds may be deleted'] };
        const previous = rounds.find(r => r.roundNumber === round.roundNumber - 1);
        if (previous && previous.status !== 'locked') return { errors: ['Previous round must be locked before deleting this round'] };
        const pairings = PairingService.getByRound(id);
        if (pairings.some(p => p.status === 'confirmed' || p.status === 'locked')) return { errors: ['Confirmed or locked pairings cannot be deleted'] };
        const results = ResultService.getByRound(id);
        if (results.length) return { errors: ['Rounds with results cannot be deleted'] };
        pairings.forEach(p => Storage.remove('pairings', 'pairingId', p.pairingId));
        Storage.remove('rounds', 'roundId', id);
        const division = DivisionService.getById(round.divisionId);
        if (division) Storage.update('divisions', 'divisionId', division.divisionId, { currentRound: Math.max(0, round.roundNumber - 1) });
        AuditService.log({ tournamentId: round.tournamentId, divisionId: round.divisionId, roundId: id, entityType: 'round', entityId: id, action: 'delete', eventCode: 'ROUND_DELETED', reason, after: { roundNumber: round.roundNumber, deletedDraftPairingCount: pairings.length } });
        return { data: true };
    },
    updateStatus(id, status, options = {}) {
        // Patch 02.18 — no Round status write bypasses the lifecycle graph.
        return RoundLifecycleService.transition(id, status, options);
    },
    startRound(id) {
        const r = this.getById(id);
        if (!r) return { errors:['Round not found'] };
        const activeGuard = TournamentCompletionService.requireActive(r.tournamentId, 'Start Round');
        if (activeGuard.errors) return activeGuard;
        if (r.status !== 'pairing_confirmed') return { errors:['Round pairings must be confirmed before the round can start.'] };
        const previous = this.getByDivision(r.divisionId).find(x => Number(x.roundNumber) === Number(r.roundNumber) - 1);
        if (previous && previous.status !== 'locked') return { errors:[`Round ${previous.roundNumber} must be locked before Round ${r.roundNumber} can start.`] };
        const validation = PairingService.validateRound(id);
        if (!validation.valid) return { errors:validation.errors, warnings:validation.warnings };
        const byeResults = ByeResultService.ensureForRound(id);
        if (byeResults.errors) return { errors:byeResults.errors };
        return this.updateStatus(id, 'in_progress', {
            audit: true,
            eventCode: 'ROUND_STARTED',
            reason: 'Round started after confirmed pairings'
        });
    },
    lockRound(id) {
        const r = this.getById(id);
        if (!r) return { errors: ['Round not found'] };
        const activeGuard = TournamentCompletionService.requireActive(r.tournamentId, 'Lock Round');
        if (activeGuard.errors) return activeGuard;
        // Patch 02.14 — every pairing, including BYE, must have an official result.
        const pairings = Storage.find('pairings', p => p.roundId === id && p.status !== 'cancelled');
        const results = Storage.find(
            'matchResults',
            m => m.roundId === id && m.status !== 'voided' && m.resultType !== 'void'
        );
        if (results.length < pairings.length) return { errors: ['Not all pairings have results'] };

        // Patch 02.7 — count alone is not enough. Every pairing must have exactly
        // one active result and that result must belong to this exact pairing identity.
        const pairingResultIntegrity = PairingResultIntegrityService.inspectRound(id);
        if (!pairingResultIntegrity.ok) {
            return { errors: pairingResultIntegrity.errors };
        }

        // Score/spread arithmetic integrity remains a separate guard.
        const intErrors = CalcEngine.integrityCheck(r.divisionId, r.roundNumber);
        if (intErrors.length) return { errors: intErrors };
        // Patch 02.18 — verify the Round transition before mutating pairing/result statuses.
        const lifecycleGuard = RoundLifecycleService.inspect(r, 'locked');
        if (!lifecycleGuard.ok) return { errors:lifecycleGuard.errors };
        // Patch 02.32: re-lock + snapshot propagation is one transactional unit.
        // If snapshot creation/rebuild/integrity fails, restore the exact pre-lock DB.
        const preRelockDb = Storage.exportAll();
        try {
        // Lock
        Storage.find('pairings', p => p.roundId === id).forEach(p => Storage.update('pairings', 'pairingId', p.pairingId, { status: 'locked' }));
        Storage.find(
            'matchResults',
            m => m.roundId === id && m.status !== 'voided' && m.resultType !== 'void'
        ).forEach(m => Storage.update('matchResults', 'resultId', m.resultId, { status: 'locked' }));
        this.updateStatus(id, 'locked');
        // Official snapshot must exist before Tournament completion is evaluated.
        const snapshot = StandingService.createSnapshot(r.divisionId, r.roundNumber);
        // If this was a historical correction, rebuild official snapshots for later
        // rounds that are still locked. Pairings/results remain historical facts; only
        // the derived standing chain is recalculated from the corrected result history.
        const rebuiltDownstream = StandingService.rebuildLockedDownstream(r.divisionId, r.roundNumber);
        // Patch 02.37.1 — boundary verification must compare against the exact
        // pre-lock snapshot state. Historical invalidation metadata from an older,
        // unrelated correction is legitimate history and must not make a later lock fail.
        const propagation = SnapshotCorrectionPropagationIntegrityService.inspect(
            r.divisionId,
            r.roundNumber,
            { baselineDb: preRelockDb, transactionRoundId: id }
        );
        if (!propagation.ok) throw new Error(`Snapshot correction propagation integrity failed: ${propagation.errors.join(' ')}`);
        TournamentCompletionService.evaluate(r.tournamentId);
        AuditService.log({ tournamentId: r.tournamentId, divisionId: r.divisionId, roundId: id, entityType: 'round', entityId: id, action: 'lock', eventCode: 'ROUND_LOCKED', relatedSnapshotId: snapshot?.snapshotId, rebuiltDownstreamSnapshotIds:rebuiltDownstream.map(s=>s.snapshotId), snapshotPropagationIntegrity:'passed' });
        return { data: this.getById(id), snapshot, rebuiltDownstream, propagation };
        } catch (e) {
            try { Storage.replaceAll(preRelockDb); }
            catch (rollbackError) {
                return { errors:[`CRITICAL: Round re-lock propagation failed and automatic rollback also failed. Do not continue using this tab. ${rollbackError.message || rollbackError}`] };
            }
            return { errors:[`Round re-lock / snapshot propagation failed and was rolled back safely: ${e.message || e}`] };
        }
    },
    unlockRound(id, reason) {
        const r = this.getById(id);
        if (!r) return { errors: ['Round not found'] };
        if (r.status !== 'locked') return { errors: ['Round is not locked'] };
        if (!reason?.trim()) return { errors: ['Reason is required to unlock'] };

        const tournament = TournamentService.getById(r.tournamentId);
        const division = DivisionService.getById(r.divisionId);
        if (!tournament || !division) return { errors: ['Tournament or Division not found'] };
        if (tournament.status === 'archived') return { errors: ['Archived Tournament must be restored before a round can be unlocked.'] };
        if (!['active','completed_pending_approval','approved'].includes(tournament.status)) {
            return { errors: [`Round unlock is not allowed while Tournament status is ${String(tournament.status || '').toUpperCase()}.`] };
        }

        // Patch 02.5: unlocking historical results invalidates every official standing
        // from this round forward. Keep the immutable snapshot records; only their
        // official-current state is revoked until corrected standings are rebuilt.
        const before = Storage.exportAll();
        try {
            const invalidated = StandingService.invalidateFromRound(r.divisionId, r.roundNumber, {
                reason: reason.trim(),
                roundId: r.roundId
            });

            Storage.find('pairings', p => p.roundId === id).forEach(p => Storage.update('pairings', 'pairingId', p.pairingId, { status: 'confirmed' }));
            Storage.find(
                'matchResults',
                m => m.roundId === id && m.status !== 'voided' && m.resultType !== 'void'
            ).forEach(m => Storage.update('matchResults', 'resultId', m.resultId, { status: 'completed' }));
            this.updateStatus(id, 'completed');

            const lifecycle = TournamentCompletionService.rollbackForCorrection(r.tournamentId, r.divisionId, {
                roundId: r.roundId,
                roundNumber: r.roundNumber,
                reason: reason.trim()
            });

            AuditService.log({
                tournamentId: r.tournamentId,
                divisionId: r.divisionId,
                roundId: id,
                entityType: 'round',
                entityId: id,
                action: 'unlock',
                eventCode: 'ROUND_UNLOCKED',
                reason: reason.trim(),
                after: {
                    roundStatus: 'completed',
                    invalidatedSnapshotCount: invalidated.count,
                    invalidatedThroughRounds: invalidated.throughRounds,
                    tournamentStatus: lifecycle.tournamentStatus,
                    divisionStatus: lifecycle.divisionStatus
                }
            });
            return { data: this.getById(id), invalidated, lifecycle };
        } catch (e) {
            try { Storage.replaceAll(before); }
            catch (rollbackError) {
                return { errors: [`CRITICAL: Round unlock failed and automatic rollback also failed. Do not continue using this tab. ${rollbackError.message || rollbackError}`] };
            }
            return { errors: [`Round unlock failed and was rolled back safely: ${e.message || e}`] };
        }
    }
};

// ============================================================
// PAIRING SERVICE
// ============================================================
const PairingService = {
    create(data) {
        const p = {
            pairingId: Utils.generateId('PAR'),
            tournamentId: data.tournamentId, divisionId: data.divisionId, roundId: data.roundId,
            roundNumber: data.roundNumber, tableNumber: data.tableNumber || 1,
            player1RegistrationId: data.player1RegistrationId || '',
            player1Id: data.player1Id || '',
            player2RegistrationId: data.player2RegistrationId || '',
            player2Id: data.player2Id || '',
            pairingType: data.pairingType || 'normal',
            // Patch 02.16 — preserve BYE semantics as first-class historical metadata.
            byeReason: data.pairingType === 'bye' ? (data.byeReason || data.engineMetadata?.byeReason || 'ordinary') : null,
            assignmentSource: data.pairingType === 'bye' ? (data.assignmentSource || data.engineMetadata?.assignmentSource || data.generatedMethod || 'manual') : null,
            gibsonizationReason: data.pairingType === 'bye' && (data.byeReason || data.engineMetadata?.byeReason) === 'gibson' ? (data.gibsonizationReason || data.engineMetadata?.gibsonizationReason || data.overrideReason || null) : null,
            generatedMethod: data.generatedMethod || 'manual', generatedBy: data.generatedBy || 'admin',
            manualOverride: Boolean(data.manualOverride), originalPlayer1Id: data.originalPlayer1Id || null, originalPlayer2Id: data.originalPlayer2Id || null, overrideReason: data.overrideReason || null,
            repeatOpponent: false, previousMeetingCount: 0,
            firstPlayerId: data.firstPlayerId || null, engineMetadata: { ...(data.engineMetadata || {}) },
            status: 'draft', notes: '',
            createdAt: Utils.now(), updatedAt: Utils.now(), createdBy: 'admin', updatedBy: 'admin'
        };
        // Check repeat and preserve prior meeting rounds for manual warnings.
        if (p.player1Id && p.player2Id) {
            const prev = Storage.find('pairings', x => x.tournamentId === p.tournamentId && x.divisionId === p.divisionId && x.status !== 'cancelled' && ((x.player1Id === p.player1Id && x.player2Id === p.player2Id) || (x.player1Id === p.player2Id && x.player2Id === p.player1Id)));
            if (prev.length > 0) {
                p.repeatOpponent = true;
                p.previousMeetingCount = prev.length;
                p.engineMetadata = { ...p.engineMetadata, previousMeetingRounds: prev.map(x => x.roundNumber).filter(Number.isFinite) };
            }
        }
        const errors = Validation.pairing(p, data.roundId);
        if (errors.length) return { errors, warnings: p.repeatOpponent ? ['Repeat opponent!'] : [] };
        Storage.insert('pairings', p);
        AuditService.log({ tournamentId: p.tournamentId, divisionId: p.divisionId, roundId: p.roundId, entityType: 'pairing', entityId: p.pairingId, action: 'create', eventCode: 'PAIRING_CREATED', after: p });
        return { data: p, warnings: p.repeatOpponent ? ['Repeat opponent detected'] : [] };
    },
    getByRound(roundId) { return Storage.find('pairings', p => p.roundId === roundId).sort((a,b)=>a.tableNumber-b.tableNumber); },
    remove(id) {
        const p = Storage.getById('pairings', 'pairingId', id);
        if (!p) return { errors: ['Pairing not found'] };
        const round = RoundService.getById(p.roundId);
        const results = ResultService.getByRound(p.roundId);
        if (p.status === 'locked' || round?.status === 'locked') return { errors: ['Cannot remove a locked pairing'] };
        if (results.length) return { errors: ['Cannot remove pairings after results exist. Use the correction workflow.'] };
        if (p.status === 'confirmed' || round?.status === 'pairing_confirmed') return { errors: ['Reopen the round pairings before editing or removing a confirmed pairing.'] };
        Storage.remove('pairings', 'pairingId', id);
        AuditService.log({ tournamentId: p.tournamentId, divisionId: p.divisionId, roundId: p.roundId, entityType: 'pairing', entityId: id, action: 'remove', eventCode: 'PAIRING_DRAFT_REMOVED', before: p });
        return { data: true };
    },
    reopenRoundPairings(roundId, reason = 'Admin pairing correction before results') {
        const round = RoundService.getById(roundId);
        if (!round) return { errors: ['Round not found'] };
        if (round.status !== 'pairing_confirmed') return { errors: ['Only a pairing-confirmed round may be reopened here'] };
        const results = ResultService.getByRound(roundId);
        if (results.length) return { errors: ['Cannot reopen pairings after results exist. Use the correction workflow.'] };
        const pairings = this.getByRound(roundId);
        pairings.forEach(p => Storage.update('pairings', 'pairingId', p.pairingId, { status: 'draft', updatedAt: Utils.now() }));
        RoundService.updateStatus(roundId, 'draft');
        AuditService.log({ tournamentId: round.tournamentId, divisionId: round.divisionId, roundId, entityType: 'round', entityId: roundId, action: 'reopen_pairings', eventCode: 'ROUND_PAIRINGS_REOPENED', reason, before: { status: 'pairing_confirmed' }, after: { status: 'draft', pairingCount: pairings.length } });
        return { data: RoundService.getById(roundId) };
    },
    clearDraftRoundPairings(roundId, reason = 'Admin rebuild pairing plan') {
        const round = RoundService.getById(roundId);
        if (!round) return { errors: ['Round not found'] };
        if (!['draft','pairing_generated'].includes(round.status)) return { errors: ['Pairings must be reopened before clearing this round'] };
        if (ResultService.getByRound(roundId).length) return { errors: ['Cannot clear pairings after results exist'] };
        const pairings = this.getByRound(roundId);
        if (pairings.some(p => p.status === 'confirmed' || p.status === 'locked')) return { errors: ['Confirmed or locked pairings cannot be cleared'] };
        pairings.forEach(p => Storage.remove('pairings', 'pairingId', p.pairingId));
        AuditService.log({ tournamentId: round.tournamentId, divisionId: round.divisionId, roundId, entityType: 'round', entityId: roundId, action: 'clear_pairings', eventCode: 'ROUND_DRAFT_PAIRINGS_CLEARED', reason, before: { pairingCount: pairings.length }, after: { pairingCount: 0 } });
        return { data: true };
    },
    validateRound(roundId) {
        const round = RoundService.getById(roundId);
        if (!round) return { errors: ['Round not found'], warnings: [] };
        const division = DivisionService.getById(round.divisionId);
        const eligible = RegistrationService.getEligible(round.divisionId);
        const pairings = this.getByRound(roundId);
        const errors = [], warnings = [], seen = new Set();
        const tableValidation = TableAssignmentService.validate(pairings, division);
        errors.push(...tableValidation.errors);
        pairings.forEach(p => {
            [p.player1Id, p.player2Id].filter(Boolean).forEach(id => {
                if (seen.has(id)) errors.push(`Player ${id} is already paired in this round.`);
                seen.add(id);
                if (!eligible.some(r => r.playerId === id)) errors.push(`Player ${id} is not eligible in this division.`);
            });
            if (p.pairingType === 'normal' && p.player1Id === p.player2Id) errors.push('Player cannot be paired with themselves');
            if (p.repeatOpponent) warnings.push(`Repeat Opponent: ${p.previousMeetingCount} previous meeting(s)`);
        });
        const unpaired = eligible.filter(r => !seen.has(r.playerId));
        if (unpaired.length) errors.push(`${unpaired.length} eligible player(s) remain unpaired. Assign a BYE when exactly one eligible player remains.`);
        const byeCount = pairings.filter(p => p.pairingType === 'bye').length;
        // Patch 02.14: do not impose a global one-BYE-per-round/even-pool prohibition here.
        // Future Gibsonization can legitimately create a Gibson BYE plus an ordinary BYE.
        // Individual pairing engines/services remain responsible for their own BYE rules.
        return { valid: !errors.length, errors, warnings, unpaired, eligibleCount: eligible.length, pairedCount: seen.size, byeCount };
    },
    confirmAll(roundId) {
        const round = RoundService.getById(roundId);
        if (!round) return { errors:['Round not found'], warnings:[] };
        const activeGuard = TournamentCompletionService.requireActive(round.tournamentId, 'Confirm Pairings');
        if (activeGuard.errors) return { errors:activeGuard.errors, warnings:[] };
        const validation = this.validateRound(roundId);
        if (!validation.valid) return validation;
        Storage.find('pairings', p => p.roundId === roundId).forEach(p => Storage.update('pairings', 'pairingId', p.pairingId, { status: 'confirmed' }));
        RoundService.updateStatus(roundId, 'pairing_confirmed');
        const r = RoundService.getById(roundId);
        AuditService.log({ tournamentId: r.tournamentId, divisionId: r.divisionId, roundId, entityType: 'round', entityId: roundId, action: 'confirm_pairing', eventCode: 'ROUND_PAIRING_CONFIRMED' });
        // PATCH 02.19.1 — return a stable service result so manual Confirm All can
        // finish its UI refresh instead of throwing after a successful mutation.
        return { data: true, errors: [], warnings: validation.warnings || [], validation };
    },
    autoNumberTables(roundId) {
        const pairings = this.getByRound(roundId);
        pairings.forEach((p, i) => Storage.update('pairings', 'pairingId', p.pairingId, { tableNumber: i + 1 }));
    }
};

// ============================================================
// PATCH 02.39.3 — COMPLETED-ROUND LATE PAIR RECOVERY
// Builds on 02.39.2 late-arrival pairing. COMPLETED is not historical LOCKED:
// if newly discovered eligible players were omitted from the confirmed pairing set,
// manager may add exactly such a late pair and the round temporarily returns to
// RESULTS_PENDING until its DOUBLE WALKOVER result is recorded.
//
// PATCH 02.39.2 — LATE ARRIVAL PAIR / DOUBLE WALKOVER ONLY
// After the normal pairing plan is already confirmed, an administrator may
// account for eligible players who were not in the confirmed pairing set by
// adding a late pair. This is deliberately NOT a reopening of the pairing plan:
// existing pairings/results are untouched, the new pairing is confirmed
// immediately, and its only permitted result is DOUBLE WALKOVER.
// ============================================================
const LateArrivalDoubleWalkoverService = {
    allowedRoundStatuses: Object.freeze(['pairing_confirmed','in_progress','completed','results_pending']),

    inspect(roundId, divisionId) {
        const round = RoundService.getById(roundId);
        const errors = [];
        if (!round) return {ok:false,errors:['Round not found.'],available:[]};
        if (round.divisionId !== divisionId) errors.push('Round does not belong to the selected Division.');
        if (!this.allowedRoundStatuses.includes(round.status)) {
            errors.push(`Late-arrival pairing is allowed after pairings are CONFIRMED and while the round remains UNLOCKED. Current status: ${String(round.status||'').toUpperCase()}.`);
        }
        const activeGuard = TournamentCompletionService.requireActive(round.tournamentId, 'Add Late-Arrival Pair');
        if (activeGuard.errors) errors.push(...activeGuard.errors);
        const eligible = RegistrationService.getEligible(divisionId);
        const pairings = PairingService.getByRound(roundId).filter(p=>p.status!=='cancelled');
        const pairedIds = new Set(pairings.flatMap(p=>[p.player1Id,p.player2Id].filter(Boolean)));
        const available = eligible.filter(r=>!pairedIds.has(r.playerId));
        return {ok:errors.length===0,errors,round,eligible,pairings,available};
    },

    create(roundId, divisionId, reg1Id, reg2Id) {
        const state = this.inspect(roundId, divisionId);
        if (!state.ok) return {errors:state.errors};
        if (!reg1Id || !reg2Id || reg1Id===reg2Id) return {errors:['Select two different late-arrival players.']};
        const r1 = state.available.find(r=>r.registrationId===reg1Id);
        const r2 = state.available.find(r=>r.registrationId===reg2Id);
        if (!r1 || !r2) return {errors:['Both players must still be eligible and unpaired in this round.']};

        const result = PairingService.create({
            tournamentId: state.round.tournamentId,
            divisionId,
            roundId,
            roundNumber: state.round.roundNumber,
            tableNumber: TableAssignmentService.nextAvailable(roundId, divisionId),
            player1RegistrationId:r1.registrationId,
            player1Id:r1.playerId,
            player2RegistrationId:r2.registrationId,
            player2Id:r2.playerId,
            pairingType:'normal',
            generatedMethod:'late_arrival_admin',
            manualOverride:true,
            overrideReason:'Late arrival after confirmed pairing plan — DOUBLE WALKOVER only',
            engineMetadata:{
                assignmentMode:'late_arrival_double_walkover_only',
                lateArrivalPair:true,
                resultRestriction:'double_walkover_only'
            }
        });
        if (result.errors) return result;

        const pairing = Storage.update('pairings','pairingId',result.data.pairingId,{
            status:'confirmed',
            lateArrivalPair:true,
            resultRestriction:'double_walkover_only',
            assignmentSource:'late_arrival_admin',
            lateArrivalAddedAt:Utils.now(),
            lateArrivalAddedBy:'admin'
        });

        // PATCH 02.39.3 — a round may already have auto-recovered to COMPLETED
        // after every *known* pairing received a result. Adding a late-arrival pair
        // makes that completion claim temporarily false again, but the round is still
        // unlocked. Move it to RESULTS_PENDING so the new administrative result can
        // be entered without using the historical Unlock workflow. Once DOUBLE
        // WALKOVER is submitted, RoundResultCompletenessRecovery returns it to
        // COMPLETED automatically. Existing pairings/results remain untouched.
        if (state.round.status === 'completed') {
            const lifecycle = RoundService.updateStatus(roundId, 'results_pending', {
                audit:true,
                eventCode:'ROUND_LATE_ARRIVAL_RESULT_PENDING',
                reason:'Late-arrival pair added after prior result completeness; DOUBLE WALKOVER result is now required.'
            });
            if (lifecycle.errors) {
                // Keep the operation atomic from the manager perspective: if the
                // lifecycle rollback cannot be represented legally, remove only the
                // just-created late pair and leave the pre-existing round untouched.
                Storage.remove('pairings','pairingId',pairing.pairingId);
                return {errors:lifecycle.errors};
            }
        }

        AuditService.log({
            tournamentId:pairing.tournamentId,
            divisionId:pairing.divisionId,
            roundId:pairing.roundId,
            entityType:'pairing',
            entityId:pairing.pairingId,
            action:'late_arrival_pair_create',
            eventCode:'LATE_ARRIVAL_DOUBLE_WALKOVER_PAIR_ADDED',
            after:pairing,
            reason:'Added after pairing confirmation. Result is restricted to DOUBLE WALKOVER only.'
        });
        return {data:pairing,warnings:result.warnings||[]};
    },

    isRestrictedPair(pairing) {
        return !!pairing && (pairing.resultRestriction==='double_walkover_only' || pairing.engineMetadata?.resultRestriction==='double_walkover_only');
    },

    runSelfTest() {
        const normal={pairingId:'P1'};
        const late={pairingId:'P2',lateArrivalPair:true,resultRestriction:'double_walkover_only'};
        const errors=[];
        if (this.isRestrictedPair(normal)) errors.push('Normal pairing was incorrectly restricted.');
        if (!this.isRestrictedPair(late)) errors.push('Late-arrival pairing restriction was not detected.');
        if (!this.allowedRoundStatuses.includes('pairing_confirmed') || !this.allowedRoundStatuses.includes('in_progress') || !this.allowedRoundStatuses.includes('completed') || !this.allowedRoundStatuses.includes('results_pending') || this.allowedRoundStatuses.includes('locked')) errors.push('Late-arrival lifecycle boundary is incorrect.');
        return {ok:errors.length===0,errors,message:errors.length?`Late Arrival DOUBLE WALKOVER Self-Test FAILED: ${errors.join(' ')}`:'Late Arrival DOUBLE WALKOVER Self-Test PASSED: confirmed/in-progress/completed/results-pending unlocked rounds may accept isolated late pairs restricted to DOUBLE WALKOVER only; LOCKED rounds remain blocked. Live data was not modified.'};
    }
};

// RESULT SERVICE
// ============================================================
const VoidHistoryStatusRecovery = {
    recoverAll() {
        const affected = Storage.find(
            'matchResults',
            m => m.resultType === 'void' && m.status !== 'voided'
        );

        affected.forEach(m => {
            Storage.update('matchResults', 'resultId', m.resultId, {
                status: 'voided',
                updatedAt: Utils.now(),
                updatedBy: 'system'
            });
        });

        if (affected.length) {
            AuditService.log({
                entityType: 'system',
                entityId: 'void-history-status',
                action: 'repair',
                eventCode: 'VOID_HISTORY_STATUS_RECOVERED',
                reason: `Restored ${affected.length} historical VOID result record(s) to status VOIDED after legacy round lock/unlock status overwrite. Scores and history were preserved.`
            });
        }

        return { changed: affected.length };
    }
};


// ============================================================
// PATCH 02.7 — EXACT PAIRING ↔ RESULT INTEGRITY
// ============================================================
const PairingResultIntegrityService = {
    _isHistoricalVoid(r) {
        return r?.status === 'voided' || r?.resultType === 'void';
    },

    _activeResults(results) {
        return (results || []).filter(r => !this._isHistoricalVoid(r));
    },

    _inspectCollections(pairings, results, round = null) {
        const errors = [];
        const warnings = [];
        const pairingById = new Map((pairings || []).map(p => [p.pairingId, p]));
        const activeResults = this._activeResults(results || []);
        const activeByPairing = new Map();

        activeResults.forEach(r => {
            const list = activeByPairing.get(r.pairingId) || [];
            list.push(r);
            activeByPairing.set(r.pairingId, list);
        });

        // Every result — including historical VOID records — must still point back to
        // the exact pairing identity it originally belonged to.
        (results || []).forEach(r => {
            const p = pairingById.get(r.pairingId);
            if (!p) {
                errors.push(`Result ${r.resultId} references pairing ${r.pairingId} that is not in this round.`);
                return;
            }

            const exactFields = [
                ['tournamentId', 'tournament'],
                ['divisionId', 'division'],
                ['roundId', 'round'],
                ['roundNumber', 'round number'],
                ['tableNumber', 'table'],
                ['player1Id', 'player 1'],
                ['player2Id', 'player 2'],
                ['player1RegistrationId', 'player 1 registration'],
                ['player2RegistrationId', 'player 2 registration']
            ];

            exactFields.forEach(([field, label]) => {
                const pv = p[field] ?? null;
                const rv = r[field] ?? null;
                if (String(pv ?? '') !== String(rv ?? '')) {
                    errors.push(`Result ${r.resultId} ${label} does not match pairing ${p.pairingId}.`);
                }
            });

            if (!this._isHistoricalVoid(r)) {
                const allowedTypes = p.pairingType === 'bye' ? ['bye'] : ['normal','walkover','forfeit','double_walkover'];
                if (!allowedTypes.includes(r.resultType)) {
                    errors.push(`Active result ${r.resultId} type ${r.resultType || '(blank)'} does not match pairing ${p.pairingId} type ${p.pairingType || 'normal'}.`);
                }
            }
        });

        // At most one live/current result may exist for a pairing.
        for (const p of (pairings || [])) {
            const active = activeByPairing.get(p.pairingId) || [];
            if (active.length > 1) {
                errors.push(`Pairing ${p.pairingId} has ${active.length} active results; exactly one active result is allowed.`);
            }
        }

        // Patch 02.14 — completed/locked rounds require one exact active result for
        // every pairing, including BYE. BYE is an official competition result, not a missing game.
        const requiresComplete = round && ['completed', 'locked'].includes(round.status);
        if (requiresComplete) {
            for (const p of (pairings || []).filter(x => x.status !== 'cancelled')) {
                const allowedTypes = p.pairingType === 'bye' ? ['bye'] : ['normal','walkover','forfeit','double_walkover'];
                const active = (activeByPairing.get(p.pairingId) || []).filter(r => allowedTypes.includes(r.resultType));
                if (active.length !== 1) {
                    errors.push(`Round ${round.roundNumber}: pairing ${p.pairingId} has ${active.length} compatible active result(s); exactly 1 is required.`);
                }
            }
        }

        // An active result may never belong to a cancelled pairing.
        activeResults.forEach(r => {
            const p = pairingById.get(r.pairingId);
            if (p?.status === 'cancelled') {
                errors.push(`Active result ${r.resultId} belongs to cancelled pairing ${p.pairingId}.`);
            }
        });

        return {
            ok: errors.length === 0,
            errors,
            warnings,
            counts: {
                pairings: (pairings || []).length,
                normalPairings: (pairings || []).filter(p => p.pairingType === 'normal' && p.status !== 'cancelled').length,
                activeResults: activeResults.length,
                historicalVoidResults: (results || []).filter(r => this._isHistoricalVoid(r)).length
            }
        };
    },

    inspectRound(roundId) {
        const round = RoundService.getById(roundId);
        if (!round) return { ok:false, errors:['Round not found.'], warnings:[], counts:{} };

        const pairings = Storage.find('pairings', p => p.roundId === roundId);
        const results = Storage.find('matchResults', r => r.roundId === roundId);
        return this._inspectCollections(pairings, results, round);
    },

    inspectDivision(divisionId) {
        const errors = [];
        const warnings = [];
        const rounds = RoundService.getByDivision(divisionId);
        let pairings = 0, activeResults = 0, historicalVoidResults = 0;

        rounds.forEach(round => {
            const report = this.inspectRound(round.roundId);
            report.errors.forEach(e => errors.push(e));
            report.warnings.forEach(w => warnings.push(w));
            pairings += report.counts.pairings || 0;
            activeResults += report.counts.activeResults || 0;
            historicalVoidResults += report.counts.historicalVoidResults || 0;
        });

        return {
            ok: errors.length === 0,
            errors,
            warnings,
            counts: { rounds: rounds.length, pairings, activeResults, historicalVoidResults }
        };
    },

    canSubmitForPairing(pairingId) {
        const active = Storage.find(
            'matchResults',
            r => r.pairingId === pairingId && !this._isHistoricalVoid(r)
        );
        if (active.length > 1) {
            return {
                ok:false,
                errors:[`Pairing ${pairingId} already has ${active.length} active results. Resolve the duplicate before entering another score.`]
            };
        }
        return { ok:true, errors:[] };
    },

    hasExactlyOneActiveResult(pairingId, expectedType = null) {
        // Patch 02.26.2 — WALKOVER / FORFEIT are official result executions of a
        // NORMAL pairing. Completeness must therefore use compatible result types,
        // not literal resultType === 'normal'. BYE remains BYE-only.
        const compatibleTypes = expectedType === 'bye'
            ? ['bye']
            : expectedType === 'normal'
                ? ['normal', 'walkover', 'forfeit', 'double_walkover']
                : null;
        const active = Storage.find(
            'matchResults',
            r => r.pairingId === pairingId && !this._isHistoricalVoid(r) &&
                 (!expectedType || (compatibleTypes ? compatibleTypes.includes(r.resultType) : r.resultType === expectedType))
        );
        return active.length === 1;
    },

    runSelfTest() {
        const round = { roundId:'R-T', roundNumber:3, status:'locked' };
        const pairings = [
            {
                pairingId:'PAR-1', tournamentId:'T-1', divisionId:'D-1', roundId:'R-T',
                roundNumber:3, tableNumber:1, pairingType:'normal', status:'locked',
                player1Id:'P-A', player2Id:'P-B',
                player1RegistrationId:'REG-A', player2RegistrationId:'REG-B'
            },
            {
                pairingId:'PAR-2', tournamentId:'T-1', divisionId:'D-1', roundId:'R-T',
                roundNumber:3, tableNumber:2, pairingType:'normal', status:'locked',
                player1Id:'P-C', player2Id:'P-D',
                player1RegistrationId:'REG-C', player2RegistrationId:'REG-D'
            }
        ];

        const good = [
            {
                resultId:'RES-1', pairingId:'PAR-1', tournamentId:'T-1', divisionId:'D-1',
                roundId:'R-T', roundNumber:3, tableNumber:1, resultType:'normal', status:'locked',
                player1Id:'P-A', player2Id:'P-B',
                player1RegistrationId:'REG-A', player2RegistrationId:'REG-B'
            },
            {
                resultId:'RES-2', pairingId:'PAR-2', tournamentId:'T-1', divisionId:'D-1',
                roundId:'R-T', roundNumber:3, tableNumber:2, resultType:'normal', status:'locked',
                player1Id:'P-C', player2Id:'P-D',
                player1RegistrationId:'REG-C', player2RegistrationId:'REG-D'
            },
            {
                resultId:'RES-OLD', pairingId:'PAR-1', tournamentId:'T-1', divisionId:'D-1',
                roundId:'R-T', roundNumber:3, tableNumber:1, resultType:'void', status:'voided',
                player1Id:'P-A', player2Id:'P-B',
                player1RegistrationId:'REG-A', player2RegistrationId:'REG-B'
            }
        ];

        const errors = [];
        const pass = this._inspectCollections(pairings, good, round);
        if (!pass.ok) errors.push('Valid replacement history was rejected.');

        const duplicate = this._inspectCollections(pairings, [
            ...good,
            { ...good[0], resultId:'RES-DUP', status:'completed' }
        ], round);
        if (duplicate.ok || !duplicate.errors.some(e => e.includes('active results'))) {
            errors.push('Duplicate active result was not detected.');
        }

        const mismatch = this._inspectCollections(pairings, [
            { ...good[0], player2Id:'P-WRONG' },
            good[1]
        ], round);
        if (mismatch.ok || !mismatch.errors.some(e => e.includes('does not match pairing'))) {
            errors.push('Pairing/result identity mismatch was not detected.');
        }

        const missing = this._inspectCollections(pairings, [good[0]], round);
        if (missing.ok || !missing.errors.some(e => e.includes('exactly 1 is required'))) {
            errors.push('Missing active result in a locked round was not detected.');
        }

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Exact Pairing ↔ Result Integrity Self-Test FAILED: ${errors.join(' ')}`
                : 'Exact Pairing ↔ Result Integrity Self-Test PASSED: duplicate active results, missing results, and pairing/result identity mismatches are blocked while historical VOID records remain preserved.'
        };
    }
};

const RoundResultCompletenessRecovery = {
    recoverRound(roundId) {
        const round = RoundService.getById(roundId);
        if (!round || round.status !== 'results_pending') return { changed: false };

        const pairings = PairingService.getByRound(roundId)
            .filter(p => p.status !== 'voided' && p.status !== 'cancelled');

        const results = Storage.find(
            'matchResults',
            m => m.roundId === roundId && m.status !== 'voided' && m.resultType !== 'void'
        );

        const allComplete = pairings.length > 0 && pairings.every(p =>
            PairingResultIntegrityService.hasExactlyOneActiveResult(
                p.pairingId,
                p.pairingType === 'bye' ? 'bye' : 'normal'
            )
        );

        if (!allComplete) return { changed: false };

        const integrity = PairingResultIntegrityService.inspectRound(roundId);
        // RESULTS_PENDING is expected during correction, so completeness is checked
        // above; exact pairing/result identity must still be clean before recovery.
        const identityErrors = (integrity.errors || []).filter(e => !e.includes('exactly 1 is required'));
        if (identityErrors.length) return { changed:false, errors:identityErrors };

        RoundService.updateStatus(roundId, 'completed');

        AuditService.log({
            tournamentId: round.tournamentId,
            divisionId: round.divisionId,
            roundId,
            entityType: 'round',
            entityId: roundId,
            action: 'status_recovered',
            eventCode: 'ROUND_RESULTS_COMPLETENESS_RECOVERED',
            reason: 'All non-voided pairings have valid results after historical correction.',
            after: { status: 'completed' }
        });

        return { changed: true };
    },

    recoverAll() {
        let changed = 0;
        Storage.find('rounds', r => r.status === 'results_pending').forEach(r => {
            if (this.recoverRound(r.roundId).changed) changed++;
        });
        return { changed };
    }
};

const ResultVoidGuard = {
    inspect(result, round, reason, tournament) {
        const errors = [];
        if (!result) errors.push('Result not found.');
        if (!round) errors.push('Round not found.');
        if (!reason?.trim()) errors.push('Reason is required to void a result.');
        if (round?.status === 'locked') {
            errors.push(`Round ${round.roundNumber} is LOCKED. Unlock the round first so downstream official snapshots and lifecycle are invalidated safely.`);
        }
        if (tournament?.status && tournament.status !== 'active') {
            errors.push(`Tournament must be ACTIVE before a result can be voided. Current status: ${String(tournament.status).toUpperCase()}.`);
        }
        if (result?.status === 'voided' || result?.resultType === 'void') {
            errors.push('Result is already voided.');
        }
        // Patch 02.17 — BYE/Gibson BYE results are derived historical facts.
        // They must never be voided independently from their pairing because that
        // would strand the round with no legal manual replacement path.
        if (result && result.resultType === 'bye') {
            const kind = result.byeReason === 'gibson' ? 'Gibson BYE' : 'BYE';
            errors.push(`${kind} result is system-managed and cannot be voided independently. Correct the BYE pairing/assignment through the round correction workflow instead.`);
        }
        return { ok: errors.length === 0, errors };
    },

    runSelfTest() {
        const errors = [];
        const result = { resultId:'RES-X', status:'completed', resultType:'normal' };
        const activeTournament = { status:'active' };

        const locked = this.inspect(result, { roundNumber:3, status:'locked' }, 'Correction', activeTournament);
        if (locked.ok || !locked.errors.some(e => e.includes('Unlock the round first'))) {
            errors.push('Locked-round void was not blocked.');
        }

        const noReason = this.inspect(result, { roundNumber:3, status:'completed' }, '', activeTournament);
        if (noReason.ok || !noReason.errors.some(e => e.includes('Reason is required'))) {
            errors.push('Missing-reason void was not blocked.');
        }

        const allowed = this.inspect(result, { roundNumber:3, status:'completed' }, 'Duplicate score entry', activeTournament);
        if (!allowed.ok) errors.push('Unlocked correction-state void was incorrectly blocked.');

        const nonActive = this.inspect(result, { roundNumber:3, status:'completed' }, 'Correction', { status:'approved' });
        if (nonActive.ok) errors.push('Non-ACTIVE tournament void was not blocked.');

        const bye = this.inspect({ resultId:'RES-BYE', status:'completed', resultType:'bye', byeReason:'ordinary' }, { roundNumber:3, status:'completed' }, 'Correction', activeTournament);
        if (bye.ok || !bye.errors.some(e => e.includes('system-managed'))) errors.push('Ordinary BYE result could be voided independently.');
        const gibson = this.inspect({ resultId:'RES-GIB', status:'completed', resultType:'bye', byeReason:'gibson' }, { roundNumber:3, status:'completed' }, 'Correction', activeTournament);
        if (gibson.ok || !gibson.errors.some(e => e.includes('Gibson BYE'))) errors.push('Gibson BYE result could be voided independently.');

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Void Result Guard Self-Test FAILED: ${errors.join(' ')}`
                : 'Void Result Guard Self-Test PASSED: locked rounds require unlock-first, a reason is mandatory, normal results may be voided only inside the ACTIVE correction workflow, and BYE/Gibson BYE results cannot be voided independently.'
        };
    }
};

// ============================================================
// PATCH 02.14 — BYE RESULT EXECUTION
// A BYE is an official result. Its score and official spread come from the
// Division ByePolicy and are deliberately independent of Maximum Spread.
// ============================================================
const ByeResultService = {
    policyForDivision(divisionId) {
        const division = DivisionService.getById(divisionId);
        const policy = division?.byePolicyId ? Storage.getById('byePolicies','byePolicyId',division.byePolicyId) : null;
        return {
            byePolicyId: policy?.byePolicyId || null,
            countsAsGame: policy?.countsAsGame !== false,
            countsAsWin: policy?.countsAsWin !== false,
            matchPointsAwarded: Number.isFinite(Number(policy?.matchPointsAwarded)) ? Number(policy.matchPointsAwarded) : 1,
            scoreFor: Math.max(0, Number(policy?.scoreFor ?? 100)),
            scoreAgainst: Math.max(0, Number(policy?.scoreAgainst ?? 0)),
            officialSpreadAwarded: Math.max(0, Number(policy?.officialSpreadAwarded ?? 100)),
            policyVersion: Number(policy?.version || 1)
        };
    },

    ensureForPairing(pairingId) {
        const pairing = Storage.getById('pairings','pairingId',pairingId);
        if (!pairing) return { errors:['Pairing not found'] };
        if (pairing.pairingType !== 'bye') return { errors:['Pairing is not a BYE'] };
        const existing = Storage.findOne('matchResults', r => r.pairingId === pairingId && r.status !== 'voided' && r.resultType !== 'void');
        if (existing) return { data:existing, created:false };

        const policy = this.policyForDivision(pairing.divisionId);
        const rawSpread = policy.scoreFor - policy.scoreAgainst;
        const r = {
            resultId: Utils.generateId('RES'),
            tournamentId: pairing.tournamentId, divisionId: pairing.divisionId, roundId: pairing.roundId, pairingId: pairing.pairingId,
            roundNumber: pairing.roundNumber, tableNumber: pairing.tableNumber,
            player1RegistrationId: pairing.player1RegistrationId, player1Id: pairing.player1Id, player1Score: policy.scoreFor,
            player2RegistrationId: null, player2Id: null, player2Score: policy.scoreAgainst,
            player1Result: policy.countsAsWin ? 'W' : null, player2Result: null,
            winnerId: policy.countsAsWin ? pairing.player1Id : null, loserId: null,
            rawSpreadPlayer1: rawSpread, rawSpreadPlayer2: 0,
            officialSpreadPlayer1: policy.officialSpreadAwarded, officialSpreadPlayer2: 0,
            spreadLimitUsed: null,
            resultType: 'bye', pairingType: 'bye', status: 'completed',
            // Patch 02.16 — result keeps the exact historical meaning of this BYE.
            byeReason: pairing.byeReason || pairing.engineMetadata?.byeReason || 'ordinary',
            assignmentSource: pairing.assignmentSource || pairing.engineMetadata?.assignmentSource || pairing.generatedMethod || 'system',
            gibsonizationReason: pairing.gibsonizationReason || pairing.engineMetadata?.gibsonizationReason || null,
            byePolicyId: policy.byePolicyId, byePolicyVersion: policy.policyVersion,
            byeCountsAsGame: policy.countsAsGame, byeCountsAsWin: policy.countsAsWin,
            byeMatchPointsAwarded: policy.matchPointsAwarded,
            byeOfficialSpreadAwarded: policy.officialSpreadAwarded,
            byeStandingExecutionVersion: 1,
            autoGenerated: true, submittedAt: Utils.now(), submittedBy: 'system', updatedAt: Utils.now(), updatedBy: 'system'
        };
        Storage.insert('matchResults', r);
        const div = DivisionService.getById(pairing.divisionId);
        Storage.update('divisions','divisionId',pairing.divisionId,{ resultRevision:(div?.resultRevision||0)+1 });
        AuditService.log({ tournamentId:r.tournamentId, divisionId:r.divisionId, roundId:r.roundId, entityType:'matchResult', entityId:r.resultId, action:'create', eventCode:'BYE_RESULT_AUTO_CREATED', after:r });
        return { data:r, created:true };
    },

    ensureForRound(roundId) {
        const byes = PairingService.getByRound(roundId).filter(p => p.pairingType === 'bye' && p.status !== 'cancelled');
        const created = [];
        for (const p of byes) {
            const result = this.ensureForPairing(p.pairingId);
            if (result.errors) return { errors:result.errors, created };
            if (result.created) created.push(result.data);
        }
        return { data:created };
    }
};


// ============================================================
// PATCH 02.14.2 — LEGACY BYE POLICY NORMALIZATION / RESULT BACKFILL
// Normalizes only the known legacy default fingerprint 0–0 / +350 when
// the BYE Rules have never been explicitly configured. Existing custom
// policies are preserved. Matching auto-generated BYE results are repaired
// to 100–0 / +100 and Division resultRevision is advanced safely.
// ============================================================
const LegacyByePolicyNormalizer = {
    _recoveryKey: STORAGE_KEY + '_pre_bye_policy_normalization',

    _isLegacyDefault(policy) {
        return !!policy &&
            !policy.byeRulesConfiguredAt &&
            !policy.byeRulesConfiguredBy &&
            Number(policy.scoreFor ?? 0) === 0 &&
            Number(policy.scoreAgainst ?? 0) === 0 &&
            Number(policy.officialSpreadAwarded ?? 350) === 350;
    },

    inspect() {
        const policies = Storage.getAll('byePolicies').filter(p => this._isLegacyDefault(p));
        const policyIds = new Set(policies.map(p => p.byePolicyId));
        const results = Storage.getAll('matchResults').filter(r =>
            r.resultType === 'bye' &&
            r.status !== 'voided' &&
            r.autoGenerated === true &&
            policyIds.has(r.byePolicyId) &&
            Number(r.player1Score ?? 0) === 0 &&
            Number(r.player2Score ?? 0) === 0 &&
            Number(r.officialSpreadPlayer1 ?? 350) === 350
        );
        return { needed: policies.length > 0, policies, results };
    },

    normalizeAll() {
        const scan = this.inspect();
        if (!scan.needed) return { ok:true, changed:false, policyCount:0, resultCount:0 };

        const before = Storage.exportAll();
        try {
            localStorage.setItem(this._recoveryKey, JSON.stringify({
                createdAt: Utils.now(),
                source: 'PRE_LEGACY_BYE_POLICY_NORMALIZATION',
                data: before
            }));
        } catch (e) {
            return { ok:false, errors:[`Legacy BYE normalization cancelled: recovery copy could not be saved (${e.message || e}). Live data was not changed.`] };
        }

        const affectedDivisions = new Set();
        try {
            for (const policy of scan.policies) {
                Storage.update('byePolicies','byePolicyId',policy.byePolicyId,{
                    scoreFor:100,
                    scoreAgainst:0,
                    officialSpreadAwarded:100,
                    legacyByeDefaultNormalizedAt:Utils.now(),
                    legacyByeDefaultNormalizedFrom:{ scoreFor:0, scoreAgainst:0, officialSpreadAwarded:350 }
                });
                if (policy.divisionId) affectedDivisions.add(policy.divisionId);
                AuditService.log({
                    tournamentId:policy.tournamentId, divisionId:policy.divisionId,
                    entityType:'byePolicy', entityId:policy.byePolicyId, action:'normalize_legacy_default',
                    eventCode:'LEGACY_BYE_POLICY_DEFAULT_NORMALIZED',
                    before:{scoreFor:0,scoreAgainst:0,officialSpreadAwarded:350},
                    after:{scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100},
                    reason:'Normalized only the historical default fingerprint. Explicitly configured BYE rules are not changed.'
                });
            }

            let repairedResults = 0;
            for (const r of scan.results) {
                const rawSpread = 100;
                Storage.update('matchResults','resultId',r.resultId,{
                    player1Score:100, player2Score:0,
                    rawSpreadPlayer1:rawSpread, rawSpreadPlayer2:0,
                    officialSpreadPlayer1:100, officialSpreadPlayer2:0,
                    byeOfficialSpreadAwarded:100,
                    legacyByeResultNormalizedAt:Utils.now()
                });
                affectedDivisions.add(r.divisionId);
                repairedResults++;
                AuditService.log({
                    tournamentId:r.tournamentId, divisionId:r.divisionId, roundId:r.roundId,
                    entityType:'matchResult', entityId:r.resultId, action:'repair_legacy_bye_result',
                    eventCode:'LEGACY_BYE_RESULT_BACKFILLED',
                    before:{player1Score:0,player2Score:0,officialSpreadPlayer1:350},
                    after:{player1Score:100,player2Score:0,officialSpreadPlayer1:100},
                    reason:'Auto-generated BYE result repaired to match normalized Division BYE Rules.'
                });
            }

            for (const divisionId of affectedDivisions) {
                const d = DivisionService.getById(divisionId);
                if (d) Storage.update('divisions','divisionId',divisionId,{ resultRevision:(d.resultRevision||0)+1 });
            }

            return { ok:true, changed:true, policyCount:scan.policies.length, resultCount:repairedResults };
        } catch (e) {
            try { Storage.replaceAll(before); }
            catch (rollbackError) {
                return { ok:false, errors:[`CRITICAL: legacy BYE normalization failed and rollback also failed. Recovery copy remains at ${this._recoveryKey}.`] };
            }
            return { ok:false, errors:[`Legacy BYE normalization failed and was rolled back safely: ${e.message || e}`] };
        }
    }
};

// ============================================================
// PATCH 02.16 — GIBSON BYE METADATA / HISTORY INTEGRITY
// Backfills already-created Gibson BYEs from engineMetadata without changing
// pairing/result outcomes. New records persist the semantics at top level.
// ============================================================
const GibsonByeMetadataIntegrityService = {
    normalizeExisting() {
        let pairingsUpdated = 0, resultsUpdated = 0;
        const byPairingId = new Map();
        Storage.getAll('pairings').forEach(p => {
            if (p.pairingType !== 'bye') return;
            const byeReason = p.byeReason || p.engineMetadata?.byeReason || 'ordinary';
            const assignmentSource = p.assignmentSource || p.engineMetadata?.assignmentSource || p.generatedMethod || 'legacy';
            const gibsonizationReason = byeReason === 'gibson' ? (p.gibsonizationReason || p.engineMetadata?.gibsonizationReason || p.overrideReason || null) : null;
            byPairingId.set(p.pairingId,{byeReason,assignmentSource,gibsonizationReason});
            if (p.byeReason !== byeReason || p.assignmentSource !== assignmentSource || (p.gibsonizationReason||null) !== gibsonizationReason) {
                Storage.update('pairings','pairingId',p.pairingId,{byeReason,assignmentSource,gibsonizationReason,updatedAt:Utils.now()});
                pairingsUpdated++;
            }
        });
        Storage.getAll('matchResults').forEach(r => {
            if (r.resultType !== 'bye' || r.status === 'voided') return;
            const meta = byPairingId.get(r.pairingId); if (!meta) return;
            if (r.byeReason !== meta.byeReason || r.assignmentSource !== meta.assignmentSource || (r.gibsonizationReason||null) !== meta.gibsonizationReason) {
                Storage.update('matchResults','resultId',r.resultId,{...meta,updatedAt:Utils.now()});
                resultsUpdated++;
            }
        });
        if (pairingsUpdated || resultsUpdated) AuditService.log({entityType:'system',entityId:'gibson-bye-metadata',action:'normalize',eventCode:'GIBSON_BYE_METADATA_NORMALIZED',after:{pairingsUpdated,resultsUpdated}});
        return {ok:true,pairingsUpdated,resultsUpdated};
    }
};

// ============================================================
// PATCH 02.17 — BYE / GIBSON BYE HISTORICAL CORRECTION INTEGRITY
// BYE results are derived from confirmed BYE pairings. Unlock/re-lock may
// change lifecycle/snapshot state, but must not rewrite the historical BYE
// identity, assignment source, Gibson reason, policy version, or create a
// duplicate active result.
// ============================================================
const ByeHistoricalCorrectionIntegrityService = {
    inspectRound(roundId) {
        const errors = [], warnings = [];
        const byes = Storage.find('pairings', p => p.roundId === roundId && p.pairingType === 'bye' && p.status !== 'cancelled');
        byes.forEach(p => {
            const active = Storage.find('matchResults', r => r.pairingId === p.pairingId && r.status !== 'voided' && r.resultType !== 'void');
            if (active.length > 1) errors.push(`BYE pairing ${p.pairingId} has ${active.length} active results; expected at most one.`);
            const r = active[0];
            if (!r) return;
            const expectedReason = p.byeReason || p.engineMetadata?.byeReason || 'ordinary';
            const expectedSource = p.assignmentSource || p.engineMetadata?.assignmentSource || p.generatedMethod || 'system';
            const expectedGibsonReason = expectedReason === 'gibson' ? (p.gibsonizationReason || p.engineMetadata?.gibsonizationReason || null) : null;
            if (r.resultType !== 'bye' || r.pairingType !== 'bye') errors.push(`BYE result ${r.resultId} lost its BYE type.`);
            if ((r.byeReason || 'ordinary') !== expectedReason) errors.push(`BYE result ${r.resultId} byeReason no longer matches its pairing.`);
            if ((r.assignmentSource || 'system') !== expectedSource) errors.push(`BYE result ${r.resultId} assignmentSource no longer matches its pairing.`);
            if ((r.gibsonizationReason || null) !== expectedGibsonReason) errors.push(`BYE result ${r.resultId} Gibson reason no longer matches its pairing.`);
            if (!r.byePolicyId || !Number.isFinite(Number(r.byePolicyVersion))) warnings.push(`BYE result ${r.resultId} has incomplete historical policy metadata.`);
        });
        return { ok:errors.length===0, errors, warnings, byePairingCount:byes.length };
    },
    runSelfTest() {
        const errors=[];
        const pairing={pairingId:'P-G',pairingType:'bye',byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Clinched position test'};
        const result={resultId:'R-G',pairingId:'P-G',pairingType:'bye',resultType:'bye',status:'completed',byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Clinched position test',byePolicyId:'BP-1',byePolicyVersion:1};
        const signature = x => JSON.stringify([x.byeReason,x.assignmentSource,x.gibsonizationReason,x.byePolicyId,x.byePolicyVersion]);
        const before=signature(result);
        const unlocked={...result,status:'completed'};
        const relocked={...unlocked,status:'locked'};
        if (signature(unlocked)!==before || signature(relocked)!==before) errors.push('Unlock/re-lock changed historical Gibson BYE metadata.');
        const voidGuard=ResultVoidGuard.inspect(result,{roundNumber:3,status:'completed'},'Correction',{status:'active'});
        if (voidGuard.ok) errors.push('Gibson BYE independent void was not blocked.');
        const ordinaryGuard=ResultVoidGuard.inspect({...result,byeReason:'ordinary',gibsonizationReason:null},{roundNumber:3,status:'completed'},'Correction',{status:'active'});
        if (ordinaryGuard.ok) errors.push('Ordinary BYE independent void was not blocked.');
        if (pairing.byeReason!=='gibson') errors.push('Pairing historical BYE identity changed unexpectedly.');
        return {ok:!errors.length,errors,message:errors.length?`BYE Historical Correction Self-Test FAILED: ${errors.join(' ')}`:'BYE Historical Correction Self-Test PASSED: BYE/Gibson identity is immutable across unlock/re-lock and independent BYE-result voiding is blocked.'};
    }
};

// ============================================================
// PATCH 02.23 — RESULT ENTRY INTEGRITY / VALIDATION
