                officialSpreadAwarded:100
            },
            forfeit: {
                countsAsGame:true,
                winnerGetsWin:true,
                scoreMode:'entered_adjusted',
                useOfficialSpread:true
            },
            void: { countsAsGame:false, countsForStanding:false },
            version:1,
            status:'active'
        };
    },

    validateWalkover(input={}) {
        const errors = [];
        const scoreFor = Number(input.scoreFor);
        const scoreAgainst = Number(input.scoreAgainst);
        const officialSpreadAwarded = Number(input.officialSpreadAwarded);

        if (![scoreFor, scoreAgainst, officialSpreadAwarded].every(Number.isFinite)) {
            errors.push('WALKOVER policy values must be numeric.');
        }
        if (![scoreFor, scoreAgainst, officialSpreadAwarded].every(Number.isInteger)) {
            errors.push('WALKOVER policy values must be whole numbers.');
        }
        if ([scoreFor, scoreAgainst, officialSpreadAwarded].some(v => v < 0)) {
            errors.push('WALKOVER policy values cannot be negative.');
        }
        if (Number.isFinite(scoreFor) && Number.isFinite(scoreAgainst) && scoreFor <= scoreAgainst) {
            errors.push('WALKOVER winner score must be higher than loser score.');
        }
        return { ok: errors.length === 0, errors };
    },

    updateDivisionPolicy(divisionId, input={}) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { errors:['Division not found.'] };

        const validation = this.validateWalkover(input.walkover || {});
        if (!validation.ok) return { errors:validation.errors };

        let policy = this.getForDivision(divisionId);
        if (!policy.resultPolicyId) {
            policy = {
                ...policy,
                resultPolicyId: Utils.generateId('RP'),
                tournamentId: division.tournamentId,
                divisionId,
                createdAt: Utils.now(),
                updatedAt: Utils.now()
            };
            Storage.insert('resultPolicies', policy);
            Storage.update('divisions','divisionId',divisionId,{resultPolicyId:policy.resultPolicyId});
        }

        const before = JSON.parse(JSON.stringify(policy));
        const nextWalkover = {
            ...(policy.walkover || {}),
            countsAsGame:true,
            winnerGetsWin:true,
            scoreMode:'policy_defined',
            scoreFor:Number(input.walkover.scoreFor),
            scoreAgainst:Number(input.walkover.scoreAgainst),
            officialSpreadAwarded:Number(input.walkover.officialSpreadAwarded)
        };
        const nextForfeit = {
            ...(policy.forfeit || {}),
            countsAsGame:true,
            winnerGetsWin:true,
            scoreMode:'entered_adjusted',
            useOfficialSpread:true
        };

        const changed =
            Number(policy.walkover?.scoreFor ?? 100) !== nextWalkover.scoreFor ||
            Number(policy.walkover?.scoreAgainst ?? 0) !== nextWalkover.scoreAgainst ||
            Number(policy.walkover?.officialSpreadAwarded ?? 100) !== nextWalkover.officialSpreadAwarded ||
            policy.forfeit?.scoreMode !== 'entered_adjusted' ||
            policy.forfeit?.useOfficialSpread !== true;

        if (!changed) return { data:policy, changed:false };

        const nextVersion = Math.max(1, Number(policy.version || 1) + 1);
        const after = Storage.update('resultPolicies','resultPolicyId',policy.resultPolicyId,{
            walkover:nextWalkover,
            forfeit:nextForfeit,
            version:nextVersion,
            status:'active',
            resultPolicyConfiguredAt:Utils.now(),
            resultPolicyConfiguredBy:'admin',
            updatedAt:Utils.now()
        });

        AuditService.log({
            tournamentId:division.tournamentId,
            divisionId,
            entityType:'resultPolicy',
            entityId:policy.resultPolicyId,
            action:'update',
            eventCode:'RESULT_POLICY_CONFIG_UPDATED',
            before,
            after,
            reason:'Division ResultPolicy configuration updated; historical result records remain frozen.'
        });

        return { data:after, changed:true };
    },

    runSelfTest() {
        const errors = [];
        const v = this.validateWalkover({scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100});
        if (!v.ok) errors.push('Default WALKOVER policy should validate.');
        if (this.validateWalkover({scoreFor:0,scoreAgainst:100,officialSpreadAwarded:100}).ok) {
            errors.push('WALKOVER winner<=loser validation failed.');
        }
        if (this.validateWalkover({scoreFor:100.5,scoreAgainst:0,officialSpreadAwarded:100}).ok) {
            errors.push('Decimal WALKOVER policy validation failed.');
        }

        const frozenHistorical = {
            resultType:'walkover',
            player1Score:100,
            player2Score:0,
            officialSpreadPlayer1:100,
            resultPolicyVersion:1
        };
        const editedPolicy = {
            version:2,
            walkover:{scoreFor:200,scoreAgainst:100,officialSpreadAwarded:100}
        };
        if (frozenHistorical.player1Score !== 100 ||
            frozenHistorical.player2Score !== 0 ||
            frozenHistorical.officialSpreadPlayer1 !== 100 ||
            frozenHistorical.resultPolicyVersion !== 1 ||
            editedPolicy.version !== 2) {
            errors.push('Historical freeze simulation failed.');
        }

        return {
            ok:errors.length===0,
            errors,
            message:errors.length
                ? `ResultPolicy Configuration Self-Test FAILED: ${errors.join(' ')}`
                : 'ResultPolicy Configuration Self-Test PASSED: validation, policy versioning boundary, fixed FORFEIT adjusted-score mode, and historical freeze behavior are safe. Live tournament data was not modified.'
        };
    }
};


const ResultPolicyIntegrityService = {
    inspectPolicyShape(policy, division=null) {
        const errors = [];
        const warnings = [];

        if (!policy) {
            return { ok:false, errors:['ResultPolicy record is missing.'], warnings };
        }
        if (!policy.resultPolicyId) errors.push('ResultPolicy ID is missing.');
        if (!Number.isInteger(Number(policy.version)) || Number(policy.version) < 1) {
            errors.push('ResultPolicy version must be a positive integer.');
        }
        if ((policy.status || 'active') !== 'active') {
            errors.push(`ResultPolicy status must be ACTIVE; found ${policy.status || 'missing'}.`);
        }

        if (division) {
            if (policy.divisionId !== division.divisionId) {
                errors.push(`ResultPolicy divisionId mismatch: expected ${division.divisionId}.`);
            }
            if (policy.tournamentId !== division.tournamentId) {
                errors.push(`ResultPolicy tournamentId mismatch for Division ${division.divisionCode || division.divisionId}.`);
            }
        }

        const normal = policy.normal || {};
        if (normal.countsAsGame !== true) errors.push('NORMAL policy must count as a game.');
        if (normal.useEnteredScores !== true) errors.push('NORMAL policy must use entered scores.');
        if (normal.useOfficialSpread !== true) errors.push('NORMAL policy must use Official Spread.');

        const bye = policy.bye || {};
        if (bye.useByePolicy !== true) errors.push('BYE result execution must delegate to ByePolicy.');

        const walkover = policy.walkover || {};
        const walkoverValidation = ResultPolicyConfigurationService.validateWalkover(walkover);
        if (!walkoverValidation.ok) errors.push(...walkoverValidation.errors.map(e => `WALKOVER: ${e}`));
        if (walkover.countsAsGame !== true) errors.push('WALKOVER must count as a game.');
        if (walkover.winnerGetsWin !== true) errors.push('WALKOVER must award a win to the declared winner.');
        if (walkover.scoreMode !== 'policy_defined') errors.push('WALKOVER scoreMode must be policy_defined.');

        const forfeit = policy.forfeit || {};
        if (forfeit.countsAsGame !== true) errors.push('FORFEIT must count as a game.');
        if (forfeit.winnerGetsWin !== true) errors.push('FORFEIT must award a win to the declared winner.');
        if (forfeit.scoreMode !== 'entered_adjusted') errors.push('FORFEIT scoreMode must remain entered_adjusted.');
        if (forfeit.useOfficialSpread !== true) errors.push('FORFEIT must use Official Spread derived from adjusted score.');

        const voidRule = policy.void || {};
        if (voidRule.countsAsGame !== false) errors.push('VOID must not count as a game.');
        if (voidRule.countsForStanding !== false) errors.push('VOID must not count for Standing.');

        return { ok:errors.length===0, errors, warnings };
    },

    inspectDivision(divisionId) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { ok:false, errors:['Division not found.'], warnings:[], divisionId };

        const errors = [];
        const warnings = [];

        if (!division.resultPolicyId) {
            errors.push(`Division ${division.divisionCode || division.divisionId} has no ResultPolicy reference.`);
            return { ok:false, errors, warnings, divisionId, policy:null };
        }

        const policy = Storage.getById('resultPolicies','resultPolicyId',division.resultPolicyId);
        if (!policy) {
            errors.push(`Division ${division.divisionCode || division.divisionId} references missing ResultPolicy ${division.resultPolicyId}.`);
            return { ok:false, errors, warnings, divisionId, policy:null };
        }

        const shape = this.inspectPolicyShape(policy, division);
        errors.push(...shape.errors);
        warnings.push(...shape.warnings);

        // A ResultPolicy should belong to exactly one Division.
        const duplicateRefs = Storage.find('divisions', d =>
            d.resultPolicyId === policy.resultPolicyId &&
            d.divisionId !== division.divisionId
        );
        if (duplicateRefs.length) {
            errors.push(`ResultPolicy ${policy.resultPolicyId} is referenced by multiple Divisions.`);
        }

        return {
            ok:errors.length===0,
            errors,
            warnings,
            divisionId,
            policy,
            version:Number(policy.version || 0)
        };
    },

    inspectTournament(tournamentId) {
        const divisions = DivisionService.getByTournament(tournamentId);
        const reports = divisions.map(d => this.inspectDivision(d.divisionId));
        const errors = reports.flatMap(r => r.errors.map(e => `${DivisionService.getById(r.divisionId)?.divisionCode || r.divisionId}: ${e}`));
        const warnings = reports.flatMap(r => r.warnings || []);
        return {
            ok:errors.length===0,
            errors,
            warnings,
            checkedDivisions:reports.length,
            reports
        };
    },

    requireExecutablePolicy(divisionId) {
        const report = this.inspectDivision(divisionId);
        if (!report.ok) {
            return {
                ok:false,
                errors:[
                    'ResultPolicy integrity guard blocked special-result execution.',
                    ...report.errors
                ]
            };
        }
        return { ok:true, policy:report.policy, report };
    },

    validateDivisionConfigInput(input={}) {
        const walkover = ResultPolicyConfigurationService.validateWalkover(input.walkover || {});
        const errors = [...walkover.errors];

        // Fixed invariants intentionally cannot be configured in UI.
        if (input.forfeit && input.forfeit.scoreMode && input.forfeit.scoreMode !== 'entered_adjusted') {
            errors.push('FORFEIT scoreMode is fixed to entered_adjusted.');
        }
        return { ok:errors.length===0, errors };
    },

    runSelfTest() {
        const errors = [];
        const valid = {
            resultPolicyId:'RP-X',
            tournamentId:'T-X',
            divisionId:'D-X',
            normal:{countsAsGame:true,useEnteredScores:true,useOfficialSpread:true},
            bye:{useByePolicy:true},
            walkover:{countsAsGame:true,winnerGetsWin:true,scoreMode:'policy_defined',scoreFor:200,scoreAgainst:100,officialSpreadAwarded:100},
            forfeit:{countsAsGame:true,winnerGetsWin:true,scoreMode:'entered_adjusted',useOfficialSpread:true},
            void:{countsAsGame:false,countsForStanding:false},
            version:2,
            status:'active'
        };
        const division = {divisionId:'D-X',tournamentId:'T-X',divisionCode:'DX'};

        if (!this.inspectPolicyShape(valid,division).ok) {
            errors.push('Valid ResultPolicy shape was rejected.');
        }
        if (this.inspectPolicyShape({...valid, divisionId:'WRONG'},division).ok) {
            errors.push('Division ownership mismatch was not detected.');
        }
        if (this.inspectPolicyShape({...valid, forfeit:{...valid.forfeit,scoreMode:'policy_defined'}},division).ok) {
            errors.push('Illegal FORFEIT scoreMode was not detected.');
        }
        if (this.inspectPolicyShape({...valid, version:0},division).ok) {
            errors.push('Invalid ResultPolicy version was not detected.');
        }

        return {
            ok:errors.length===0,
            errors,
            message:errors.length
                ? `ResultPolicy Integrity / Division Config Guard Self-Test FAILED: ${errors.join(' ')}`
                : 'ResultPolicy Integrity / Division Config Guard Self-Test PASSED: ownership, schema invariants, configuration validation, and executable-policy guard are correct. Live tournament data was not modified.'
        };
    }
};

// ============================================================
// PATCH 02.39 — WALKOVER / DOUBLE WALKOVER RESULT EXECUTION
// DOUBLE WALKOVER is an administrative result for a real two-player pairing
// where BOTH players fail to appear/commence play within the allowed period.
// It is NOT a 0–0 tie. Each player independently receives the WALKOVER loser
// standing line frozen from the Division ResultPolicy:
// GP 1 / W 0 / T 0 / L 1 / MP 0 / SF 0 / SA 100 / OS -100 by default.
// Because both players lose administratively, this result is intentionally
// non-zero-sum and must never be validated as an ordinary played score.
// ============================================================
const DoubleWalkoverStandingExecutionService = {
    resolve(result) {
        if (!result || result.resultType !== 'double_walkover') {
            return {ok:false,errors:['Result is not DOUBLE WALKOVER.']};
        }
        const errors=[];
        const p1={
            scoreFor:Number(result.standingScoreForPlayer1 ?? 0),
            scoreAgainst:Number(result.standingScoreAgainstPlayer1 ?? 100),
            rawSpread:Number(result.rawSpreadPlayer1 ?? -100),
            officialSpread:Number(result.officialSpreadPlayer1 ?? -100),
            resultCode:result.player1Result || 'L',
            matchPoints:Number(result.matchPointsPlayer1 ?? 0)
        };
        const p2={
            scoreFor:Number(result.standingScoreForPlayer2 ?? 0),
            scoreAgainst:Number(result.standingScoreAgainstPlayer2 ?? 100),
            rawSpread:Number(result.rawSpreadPlayer2 ?? -100),
            officialSpread:Number(result.officialSpreadPlayer2 ?? -100),
            resultCode:result.player2Result || 'L',
            matchPoints:Number(result.matchPointsPlayer2 ?? 0)
        };
        [p1,p2].forEach((x,idx)=>{
            const who=idx===0?'Player 1':'Player 2';
            if (![x.scoreFor,x.scoreAgainst,x.rawSpread,x.officialSpread,x.matchPoints].every(Number.isFinite)) errors.push(`${who} DOUBLE WALKOVER standing facts are invalid.`);
            if (x.scoreFor < 0 || x.scoreAgainst < 0) errors.push(`${who} DOUBLE WALKOVER SF/SA cannot be negative.`);
            if (x.resultCode !== 'L') errors.push(`${who} DOUBLE WALKOVER result must be L.`);
            if (x.matchPoints !== 0) errors.push(`${who} DOUBLE WALKOVER Match Points must be 0.`);
            if (x.officialSpread >= 0) errors.push(`${who} DOUBLE WALKOVER Official Spread must be negative.`);
        });
        if (!result.player1Id || !result.player2Id || result.player1Id===result.player2Id) errors.push('DOUBLE WALKOVER requires two distinct real players.');
        return {ok:errors.length===0,errors,data:{player1:p1,player2:p2,countsAsGame:result.countsAsGame!==false}};
    },
    applyToStats(stats, result, side) {
        const resolved=this.resolve(result);
        if(!resolved.ok) return resolved;
        const x=Number(side)===2?resolved.data.player2:resolved.data.player1;
        if(resolved.data.countsAsGame) stats.gamesPlayed++;
        stats.losses++;
        stats.matchPoints += x.matchPoints;
        stats.scoreFor += x.scoreFor;
        stats.scoreAgainst += x.scoreAgainst;
        stats.sumRawSpread += x.rawSpread;
        stats.sumOfficialSpread += x.officialSpread;
        return {ok:true,data:stats,execution:x};
    },
    runSelfTest() {
        const errors=[];
        const result={resultType:'double_walkover',player1Id:'A',player2Id:'B',player1Result:'L',player2Result:'L',standingScoreForPlayer1:0,standingScoreAgainstPlayer1:100,standingScoreForPlayer2:0,standingScoreAgainstPlayer2:100,rawSpreadPlayer1:-100,rawSpreadPlayer2:-100,officialSpreadPlayer1:-100,officialSpreadPlayer2:-100,matchPointsPlayer1:0,matchPointsPlayer2:0,countsAsGame:true};
        const fresh=()=>({gamesPlayed:0,wins:0,ties:0,losses:0,matchPoints:0,scoreFor:0,scoreAgainst:0,sumRawSpread:0,sumOfficialSpread:0});
        const a=fresh(),b=fresh();
        const ra=this.applyToStats(a,result,1), rb=this.applyToStats(b,result,2);
        for (const [label,st,ok] of [['P1',a,ra.ok],['P2',b,rb.ok]]) {
            if(!ok||st.gamesPlayed!==1||st.wins!==0||st.ties!==0||st.losses!==1||st.matchPoints!==0||st.scoreFor!==0||st.scoreAgainst!==100||st.sumOfficialSpread!==-100) errors.push(`${label} DOUBLE WALKOVER standing execution failed.`);
        }
        return {ok:errors.length===0,errors,message:errors.length?`DOUBLE WALKOVER Self-Test FAILED: ${errors.join(' ')}`:'DOUBLE WALKOVER Self-Test PASSED: both players receive GP1 / W0-T0-L1 / MP0 / SF0 / SA100 / OS-100; no 0–0 tie is created. Live tournament data was not modified.'};
    }
};

const ResultPolicyExecutionService = {
    policyForDivision(divisionId) {
        const division = DivisionService.getById(divisionId);
        const stored = division?.resultPolicyId ? Storage.getById('resultPolicies','resultPolicyId',division.resultPolicyId) : null;
        const fallback = {
            resultPolicyId: stored?.resultPolicyId || 'SYSTEM-DEFAULT-RESULT-POLICY', version:Number(stored?.version || 1),
            walkover:{countsAsGame:true,winnerGetsWin:true,scoreMode:'policy_defined',scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100},
            forfeit:{countsAsGame:true,winnerGetsWin:true,scoreMode:'entered_adjusted',useOfficialSpread:true}
        };
        return {
            ...fallback, ...(stored || {}),
            walkover:{...fallback.walkover,...(stored?.walkover || {})},
            forfeit:{...fallback.forfeit,...(stored?.forfeit || {})}
        };
    },
    execute(pairing, type, winnerSide, data={}) {
        const errors=[];
        if (!pairing) return {ok:false,errors:['Pairing not found.']};
        if (pairing.pairingType !== 'normal') return {ok:false,errors:['Walkover/Forfeit may only replace a NORMAL pairing result.']};
        if (!['walkover','forfeit','double_walkover'].includes(type)) return {ok:false,errors:['Special result type must be WALKOVER, DOUBLE WALKOVER or FORFEIT.']};
        if (type!=='double_walkover' && ![1,2].includes(Number(winnerSide))) return {ok:false,errors:['Select the winning player.']};
        const policyGuard = ResultPolicyIntegrityService.requireExecutablePolicy(pairing.divisionId);
        if (!policyGuard.ok) return {ok:false,errors:policyGuard.errors};
        const policy=policyGuard.policy;
        const rule=type==='double_walkover' ? (policy.walkover || {}) : (policy[type] || {});
        const spreadLimit=SpreadLimitResolver.getSpreadLimit(pairing.divisionId,pairing.roundNumber) ?? 350;

        if (type==='double_walkover') {
            const walkoverWinnerScore=Number(rule.scoreFor ?? 100);
            const walkoverLoserScore=Number(rule.scoreAgainst ?? 0);
            const walkoverOfficialSpread=Number(rule.officialSpreadAwarded ?? 100);
            if (![walkoverWinnerScore,walkoverLoserScore,walkoverOfficialSpread].every(Number.isFinite)) errors.push('ResultPolicy produced invalid DOUBLE WALKOVER scoring values.');
            if ([walkoverWinnerScore,walkoverLoserScore,walkoverOfficialSpread].some(v=>!Number.isInteger(v)||v<0)) errors.push('DOUBLE WALKOVER policy values must be non-negative integers.');
            if (walkoverWinnerScore <= walkoverLoserScore) errors.push('DOUBLE WALKOVER requires a valid WALKOVER policy where winner score is higher than loser score.');
            if(errors.length) return {ok:false,errors};
            const loserSF=walkoverLoserScore;
            const loserSA=walkoverWinnerScore;
            const loserRaw=loserSF-loserSA;
            const loserOS=-Math.abs(walkoverOfficialSpread);
            return {ok:true,errors:[],execution:{
                // Display scores are intentionally neutral. Standing facts below are authoritative.
                player1Score:0,player2Score:0,player1Result:'L',player2Result:'L',winnerId:null,loserId:null,
                standingScoreForPlayer1:loserSF,standingScoreAgainstPlayer1:loserSA,
                standingScoreForPlayer2:loserSF,standingScoreAgainstPlayer2:loserSA,
                rawSpreadPlayer1:loserRaw,rawSpreadPlayer2:loserRaw,
                officialSpreadPlayer1:loserOS,officialSpreadPlayer2:loserOS,
                matchPointsPlayer1:0,matchPointsPlayer2:0,
                spreadLimitUsed:spreadLimit,resultType:'double_walkover',pairingType:'normal',countsAsGame:true,
                administrativeResult:true,nonZeroSumStanding:true,doubleWalkoverRuleVersion:1,
                resultPolicyId:policy.resultPolicyId || null,resultPolicyVersion:Number(policy.version || 1),
                resultPolicyExecutionVersion:2,scoreModeUsed:'double_walkover_from_walkover_loser_line'
            }};
        }

        let winnerScore, loserScore, officialWinnerSpread;
        if (type==='walkover') {
            winnerScore=Number(rule.scoreFor ?? 100); loserScore=Number(rule.scoreAgainst ?? 0);
            officialWinnerSpread=Number(rule.officialSpreadAwarded ?? Math.min(spreadLimit,Math.max(0,winnerScore-loserScore)));
        } else {
            const ws=ResultEntryIntegrityService.parseEnteredScore(data.winnerScore,'Winner');
            const ls=ResultEntryIntegrityService.parseEnteredScore(data.loserScore,'Loser');
            if(!ws.ok) errors.push(ws.error); if(!ls.ok) errors.push(ls.error);
            if(errors.length) return {ok:false,errors};
            winnerScore=ws.value; loserScore=ls.value;
            if (winnerScore <= loserScore) errors.push('Forfeit adjusted score must leave the declared winner with a higher score than the loser.');
            officialWinnerSpread=Math.min(spreadLimit,Math.max(-spreadLimit,winnerScore-loserScore));
        }
        if (![winnerScore,loserScore,officialWinnerSpread].every(Number.isFinite)) errors.push('ResultPolicy produced invalid numeric scoring values.');
        if (winnerScore < 0 || loserScore < 0 || !Number.isInteger(winnerScore) || !Number.isInteger(loserScore)) errors.push('Special-result scores must be non-negative integers.');
        if (officialWinnerSpread < 0) errors.push('Winning Official Spread cannot be negative.');
        if(errors.length) return {ok:false,errors};
        const p1Wins=Number(winnerSide)===1;
        const p1Score=p1Wins?winnerScore:loserScore, p2Score=p1Wins?loserScore:winnerScore;
        const raw1=p1Score-p2Score, raw2=-raw1;
        const os1=p1Wins?officialWinnerSpread:-officialWinnerSpread, os2=-os1;
        return {ok:true,errors:[],execution:{
            player1Score:p1Score,player2Score:p2Score,player1Result:p1Wins?'W':'L',player2Result:p1Wins?'L':'W',
            winnerId:p1Wins?pairing.player1Id:pairing.player2Id,loserId:p1Wins?pairing.player2Id:pairing.player1Id,
            rawSpreadPlayer1:raw1,rawSpreadPlayer2:raw2,officialSpreadPlayer1:os1,officialSpreadPlayer2:os2,
            spreadLimitUsed:spreadLimit,resultType:type,pairingType:'normal',countsAsGame:rule.countsAsGame!==false,
            resultPolicyId:policy.resultPolicyId || null,resultPolicyVersion:Number(policy.version || 1),
            resultPolicyExecutionVersion:1,scoreModeUsed:rule.scoreMode || (type==='forfeit'?'entered_adjusted':'policy_defined')
        }};
    },
    runSelfTest() {
        const errors=[];
        const fake={pairingType:'normal',divisionId:'D',roundNumber:1,player1Id:'A',player2Id:'B'};
        // Patch 02.39.1: execute() resolves policy through ResultPolicyIntegrityService,
        // so the self-test must stub that exact boundary rather than policyForDivision().
        const originalRequireExecutablePolicy=ResultPolicyIntegrityService.requireExecutablePolicy;
        ResultPolicyIntegrityService.requireExecutablePolicy=()=>({ok:true,errors:[],policy:{resultPolicyId:'RP-X',version:3,walkover:{scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100,countsAsGame:true},forfeit:{scoreMode:'entered_adjusted',countsAsGame:true}}});
        try {
            const w=this.execute(fake,'walkover',2,{});
            if(!w.ok||w.execution.player1Score!==0||w.execution.player2Score!==100||w.execution.player2Result!=='W'||w.execution.officialSpreadPlayer2!==100) errors.push('Walkover execution failed.');
            const d=this.execute(fake,'double_walkover',null,{});
            if(!d.ok||d.execution.player1Result!=='L'||d.execution.player2Result!=='L'||d.execution.standingScoreForPlayer1!==0||d.execution.standingScoreAgainstPlayer1!==100||d.execution.officialSpreadPlayer1!==-100||d.execution.officialSpreadPlayer2!==-100||d.execution.matchPointsPlayer1!==0||d.execution.matchPointsPlayer2!==0) errors.push('Double Walkover execution failed.');
            const f=this.execute(fake,'forfeit',1,{winnerScore:320,loserScore:270});
            if(!f.ok||f.execution.player1Result!=='W'||f.execution.rawSpreadPlayer1!==50||f.execution.officialSpreadPlayer1!==50) errors.push('Forfeit adjusted-score execution failed.');
            const bad=this.execute(fake,'forfeit',1,{winnerScore:200,loserScore:250});
            if(bad.ok) errors.push('Forfeit winner/score consistency guard failed.');
        } finally { ResultPolicyIntegrityService.requireExecutablePolicy=originalRequireExecutablePolicy; }
        return {ok:errors.length===0,errors,message:errors.length?`ResultPolicy Execution Self-Test FAILED: ${errors.join(' ')}`:'ResultPolicy Execution Self-Test PASSED: WALKOVER, DOUBLE WALKOVER, FORFEIT adjusted scoring, frozen policy metadata, and score-consistency guards are correct. Live tournament data was not modified.'};
    }
};

const ResultEntryIntegrityService = {
    editableRoundStatuses: Object.freeze(['in_progress','completed','results_pending']),

    canEditRound(round) {
        if (!round) return { ok:false, errors:['Round not found.'] };
        if (round.status === 'locked') return { ok:false, errors:[`Round ${round.roundNumber} is LOCKED. Unlock the round before correcting results.`] };
        if (!this.editableRoundStatuses.includes(round.status)) {
            return { ok:false, errors:[`Result entry is not allowed while Round ${round.roundNumber} is ${String(round.status || '').toUpperCase()}. Start the round first.`] };
        }
        return { ok:true, errors:[] };
    },

    parseEnteredScore(value, label) {
        const raw = typeof value === 'string' ? value.trim() : value;
        if (raw === '' || raw === null || raw === undefined) return { ok:false, error:`${label} score is required.` };
        const n = Number(raw);
        if (!Number.isFinite(n) || !Number.isInteger(n) || n < 0) return { ok:false, error:`${label} score must be a non-negative integer.` };
        return { ok:true, value:n };
    },

    validateSubmission(pairing, data) {
        const errors = [];
        if (!pairing) return { ok:false, errors:['Pairing not found.'] };
        const round = RoundService.getById(pairing.roundId);
        const roundGuard = this.canEditRound(round);
        if (!roundGuard.ok) errors.push(...roundGuard.errors);
        if (pairing.status === 'locked') errors.push('Pairing is locked.');
        if (pairing.pairingType !== 'normal') errors.push('Only NORMAL pairings accept manual score entry. BYE results are system-managed.');
        if (!pairing.player1Id || !pairing.player2Id || pairing.player1Id === pairing.player2Id) errors.push('Pairing player identity is invalid.');

        const p1 = this.parseEnteredScore(data?.player1Score, 'Player 1');
        const p2 = this.parseEnteredScore(data?.player2Score, 'Player 2');
        if (!p1.ok) errors.push(p1.error);
        if (!p2.ok) errors.push(p2.error);
        return { ok:errors.length===0, errors, round, player1Score:p1.ok?p1.value:null, player2Score:p2.ok?p2.value:null };
    },

    inspectResult(result) {
        const errors = [], warnings = [];
        if (!result) return { ok:false, errors:['Result not found.'], warnings };
        if (result.status === 'voided' || result.resultType === 'void') return { ok:true, errors, warnings, historicalVoid:true };
        const pairing = Storage.getById('pairings','pairingId',result.pairingId);
        if (!pairing) return { ok:false, errors:[`Result ${result.resultId} references a missing pairing.`], warnings };
        if (result.resultType === 'bye' || pairing.pairingType === 'bye') return { ok:true, errors, warnings, bye:true };
        if (['walkover','forfeit','double_walkover'].includes(result.resultType)) {
            const fields=['player1Score','player2Score','rawSpreadPlayer1','rawSpreadPlayer2','officialSpreadPlayer1','officialSpreadPlayer2'];
            fields.forEach(f=>{ if(!Number.isFinite(Number(result[f]))) errors.push(`${result.resultId}: ${f} is not numeric.`); });
            if (result.resultType==='double_walkover') {
                const dwo=DoubleWalkoverStandingExecutionService.resolve(result);
                if(!dwo.ok) errors.push(...dwo.errors.map(e=>`${result.resultId}: ${e}`));
            } else {
                if (!['W','L'].includes(result.player1Result) || !['W','L'].includes(result.player2Result) || result.player1Result===result.player2Result) errors.push(`${result.resultId}: special result must freeze one W and one L.`);
                if ((Number(result.rawSpreadPlayer1)||0)+(Number(result.rawSpreadPlayer2)||0)!==0) errors.push(`${result.resultId}: raw spread does not sum to zero.`);
                if ((Number(result.officialSpreadPlayer1)||0)+(Number(result.officialSpreadPlayer2)||0)!==0) errors.push(`${result.resultId}: official spread does not sum to zero.`);
            }
            if (!result.resultPolicyExecutionVersion) warnings.push(`${result.resultId}: legacy special result has no frozen ResultPolicy execution version.`);
            return {ok:errors.length===0,errors,warnings,special:true};
        }

        const p1 = this.parseEnteredScore(result.player1Score, 'Player 1');
        const p2 = this.parseEnteredScore(result.player2Score, 'Player 2');
        if (!p1.ok) errors.push(`${result.resultId}: ${p1.error}`);
        if (!p2.ok) errors.push(`${result.resultId}: ${p2.error}`);
        if (!p1.ok || !p2.ok) return { ok:false, errors, warnings };

        const spreadLimit = Number(result.spreadLimitUsed);
        if (!Number.isFinite(spreadLimit) || spreadLimit <= 0) errors.push(`${result.resultId}: frozen spreadLimitUsed is invalid.`);
        const allowTies = result.allowTiesUsed !== undefined
            ? Boolean(result.allowTiesUsed)
            : (DivisionService.getById(result.divisionId)?.allowTies ?? TournamentService.getById(result.tournamentId)?.allowTies ?? true);
        if (result.allowTiesUsed === undefined) warnings.push(`${result.resultId}: legacy result has no frozen allowTiesUsed metadata; current competition setting was used for audit only.`);
        if (errors.length) return { ok:false, errors, warnings };

        const calc = CalcEngine.calculateResult(p1.value,p2.value,spreadLimit,allowTies);
        if (calc.error) errors.push(`${result.resultId}: ${calc.error}`);
        else {
            const expectedWinner = calc.p1Result==='W' ? pairing.player1Id : calc.p2Result==='W' ? pairing.player2Id : null;
            const expectedLoser = calc.p1Result==='L' ? pairing.player1Id : calc.p2Result==='L' ? pairing.player2Id : null;
            const checks = [
                ['player1Result', result.player1Result, calc.p1Result], ['player2Result', result.player2Result, calc.p2Result],
                ['winnerId', result.winnerId ?? null, expectedWinner], ['loserId', result.loserId ?? null, expectedLoser],
                ['rawSpreadPlayer1', Number(result.rawSpreadPlayer1), calc.rawSpread1], ['rawSpreadPlayer2', Number(result.rawSpreadPlayer2), calc.rawSpread2],
                ['officialSpreadPlayer1', Number(result.officialSpreadPlayer1), calc.officialSpread1], ['officialSpreadPlayer2', Number(result.officialSpreadPlayer2), calc.officialSpread2]
            ];
            checks.forEach(([field,actual,expected])=>{
                if (String(actual ?? '') !== String(expected ?? '')) errors.push(`${result.resultId}: ${field} is ${String(actual)} but score-derived value must be ${String(expected)}.`);
            });
        }

        const identity = ['tournamentId','divisionId','roundId','roundNumber','tableNumber','player1Id','player2Id','player1RegistrationId','player2RegistrationId'];
        identity.forEach(field=>{
            if (String(result[field] ?? '') !== String(pairing[field] ?? '')) errors.push(`${result.resultId}: ${field} does not match its exact pairing.`);
        });
        return { ok:errors.length===0, errors, warnings };
    },

    inspectDivision(divisionId) {
        const errors=[], warnings=[];
        const results = Storage.find('matchResults', r => r.divisionId===divisionId && r.status!=='voided' && r.resultType!=='void');
        let normalCount=0, byeCount=0;
        results.forEach(r=>{
            if (r.resultType==='bye' || r.pairingType==='bye') { byeCount++; return; }
            normalCount++;
            const x=this.inspectResult(r);
            errors.push(...x.errors); warnings.push(...x.warnings);
        });
        return {ok:errors.length===0,errors,warnings,normalResultCount:normalCount,byeResultCount:byeCount,totalResultCount:results.length};
    },

    runSelfTest() {
        const errors=[];
        const parseCases=[
            ['',false],[-1,false],[1.5,false],['12.5',false],['abc',false],['12abc',false],[0,true],['0',true],[432,true]
        ];
        parseCases.forEach(([v,expected])=>{ if(this.parseEnteredScore(v,'Test').ok!==expected) errors.push(`Strict score parsing failed for ${JSON.stringify(v)}.`); });
        if (this.canEditRound({roundNumber:1,status:'pairing_confirmed'}).ok) errors.push('PAIRING_CONFIRMED incorrectly allows score entry before Start Round.');
        if (!this.canEditRound({roundNumber:1,status:'in_progress'}).ok) errors.push('IN_PROGRESS incorrectly blocks score entry.');
        if (!this.canEditRound({roundNumber:1,status:'results_pending'}).ok) errors.push('RESULTS_PENDING incorrectly blocks replacement score entry.');
        if (this.canEditRound({roundNumber:1,status:'locked'}).ok) errors.push('LOCKED incorrectly allows score editing.');
        const c1=CalcEngine.calculateResult(400,387,350,true);
        if (c1.p1Result!=='W'||c1.rawSpread1!==13||c1.officialSpread1!==13) errors.push('Normal score derivation failed.');
        const c2=CalcEngine.calculateResult(800,100,350,true);
        if (c2.rawSpread1!==700||c2.officialSpread1!==350||c2.officialSpread2!==-350) errors.push('Maximum Spread cap failed.');
        const c3=CalcEngine.calculateResult(400,400,350,true);
        if (c3.p1Result!=='T'||c3.p2Result!=='T') errors.push('Allowed tie derivation failed.');
        const c4=CalcEngine.calculateResult(400,400,350,false);
        if (!c4.error) errors.push('Disallowed tie was not blocked.');
        return {ok:errors.length===0,errors,message:errors.length?`Result Entry Integrity Self-Test FAILED: ${errors.join(' ')}`:'Result Entry Integrity Self-Test PASSED: strict non-negative integer scores, start-before-entry lifecycle, automatic W/L/T, Maximum Spread capping, tie policy, and locked-round protection are enforced. Live tournament data was not modified.'};
    }
};


// ============================================================
// PATCH 02.30 — SPECIAL RESULT CORRECTION / REPLACEMENT INTEGRITY
// One correction chain authority for NORMAL <-> WALKOVER/FORFEIT replacement.
// A replacement must target the latest VOID of the exact same pairing;
// old historical facts remain immutable and only one active result may exist.
// ============================================================
const ResultCorrectionReplacementIntegrityService = {
    activeResultsForPairing(pairingId) {
        return Storage.find('matchResults', r =>
            r.pairingId === pairingId &&
            r.status !== 'voided' &&
            r.resultType !== 'void'
        );
    },

    voidHistoryForPairing(pairingId) {
        return Storage.find('matchResults', r =>
            r.pairingId === pairingId &&
            (r.status === 'voided' || r.resultType === 'void')
        ).sort((a,b) => {
            const ta = Date.parse(a.voidedAt || a.updatedAt || a.createdAt || '') || 0;
            const tb = Date.parse(b.voidedAt || b.updatedAt || b.createdAt || '') || 0;
            return tb - ta;
        });
    },

    latestReplacementTarget(pairingId) {
        return this.voidHistoryForPairing(pairingId)[0] || null;
    },

    historicalType(result) {
        if (!result) return null;
        if (result.resultType && result.resultType !== 'void') return result.resultType;
        return result.historicalSpecialResultType || result.originalResultType || 'normal';
    },

    validateTarget(pairing, target) {
        const errors = [];
        if (!pairing) return {ok:false, errors:['Pairing not found.']};
        if (!target) return {ok:true, errors:[]};

        if (!(target.status === 'voided' || target.resultType === 'void')) {
            errors.push('Replacement target must be a VOIDED historical result.');
        }
        if (target.pairingId !== pairing.pairingId) {
            errors.push('Replacement target belongs to a different pairing.');
        }
        if (target.roundId !== pairing.roundId ||
            target.divisionId !== pairing.divisionId ||
            target.tournamentId !== pairing.tournamentId) {
            errors.push('Replacement target round/division/tournament identity does not match the pairing.');
        }
        if (target.player1Id !== pairing.player1Id ||
            target.player2Id !== pairing.player2Id ||
            target.player1RegistrationId !== pairing.player1RegistrationId ||
            target.player2RegistrationId !== pairing.player2RegistrationId) {
            errors.push('Replacement target player identity does not match the exact pairing.');
        }
        if (!String(target.voidReason || '').trim()) {
            errors.push('Replacement target is missing its correction reason.');
        }
        return {ok:errors.length===0, errors};
    },

    prepareReplacement(pairingId, newResultType) {
        const pairing = Storage.getById('pairings','pairingId',pairingId);
        if (!pairing) return {ok:false,errors:['Pairing not found.']};

        const active = this.activeResultsForPairing(pairingId);
        if (active.length > 0) {
            return {ok:false,errors:['This pairing already has an active result. Void it first before entering a replacement.']};
        }

        const target = this.latestReplacementTarget(pairingId);
        const targetGuard = this.validateTarget(pairing,target);
        if (!targetGuard.ok) return targetGuard;

        return {
            ok:true,
            pairing,
            target,
            metadata: target ? {
                replacesResultId: target.resultId,
                replacementReason: target.voidReason || null,
                replacementFromType: this.historicalType(target),
                replacementToType: newResultType,
                correctionChainVersion: 1
            } : {
                replacesResultId:null,
                replacementReason:null,
                replacementFromType:null,
                replacementToType:null,
                correctionChainVersion:null
            }
        };
    },

    inspectPairing(pairingId) {
        const pairing = Storage.getById('pairings','pairingId',pairingId);
        const active = this.activeResultsForPairing(pairingId);
        const voids = this.voidHistoryForPairing(pairingId);
        const errors = [];
        const warnings = [];

        if (!pairing) return {ok:false,errors:['Pairing not found.'],warnings,activeCount:0,voidCount:voids.length};

        if (active.length > 1) {
            errors.push('More than one active result exists for this pairing.');
        }

        active.forEach(r => {
            if (!r.replacesResultId) return;
            const target = voids.find(v => v.resultId === r.replacesResultId);
            if (!target) {
                errors.push(`${r.resultId}: replacement points to a missing/non-VOID result.`);
                return;
            }
            const guard = this.validateTarget(pairing,target);
            errors.push(...guard.errors.map(e => `${r.resultId}: ${e}`));

            if (r.replacementFromType && r.replacementFromType !== this.historicalType(target)) {
                errors.push(`${r.resultId}: replacementFromType does not match historical target type.`);
            }
            if (r.replacementToType && r.replacementToType !== r.resultType) {
                errors.push(`${r.resultId}: replacementToType does not match active result type.`);
            }
        });

        voids.forEach(v => {
            if (!v.voidReason?.trim()) errors.push(`${v.resultId}: historical VOID has no reason.`);
            if (!v.voidedAt) warnings.push(`${v.resultId}: legacy VOID has no voidedAt timestamp.`);
        });

        return {
            ok:errors.length===0,
            errors,
            warnings,
            activeCount:active.length,
            voidCount:voids.length,
            activeResult:active[0] || null,
            latestVoid:voids[0] || null
        };
    },

    inspectDivision(divisionId) {
        const pairings = Storage.find('pairings',p=>p.divisionId===divisionId);
        const reports = pairings.map(p=>({pairing:p,report:this.inspectPairing(p.pairingId)}));
        const errors = reports.flatMap(x=>x.report.errors.map(e=>`R${x.pairing.roundNumber} T${x.pairing.tableNumber}: ${e}`));
        const warnings = reports.flatMap(x=>x.report.warnings || []);
        return {
            ok:errors.length===0,
            errors,
            warnings,
            checkedPairings:reports.length,
            replacementChains:reports.filter(x=>x.report.voidCount>0).length
        };
    },

    runSelfTest() {
        const errors = [];
        const pairing = {
            pairingId:'PAR-X',roundId:'R-X',divisionId:'D-X',tournamentId:'T-X',
            player1Id:'P1',player2Id:'P2',player1RegistrationId:'REG1',player2RegistrationId:'REG2'
        };
        const specialVoid = {
            resultId:'RES-OLD',pairingId:'PAR-X',roundId:'R-X',divisionId:'D-X',tournamentId:'T-X',
            player1Id:'P1',player2Id:'P2',player1RegistrationId:'REG1',player2RegistrationId:'REG2',
            status:'voided',resultType:'void',originalResultType:'walkover',
            historicalSpecialResultType:'walkover',voidReason:'Correction test',voidedAt:'2026-09-11T10:00:00',
            player1Score:200,player2Score:100,officialSpreadPlayer1:100,resultPolicyVersion:2
        };
        if (!this.validateTarget(pairing,specialVoid).ok) errors.push('Valid same-pairing VOID target was rejected.');
        if (this.validateTarget(pairing,{...specialVoid,pairingId:'PAR-OTHER'}).ok) errors.push('Cross-pairing replacement target was not blocked.');
        if (this.validateTarget(pairing,{...specialVoid,player2Id:'OTHER'}).ok) errors.push('Player-identity mismatch was not blocked.');
        if (this.historicalType(specialVoid) !== 'walkover') errors.push('Historical WALKOVER type was not preserved.');
        if (specialVoid.player1Score !== 200 || specialVoid.player2Score !== 100 || specialVoid.resultPolicyVersion !== 2) {
            errors.push('Frozen historical special-result facts were altered.');
        }

        return {
            ok:errors.length===0,
            errors,
            message:errors.length
                ? `Special Result Correction / Replacement Integrity Self-Test FAILED: ${errors.join(' ')}`
                : 'Special Result Correction / Replacement Integrity Self-Test PASSED: exact-pairing replacement target, single-active-result rule, historical type preservation, and frozen special-result facts are safe. Live tournament data was not modified.'
        };
    }
};


// ============================================================
// PATCH 02.31 — RESULT CORRECTION CHAIN AUDIT / HISTORICAL TRACE VIEW
// Read-only projection. Never mutates competition data.
// ============================================================
const ResultCorrectionTraceService = {
    _isVoid(r) { return !!r && (r.status === 'voided' || r.resultType === 'void'); },
    _type(r) { return ResultCorrectionReplacementIntegrityService.historicalType(r) || r?.resultType || 'normal'; },
    _time(r) { return r?.voidedAt || r?.updatedAt || r?.createdAt || ''; },

    getTrace(pairingId) {
        const pairing = Storage.getById('pairings','pairingId',pairingId);
        if (!pairing) return {ok:false,errors:['Pairing not found.']};
        const all = Storage.find('matchResults',r=>r.pairingId===pairingId);
        const byId = Object.fromEntries(all.map(r=>[r.resultId,r]));
        const active = all.filter(r=>!this._isVoid(r));
        const errors=[];
        if (active.length>1) errors.push('More than one active result exists for this pairing.');

        // Build oldest -> newest correction chain using replacesResultId, then include any legacy orphan history.
        const children={};
        all.forEach(r=>{ if(r.replacesResultId) (children[r.replacesResultId] ||= []).push(r); });
        const roots=all.filter(r=>!r.replacesResultId || !byId[r.replacesResultId]).sort((a,b)=>String(this._time(a)).localeCompare(String(this._time(b))));
        const ordered=[], seen=new Set();
        const walk=r=>{ if(!r||seen.has(r.resultId))return; seen.add(r.resultId); ordered.push(r); (children[r.resultId]||[]).sort((a,b)=>String(this._time(a)).localeCompare(String(this._time(b)))).forEach(walk); };
        roots.forEach(walk); all.filter(r=>!seen.has(r.resultId)).sort((a,b)=>String(this._time(a)).localeCompare(String(this._time(b)))).forEach(walk);

        const resultIds=new Set(all.map(r=>r.resultId));
        const audit=Storage.find('auditLogs',a=>
            a.pairingId===pairingId ||
            (a.entityType==='matchResult' && resultIds.has(a.entityId)) ||
            (a.roundId===pairing.roundId && ['RESULT_VOIDED_FOR_CORRECTION','RESULT_SPECIAL_REPLACEMENT_SUBMITTED','RESULT_SUBMITTED','RESULT_WALKOVER_SUBMITTED','RESULT_FORFEIT_SUBMITTED','RESULT_DOUBLE_WALKOVER_SUBMITTED'].includes(a.eventCode))
        ).sort((a,b)=>String(a.performedAt).localeCompare(String(b.performedAt)));

        const snapshots=Storage.find('standingSnapshots',x=>
            x.divisionId===pairing.divisionId && Number(x.throughRound)>=Number(pairing.roundNumber)
        ).sort((a,b)=>Number(a.throughRound)-Number(b.throughRound) || Number(a.snapshotVersion||1)-Number(b.snapshotVersion||1));

        const chain=ordered.map((r,i)=>({
            sequence:i+1,result:r,resultId:r.resultId,type:this._type(r),status:this._isVoid(r)?'voided':'active',
            score:`${Number(r.player1Score??0)}–${Number(r.player2Score??0)}`,
            officialSpread:Number(r.officialSpreadPlayer1 ?? r.officialSpread ?? 0),
            reason:r.voidReason || r.replacementReason || '',
            replacesResultId:r.replacesResultId || null,
            resultPolicyId:r.resultPolicyId || null,resultPolicyVersion:r.resultPolicyVersion ?? null,
            createdAt:r.createdAt || null,voidedAt:r.voidedAt || null
        }));
        return {ok:errors.length===0,errors,pairing,chain,activeResult:active[0]||null,audit,snapshots};
    },

    inspectDivision(divisionId) {
        const pairings=Storage.find('pairings',p=>p.divisionId===divisionId);
        const traces=pairings.map(p=>this.getTrace(p.pairingId));
        const errors=traces.flatMap(t=>t.errors||[]);
        const correctionTraces=traces.filter(t=>
            (t.chain?.length||0)>1 ||
            t.chain?.some(x=>x.status==='voided' || !!x.replacesResultId)
        );
        return {
            ok:errors.length===0,
            errors,
            pairingsChecked:pairings.length,
            chains:correctionTraces.length,
            correctionPairingIds:correctionTraces.map(t=>t.pairing?.pairingId).filter(Boolean)
        };
    },

    inspectTournament(tournamentId) {
        const divisions=DivisionService.getByTournament(tournamentId);
        const reports=divisions.map(d=>({division:d,report:this.inspectDivision(d.divisionId)}));
        const errors=reports.flatMap(x=>(x.report.errors||[]).map(e=>`${x.division.divisionCode}: ${e}`));
        return {
            ok:errors.length===0,
            errors,
            divisionsChecked:reports.length,
            pairingsChecked:reports.reduce((n,x)=>n+(x.report.pairingsChecked||0),0),
            chains:reports.reduce((n,x)=>n+(x.report.chains||0),0),
            correctionPairingIds:reports.flatMap(x=>x.report.correctionPairingIds||[])
        };
    },

    runSelfTest() {
        const errors=[];
        const sample=[
            {resultId:'R1',resultType:'normal',status:'voided',originalResultType:'normal',player1Score:450,player2Score:400,voidReason:'Correction',createdAt:'2026-09-11T10:00:00',voidedAt:'2026-09-11T10:10:00'},
            {resultId:'R2',resultType:'walkover',status:'locked',replacesResultId:'R1',replacementFromType:'normal',replacementToType:'walkover',player1Score:200,player2Score:100,resultPolicyVersion:2,createdAt:'2026-09-11T10:11:00'}
        ];
        if (this._type(sample[0])!=='normal') errors.push('VOID historical type was not preserved.');
        if (sample[1].replacesResultId!=='R1') errors.push('Replacement link was not preserved.');
        if (sample[0].player1Score!==450 || sample[1].player1Score!==200) errors.push('Frozen historical scores were altered.');
        return {ok:!errors.length,errors,message:errors.length?`Correction Trace Self-Test FAILED: ${errors.join(' ')}`:'Correction Trace Self-Test PASSED: historical type, replacement link, frozen score facts, and read-only trace projection are safe.'};
    }
};

// ============================================================
// PATCH 02.33 — CORRECTION TRANSACTION ATOMICITY / ROLLBACK INTEGRITY
// ============================================================
const CorrectionTransactionAtomicityService = {
    run(label, work, verify=null) {
        const before=Storage.exportAll();
        try {
            const value=work();
            if(value?.errors?.length) throw new Error(value.errors.join(' '));
            const check=verify ? verify(value) : {ok:true};
            if(check===false || check?.ok===false) throw new Error((check?.errors||[`${label} post-commit verification failed.`]).join(' '));
            return {ok:true,value};
        } catch(e) {
            try { Storage.replaceAll(before); }
            catch(rb) { return {ok:false,critical:true,errors:[`CRITICAL: ${label} failed and rollback also failed. Do not continue using this tab. ${rb.message||rb}`]}; }
            return {ok:false,rolledBack:true,errors:[`${label} failed and was rolled back safely: ${e.message||e}`]};
        }
    },
    verifyPairing(pairingId, expectedResultId, replacesResultId=null) {
        const active=Storage.find('matchResults',r=>r.pairingId===pairingId&&r.status!=='voided'&&r.resultType!=='void');
        const errors=[];
        if(active.length!==1) errors.push(`Pairing must have exactly one active result after commit; found ${active.length}.`);
        if(active[0]&&active[0].resultId!==expectedResultId) errors.push('Committed active result is not the newly created result.');
        if(replacesResultId){
            if(active[0]?.replacesResultId!==replacesResultId) errors.push('Replacement link does not target expected VOID predecessor.');
            const old=Storage.getById('matchResults','resultId',replacesResultId);
            if(!old||old.status!=='voided'||old.resultType!=='void') errors.push('VOID predecessor was not preserved as historical data.');
        }
        return {ok:!errors.length,errors};
    },
    inspectDivision(divisionId){
        const ps=Storage.find('pairings',p=>p.divisionId===divisionId&&p.status!=='cancelled');
        const errors=[]; let chains=0,pending=0;
        ps.forEach(p=>{
            const all=Storage.find('matchResults',r=>r.pairingId===p.pairingId);
            const active=all.filter(r=>r.status!=='voided'&&r.resultType!=='void');
            const voids=all.filter(r=>r.status==='voided'||r.resultType==='void');
            if(active.length>1) errors.push(`R${p.roundNumber} T${p.tableNumber}: ${active.length} active results.`);
            if(voids.length){ chains++; if(!active.length) pending++; }
        });
        return {ok:!errors.length,errors,pairingsChecked:ps.length,correctionChains:chains,pendingReplacementChains:pending};
    },
    runSelfTest(){
        const clone=x=>JSON.parse(JSON.stringify(x)), sig=x=>JSON.stringify(x);
        const run=(state,fn)=>{const before=clone(state);try{fn(state);return {ok:true,state};}catch(_){return {ok:false,state:before};}};
        const base={void:{id:'OLD',status:'voided'},active:[],revision:4,round:'results_pending',audit:[]};
        const b=clone(base), before=sig(b);
        const fail=run(b,x=>{x.active.push({id:'NEW',replaces:'OLD'});x.revision++;throw new Error('injected');});
        if(fail.ok||sig(fail.state)!==before) return {ok:false,message:'Rollback self-test failed: injected failure left partial state.'};
        const pass=run(clone(base),x=>{x.active.push({id:'NEW',replaces:'OLD'});x.revision++;x.round='completed';x.audit.push('REPLACEMENT');});
        if(!pass.ok||pass.state.active.length!==1||pass.state.revision!==5||pass.state.round!=='completed'||pass.state.audit.length!==1) return {ok:false,message:'Commit self-test failed.'};
        return {ok:true,message:'Correction Transaction Atomicity Self-Test PASSED: injected mid-transaction failure restores the exact pre-state; successful replacement commits result + revision + round recovery + audit as one unit. Live tournament data was not modified.'};
    }
};

        const r={
            resultId:Utils.generateId('RES'),tournamentId:pairing.tournamentId,divisionId:pairing.divisionId,roundId:pairing.roundId,pairingId:pairing.pairingId,
            roundNumber:pairing.roundNumber,tableNumber:pairing.tableNumber,player1RegistrationId:pairing.player1RegistrationId,player1Id:pairing.player1Id,
            player2RegistrationId:pairing.player2RegistrationId,player2Id:pairing.player2Id,...exec.execution,
            specialResultReason:reason,status:'completed',submittedAt:Utils.now(),submittedBy:'admin',updatedAt:Utils.now(),updatedBy:'admin',
            replacesResultId:replacementMeta.replacesResultId,replacementReason:replacementMeta.replacementReason,
            replacementFromType:replacementMeta.replacementFromType,replacementToType:replacementMeta.replacementToType,
            correctionChainVersion:replacementMeta.correctionChainVersion
        };
        const tx=CorrectionTransactionAtomicityService.run(prior?'Special result replacement transaction':'Special result submission transaction',()=>{
            Storage.insert('matchResults',r);
            const div=DivisionService.getById(pairing.divisionId); if(!div) throw new Error('Division not found while committing special result.');
            Storage.update('divisions','divisionId',pairing.divisionId,{resultRevision:(div.resultRevision||0)+1});
            RoundResultCompletenessRecovery.recoverRound(pairing.roundId);
            AuditService.log({tournamentId:r.tournamentId,divisionId:r.divisionId,roundId:r.roundId,entityType:'matchResult',entityId:r.resultId,action:'create',eventCode:prior?'RESULT_SPECIAL_REPLACEMENT_SUBMITTED':(r.resultType==='walkover'?'RESULT_WALKOVER_SUBMITTED':(r.resultType==='double_walkover'?'RESULT_DOUBLE_WALKOVER_SUBMITTED':'RESULT_FORFEIT_SUBMITTED')),after:r,reason:prior?`Replacement ${String(replacementMeta.replacementFromType||'result').toUpperCase()} → ${String(r.resultType).toUpperCase()} for voided result ${prior.resultId}. ${reason}`:reason});
            return r;
        },()=>CorrectionTransactionAtomicityService.verifyPairing(pairing.pairingId,r.resultId,prior?.resultId||null));
        if(!tx.ok) return {errors:tx.errors};
        return {data:r,transactionAtomicity:'committed'};
    },
    voidResult(resultId, reason) {
        const before = Storage.getById('matchResults', 'resultId', resultId);
        const round = before ? RoundService.getById(before.roundId) : null;
        const tournament = before ? TournamentService.getById(before.tournamentId) : null;

        const guard = ResultVoidGuard.inspect(before, round, reason, tournament);
        if (!guard.ok) return { errors: guard.errors };

        const backup = Storage.exportAll();
        try {
            const voidedAt = Utils.now();
            const after = Storage.update('matchResults', 'resultId', resultId, {
                status: 'voided',
                // Patch 02.27 — preserve what this historical record WAS before VOID.
                // resultType remains 'void' so every existing active-result filter stays safe.
                originalResultType: before.originalResultType || before.resultType || 'normal',
                originalStatus: before.originalStatus || before.status || 'completed',
                historicalSpecialResultType: ['walkover','forfeit','double_walkover'].includes(before.resultType)
                    ? before.resultType
                    : (before.historicalSpecialResultType || null),
                status: 'voided',
                resultType: 'void',
                voidReason: reason.trim(),
                voidedAt,
                voidedBy: 'admin',
                updatedAt: voidedAt,
                updatedBy: 'admin'
            });

            const div = DivisionService.getById(before.divisionId);
            if (!div) throw new Error('Division not found while voiding result.');
            Storage.update('divisions', 'divisionId', before.divisionId, {
                resultRevision: (div.resultRevision || 0) + 1
            });

            // A void removes one valid result from the round. The round must therefore
            // stop claiming completion until a replacement result is entered.
            if (round.status === 'completed') {
                RoundService.updateStatus(round.roundId, 'results_pending');
            }

            AuditService.log({
                tournamentId: before.tournamentId,
                divisionId: before.divisionId,
                roundId: before.roundId,
                entityType: 'matchResult',
                entityId: resultId,
                action: 'void',
                eventCode: 'RESULT_VOIDED_FOR_CORRECTION',
                before,
                after,
                reason: reason.trim()
            });

            return {
                data: after,
                roundStatus: RoundService.getById(before.roundId)?.status || round.status
            };
        } catch (e) {
            try {
                Storage.replaceAll(backup);
            } catch (rollbackError) {
                return {
                    errors: [
                        `CRITICAL: Result void failed and automatic rollback also failed. Do not continue using this tab. ${rollbackError.message || rollbackError}`
                    ]
                };
            }
            return {
                errors: [`Result void failed and was rolled back safely: ${e.message || e}`]
            };
        }
    },
    getByRound(roundId) {
        return Storage.find(
            'matchResults',
            m => m.roundId === roundId && m.status !== 'voided' && m.resultType !== 'void'
        );
    }
};


// ============================================================
// PATCH 02.27 — WALKOVER / FORFEIT HISTORICAL CORRECTION INTEGRITY
// Locked special results must follow the same historical correction chain:
// unlock -> void(reason) -> replacement -> re-lock -> new official snapshot.
// VOID history is never deleted. The old special-result identity and frozen
// ResultPolicy metadata remain inspectable after correction.
// ============================================================
const SpecialResultHistoricalCorrectionIntegrityService = {
    specialTypes: Object.freeze(['walkover','forfeit','double_walkover']),

    historicalType(result) {
        if (!result) return null;
        if (this.specialTypes.includes(result.resultType)) return result.resultType;
        if (this.specialTypes.includes(result.historicalSpecialResultType)) return result.historicalSpecialResultType;
        if (this.specialTypes.includes(result.originalResultType)) return result.originalResultType;
        return null;
    },

    inspectDivision(divisionId) {
        const results = Storage.find('matchResults', r => r.divisionId === divisionId);
        const errors = [];
        const warnings = [];
        const voidedSpecial = results.filter(r =>
            (r.status === 'voided' || r.resultType === 'void') &&
            !!this.historicalType(r)
        );
        const activeSpecial = results.filter(r =>
            r.status !== 'voided' &&
            r.resultType !== 'void' &&
            this.specialTypes.includes(r.resultType)
        );

        // Every active replacement that points backward must point to a preserved VOID.
        activeSpecial.forEach(r => {
            if (!r.replacesResultId) return;
            const prior = results.find(x => x.resultId === r.replacesResultId);
            if (!prior) {
                errors.push(`${r.resultId}: replacesResultId points to a missing historical result.`);
                return;
            }
            if (!(prior.status === 'voided' || prior.resultType === 'void')) {
                errors.push(`${r.resultId}: replacement target is not VOIDED.`);
            }
        });

        // A preserved special VOID should still carry frozen historical semantics.
        voidedSpecial.forEach(r => {
            const type = this.historicalType(r);
            if (!type) errors.push(`${r.resultId}: historical special-result type was lost.`);
            if (!r.voidReason?.trim()) errors.push(`${r.resultId}: VOID reason is missing.`);
            if (!r.voidedAt) warnings.push(`${r.resultId}: legacy special VOID has no voidedAt timestamp.`);
            if (r.resultPolicyVersion == null) warnings.push(`${r.resultId}: legacy special VOID has no frozen ResultPolicy version.`);
        });

        // Never allow two active results for one pairing after correction.
        const activeByPairing = new Map();
        results.filter(r => r.status !== 'voided' && r.resultType !== 'void').forEach(r => {
            const list = activeByPairing.get(r.pairingId) || [];
            list.push(r);
            activeByPairing.set(r.pairingId, list);
        });
        activeByPairing.forEach((items, pairingId) => {
            if (items.length > 1) errors.push(`${pairingId}: duplicate active results after historical correction.`);
        });

        return {
            ok: errors.length === 0,
            errors,
            warnings,
            activeSpecialCount: activeSpecial.length,
            voidedSpecialCount: voidedSpecial.length
        };
    },

    runSelfTest() {
        const errors = [];

        const oldWalkover = {
            resultId:'RES-W1', pairingId:'PAR-1',
            status:'voided', resultType:'void',
            originalResultType:'walkover',
            historicalSpecialResultType:'walkover',
            voidReason:'Player actually arrived',
            voidedAt:'2026-09-11T10:00:00',
            resultPolicyId:'RP-1', resultPolicyVersion:1,
            player1Score:100, player2Score:0,
            officialSpreadPlayer1:100, officialSpreadPlayer2:-100
        };
        if (this.historicalType(oldWalkover) !== 'walkover') {
            errors.push('VOIDED WALKOVER lost its historical result identity.');
        }

        const oldForfeit = {
            ...oldWalkover,
            resultId:'RES-F1',
            originalResultType:'forfeit',
            historicalSpecialResultType:'forfeit',
            player1Score:410, player2Score:300,
            officialSpreadPlayer1:110, officialSpreadPlayer2:-110
        };
        if (this.historicalType(oldForfeit) !== 'forfeit') {
            errors.push('VOIDED FORFEIT lost its historical result identity.');
        }

        // Replacement linkage may change result type: special -> normal, normal -> special,
        // or special -> another special. The historical record remains separate.
        const replacement = {
            resultId:'RES-R2', pairingId:'PAR-1',
            status:'completed', resultType:'normal',
            replacesResultId:'RES-W1'
        };
        if (replacement.replacesResultId !== oldWalkover.resultId) {
            errors.push('Replacement chain did not preserve replacesResultId.');
        }

        // Frozen special scoring facts must survive VOID unchanged.
        if (oldWalkover.player1Score !== 100 ||
            oldWalkover.player2Score !== 0 ||
            oldWalkover.officialSpreadPlayer1 !== 100 ||
            oldForfeit.player1Score !== 410 ||
            oldForfeit.player2Score !== 300 ||
            oldForfeit.officialSpreadPlayer1 !== 110) {
            errors.push('VOID mutation rewrote frozen special-result scoring facts.');
        }

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Special Result Historical Correction Self-Test FAILED: ${errors.join(' ')}`
                : 'Special Result Historical Correction Self-Test PASSED: WALKOVER/FORFEIT identity, frozen scoring facts, VOID preservation, and replacement linkage are safe. Live tournament data was not modified.'
        };
    }
};

const StandingSnapshotThroughRoundGuard = {
    runSelfTest() {
        const rounds = [
            { roundId:'R1', roundNumber:1 },
            { roundId:'R2', roundNumber:2 },
            { roundId:'R3', roundNumber:3 },
            { roundId:'R4', roundNumber:4 }
        ];
        const results = [
            { resultId:'A', roundId:'R1' },
            { resultId:'B', roundId:'R2' },
            { resultId:'C', roundId:'R3' },
            { resultId:'D', roundId:'R4' }
        ];
        const throughRound = 3;
        const allowed = new Set(rounds.filter(r => Number(r.roundNumber) <= throughRound).map(r => r.roundId));
        const scoped = results.filter(r => allowed.has(r.roundId));
        const errors = [];

        if (scoped.map(r => r.resultId).join(',') !== 'A,B,C') {
            errors.push('Historical standing scope did not stop at throughRound.');
        }
        if (scoped.some(r => r.roundId === 'R4')) {
            errors.push('Future-round result leaked into historical standing.');
        }

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Through-Round Self-Test FAILED: ${errors.join(' ')}`
                : 'Through-Round Self-Test PASSED: historical standings exclude every result after the requested round.'
        };
    }
};

const StandingSnapshotIntegrityService = {
    inspect(divisionId) {
        const snapshots = Storage.find('standingSnapshots', s => s.divisionId === divisionId);
        const groups = new Map();
        snapshots.forEach(s => {
            const round = Number(s.throughRound);
            if (!groups.has(round)) groups.set(round, []);
            groups.get(round).push(s);
        });

        const errors = [];
        const warnings = [];

        groups.forEach((items, round) => {
            const versions = items.map(s => Number(s.snapshotVersion || 1));
            const current = items.filter(s => s.status === 'current');

            if (new Set(versions).size !== versions.length) {
                errors.push(`Round ${round}: duplicate snapshotVersion detected.`);
            }
            if (current.length > 1) {
                errors.push(`Round ${round}: more than one CURRENT official snapshot.`);
            }
            if (current.length === 1) {
                const maxVersion = Math.max(...versions);
                const currentVersion = Number(current[0].snapshotVersion || 1);
                if (currentVersion !== maxVersion) {
                    errors.push(`Round ${round}: CURRENT snapshot is not the highest version.`);
                }
            }
            if (current.length === 0 && items.length) {
                warnings.push(`Round ${round}: no CURRENT official snapshot.`);
            }
        });

        return {
            ok: errors.length === 0,
            errors,
            warnings,
            snapshotCount: snapshots.length,
            roundCount: groups.size
        };
    },

    runSelfTest() {
        const errors = [];

        // Simulate R3 v1 -> corrected results -> R3 v2.
        const sample = [
            { snapshotId:'S1', throughRound:3, snapshotVersion:1, sourceResultRevision:7, status:'superseded' },
            { snapshotId:'S2', throughRound:3, snapshotVersion:2, sourceResultRevision:8, status:'current' },
            { snapshotId:'S3', throughRound:2, snapshotVersion:1, sourceResultRevision:5, status:'current' }
        ];

        const inspectPure = (items) => {
            const grouped = new Map();
            items.forEach(s => {
                const r = Number(s.throughRound);
                if (!grouped.has(r)) grouped.set(r, []);
                grouped.get(r).push(s);
            });
            const e = [];
            grouped.forEach((arr, round) => {
                const versions = arr.map(s => Number(s.snapshotVersion || 1));
                const current = arr.filter(s => s.status === 'current');
                if (new Set(versions).size !== versions.length) e.push(`R${round} duplicate version`);
                if (current.length > 1) e.push(`R${round} multiple current`);
                if (current.length === 1 && Number(current[0].snapshotVersion || 1) !== Math.max(...versions)) {
                    e.push(`R${round} current is not latest`);
                }
            });
            return e;
        };

        if (inspectPure(sample).length) errors.push('Valid version chain was rejected.');

        const bad = sample.concat([
            { snapshotId:'S4', throughRound:3, snapshotVersion:3, sourceResultRevision:9, status:'current' }
        ]);
        if (!inspectPure(bad).some(x => x.includes('multiple current'))) {
            errors.push('Multiple-current corruption was not detected.');
        }

        const existingVersions = sample.filter(s => s.throughRound === 3).map(s => Number(s.snapshotVersion || 1));
        const nextVersion = existingVersions.length ? Math.max(...existingVersions) + 1 : 1;
        if (nextVersion !== 3) errors.push('Next snapshot version was not calculated sequentially.');

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Snapshot Integrity Self-Test FAILED: ${errors.join(' ')}`
                : 'Snapshot Integrity Self-Test PASSED: versions advance sequentially, one CURRENT snapshot is enforced per round, and duplicate-current corruption is detected.'
        };
    }
};


const LegacySnapshotVersionNormalizer = {
    _recoveryKey: STORAGE_KEY + '_pre_snapshot_normalization',

    _timeValue(snapshot) {
        const raw = snapshot.calculatedAt || snapshot.createdAt || snapshot.updatedAt || '';
        const t = Date.parse(raw);
        return Number.isFinite(t) ? t : 0;
    },

    _needsNormalization(items) {
        if (!items.length) return false;
        const versions = items.map(s => {
            const v = Number(s.snapshotVersion);
            return Number.isInteger(v) && v > 0 ? v : null;
        });
        const hasMissing = versions.some(v => v === null);
        const numeric = versions.filter(v => v !== null);
        const hasDuplicate = new Set(numeric).size !== numeric.length;
        const current = items.filter(s => s.status === 'current');
        const currentProblem = current.length !== 1;
        const highestProblem = current.length === 1 && numeric.length === items.length &&
            Number(current[0].snapshotVersion) !== Math.max(...numeric);
        return hasMissing || hasDuplicate || currentProblem || highestProblem;
    },

    inspect(divisionId = null) {
        const snapshots = Storage.find('standingSnapshots', s => !divisionId || s.divisionId === divisionId);
        const groups = new Map();
        snapshots.forEach(s => {
            const key = `${s.divisionId}::${Number(s.throughRound)}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(s);
        });
        const affected = [];
        groups.forEach((items, key) => {
            if (this._needsNormalization(items)) {
                affected.push({
                    key,
                    divisionId: items[0]?.divisionId || null,
                    tournamentId: items[0]?.tournamentId || null,
                    throughRound: Number(items[0]?.throughRound),
                    snapshotCount: items.length
                });
            }
        });
        return { needed: affected.length > 0, affectedGroups: affected, affectedCount: affected.length };
    },

    normalizeAll() {
        const before = Storage.exportAll();
        const scan = this.inspect();
        if (!scan.needed) {
            return { ok: true, changed: false, affectedCount: 0, message: 'No legacy snapshot normalization is required.' };
        }

        // A dedicated full-database recovery copy is mandatory before touching legacy metadata.
        try {
            localStorage.setItem(this._recoveryKey, JSON.stringify({
                createdAt: Utils.now(),
                source: 'PRE_LEGACY_SNAPSHOT_NORMALIZATION',
                data: before
            }));
        } catch (e) {
            throw new Error('Legacy snapshot normalization cancelled: recovery copy could not be saved. Live data was not changed.');
        }

        const working = Utils.deepClone(before);
        const groups = new Map();
        (working.standingSnapshots || []).forEach((s, index) => {
            const key = `${s.divisionId}::${Number(s.throughRound)}`;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push({ s, index });
        });

        const auditItems = [];
        groups.forEach((entries) => {
            const items = entries.map(x => x.s);
            if (!this._needsNormalization(items)) return;

            // Preserve chronology. Existing timestamps are authoritative; original storage
            // order is the deterministic fallback for legacy records with equal/no timestamps.
            entries.sort((a, b) => {
                const ta = this._timeValue(a.s);
                const tb = this._timeValue(b.s);
                if (ta !== tb) return ta - tb;
                return a.index - b.index;
            });

            entries.forEach((entry, i) => {
                const s = entry.s;
                const previous = i > 0 ? entries[i - 1].s : null;
                const next = i < entries.length - 1 ? entries[i + 1].s : null;
                s.snapshotVersion = i + 1;
                s.status = i === entries.length - 1 ? 'current' : 'superseded';
                s.supersedesSnapshotId = previous?.snapshotId || null;
                if (next) {
                    s.supersededBySnapshotId = next.snapshotId;
                    s.supersededAt = next.calculatedAt || next.createdAt || s.supersededAt || Utils.now();
                } else {
                    s.supersededBySnapshotId = null;
                    if (s.status === 'current') delete s.supersededAt;
                }
            });

            const last = entries[entries.length - 1].s;
            auditItems.push({
                tournamentId: last.tournamentId || null,
                divisionId: last.divisionId || null,
                throughRound: Number(last.throughRound),
                snapshotCount: entries.length,
                currentSnapshotId: last.snapshotId
            });
        });

        // Validate the candidate database BEFORE replacing live Storage.
        const candidateGroups = new Map();
        (working.standingSnapshots || []).forEach(s => {
            const key = `${s.divisionId}::${Number(s.throughRound)}`;
            if (!candidateGroups.has(key)) candidateGroups.set(key, []);
            candidateGroups.get(key).push(s);
        });
        const candidateErrors = [];
        candidateGroups.forEach((items, key) => {
            const versions = items.map(s => Number(s.snapshotVersion));
            const current = items.filter(s => s.status === 'current');
            if (new Set(versions).size !== versions.length) candidateErrors.push(`${key}: duplicate version`);
            if (current.length !== 1) candidateErrors.push(`${key}: expected exactly one CURRENT`);
            if (current.length === 1 && Number(current[0].snapshotVersion) !== Math.max(...versions)) {
                candidateErrors.push(`${key}: CURRENT is not latest`);
            }
        });
        if (candidateErrors.length) {
            throw new Error(`Legacy snapshot normalization cancelled during candidate validation: ${candidateErrors.join('; ')}. Live data was not changed.`);
        }

        try {
            Storage.replaceAll(working);

            // Validate persisted/live data after the single replacement.
            const divisions = [...new Set(auditItems.map(x => x.divisionId).filter(Boolean))];
            const liveErrors = [];
            divisions.forEach(id => {
                const check = StandingSnapshotIntegrityService.inspect(id);
                if (!check.ok) liveErrors.push(...check.errors.map(e => `${id}: ${e}`));
            });
