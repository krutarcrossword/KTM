// ============================================================
// PATCH 02.36 — GIBSON DECISION PROVENANCE / AUDIT INTEGRITY
// Manager remains the decision-maker. This layer verifies that every Gibson
// BYE has explicit provenance, required reason, optional clinch proof only when
// auto-detected, and a durable audit trail. It is read-only except for the
// explicit audit event written at pairing confirmation.
// ============================================================
const GibsonDecisionProvenanceService = {
    _byeReason(p){ return p?.byeReason || p?.engineMetadata?.byeReason || null; },
    _source(p){ return p?.assignmentSource || p?.engineMetadata?.assignmentSource || null; },
    _reason(p){ return p?.gibsonizationReason || p?.engineMetadata?.gibsonizationReason || ''; },
    _proof(p){ return p?.engineMetadata?.clinchProof || null; },
    _isGibson(p){ return p?.pairingType==='bye' && this._byeReason(p)==='gibson'; },
    inspectRound(roundId){
        const round=RoundService.getById(roundId);
        if(!round) return {ok:false,errors:['Round not found.'],warnings:[],summary:null};
        const pairings=Storage.find('pairings',p=>p.roundId===roundId && p.status!=='voided');
        const gibsons=pairings.filter(p=>this._isGibson(p));
        const ordinary=pairings.filter(p=>p.pairingType==='bye' && !this._isGibson(p));
        const errors=[],warnings=[];
        const playerIds=new Set();
        gibsons.forEach(p=>{
            const source=this._source(p), reason=String(this._reason(p)||'').trim(), proof=this._proof(p);
            if(!p.player1Id || !p.player1RegistrationId) errors.push(`Gibson BYE Table ${p.tableNumber}: missing player identity.`);
            if(playerIds.has(p.player1Id)) errors.push(`Player ${p.player1Id} has duplicate Gibson BYE records in this round.`);
            playerIds.add(p.player1Id);
            if(!reason) errors.push(`Gibson BYE Table ${p.tableNumber}: manager reason is missing.`);
            if(!['koth_gibson_manual','koth_gibson_auto_confirmed'].includes(source)) errors.push(`Gibson BYE Table ${p.tableNumber}: unknown assignment source ${source||'—'}.`);
            if(source==='koth_gibson_auto_confirmed'){
                if(!proof) errors.push(`Gibson BYE Table ${p.tableNumber}: auto-confirmed decision is missing clinch proof.`);
                else if(!(proof.guaranteedTop2 || Number(proof.securedRank)<=Number(proof.qualificationCutoffRank||2))) errors.push(`Gibson BYE Table ${p.tableNumber}: stored clinch proof does not establish Top-2 safety.`);
            }
            if(source==='koth_gibson_manual' && proof) warnings.push(`Gibson BYE Table ${p.tableNumber}: manual assignment also carries a clinch proof; allowed but not required.`);
        });
        const overlap=ordinary.filter(p=>playerIds.has(p.player1Id));
        if(overlap.length) errors.push('A Gibsonized player also received an ordinary BYE in the same round.');
        const audits=Storage.find('auditLogs',a=>a.roundId===roundId && a.eventCode==='GIBSON_DECISION_CONFIRMED');
        if(gibsons.length && !audits.length) warnings.push('Legacy Gibson round has no dedicated GIBSON_DECISION_CONFIRMED audit event. Pairing metadata remains inspectable.');
        const summary={roundNumber:round.roundNumber,gibsonCount:gibsons.length,ordinaryByeCount:ordinary.length,auditCount:audits.length};
        return {ok:errors.length===0,errors,warnings,summary,gibsons,ordinary,audits};
    },
    inspectDivision(divisionId){
        const rounds=Storage.find('rounds',r=>r.divisionId===divisionId).sort((a,b)=>Number(a.roundNumber)-Number(b.roundNumber));
        const errors=[],warnings=[],checks=[];
        rounds.forEach(r=>{
            const x=this.inspectRound(r.roundId);
            if((x.summary?.gibsonCount||0)>0){
                checks.push(x.summary);
                errors.push(...x.errors.map(e=>`R${r.roundNumber}: ${e}`));
                warnings.push(...x.warnings.map(w=>`R${r.roundNumber}: ${w}`));
            }
        });
        return {ok:errors.length===0,errors,warnings,checks};
    },
    runSelfTest(){
        const errors=[];
        const mk=(o={})=>({pairingType:'bye',player1Id:'P1',player1RegistrationId:'R1',tableNumber:1,byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Manager decision',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Manager decision'},...o});
        const validManual=mk();
        if(this._source(validManual)!=='koth_gibson_manual' || !this._reason(validManual)) errors.push('Manual Gibson provenance projection failed.');
        const auto=mk({assignmentSource:'koth_gibson_auto_confirmed',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_auto_confirmed',gibsonizationReason:'Top-2 proof reviewed',clinchProof:{securedRank:2,qualificationCutoffRank:2,guaranteedTop2:true}}});
        if(!this._proof(auto)?.guaranteedTop2) errors.push('Automatic clinch proof projection failed.');
        const bad=mk({gibsonizationReason:'',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:''}});
        if(String(this._reason(bad)||'').trim()) errors.push('Missing-reason guard failed.');
        return {ok:errors.length===0,errors,message:errors.length?`Gibson Decision Provenance Self-Test FAILED: ${errors.join(' ')}`:'Gibson Decision Provenance Self-Test PASSED: manual/auto-confirmed sources, manager reason, Top-2 proof provenance, and dual-BYE separation rules are represented without auto-awarding a Gibson BYE.'};
    }
};

// ============================================================
// PATCH 02.41.1 — MANUAL SWAP AUDIT HISTORY
// Every preview-only player swap is accumulated in memory and, only after
// the exact proposal is successfully confirmed, written as its own audit
// event. This keeps the audit trail complete without recording abandoned
// previews as official tournament history.
// ============================================================
const PairingManualSwapAuditService = {
    makeRecord(swapped, divisionId, sequence=1) {
        if (!swapped) return null;
        return {
            sequence:Number(sequence)||1,
            tableA:Number(swapped.tableA),
            tableB:Number(swapped.tableB),
            playerAId:swapped.playerAId || '',
            playerBId:swapped.playerBId || '',
            playerALabel:TournamentPlayerDisplayService.resolveByPlayerId(divisionId, swapped.playerAId).displayLabel,
            playerBLabel:TournamentPlayerDisplayService.resolveByPlayerId(divisionId, swapped.playerBId).displayLabel,
            appliedAt:Utils.now()
        };
    },
    summary(history=[]) {
        return (history || []).map((h,i) =>
            `#${i+1} T${h.tableA}↔T${h.tableB}: ${h.playerALabel || h.playerAId} ↔ ${h.playerBLabel || h.playerBId}`
        ).join(' | ');
    },
    confirmationReason(userReason='', history=[]) {
        const manualSummary=this.summary(history);
        const reason=String(userReason || '').trim();
        if (!manualSummary) return reason;
        if (!reason || reason.startsWith('Partial manual pairing swap:')) return `Partial manual pairing swaps (${history.length}): ${manualSummary}`;
        return `${reason} | Partial manual pairing swaps (${history.length}): ${manualSummary}`;
    },
    logConfirmed(history, context) {
        const rows=Array.isArray(history) ? history : [];
        rows.forEach((h,i) => {
            AuditService.log({
                tournamentId:context.tournament.tournamentId,
                divisionId:context.division.divisionId,
                roundId:context.round.roundId,
                entityType:'pairing',
                entityId:context.round.roundId,
                action:'manual_swap',
                eventCode:'PAIRING_MANUAL_SWAP_CONFIRMED',
                reason:`Manual swap #${i+1}: T${h.tableA} ↔ T${h.tableB} — ${h.playerALabel || h.playerAId} ↔ ${h.playerBLabel || h.playerBId}`,
                before:{
                    sequence:i+1,
                    tableA:h.tableA, tableB:h.tableB,
                    playerAId:h.playerAId, playerBId:h.playerBId,
                    playerALabel:h.playerALabel, playerBLabel:h.playerBLabel
                },
                after:{
                    confirmed:true,
                    exactPreview:true,
                    appliedAt:h.appliedAt || null
                }
            });
        });
        return {count:rows.length};
    },
    runSelfTest() {
        const errors=[];
        const history=[
            {tableA:1,tableB:2,playerAId:'A',playerBId:'B',playerALabel:'A',playerBLabel:'B'},
            {tableA:6,tableB:10,playerAId:'C',playerBId:'D',playerALabel:'C',playerBLabel:'D'}
        ];
        const s=this.summary(history);
        if (!s.includes('#1 T1↔T2') || !s.includes('#2 T6↔T10')) errors.push('Multi-swap summary lost one or more swaps.');
        const r=this.confirmationReason('',history);
        if (!r.includes('swaps (2)') || !r.includes('T6↔T10')) errors.push('Confirmation reason did not preserve the complete swap history.');
        const custom=this.confirmationReason('Manager adjustment',history);
        if (!custom.startsWith('Manager adjustment | ') || !custom.includes('T1↔T2') || !custom.includes('T6↔T10')) errors.push('Custom reason was not preserved alongside swap history.');
        return {ok:errors.length===0,errors,message:errors.length?`Manual Swap Audit Self-Test FAILED: ${errors.join(' ')}`:'Manual Swap Audit Self-Test PASSED: multiple manual swaps are retained in order, combined into confirmation context, and are ready for one audit event per confirmed swap.'};
    }
};

const PairingConfirmationService = {
    confirm(proposal, context, overrideReason='') {
        const activeGuard = TournamentCompletionService.requireActive(context?.tournament?.tournamentId, 'Confirm Pairings');
        if (activeGuard.errors) return { errors:activeGuard.errors, warnings:[] };
        const checked = PairingValidationService.validate(proposal, context);
        if (!checked.valid) return { errors: checked.errors, warnings: checked.warnings };
        const saved = proposal.pairings.map((p,i) => PairingService.create({ ...p, tournamentId:context.tournament.tournamentId, divisionId:context.division.divisionId, roundId:context.round.roundId, roundNumber:context.round.roundNumber, tableNumber:p.tableNumber, generatedMethod:proposal.engine, generatedBy:'system', engineMetadata:{...(proposal.metadata||{}), ...(p.engineMetadata||{}), engine:proposal.engine, standingInputSnapshotId:context.standingSnapshot?.snapshotId || null}, notes:p.notes||'' }));
        const saveErrors = saved.filter(x=>x.errors).flatMap(x=>x.errors);
        if (saveErrors.length) return { errors: saveErrors };
        PairingService.confirmAll(context.round.roundId);
        AuditService.log({tournamentId:context.tournament.tournamentId,divisionId:context.division.divisionId,roundId:context.round.roundId,entityType:'pairing',entityId:context.round.roundId,action:'confirm',eventCode:'PAIRING_CONFIRMED',reason:overrideReason});
        const savedPairings=saved.map(x=>x.data).filter(Boolean);
        const gibsonPairings=savedPairings.filter(p=>GibsonDecisionProvenanceService._isGibson(p));
        if(gibsonPairings.length){
            const ordinaryByeCount=savedPairings.filter(p=>p.pairingType==='bye' && !GibsonDecisionProvenanceService._isGibson(p)).length;
            const after={
                gibsonPlayerIds:gibsonPairings.map(p=>p.player1Id),
                gibsonRegistrationIds:gibsonPairings.map(p=>p.player1RegistrationId),
                assignmentSources:gibsonPairings.map(p=>GibsonDecisionProvenanceService._source(p)),
                proofBackedCount:gibsonPairings.filter(p=>!!GibsonDecisionProvenanceService._proof(p)).length,
                ordinaryByeCount
            };
            AuditService.log({tournamentId:context.tournament.tournamentId,divisionId:context.division.divisionId,roundId:context.round.roundId,entityType:'pairing',entityId:context.round.roundId,action:'gibson_decision_confirmed',eventCode:'GIBSON_DECISION_CONFIRMED',after,reason:overrideReason||gibsonPairings.map(p=>GibsonDecisionProvenanceService._reason(p)).filter(Boolean).join(' | ')});
        }
        return { data:savedPairings, warnings:checked.warnings };
    }
};

        };

    clean(value) { return value == null ? '' : String(value).trim(); },
    read(file, headerRow = 1, sheetName) {
        return file.arrayBuffer().then(buffer => {
            const workbook = XLSX.read(buffer, { type: 'array', cellDates: false });
            const sheet = workbook.Sheets[sheetName || workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            const headers = rows[(Math.max(1, headerRow) - 1)] || [];
            const normalizedHeaders = headers.map(h => this.normalizeHeader(h));
            console.debug('Excel raw worksheet headers:', headers);
            console.debug('Excel normalized headers:', normalizedHeaders);
            console.debug('Excel current mapper keys:', PLAYER_FIELDS);
            const mapping = headers.map(h => this.fieldForHeader(h));
            const data = rows.slice(Math.max(1, headerRow)).map((row, index) => {
                const player = {}; mapping.forEach((field, i) => { if (field) player[field] = this.clean(row[i]); });
                if (index === 0) console.debug('Excel parsed row 2 before validation:', player);
                if (!Object.values(player).some(Boolean)) return null;
                player.currentRating = player.currentRating === '' || player.currentRating == null ? null : Number(player.currentRating);
                player.thaiName = String(player.thaiName || '').trim();

                } else {
                    player.firstName = '';

                }
                const thaiParts = player.thaiName.split(/\s+/);
                player.firstNameTh = thaiParts.shift() || '';
                player.lastNameTh = thaiParts.join(' ');
                return { rowNumber: index + Math.max(1, headerRow) + 1, player };

        const themeLabel = document.getElementById('theme-label');

        try { localStorage.setItem('krutar_test_mode', this.testMode ? '1' : '0'); } catch (_) {}
        this.syncStaticChromeLanguage();
        this.applyTestModeVisibility();
    },

    isTestControl(el) {
        if (!el || el.tagName !== 'BUTTON') return false;
        const onclick = String(el.getAttribute('onclick') || '');
        const label = String(el.textContent || '').trim();

        // RC2.1: Standing has two maintenance actions living inside diagnostic
        // cards alongside Self-Test buttons. Treat those actions as Test Mode UI
        // too, so the whole maintenance card disappears when Test Mode is OFF.
        const maintenanceOnly =
            onclick.includes('normalizeLegacySnapshots') ||
            onclick.includes('repairLegacySnapshotLinks');

        return maintenanceOnly ||
            onclick.includes('SelfTest') ||
            /\bSelf[- ]?Test\b/i.test(label) ||
            /\bLive Test\b/i.test(label);
    },

    applyTestModeVisibility() {
        const roots = [
            document.getElementById('content'),
            document.getElementById('modal-container')
        ].filter(Boolean);

        roots.forEach(root => {
            // Reset previous Test Mode visibility decisions in this root.
            root.querySelectorAll('.krutar-test-ui-hidden').forEach(el => {
                el.classList.remove('krutar-test-ui-hidden');
            });

            // RC5.10.1: explicit Test Mode-only elements work in both page content
            // and modals. RC5.10 added these markers to the Division form.
            root.querySelectorAll('.krutar-test-only').forEach(el => {
                if (!this.testMode) el.classList.add('krutar-test-ui-hidden');
            });

            // Preserve the existing automatic detector for legacy Self-Test /
            // maintenance buttons that do not yet carry .krutar-test-only.
            const testButtons = Array.from(root.querySelectorAll('button')).filter(btn => this.isTestControl(btn));
            const targets = new Set();

            testButtons.forEach(btn => {
                // Explicitly-marked blocks are already handled above.
                const explicit = btn.closest('.krutar-test-only');
                if (explicit) {
                    targets.add(explicit);
                    return;
                }

                let node = btn;
                let best = btn;

                while (node && node.parentElement && node.parentElement !== root) {
                    const parent = node.parentElement;
                    const formControls = parent.querySelectorAll('input,select,textarea');
                    const buttons = Array.from(parent.querySelectorAll('button'));
                    const links = parent.querySelectorAll('a[href]');
                    const onlyTestButtons = buttons.length > 0 && buttons.every(b => this.isTestControl(b));

                    if (formControls.length === 0 && links.length === 0 && onlyTestButtons) {
                        best = parent;
                        node = parent;
                        continue;
                    }
                    break;
                }
                targets.add(best);
            });

            if (!this.testMode) {
                targets.forEach(el => el.classList.add('krutar-test-ui-hidden'));
            }
        });
    },

    toggleLang() {
        this.lang = this.lang === 'th' ? 'en' : 'th';

    // ========================================================
    // PATCH 02.12.4 — TOURNAMENT SELECTION STATE
    // Tournament is the application context. Dashboard and all
    // tournament-scoped pages must honor this selection instead
    // of silently falling back to tournaments[0].
    // ========================================================
    _selectionStorageKey: 'krutar_current_tournament_id',

    setTournamentContext(tournamentId, options = {}) {
        const tournament = tournamentId ? TournamentService.getById(tournamentId) : null;
        if (tournamentId && !tournament) return { errors:['Tournament not found'] };

        const changed = this.currentTournamentId !== (tournament?.tournamentId || null);
        this.currentTournamentId = tournament?.tournamentId || null;

        // Child selections belong to the previous Tournament and must never leak
        // into the newly selected Tournament context.
        if (changed) {
            this.currentDivisionId = null;
            this.currentRoundId = null;
            this.currentPairingProposal = null;
        }

        try {
            if (this.currentTournamentId) localStorage.setItem(this._selectionStorageKey, this.currentTournamentId);
            else localStorage.removeItem(this._selectionStorageKey);
        } catch (e) {
            console.warn('Unable to persist tournament selection:', e);
        }

        if (options.navigate) this.navigate(options.navigate);
        return { data:tournament, changed };
    },

    restoreTournamentContext() {
        let storedId = null;
        try { storedId = localStorage.getItem(this._selectionStorageKey); } catch (_) {}
        const activeTournaments = TournamentService.getAll();
        const selected = (storedId && activeTournaments.find(t => t.tournamentId === storedId)) || activeTournaments[0] || null;
        this.setTournamentContext(selected?.tournamentId || null);
        return selected;
    },

    getCurrentTournament() {
        const activeTournaments = TournamentService.getAll();
        let selected = this.currentTournamentId
            ? activeTournaments.find(t => t.tournamentId === this.currentTournamentId)
            : null;
        if (!selected) {
            selected = activeTournaments[0] || null;
            this.setTournamentContext(selected?.tournamentId || null);
        }
        return selected;
    },

    selectTournament(tournamentId) {
        const result = this.setTournamentContext(tournamentId);
        if (result.errors) return this.showToast(result.errors[0], 'error');
        this.showTournamentDetail(tournamentId);
    },

                <i data-lucide="${item.icon}" style="width:16px;height:16px"></i>

        if (!this.currentTournamentId) return null;

    applyDivisionContext(page, content) {
        const pages = new Set(['registration','rounds','pairings','results','standings','public-results','audit']);
        const div = this.getActiveDivision();
        if (!pages.has(page) || !div || !content) return;
        content.insertAdjacentHTML('afterbegin', this.divisionContextHtml(div));
        content.style.borderTop = `3px solid ${div.colorTag || '#f59e0b'}`;
        content.style.borderRadius = '10px 10px 0 0';
    },

    navigate(page) {
        this.currentPage = page;
        this.renderNav();
        const content = document.getElementById('content');

        const item = this.navItems.find(n=>n.id===page);
        title.textContent = item ? (this.lang==='th' ? item.labelTh : item.label) : page;
        this.updateDivisionFilter();

        switch(page) {
            case 'dashboard': this.renderDashboard(content); break;
            case 'tournaments': this.renderTournaments(content); break;
            case 'players': this.renderPlayers(content); break;
            case 'registration': this.renderRegistration(content); break;
            case 'rounds': this.renderRounds(content); break;
            case 'pairings': this.renderPairings(content); break;
            case 'results': this.renderResults(content); break;
            case 'standings': this.renderStandings(content); break;

            case 'audit': this.renderAudit(content); break;

    updateDivisionFilter() {
        const filter = document.getElementById('division-filter');
        const needsFilter = ['registration','rounds','pairings','results','standings','public-results'].includes(this.currentPage);
        filter.classList.toggle('hidden', !needsFilter);
        if (needsFilter) {
            const tournament = this.getCurrentTournament();
            let divs = [];
            if (tournament) divs = DivisionService.getByTournament(tournament.tournamentId);
            if (this.currentDivisionId && !divs.some(d => d.divisionId === this.currentDivisionId)) {
                this.currentDivisionId = null;

                this.currentPairingProposal = null;

            filter.innerHTML = `<option value="">${this.ui('All Divisions','ทุกดิวิชัน')}</option>` + divs.map(d => `<option value="${d.divisionId}" ${d.divisionId===this.currentDivisionId?'selected':''}>${d.divisionCode}</option>`).join('');

            const accent = activeDiv?.colorTag || '';
            filter.style.borderColor = accent || '';

    // ========== DASHBOARD ==========
    dashboardTournamentSummary(tournamentId) {
        const tournament = TournamentService.getById(tournamentId);
        if (!tournament) return null;
        const divs = DivisionService.getByTournament(tournamentId);
        const registrations = Storage.find('registrations', r => r.tournamentId === tournamentId);
        const checkedIn = registrations.filter(r => r.checkInStatus === 'checked_in').length;
        const activeRegs = registrations.filter(r => !['cancelled','withdrawn'].includes(r.entryStatus)).length;
        const rounds = Storage.find('rounds', r => r.tournamentId === tournamentId);
        const pairings = Storage.find('pairings', p => p.tournamentId === tournamentId && p.status !== 'cancelled');
        const results = Storage.find('matchResults', r => r.tournamentId === tournamentId && r.status !== 'voided' && r.resultType !== 'void');
        const pendingResults = pairings.filter(p => {
            if (p.pairingType === 'bye') return false;
            return !results.some(r => r.pairingId === p.pairingId);
        }).length;
        const completedDivisions = divs.filter(d => {
            const dRounds = rounds.filter(r => r.divisionId === d.divisionId);
            if (!dRounds.length) return false;
            const maxRound = Math.max(...dRounds.map(r => Number(r.roundNumber)||0));
            const latest = dRounds.find(r => Number(r.roundNumber) === maxRound);
            return latest && latest.status === 'locked';
        }).length;
        return {
            tournament, divs, registrations, checkedIn, activeRegs,
            rounds, pairings, results, pendingResults, completedDivisions
        };
    },

    dashboardDivisionStatus(div) {
        const regs = RegistrationService.getByDivision(div.divisionId);
        const rounds = RoundService.getByDivision(div.divisionId);
        const checkedIn = regs.filter(r => r.checkInStatus === 'checked_in').length;
        const activeRegs = regs.filter(r => !['cancelled','withdrawn'].includes(r.entryStatus)).length;
        const latest = rounds.length ? [...rounds].sort((a,b)=>(Number(b.roundNumber)||0)-(Number(a.roundNumber)||0))[0] : null;
        let pairings = [], results = [];
        if (latest) {
            pairings = PairingService.getByRound(latest.roundId).filter(p => p.status !== 'cancelled');
            results = Storage.find('matchResults', r => r.roundId === latest.roundId && r.status !== 'voided' && r.resultType !== 'void');
        }
        const pending = latest ? pairings.filter(p => p.pairingType !== 'bye' && !results.some(r => r.pairingId === p.pairingId)).length : 0;
        let level = 'blue', label = this.ui('Waiting for setup','รอเริ่มต้น');
        if (!latest && checkedIn === 0) { level='gray'; label=this.ui('Waiting for check-in','รอเช็กอิน'); }
        else if (!latest && checkedIn > 0) { level='blue'; label=this.ui('Ready to create Round 1','พร้อมสร้างรอบ 1'); }
        else if (latest?.status === 'locked') { level='green'; label=this.ui(`Round ${latest.roundNumber} complete`,`รอบ ${latest.roundNumber} เสร็จแล้ว`); }
        else if (pending > 0) { level='red'; label=this.ui(`${pending} result(s) pending`,`ยังขาดผล ${pending} คู่`); }
        else if (latest && pairings.length && pending === 0 && latest.status !== 'locked') { level='amber'; label=this.ui(`Round ${latest.roundNumber} ready to finalize`,`รอบ ${latest.roundNumber} พร้อมปิดรอบ`); }
        return { regs, checkedIn, activeRegs, rounds, latest, pairings, results, pending, level, label };
    },

    saveTournament(id) {
        const data = {
            tournamentName: document.getElementById('tf-name').value,
            shortName: document.getElementById('tf-short').value,
            organizerName: document.getElementById('tf-org').value,
            startDate: document.getElementById('tf-start').value,
            endDate: document.getElementById('tf-end').value,
            defaultMaximumSpread: parseInt(document.getElementById('tf-spread').value) || 350,
            allowTies: document.getElementById('tf-ties').value === 'true'
        };
        const result = id ? TournamentService.update(id, data) : TournamentService.create(data);
        if (result.errors) { this.showToast(result.errors[0], 'error'); return; }
        this.setTournamentContext(result.data.tournamentId);
        this.closeModal();
        this.showToast('Tournament saved!', 'success');
        this.navigate('dashboard');
    },

    startTournament(id) { const r=TournamentCompletionService.start(id); if(r.errors)return this.showToast(r.errors[0],'error'); this.showToast('Tournament started','success'); this.navigate('dashboard'); },
    approveTournament(id) { const report=TournamentCompletionService.inspect(id); if(!report.readyForApproval)return this.showToast(report.divisions.flatMap(d=>d.issues).join('; '),'error'); this.showModal('Approve Tournament Results?', '<p>All non-cancelled Divisions are complete, all rounds are locked, and final official standings are available.</p><p class="mt-2 text-sm text-gray-500">Approve these results as the official tournament record?</p>', `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmApproveTournament('${id}')" class="px-4 py-2 bg-purple-600 text-white rounded-lg">Approve Results</button>`); },

        const body = `<p class="text-red-600 font-semibold">This action cannot be undone.</p><p class="mt-2">${Utils.escHtml(t.tournamentName)}</p><p class="text-sm mt-2">${c.divisions} Divisions · ${c.registrations} Registrations · ${c.rounds} Rounds · ${c.pairings} Pairings · ${c.matchResults} Results</p><label class="block text-sm font-medium mt-4" for="delete-confirm">Type DELETE or the Tournament Name</label><input id="delete-confirm" class="w-full mt-1 px-3 py-2 border border-red-300 rounded-lg" autocomplete="off"></div>`;
        const actions = `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmPermanentDelete('${id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg">Permanently Delete</button>`;

    requestDeleteDivision(tournamentId, divisionId) {
        const d = DivisionService.getById(divisionId);
        if (!d) return this.showToast(this.ui('Division not found.','ไม่พบดิวิชัน'),'error');

        const check = DivisionService.safeDeleteCheck(divisionId);
        if (!check.ok) {
            const counts = check.blocking || {};
            const items = [
                ['registrations','Registration','การลงทะเบียน'],
                ['rounds','Rounds','รอบการแข่งขัน'],
                ['pairings','Pairings','การจับคู่'],
                ['matchResults','Results','ผลการแข่งขัน'],
                ['standingSnapshots','Standing Snapshots','Snapshot อันดับ'],
                ['finalStages','Final Stage','Final Stage'],
                ['finalGames','Final Games','เกมรอบชิง'],
                ['finalPlacementSnapshots','Final Placement','อันดับสุดท้าย']
            ].filter(([k])=>Number(counts[k]||0)>0)
             .map(([k,en,th])=>`${this.ui(en,th)}: ${counts[k]}`)
             .join('\n');
            alert(this.ui(
                `This Division cannot be permanently deleted because competition data already exists.\n\n${items}\n\nKeep the Division to protect tournament history.`,
                `ไม่สามารถลบดิวิชันนี้ถาวรได้ เพราะมีข้อมูลการแข่งขันแล้ว\n\n${items}\n\nระบบจะเก็บดิวิชันไว้เพื่อป้องกันประวัติการแข่งขัน`
            ));
            return;
        }

        const name = `${d.divisionCode}${d.divisionName ? ' — '+d.divisionName : ''}`;
        const ok = confirm(this.ui(
            `Permanently delete Division "${name}"?\n\nNo Registration, Round, Pairing, Result, Standing Snapshot or Final data was found. A backup JSON will be downloaded automatically before deletion.`,
            `ลบดิวิชัน "${name}" ถาวรหรือไม่?\n\nระบบตรวจแล้วว่าไม่มี Registration, Round, Pairing, Result, Standing Snapshot หรือข้อมูล Final และจะดาวน์โหลด Backup JSON ให้อัตโนมัติก่อนลบ`
        ));
        if (!ok) return;

        const result = DivisionService.permanentDelete(divisionId);
        if (result.errors) return this.showToast(result.errors[0],'error');

        if (this.currentDivisionId === divisionId) {
            this.currentDivisionId = null;
            this.currentRoundId = null;
            this.currentPairingProposal = null;
        }
        this.showToast(this.ui('Division permanently deleted safely.','ลบดิวิชันอย่างปลอดภัยแล้ว'),'success');
        this.showTournamentDetail(tournamentId);
    },

    runResultPolicyIntegritySelfTest(divisionId='') {
        const selfTest = ResultPolicyIntegrityService.runSelfTest();
        const live = divisionId
            ? ResultPolicyIntegrityService.inspectDivision(divisionId)
            : {ok:true,errors:[],warnings:[],version:1};
        const ok = selfTest.ok && live.ok;
        const el = document.getElementById('result-policy-integrity-self-test-result');
        const detail = [
            selfTest.message,
            divisionId ? `Live Division policy integrity: ${live.ok ? 'PASS' : 'FAIL'}.` : 'New Division uses pre-save configuration guard.',
            divisionId && live.ok ? `Resolved ResultPolicy version: ${live.version}.` : '',
            ...(live.errors || []),
            ...(live.warnings || []).map(w => `Warning: ${w}`),
            'Live tournament data was not modified.'
        ].filter(Boolean).join(' ');
        if (el) {
            el.className = `text-xs rounded-lg p-3 border mt-3 ${ok ? 'border-green-500 text-green-600' : 'border-red-500 text-red-600'}`;
            el.textContent = detail;
        }
        this.showToast(ok ? 'ResultPolicy Integrity Guard PASSED.' : 'ResultPolicy Integrity Guard FAILED.', ok ? 'success' : 'error');
    },

    runResultPolicyConfigSelfTest() {
        const result = ResultPolicyConfigurationService.runSelfTest();
        const el = document.getElementById('result-policy-config-self-test-result');
        if (el) {
            el.className = `text-xs rounded-lg p-3 border mt-3 ${result.ok ? 'border-green-500 text-green-600' : 'border-red-500 text-red-600'}`;
            el.textContent = result.message;
        }
        this.showToast(result.ok ? 'ResultPolicy Configuration Self-Test PASSED.' : 'ResultPolicy Configuration Self-Test FAILED.', result.ok ? 'success' : 'error');
    },

    addSpreadOverride() {
        const wrap = document.getElementById('df-overrides');
        if (!wrap) return;
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center';
        row.innerHTML = '<input data-override-round type="number" min="1" class="w-1/2 px-2 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" placeholder="Round"><input data-override-spread type="number" min="1" step="1" class="w-1/2 px-2 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" placeholder="Maximum Spread"><button type="button" class="text-red-600">×</button>';
        row.querySelector('button').onclick = () => row.remove();
        wrap.appendChild(row);
    },

    saveDivision(tournamentId, divisionId) {
        const proposedResultPolicy = {
            walkover: {
                scoreFor: Number(document.getElementById('df-walkover-score-for')?.value ?? 100),
                scoreAgainst: Number(document.getElementById('df-walkover-score-against')?.value ?? 0),
                officialSpreadAwarded: Number(document.getElementById('df-walkover-official-spread')?.value ?? 100)
            },
            forfeit: { scoreMode:'entered_adjusted' }
        };
        const resultPolicyConfigGuard = ResultPolicyIntegrityService.validateDivisionConfigInput(proposedResultPolicy);
        if (!resultPolicyConfigGuard.ok) {
            this.showToast(resultPolicyConfigGuard.errors[0], 'error');
            return;
        }

        const data = {
            tournamentId,
            divisionCode: document.getElementById('df-code').value,
            divisionName: document.getElementById('df-name').value,
            displayNameTh: document.getElementById('df-nameth').value,
            totalRounds: parseInt(document.getElementById('df-rounds').value),
            finalStageFormat: document.getElementById('df-final-format')?.value || 'none',
            entryMode: document.getElementById('df-entry-mode')?.value || 'individual_only',
            maxEntryMembers: (document.getElementById('df-entry-mode')?.value || 'individual_only') === 'individual_or_pair' ? 2 : 1,
            maximumSpread: parseInt(document.getElementById('df-spread').value),
            roundSpreadOverrides: [...document.querySelectorAll('#df-overrides > div')].map(row => ({ roundNumber: parseInt(row.querySelector('[data-override-round]').value), maximumSpread: parseInt(row.querySelector('[data-override-spread]').value) })),
            colorTag: document.getElementById('df-color').value
        };
        if (divisionId) {
            data.divisionId = divisionId;
            const beforeDivision = DivisionService.getById(divisionId);
            const tournamentState = TournamentService.getById(tournamentId);
            if (beforeDivision && tournamentState && !['draft','ready'].includes(tournamentState.status)) {
                if ((beforeDivision.finalStageFormat || 'none') !== data.finalStageFormat) {
                    this.showToast(this.ui('Final Stage format is locked after the Tournament starts.','ไม่สามารถเปลี่ยนรูปแบบ Final หลังเริ่มการแข่งขันได้'), 'error');
                    return;
                }
                if ((beforeDivision.entryMode || 'individual_only') !== data.entryMode) {
                    this.showToast(this.ui('Competition Entry Mode is locked after the Tournament starts.','ไม่สามารถเปลี่ยนรูปแบบผู้เข้าแข่งขันหลังเริ่มการแข่งขันได้'), 'error');
                    return;
                }
            }
        }
        const result = divisionId ? DivisionService.update(divisionId, data) : DivisionService.create(data);
        if (result.errors) { this.showToast(result.errors[0], 'error'); return; }
        const savedDivision = result.data;
        const savedByePolicy = savedDivision?.byePolicyId ? Storage.getById('byePolicies','byePolicyId',savedDivision.byePolicyId) : null;
        if (savedByePolicy) {
            Storage.update('byePolicies','byePolicyId',savedByePolicy.byePolicyId, {
                countsAsGame: true,
                countsAsWin: true,
                scoreFor: Math.max(0, parseInt(document.getElementById('df-bye-score-for').value) || 0),
                scoreAgainst: Math.max(0, parseInt(document.getElementById('df-bye-score-against').value) || 0),
                officialSpreadAwarded: Math.max(0, parseInt(document.getElementById('df-bye-official-spread').value) || 0),
                byeRulesConfiguredAt: Utils.now(),
                byeRulesConfiguredBy: 'admin',
                updatedAt: Utils.now()
            });
        }
        const resultPolicyUpdate = ResultPolicyConfigurationService.updateDivisionPolicy(savedDivision.divisionId, proposedResultPolicy);
        if (resultPolicyUpdate.errors) { this.showToast(resultPolicyUpdate.errors[0], 'error'); return; }

        const pairingPreset = document.getElementById('df-pairing-preset')?.value || '';
        if (pairingPreset) {
            const presetResult = PairingPlanPresetService.applyToDivision(savedDivision.divisionId, pairingPreset);
            if (presetResult.errors) { this.showToast(presetResult.errors[0], 'error'); return; }
        }
        this.closeModal();
        this.showToast('Division saved!', 'success');
        this.navigate('tournaments');
    },

            <td class="p-3"><div class="font-medium">${Utils.escHtml(PlayerDisplayService.primary(p))}</div>${PlayerDisplayService.english(p) && PlayerDisplayService.english(p)!==PlayerDisplayService.primary(p) ? `<div class="text-xs text-gray-500">${Utils.escHtml(PlayerDisplayService.english(p))}</div>` : ''}</td>
            <td class="p-3">${Utils.escHtml(p.thaiName || [p.firstNameTh, p.lastNameTh].filter(Boolean).join(' '))}</td>

                : `<span class="px-2 py-1 rounded-full text-xs bg-green-100 text-green-700 dark:bg-green-950/30 dark:text-green-300">${this.ui('ACTIVE','ใช้งาน')}</span>`}</td>

                        ? `<button onclick="App.requestRestorePlayer('${p.playerId}')" class="text-xs px-2 py-1 border border-emerald-400 text-emerald-700 dark:text-emerald-300 rounded">${this.ui('Restore','นำกลับมาใช้งาน')}</button>`

    filterPlayers(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.player-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.playerSearch || '').includes(query));
        });
        const master = document.getElementById('player-select-all');
        if (master) master.checked = false;
    },

    toggleAllPlayerRows(master) {
        document.querySelectorAll('.player-row:not(.hidden) .player-select').forEach(cb => cb.checked = !!master.checked);
    },

    selectVisiblePlayers() {
        document.querySelectorAll('.player-row:not(.hidden) .player-select').forEach(cb => cb.checked = true);
        const master = document.getElementById('player-select-all');
        if (master) master.checked = true;
    },

    clearPlayerSelection() {
        document.querySelectorAll('.player-select').forEach(cb => cb.checked = false);
        const master = document.getElementById('player-select-all');
        if (master) master.checked = false;
    },

    selectedPlayerIds() {
        return Array.from(document.querySelectorAll('.player-select:checked')).map(cb => cb.value);
    },

    requestArchivePlayer(id) {
        const p = PlayerService.getById(id);
        if (!p) return this.showToast('Player not found.', 'error');
        if (!confirm(this.ui(`Archive ${p.displayName || p.playerId}? The Player will be hidden from active lists but tournament history remains intact.`,`เก็บ ${p.displayName || p.playerId} เข้าคลัง? ผู้เล่นจะถูกซ่อนจากรายชื่อใช้งาน แต่ประวัติการแข่งขันยังคงอยู่`))) return;
        PlayerService.archive(id);
        this.showToast(this.ui('Player archived.','เก็บผู้เล่นเข้าคลังแล้ว'), 'success');
        this.navigate('players');
    },

    requestRestorePlayer(id) {
        const p = PlayerService.getById(id);
        if (!p) return this.showToast('Player not found.', 'error');
        if (!confirm(this.ui(`Restore ${PlayerDisplayService.primary(p) || p.playerId} to the active Player list?`,`นำ ${PlayerDisplayService.primary(p) || p.playerId} กลับมาอยู่ในรายชื่อผู้เล่นที่ใช้งาน?`))) return;
        const result = PlayerService.restore(id);
        if (result.errors) return this.showToast(result.errors[0],'error');
        this.showToast(this.ui('Player restored to active list.','นำผู้เล่นกลับมาใช้งานแล้ว'),'success');
        this.navigate('players');
    },

    bulkRestorePlayers() {
        const ids = this.selectedPlayerIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one archived Player.','เลือกผู้เล่นในคลังอย่างน้อย 1 คน'),'warning');
        const archivedIds = ids.filter(id => PlayerService.getById(id)?.status === 'archived');
        if (!archivedIds.length) return this.showToast(this.ui('No archived Players selected.','ไม่มีผู้เล่นในคลังที่ถูกเลือก'),'warning');
        if (!confirm(this.ui(`Restore ${archivedIds.length} Player(s) to the active list?`,`นำผู้เล่น ${archivedIds.length} คนกลับมาใช้งาน?`))) return;
        let restored = 0;
        archivedIds.forEach(id => { if (!PlayerService.restore(id).errors) restored++; });
        this.showToast(this.ui(`Restored ${restored} Player(s).`,`นำผู้เล่นกลับมาใช้งานแล้ว ${restored} คน`),'success');
        this.navigate('players');
    },

    requestRemovePlayer(id) {
        const p = PlayerService.getById(id);
        const d = PlayerService.dependencies(id);
        if (!p || !d) return this.showToast('Player not found.', 'error');
        if (d.registrations.length) return this.showToast(this.ui('This Player has tournament history. Archive instead.','ผู้เล่นนี้มีประวัติการแข่งขัน กรุณาเก็บเข้าคลังแทน'), 'error');
        if (!confirm(this.ui(`Permanently remove ${p.displayName || p.playerId}? This cannot be undone.`,`ลบ ${p.displayName || p.playerId} ออกจากฐานข้อมูลถาวร? ไม่สามารถย้อนกลับได้`))) return;
        const result = PlayerService.permanentDelete(id);
        if (result.errors) return this.showToast(result.errors[0], 'error');
        this.showToast(this.ui('Unused Player removed.','ลบผู้เล่นที่ไม่เคยใช้งานแล้ว'), 'success');
        this.navigate('players');
    },

    bulkArchivePlayers() {
        const ids = this.selectedPlayerIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one Player.','เลือกผู้เล่นอย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui(`Archive ${ids.length} selected Player(s)?`,`เก็บผู้เล่นที่เลือก ${ids.length} คนเข้าคลัง?`))) return;
        const activeIds = ids.filter(id => PlayerService.getById(id)?.status !== 'archived');
        activeIds.forEach(id => PlayerService.archive(id));
        this.showToast(this.ui(`Archived ${activeIds.length} Player(s).`,`เก็บเข้าคลังแล้ว ${activeIds.length} คน`), 'success');
        this.navigate('players');
    },

    bulkRemoveUnusedPlayers() {
        const ids = this.selectedPlayerIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one Player.','เลือกผู้เล่นอย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui('Remove selected Players only when they have never been registered in a tournament?','ลบผู้เล่นที่เลือกเฉพาะคนที่ไม่เคยลงทะเบียนแข่งขันใช่หรือไม่?'))) return;
        let removed = 0, protectedCount = 0;
        ids.forEach(id => {
            const result = PlayerService.permanentDelete(id);
            if (result.errors) protectedCount++;
            else removed++;
        });
        this.showToast(this.ui(`Removed ${removed} unused · protected ${protectedCount} with history.`,`ลบผู้เล่นที่ไม่เคยใช้งาน ${removed} คน · ป้องกัน ${protectedCount} คนที่มีประวัติ`), protectedCount ? 'warning' : 'success');
        this.navigate('players');
    },

    removeAllUnusedPlayers() {
        const unused = PlayerService.getAll().filter(p => !PlayerService.dependencies(p.playerId)?.registrations?.length);
        if (!unused.length) return this.showToast(this.ui('No unused active Players to remove.','ไม่มีผู้เล่นที่ไม่เคยใช้งานให้ลบ'), 'warning');
        if (!confirm(this.ui(`Permanently remove all ${unused.length} active Players that have never been registered?`,`ลบผู้เล่นที่ใช้งานอยู่และไม่เคยลงทะเบียนทั้งหมด ${unused.length} คนแบบถาวร?`))) return;
        let removed = 0;
        unused.forEach(p => { if (!PlayerService.permanentDelete(p.playerId).errors) removed++; });
        this.showToast(this.ui(`Removed ${removed} unused Player(s).`,`ลบผู้เล่นที่ไม่เคยใช้งาน ${removed} คนแล้ว`), 'success');
        this.navigate('players');
    },

    toggleSecondPlayer(show) {
        const wrap = document.getElementById('pf-member2-wrap');
        const btn = document.getElementById('pf-add-member-btn');
        if (wrap) wrap.classList.toggle('hidden', !show);
        if (btn) btn.classList.toggle('hidden', !!show);
        if (!show) ['pf2-thainame','pf2-englishname','pf2-club'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; });
    },

    updateProvinceField() {
        const countryEl = document.getElementById('pf-country');
        const country = normalizeCountry(countryEl?.value);
        const wrap = document.getElementById('pf-prov-wrap');
        if (!wrap) return;

        // On first render there is no #pf-prov yet, so use the Player's stored province
        // carried on the wrapper. On later country changes, use the live field value.
        const existingField = document.getElementById('pf-prov');
        const storedCurrent = wrap.dataset.currentProvince || '';
        const current = existingField ? existingField.value : storedCurrent;
        const previousCountry = normalizeCountry(countryEl?.dataset.previous || country);
        const countryChanged = !!countryEl?.dataset.previous && previousCountry !== country;
        const valueForRender = countryChanged ? '' : current;

        wrap.innerHTML = country === 'Thailand'
            ? `<select id="pf-prov" required class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600"><option value="">${this.ui('Select Province...','เลือกจังหวัด...')}</option>${THAILAND_PROVINCES.map(v=>`<option value="${v}" ${v===normalizeProvince(valueForRender)?'selected':''}>${Utils.escHtml(this.lang==='th'?(PROVINCE_TH_BY_EN[v]||v):v)}</option>`).join('')}</select>`
            : `<input id="pf-prov" required class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" value="${Utils.escHtml(valueForRender)}">`;

        // Keep the current rendered value available if the control must be rebuilt again.
        wrap.dataset.currentProvince = document.getElementById('pf-prov')?.value || valueForRender || '';
        if (countryEl) countryEl.dataset.previous = country;
    },

    savePlayer(id) {
        const parseName = (thaiName, englishName) => {
            const th = String(thaiName||'').trim(), en=String(englishName||'').trim();
            const thParts=th.split(/\s+/).filter(Boolean), enParts=en.split(/\s+/).filter(Boolean);
            return {
                thaiName:th, firstNameTh:thParts.shift()||'', lastNameTh:thParts.join(' '),
                displayName:en, firstName:enParts.shift()||'', lastName:enParts.join(' ')
            };
        };
        const ratingValue = document.getElementById('pf-rating')?.value.trim() || '';
        const shared = {
            province: normalizeProvince(document.getElementById('pf-prov')?.value.trim() || ''),
            country: normalizeCountry(document.getElementById('pf-country')?.value),
            currentRating: ratingValue === '' ? null : Number(ratingValue),
            intendedDivisions: PlayerIntentService.normalizeTags(document.getElementById('pf-intended')?.value || ''),
            registrationNote: document.getElementById('pf-regnote')?.value.trim() || ''
        };
        const p1 = {
            ...parseName(document.getElementById('pf-thainame')?.value, document.getElementById('pf-englishname')?.value),
            ...shared,
            schoolOrClub: document.getElementById('pf-club')?.value.trim() || ''
        };

        if (id) {
            const result = PlayerService.update(id,p1);
            if (result.errors) return this.showToast(result.errors[0],'error');
            this.closeModal(); this.showToast(this.ui('Player saved!','บันทึกผู้เล่นแล้ว'),'success'); this.navigate('players'); return;
        }

        const secondThai = document.getElementById('pf2-thainame')?.value.trim() || '';
        const secondEnglish = document.getElementById('pf2-englishname')?.value.trim() || '';
        const secondSchool = document.getElementById('pf2-club')?.value.trim() || '';
        const wantsSecond = !!(secondThai || secondEnglish || secondSchool);
        if (wantsSecond && !secondThai) return this.showToast(this.ui('Player 2 Thai Name is required when adding a second member.','เมื่อเพิ่มผู้เล่นคนที่ 2 ต้องกรอกชื่อ-นามสกุลภาษาไทย'),'error');

        const groupId = wantsSecond ? Utils.generateId('GRP') : null;
        const r1 = PlayerService.create({...p1,entryGroupId:groupId,entryGroupMemberIndex:groupId?1:null});
        if (r1.errors) return this.showToast(r1.errors[0],'error');

        let r2 = null;
        if (wantsSecond) {
            const p2 = {
                ...parseName(secondThai,secondEnglish),
                ...shared,
                schoolOrClub:secondSchool,
                currentRating:null,
                entryGroupId:groupId,
                entryGroupMemberIndex:2,
                _skipDuplicateCheck:true
            };
            r2 = PlayerService.create(p2);
            if (r2.errors) {
                PlayerService.permanentDelete(r1.data.playerId);
                return this.showToast(r2.errors[0],'error');
            }
        }

        this.closeModal();
        this.showToast(wantsSecond
            ? this.ui('Two Player records saved as a suggested Pair Entry.','บันทึกผู้เล่น 2 คนและเชื่อมเป็นคู่ที่แนะนำแล้ว')
            : this.ui('Player saved!','บันทึกผู้เล่นแล้ว'),'success');
        this.navigate('players');
    },

    showPlayerExcelImport() {
        const input = document.createElement('input'); input.type = 'file'; input.accept = '.xlsx,.xls';
        input.onchange = async e => {
            const file = e.target.files[0]; if (!file) return;
            try {
                const parsed = await ExcelImportService.read(file);
                const preview = parsed.rows.map(({ rowNumber, player }) => {
                    const errors = [];
                    const thaiName = String(player.thaiName || '').trim();
                    if (!thaiName) errors.push(this.ui('Thai Name is required','ต้องมีชื่อ-นามสกุล (ไทย)'));
                    const rawProvince = String(player.province || '').trim();
                    if (!rawProvince) errors.push(this.ui('Province is required','ต้องมีจังหวัด'));
                    const country = String(player.country || '').trim();
                    player.country = !country || ['TH','THAILAND','ไทย','ประเทศไทย'].includes(country.toUpperCase()) ? 'Thailand' : country;
                    if (!String(player.country || '').trim()) errors.push(this.ui('Country is required','ต้องมีประเทศ'));
                    player.country = normalizeCountry(player.country);
                    const provinceCheck = ProvinceGuardService.inspect(rawProvince, player.country);
                    if (rawProvince && !provinceCheck.ok) {
                        const suggestionText = provinceCheck.suggestion
                            ? this.ui(` Did you mean ${LocationDisplayService.province(provinceCheck.suggestion,'en')}?`,` น่าจะหมายถึง “${LocationDisplayService.province(provinceCheck.suggestion,'th')}” หรือไม่?`)
                            : '';
                        errors.push(this.ui(`Unknown Thailand province: ${rawProvince}.${suggestionText} Please correct the Excel file or use the KTM template dropdown.`,`ไม่พบจังหวัดไทย “${rawProvince}” ในรายชื่อ 77 จังหวัด.${suggestionText} กรุณาแก้ไฟล์ Excel หรือใช้ Dropdown ในแบบฟอร์ม KTM`));
                    }
                    player.province = provinceCheck.ok ? provinceCheck.canonical : rawProvince;
                    if (!PlayerIntentService.normalizeTags(player.intendedDivisions).length) errors.push(this.ui('Game / Division is required','ต้องมีเกม / รุ่น'));
                    // Player 2 is optional. Treat member 2 as present only when a name is entered.
                    // A stray School / Institution 2 value must not turn a single-player row into an invalid pair row.
                    const hasMember2 = !!(String(player.thaiName2||'').trim() || String(player.englishName2||'').trim());
                    if (!hasMember2) {
                        player.thaiName2 = '';
                        player.englishName2 = '';
                        player.schoolOrClub2 = '';
                    }
                    if (hasMember2 && !String(player.thaiName2||'').trim()) errors.push(this.ui('Player 2 Thai Name is required','ผู้เล่นคนที่ 2 ต้องมีชื่อ-นามสกุล (ไทย)'));
                    if (player.currentRating !== null && player.currentRating !== '' && !Number.isFinite(Number(player.currentRating))) errors.push(this.ui('Invalid Rating','เรตติ้งไม่ถูกต้อง'));
                    player.currentRating = player.currentRating === '' || player.currentRating == null ? null : Number(player.currentRating);
                    const existing = player.playerId && Storage.getById('players', 'playerId', player.playerId);
                    if (existing) errors.push(this.ui('Duplicate Player ID','รหัสผู้เล่นซ้ำ'));
                    if (!errors.length) player.province = normalizeProvince(player.province);
                    player.country = normalizeCountry(player.country);
                    const dup = PlayerImportIntegrityService.inspectRow(player);
                    let status = errors.length ? 'INVALID' : 'NEW / VALID';
                    let duplicateNote = '';
                    if (!errors.length && (dup.existing1 || dup.existing2)) {
                        const ids = [dup.existing1?.playerId, dup.existing2?.playerId].filter(Boolean);
                        const allMembersAlreadyExist = !!dup.existing1 && (!dup.member2Present || !!dup.existing2);
                        status = allMembersAlreadyExist ? 'EXISTING / SKIP' : 'DUPLICATE / REVIEW';
                        duplicateNote = this.ui(
                            `Existing Player${ids.length>1?'s':''}: ${ids.join(', ')}. Row will not be imported again.`,
                            `พบผู้เล่นเดิม${ids.length>1?'หลายคน':''}: ${ids.join(', ')} ระบบจะไม่สร้างซ้ำจากแถวนี้`
                        );
                    }
                    if (!player.playerId) player.playerId = Utils.generateId('P');
                    const message = errors.length ? errors.join('; ') : (duplicateNote || '—');
                    return { rowNumber, player, status, error: message };
                });
                const body = `<p class="text-sm text-gray-500 mb-3">${this.ui('Rows Read','จำนวนแถวที่อ่าน')}: ${preview.length} · ${this.ui('Only NEW / VALID rows will be committed. Existing players are skipped to prevent duplicates.','จะบันทึกเฉพาะแถว NEW / VALID เท่านั้น ผู้เล่นที่มีอยู่แล้วจะถูกข้ามเพื่อป้องกันรายชื่อซ้ำ')}</p><div class="table-container"><table class="w-full text-xs"><thead><tr class="border-b text-left"><th class="p-2">${this.ui('Row','แถว')}</th><th class="p-2">${this.ui('Thai Name 1 *','ชื่อไทย 1 *')}</th><th class="p-2">${this.ui('English Name 1','ชื่ออังกฤษ 1')}</th><th class="p-2">${this.ui('School 1','โรงเรียน 1')}</th><th class="p-2">${this.ui('Thai Name 2','ชื่อไทย 2')}</th><th class="p-2">${this.ui('English Name 2','ชื่ออังกฤษ 2')}</th><th class="p-2">${this.ui('School 2','โรงเรียน 2')}</th><th class="p-2">${this.ui('Province *','จังหวัด *')}</th><th class="p-2">${this.ui('Country *','ประเทศ *')}</th><th class="p-2">${this.ui('Game / Division *','เกม / รุ่น *')}</th><th class="p-2">${this.ui('Registration Note','หมายเหตุ')}</th><th class="p-2">${this.ui('Rating','เรตติ้ง')}</th><th class="p-2">${this.ui('Status','สถานะ')}</th><th class="p-2">${this.ui('Error / Note','ข้อผิดพลาด / หมายเหตุ')}</th></tr></thead><tbody>${preview.map(x => { const statusClass=x.status==='INVALID'?'text-red-600':(x.status==='NEW / VALID'?'text-green-600':'text-amber-500'); return `<tr class="border-b"><td class="p-2">${x.rowNumber}</td><td class="p-2">${Utils.escHtml(x.player.thaiName || '')}</td><td class="p-2">${Utils.escHtml(x.player.displayName || '')}</td><td class="p-2">${Utils.escHtml(x.player.schoolOrClub)}</td><td class="p-2">${Utils.escHtml(x.player.thaiName2 || '')}</td><td class="p-2">${Utils.escHtml(x.player.englishName2 || '')}</td><td class="p-2">${Utils.escHtml(x.player.schoolOrClub2 || '')}</td><td class="p-2">${Utils.escHtml(LocationDisplayService.province(x.player.province,this.lang))}</td><td class="p-2">${Utils.escHtml(LocationDisplayService.country(x.player.country,this.lang))}</td><td class="p-2">${Utils.escHtml(PlayerIntentService.tagsText(x.player) || '—')}</td><td class="p-2">${Utils.escHtml(PlayerIntentService.note(x.player) || '—')}</td><td class="p-2">${x.player.currentRating ?? '—'}</td><td class="p-2 ${statusClass}">${x.status}</td><td class="p-2 ${x.status==='INVALID'?'text-red-600':'text-amber-500'}">${Utils.escHtml(x.error)}</td></tr>`; }).join('')}</tbody></table></div>`;
                this.showModal(this.ui('Preview Player Import','ตัวอย่างก่อนนำเข้าผู้เล่น'), body, `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.commitPlayerImport(window.__krutarPlayerPreview)" class="px-4 py-2 bg-amber-500 text-white rounded-lg">${this.ui('Commit Valid Rows','บันทึกแถวที่ถูกต้อง')}</button>`);

    commitPlayerImport(preview) {
        const imported=[], errors=[];
        const parseName=(thaiName,englishName)=>{
            const th=String(thaiName||'').trim(), en=String(englishName||'').trim();
            const tp=th.split(/\s+/).filter(Boolean), ep=en.split(/\s+/).filter(Boolean);
            return {thaiName:th,firstNameTh:tp.shift()||'',lastNameTh:tp.join(' '),displayName:en,firstName:ep.shift()||'',lastName:ep.join(' ')};
        };
        preview.filter(x=>x.status==='NEW / VALID').forEach(x=>{
            const src=x.player;
            const has2=!!String(src.thaiName2||'').trim();
            const groupId=has2?Utils.generateId('GRP'):null;
            const r1=PlayerService.create({...src,...parseName(src.thaiName,src.displayName||src.englishName),entryGroupId:groupId,entryGroupMemberIndex:groupId?1:null,_skipDuplicateCheck:true});
            if (!r1.data) { errors.push(`Row ${x.rowNumber}: ${r1.errors?.join('; ')||'Save failed'}`); return; }
            imported.push(r1.data.playerId);
            if (has2) {
                const r2=PlayerService.create({
                    ...parseName(src.thaiName2,src.englishName2),
                    schoolOrClub:src.schoolOrClub2||'',
                    province:src.province,country:src.country,
                    intendedDivisions:src.intendedDivisions,
                    registrationNote:src.registrationNote,
                    currentRating:null,entryGroupId:groupId,entryGroupMemberIndex:2,_skipDuplicateCheck:true
                });
                if (!r2.data) {
                    PlayerService.permanentDelete(r1.data.playerId);
                    errors.push(`Row ${x.rowNumber} Player 2: ${r2.errors?.join('; ')||'Save failed'}`);
                    imported.pop();
                    return;
                }
                imported.push(r2.data.playerId);
            }
        });
        this.lastImportedPlayerIds=imported;
        this.closeModal();
        this.showToast(this.ui(`Players Saved: ${imported.length} · Errors: ${errors.length}`,`บันทึกผู้เล่น ${imported.length} คน · ข้อผิดพลาด ${errors.length}`),errors.length?'warning':'success');
        this.navigate('players');
    },
