        let currentBackup = null, cleared = false;
        try {
            currentBackup = Storage.exportAll();
            const currentReport = this.validateFullBackup(currentBackup);
            if (!currentReport.ok) {
                return { errors:[`Clear cancelled: current database failed integrity validation. ${currentReport.errors.slice(0,8).join(' | ')}`] };
            }

            const meaningfulCount = this._requiredCollections
                .filter(c => c !== 'auditLogs')
                .reduce((sum, c) => sum + (currentReport.counts[c] || 0), 0);
            if (meaningfulCount === 0) {
                return { errors:['Clear cancelled: the database is already empty. Existing pre-clear recovery was preserved.'] };
            }

            // A verified recovery copy is mandatory BEFORE any live data is cleared.
            const recoveryPayload = {
                createdAt: Utils.now(),
                source: 'PRE_CLEAR_RECOVERY',
                data: currentBackup
            };
            try {
                localStorage.setItem(STORAGE_KEY + '_pre_clear', JSON.stringify(recoveryPayload));
                const verifyRaw = localStorage.getItem(STORAGE_KEY + '_pre_clear');
                if (!verifyRaw) throw new Error('Recovery copy could not be read back after saving.');
                const verifyParsed = JSON.parse(verifyRaw);
                const verifyReport = this.validateFullBackup(verifyParsed?.data || verifyParsed);
                if (!verifyReport.ok) throw new Error(`Recovery copy failed verification: ${verifyReport.errors.slice(0,8).join(' | ')}`);
            } catch (backupErr) {
                return { errors:[`Clear cancelled: unable to create and verify pre-clear recovery copy (${backupErr.message || backupErr}). Current database was not changed.`] };
            }

            const emptyData = { schemaVersion: SCHEMA_VERSION };
            this._requiredCollections.forEach(c => emptyData[c] = []);
            Storage.replaceAll(emptyData);
            cleared = true;

            const postReport = this.validateFullBackup(Storage.exportAll());
            if (!postReport.ok) throw new Error(`Post-clear integrity check failed: ${postReport.errors.slice(0,8).join(' | ')}`);

            AuditService.log({
                entityType:'system', entityId:'database', action:'clear', eventCode:'DATABASE_CLEARED',
                before:{ collectionCounts:currentReport.counts }, after:{ collectionCounts:postReport.counts },
                reason:'All live tournament data cleared after verified pre-clear recovery copy was created.'
            });
            return { data:true, report:postReport, recoveryCounts:currentReport.counts };
        } catch (err) {
            if (cleared && currentBackup) {
                try {
                    Storage.replaceAll(currentBackup);
                    AuditService.log({ entityType:'system', entityId:'database', action:'rollback', eventCode:'DATABASE_CLEAR_ROLLED_BACK', reason:err.message || String(err) });
                    return { errors:[`Clear failed after the live database was changed, so KTM rolled back to the previous database. ${err.message || err}`] };
                } catch (rollbackErr) {
                    return { errors:[`CRITICAL: clear failed and automatic rollback also failed. Do not continue using this browser tab. The pre-clear recovery copy remains at ${STORAGE_KEY}_pre_clear. Clear error: ${err.message || err}; rollback error: ${rollbackErr.message || rollbackErr}`] };
                }
            }
            return { errors:[err.message || String(err)] };
        }
    },

    restorePreClearRecovery() {
        const raw = localStorage.getItem(STORAGE_KEY + '_pre_clear');
        if (!raw) return { errors:['No pre-clear recovery copy is available.'] };
        try {
            const parsed = JSON.parse(raw);
            const data = parsed?.data || parsed;
            const report = this.validateFullBackup(data);
            if (!report.ok) return { errors:[`Pre-clear recovery copy failed validation: ${report.errors.slice(0,8).join(' | ')}`] };

            const before = Storage.exportAll();
            Storage.replaceAll(data);
            const post = this.validateFullBackup(Storage.exportAll());
            if (!post.ok) {
                Storage.replaceAll(before);
                return { errors:[`Pre-clear recovery integrity check failed; current database was restored. ${post.errors.slice(0,8).join(' | ')}`] };
            }
            AuditService.log({ entityType:'system', entityId:'database', action:'recover', eventCode:'PRE_CLEAR_RECOVERY_RESTORED', after:{ collectionCounts:post.counts } });
            return { data:true, report:post };
        } catch (e) {
            return { errors:[e.message || String(e)] };
        }
    },

    exportPlayersCsv() {
        const players = PlayerService.getAll();
        const headers = ['playerId','firstName','lastName','firstNameTh','lastNameTh','nickname','schoolOrClub','province','country','currentRating','status'];
        const csv = headers.join(',') + '\n' + players.map(p => headers.map(h => `"${(p[h]||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
        Utils.downloadCsv(csv, 'players.csv');
        AuditService.log({ entityType: 'player', entityId: 'all', action: 'export', eventCode: 'DATA_EXPORTED' });
    },
    importPlayersCsv(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = (e) => {
                const rows = Utils.parseCsv(e.target.result);
                let imported = 0;
                rows.forEach(row => {
                    const result = PlayerService.create({ ...row, _skipDuplicateCheck: true });
                    if (result.data) imported++;
                });
                AuditService.log({ entityType: 'player', entityId: 'batch', action: 'import', eventCode: 'DATA_IMPORTED', after: { count: imported } });
                resolve(imported);
            };
            reader.readAsText(file);
        });
    },
    exportStandingCsv(divisionId, rows) {
        const headers = ['rank','playerId','playerName','schoolOrClub','gamesPlayed','wins','ties','losses','matchPoints','scoreFor','scoreAgainst','sumOfficialSpread','sumRawSpread','seed'];
        const csv = headers.join(',') + '\n' + rows.map(r => headers.map(h => `"${(r[h]||'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
        Utils.downloadCsv(csv, `standing_${divisionId}.csv`);
    },
    exportPairingsCsv(roundId) {
        const pairings = PairingService.getByRound(roundId);
        const headers = ['tableNumber','pairingType','byeReason','assignmentSource','gibsonizationReason','player1Id','player2Id','status','repeatOpponent','previousMeetingCount'];
        const csv = headers.join(',') + '\n' + pairings.map(p => headers.map(h => `"${(p[h] ?? '').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
        Utils.downloadCsv(csv, `pairings_${roundId}.csv`);
    }
};

                player2RegistrationId: openRegs[j].registrationId, player2Id: openRegs[j].playerId,
                pairingType: 'normal'
            });
        });
        PairingService.confirmAll(rd.roundId);
        RoundService.updateStatus(rd.roundId, 'in_progress');

        // Enter results
        const pairings = PairingService.getByRound(rd.roundId);
        const scores = [[450,390],[375,410],[420,420],[700,200]];
        pairings.forEach((p, i) => {

        });

    }
};

const OpponentHistoryService = {
    meetings(divisionId, playerA, playerB) {
        return Storage.find('pairings', p => p.divisionId === divisionId && p.status !== 'cancelled' &&
            ((p.player1Id === playerA && p.player2Id === playerB) || (p.player1Id === playerB && p.player2Id === playerA)));
    },
    hasPlayed(divisionId, a, b) { return this.meetings(divisionId, a, b).length > 0; },
    meetingCount(divisionId, a, b) { return this.meetings(divisionId, a, b).length; },
    meetingRounds(divisionId, a, b) { return this.meetings(divisionId, a, b).map(p => p.roundNumber).sort((x,y)=>x-y); },
    byeHistory(divisionId, playerId) { return Storage.find('pairings', p => p.divisionId === divisionId && p.pairingType === 'bye' && p.player1Id === playerId); }
};

const ByeSelectionService = {
    // Patch 02.12 — MANUAL means an explicit admin selection; never silently pick candidate #1.
    select(context, candidates = context.registrations) {
        if (!Array.isArray(candidates) || !candidates.length) return null;
        const policy = context.byePolicy || {};
        const ordered = [...candidates].sort((a,b) => (a.seed||9999)-(b.seed||9999) || String(a.playerId).localeCompare(String(b.playerId)));
        if (policy.selectionMethod === 'manual') {
            const regId = context.manualByeRegistrationId || null;
            const playerId = context.manualByePlayerId || null;
            if (!regId && !playerId) return null;
            return ordered.find(r => (regId && r.registrationId === regId) || (playerId && r.playerId === playerId)) || null;
        }
        if (policy.avoidRepeatBye !== false) {
            const fresh = ordered.filter(r => !OpponentHistoryService.byeHistory(context.division.divisionId, r.playerId).length);
            if (fresh.length) return fresh[0];
        }
        return ordered[0];
    },
    requiresManualSelection(context, candidates = context.registrations) {
        return Array.isArray(candidates) && candidates.length % 2 === 1 && (context.byePolicy || {}).selectionMethod === 'manual';
    }
};

const ByePolicyTests = {
    run() {
        const regs=[1,2,3,4,5].map(i=>({registrationId:`R${i}`,playerId:`P${i}`,seed:i}));
        const base={division:{divisionId:'BYE-TEST'},registrations:regs,byePolicy:{selectionMethod:'manual',avoidRepeatBye:true}};
        const checks={};
        checks.noSilentDefault=ByeSelectionService.select(base,regs)===null;
        checks.explicitSelection=ByeSelectionService.select({...base,manualByeRegistrationId:'R4'},regs)?.registrationId==='R4';
        checks.invalidRejected=ByeSelectionService.select({...base,manualByeRegistrationId:'NOPE'},regs)===null;
        checks.oddRequiresManual=ByeSelectionService.requiresManualSelection(base,regs)===true;
        checks.evenNeedsNone=ByeSelectionService.requiresManualSelection({...base,registrations:regs.slice(0,4)},regs.slice(0,4))===false;
        const ok=Object.values(checks).every(Boolean);
        return {ok,checks,message:ok?'Bye Policy Self-Test PASSED: MANUAL BYE never auto-selects a player; an explicit eligible registration is honored; invalid selections are rejected; even pools need no BYE. Round Robin structural BYEs remain controlled by its circle schedule. Live tournament data was not modified.':'Bye Policy Self-Test FAILED.'};
    }
};

const RoundRobinCapacityService = {
    capacityForPlayerCount(playerCount) {
        const count = Number(playerCount || 0);
        if (!Number.isInteger(count) || count < 2) return { valid:false, playerCount:count, cycleLength:0, effectiveSeats:0, hasBye:false, error:'Round Robin requires at least 2 eligible players.' };
        const hasBye = count % 2 === 1;
        const effectiveSeats = hasBye ? count + 1 : count;
        return { valid:true, playerCount:count, cycleLength:effectiveSeats - 1, effectiveSeats, hasBye };
    },

    engineForPlanRound(plan, roundNumber) {
        const rule = (plan?.roundRules || []).find(r => Number(r.roundNumber || r.round) === Number(roundNumber));
        if (rule) return rule.engine || rule.method || 'manual';
        if (plan?.planType === 'round_robin' || plan?.planType === 'round_robin_plus_koth') return 'round_robin';
        if (plan?.planType === 'swiss' || plan?.planType === 'swiss_plus_koth') return 'swiss';
        return 'manual';
    },

    analyzePlanDefinition(plan, divisionTotalRounds, playerCount) {
        const capacity = this.capacityForPlayerCount(playerCount);
        if (!plan) return { valid:false, errors:['No pairing plan supplied'], warnings:[], capacity, roundRobinRounds:[], plannedRoundRobinCount:0 };
        const totalRounds = Number(plan.totalRounds || divisionTotalRounds || 0);
        const roundRobinRounds = [];
        for (let roundNumber = 1; roundNumber <= totalRounds; roundNumber++) {
            if (this.engineForPlanRound(plan, roundNumber) === 'round_robin') roundRobinRounds.push(roundNumber);
        }
        const errors = [], warnings = [];
        if (!capacity.valid) errors.push(capacity.error);
        if (capacity.valid && roundRobinRounds.length > capacity.cycleLength) {
            errors.push(`Pairing plan invalid: ${roundRobinRounds.length} Round Robin round(s) are configured, but ${capacity.playerCount} eligible players allow only ${capacity.cycleLength} unique Round Robin round(s) per cycle. Change the excess Round Robin round(s) to another pairing method before using this plan.`);
        }
        return { valid:!errors.length, errors, warnings, plan, capacity, roundRobinRounds, plannedRoundRobinCount:roundRobinRounds.length, totalRounds };
    },

    analyzePlan(divisionId, playerCount) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { valid:false, errors:['Division not found'], warnings:[] };
        const plans = Storage.find('pairingPlans', p => p.divisionId === divisionId && p.status === 'active');
        const plan = plans.find(p => p.pairingPlanId === division.pairingPlanId) || plans[0] || null;
        if (!plan) return { valid:false, errors:['No active pairing plan'], warnings:[], capacity:this.capacityForPlayerCount(playerCount), roundRobinRounds:[], plannedRoundRobinCount:0 };
        return this.analyzePlanDefinition(plan, division.totalRounds, playerCount);
    },

    sequenceForRound(context, engineName='round_robin') {
        const capacity = this.capacityForPlayerCount(context?.registrations?.length || 0);
        if (!capacity.valid) return { valid:false, errors:[capacity.error], warnings:[], capacity, sequenceIndex:0, cycleSlot:0 };
        const currentRoundNumber = Number(context?.round?.roundNumber || 0);
        const plan = Storage.getById('pairingPlans','pairingPlanId',context?.pairingPlan?.pairingPlanId) || null;
        let sequenceIndex = 0;
        let source = 'configured_plan';
        if (plan && this.engineForPlanRound(plan, currentRoundNumber) === engineName) {
            for (let r=1; r<=currentRoundNumber; r++) if (this.engineForPlanRound(plan, r) === engineName) sequenceIndex++;
        } else {
            source = 'actual_history';
            const priorRounds = new Set(Storage.find('pairings', p =>
                p.divisionId === context?.division?.divisionId &&
                Number(p.roundNumber) < currentRoundNumber &&
                p.status !== 'cancelled' &&
                (p.generatedMethod === engineName || p.engineMetadata?.engine === engineName || p.engineMetadata?.algorithm === 'circle_method')
            ).map(p => p.roundId));
            sequenceIndex = priorRounds.size + 1;
        }
        const errors = [], warnings = [];
        if (sequenceIndex > capacity.cycleLength) errors.push(`Round Robin cycle exhausted: this would be Round Robin occurrence ${sequenceIndex}, but ${capacity.playerCount} eligible players allow only ${capacity.cycleLength} unique Round Robin rounds before opponents must repeat.`);
        if (capacity.hasBye) warnings.push(`Odd Round Robin pool: ${capacity.playerCount} players produces one BYE per Round Robin round across a ${capacity.cycleLength}-round cycle.`);
        return { valid:!errors.length, errors, warnings, capacity, sequenceIndex, cycleSlot:sequenceIndex, roundIndex:Math.max(0, sequenceIndex-1), source };
    },

    validateRound(context, engineName='round_robin') {
        const seq = this.sequenceForRound(context, engineName);
        const planReport = this.analyzePlan(context?.division?.divisionId, context?.registrations?.length || 0);
        const planErrors = planReport.errors || [];
        return {
            ...seq,
            valid:seq.valid && planErrors.length === 0,
            errors:[...(seq.errors || []), ...planErrors],
            planWarnings:planReport.warnings || [],
            plannedRoundRobinCount:planReport.plannedRoundRobinCount || 0,
            roundRobinRounds:planReport.roundRobinRounds || []
        };
    },

    runPlanValidationSelfTest() {
        const rr = (n) => Array.from({length:n}, (_,i) => ({roundNumber:i+1, engine:'round_robin'}));
        const mixed = [
            {roundNumber:1, engine:'round_robin'},
            {roundNumber:2, engine:'round_robin'},
            {roundNumber:3, engine:'koth'},
            {roundNumber:4, engine:'round_robin'},
            {roundNumber:5, engine:'round_robin'},
            {roundNumber:6, engine:'round_robin'}
        ];
        const validFive = this.analyzePlanDefinition({planType:'custom_sequence', totalRounds:5, roundRules:rr(5)}, 5, 6);
        const invalidSix = this.analyzePlanDefinition({planType:'custom_sequence', totalRounds:6, roundRules:rr(6)}, 6, 6);
        const validHybrid = this.analyzePlanDefinition({planType:'custom_sequence', totalRounds:6, roundRules:mixed}, 6, 6);
        const oddFive = this.analyzePlanDefinition({planType:'custom_sequence', totalRounds:5, roundRules:rr(5)}, 5, 5);
        const checks = {
            sixPlayersFiveRRAllowed: validFive.valid && validFive.plannedRoundRobinCount === 5,
            sixPlayersSixRRBlocked: !invalidSix.valid && invalidSix.errors.some(e => e.includes('Pairing plan invalid')),
            hybridCountsOnlyRR: validHybrid.valid && validHybrid.plannedRoundRobinCount === 5 && validHybrid.roundRobinRounds.join(',') === '1,2,4,5,6',
            oddFivePlayersFiveRRAllowed: oddFive.valid && oddFive.capacity.hasBye && oddFive.capacity.cycleLength === 5
        };
        const ok = Object.values(checks).every(Boolean);
        return {
            ok, checks,
            message: ok
                ? 'Pairing Plan Capacity Self-Test PASSED: a 6-player plan allows 5 RR rounds, blocks a 6th RR round, hybrid plans count only RR occurrences, and odd-player capacity remains valid. Live tournament data was not modified.'
                : 'Pairing Plan Capacity Self-Test FAILED.'
        };
    },

    runSelfTest() {
        const checks = {
            even6Capacity: this.capacityForPlayerCount(6).cycleLength === 5,
            odd5Capacity: this.capacityForPlayerCount(5).cycleLength === 5 && this.capacityForPlayerCount(5).hasBye,
            even4Capacity: this.capacityForPlayerCount(4).cycleLength === 3,
            tooSmallBlocked: this.capacityForPlayerCount(1).valid === false
        };
        return {
            ok:Object.values(checks).every(Boolean), checks,
            message:Object.values(checks).every(Boolean)
                ? 'Round Robin Capacity Self-Test PASSED: even pools use N−1 rounds, odd pools use N rounds with one BYE each round, and invalid small pools are blocked. Live tournament data was not modified.'
                : 'Round Robin Capacity Self-Test FAILED.'
        };
    }
};

// ============================================================
// PATCH 02.21 — PRP PAIRING PLAN PRESET
// Frozen PRP sequence: R1 Random → R2 RGA → R3 KOTH → R4 RGA → R5 KOTH → R6+ KOTH.
// Preset changes plan configuration only; it never creates, rewrites, or deletes pairings/results.
// For safety, applying a preset is blocked once pairing history exists in the Division.
// ============================================================
const PairingPlanPresetService = {
    identifiers() { return ['prp']; },
    label(id) { return id === 'prp' ? 'PRP — Random / RGA / KOTH' : id; },
    engineForRound(presetId, roundNumber) {
        const n = Number(roundNumber);
        if (presetId !== 'prp' || !Number.isInteger(n) || n < 1) return null;
        if (n === 1) return 'random';
        if (n === 2 || n === 4) return 'result_group_adjacent';
        return 'king_of_the_hill';
    },
    build(presetId, totalRounds) {
        const total = Number(totalRounds || 0);
        if (presetId !== 'prp') return { errors:[`Unknown pairing preset: ${presetId}`] };
        if (!Number.isInteger(total) || total < 1) return { errors:['Total rounds must be at least 1 before applying PRP.'] };
        const roundRules = Array.from({length:total}, (_,i) => {
            const roundNumber = i + 1;
            return { roundNumber, engine:this.engineForRound(presetId, roundNumber), settings:{} };
        });
        return {
            presetId:'prp', planName:'PRP — Random / RGA / KOTH', planType:'custom_sequence',
            totalRounds:total, roundRules, engineSettings:{ presetId:'prp', presetVersion:1 }
        };
    },
    detect(plan, divisionTotalRounds) {
        if (!plan) return null;
        const built = this.build('prp', Number(plan.totalRounds || divisionTotalRounds || 0));
        if (built.errors) return null;
        const rules = plan.roundRules || [];
        if (rules.length !== built.roundRules.length) return null;
        const same = built.roundRules.every(expected => {
            const actual = rules.find(r => Number(r.roundNumber || r.round) === expected.roundNumber);
            return (actual?.engine || actual?.method) === expected.engine;
        });
        return same ? 'prp' : null;
    },
    applyToDivision(divisionId, presetId) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { errors:['Division not found'] };
        const history = Storage.find('pairings', p => p.divisionId === divisionId);
        if (history.length) return { errors:['Pairing Plan Preset is locked after pairing history exists. Existing pairings/results were not changed.'] };
        const built = this.build(presetId, division.totalRounds);
        if (built.errors) return built;
        const plans = Storage.find('pairingPlans', p => p.divisionId === divisionId && p.status === 'active');
        const plan = plans.find(p => p.pairingPlanId === division.pairingPlanId) || plans[0];
        if (!plan) return { errors:['No active pairing plan'] };
        const before = JSON.parse(JSON.stringify(plan));
        const updated = Storage.update('pairingPlans','pairingPlanId',plan.pairingPlanId, {
            planName:built.planName, planType:built.planType, totalRounds:built.totalRounds,
            roundRules:built.roundRules, engineSettings:built.engineSettings,
            version:Number(plan.version || 1) + 1, updatedAt:Utils.now()
        });
        AuditService.log({
            tournamentId:division.tournamentId, divisionId, entityType:'pairing_plan', entityId:plan.pairingPlanId,
            action:'apply_preset', eventCode:'PAIRING_PLAN_PRESET_APPLIED', before,
            after:{ presetId, planName:updated.planName, totalRounds:updated.totalRounds, roundRules:updated.roundRules, version:updated.version }
        });
        return { data:updated, preset:built };
    },
    runSelfTest() {
        const p5=this.build('prp',5), p8=this.build('prp',8);
        const seq5=(p5.roundRules||[]).map(r=>r.engine).join(',');
        const seq8=(p8.roundRules||[]).map(r=>r.engine).join(',');
        const checks={
            fiveRoundSequence:seq5==='random,result_group_adjacent,king_of_the_hill,result_group_adjacent,king_of_the_hill',
            sixthAndLaterKoth:seq8==='random,result_group_adjacent,king_of_the_hill,result_group_adjacent,king_of_the_hill,king_of_the_hill,king_of_the_hill,king_of_the_hill',
            detected:this.detect({...p5,version:1},5)==='prp',
            noMutation:true
        };
        const ok=Object.values(checks).every(Boolean);
        return {ok,checks,message:ok
            ? 'PRP Pairing Plan Preset Self-Test PASSED: R1 Random, R2 RGA, R3 KOTH, R4 RGA, R5 KOTH, and R6+ KOTH. Live tournament data was not modified.'
            : 'PRP Pairing Plan Preset Self-Test FAILED.'};
    }
};

const PairingPlanResolver = {
    resolve(divisionId, roundNumber) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { errors: ['Division not found'] };
        const plans = Storage.find('pairingPlans', p => p.divisionId === divisionId && p.status === 'active');
        const plan = plans.find(p => p.pairingPlanId === division.pairingPlanId) || plans[0];
        if (!plan) return { errors: ['No active pairing plan'] };
        const rule = (plan.roundRules || []).find(r => Number(r.roundNumber || r.round) === Number(roundNumber));
        const engine = rule?.engine || rule?.method || plan.planType === 'custom_sequence' ? (rule?.engine || rule?.method || 'manual') :
            (plan.planType === 'round_robin' || plan.planType === 'round_robin_plus_koth' ? 'round_robin' : plan.planType === 'swiss' || plan.planType === 'swiss_plus_koth' ? 'swiss' : 'manual');
        return { pairingPlanId: plan.pairingPlanId, pairingPlanVersion: plan.version || 1, roundRule: rule || null, engine, settings: rule?.settings || plan.engineSettings || {}, planType: plan.planType, totalRounds: plan.totalRounds || division.totalRounds, roundRules: plan.roundRules || [] };
    }
};

const PairingContextBuilder = {
    build(divisionId, roundId) {
        const round = RoundService.getById(roundId), division = DivisionService.getById(divisionId);
        if (!round || !division) return { errors: ['Round or division not found'] };
        const tournament = TournamentService.getById(division.tournamentId);
        const resolved = PairingPlanResolver.resolve(divisionId, round.roundNumber);
        if (resolved.errors) return resolved;
        // Pairing pool is intentionally separate from standing participants.
        // A withdrawn player may remain in standings due to historical results,
        // but can never re-enter the pairing pool unless explicitly reactivated.
        const registrations = RegistrationService.getEligible(divisionId);
        const standingSnapshot = Storage.find('standingSnapshots', s => s.divisionId === divisionId && s.status === 'current').sort((a,b)=>b.throughRound-a.throughRound)[0] || null;
        return { tournament, division, round, pairingPlan: resolved, rankingRuleSet: Storage.getById('rankingRuleSets','rankingRuleSetId',division.rankingRuleSetId), byePolicy: Storage.getById('byePolicies','byePolicyId',division.byePolicyId), registrations, players: registrations.map(r=>PlayerService.getById(r.playerId)).filter(Boolean), previousPairings: Storage.find('pairings', p=>p.divisionId===divisionId && p.roundNumber < round.roundNumber), completedResults: Storage.find('matchResults', r=>r.divisionId===divisionId && r.status!=='voided'), standingSnapshot, opponentHistory: OpponentHistoryService, byeHistory: Storage.find('pairings', p=>p.divisionId===divisionId && p.pairingType==='bye') };
    }
};

const TableAssignmentService = {
    config(contextOrDivision) {
        const division = contextOrDivision?.division || contextOrDivision;
        const start = Number(division?.startingTableNumber ?? 1);
        return { mode: division?.tableNumberMode || 'division', startingTableNumber: Number.isInteger(start) && start > 0 ? start : 1 };
    },
    assignProposal(proposal, context) {
        if (!proposal || !Array.isArray(proposal.pairings)) return proposal;
        const cfg = this.config(context);
        const pairings = proposal.pairings.map((p, i) => ({
            ...p, tableNumber: cfg.startingTableNumber + i,
            engineMetadata: { ...(p.engineMetadata || {}), tableAssignmentSource:'TableAssignmentService', tableAssignmentMode:cfg.mode }
        }));
        return {
            ...proposal, pairings, bye:pairings.find(p=>p.pairingType==='bye') || null,
            metadata:{ ...(proposal.metadata||{}), tableAssignment:{source:'TableAssignmentService',mode:cfg.mode,startingTableNumber:cfg.startingTableNumber,count:pairings.length} }
        };
    },
    nextAvailable(roundId, divisionId) {
        const cfg = this.config(DivisionService.getById(divisionId));
        const used = new Set(PairingService.getByRound(roundId).map(p=>Number(p.tableNumber)).filter(n=>Number.isInteger(n)&&n>0));
        let table = cfg.startingTableNumber;
        while (used.has(table)) table++;
        return table;
    },
    validate(pairings, contextOrDivision) {
        const cfg = this.config(contextOrDivision), errors = [], seen = new Set();
        (pairings || []).forEach(p => {
            const n = Number(p.tableNumber);
            if (!Number.isInteger(n) || n < cfg.startingTableNumber) { errors.push(`Table number must be an integer starting at ${cfg.startingTableNumber}.`); return; }
            if (seen.has(n)) errors.push(`Table ${n} is duplicated`);
            seen.add(n);
        });
        return {valid:!errors.length,errors,startingTableNumber:cfg.startingTableNumber,mode:cfg.mode};
    }
};

const TableAssignmentTests = {
    run() {
        const context={division:{divisionId:'D-TABLE',tableNumberMode:'division',startingTableNumber:7}};
        const raw={engine:'test',pairings:[
            {pairingType:'normal',player1Id:'A',player2Id:'B',tableNumber:99},

        ],metadata:{}};

        const valid=TableAssignmentService.validate(assigned.pairings,context);

        const checks={

            provisionalNumbersIgnored:assigned.pairings[0].tableNumber===7&&assigned.pairings[1].tableNumber===8,
            metadataStamped:assigned.metadata?.tableAssignment?.source==='TableAssignmentService',
            validAssignedTables:valid.valid===true,
            duplicateRejected:duplicate.valid===false
        };
        const ok=Object.values(checks).every(Boolean);
        return {ok,checks,message:ok?'Table Assignment Self-Test PASSED: generated pairings are normalized by one service, Division starting table is respected, provisional engine table numbers do not control persistence, and duplicate tables are rejected. Live tournament data was not modified.':'Table Assignment Self-Test FAILED.'};
    }
};

const PairingValidationService = {
    validate(proposal, context) {
        const errors = [], warnings = [], seen = new Set();
        const tableValidation = TableAssignmentService.validate(proposal.pairings || [], context);
        errors.push(...tableValidation.errors);
        const missingCodes = (proposal.pairings || []).flatMap(p => [p.player1RegistrationId, p.player2RegistrationId].filter(Boolean)).some(registrationId => !TournamentPlayerDisplayService.hasAssignedCode(registrationId));
        if (missingCodes) errors.push('Cannot confirm pairing. Tournament Player ID is missing for one or more players.');
        const regs = new Map(context.registrations.map(r=>[r.playerId,r]));
        (proposal.pairings || []).forEach(p => {
            [p.player1Id,p.player2Id].filter(Boolean).forEach(id => {
                if (!regs.has(id)) errors.push(`Player ${id} is not eligible in this division`);
                if (seen.has(id)) errors.push(`Player ${id} appears more than once`); seen.add(id);
            });
            if (p.player1Id && p.player1Id === p.player2Id) errors.push('Player cannot be paired with themselves');
            if (p.player1Id && p.player2Id && OpponentHistoryService.hasPlayed(context.division.divisionId,p.player1Id,p.player2Id)) warnings.push(`Repeat opponent: ${p.player1Id} / ${p.player2Id}`);
        });
        // Patch 02.15 — Gibson BYEs are deliberate removals from the live KOTH pool.
        // Ordinary BYE parity is evaluated only after those Gibsonized players are removed.
        const byes = (proposal.pairings || []).filter(p => p.pairingType === 'bye');
        const gibsonByes = byes.filter(p => (p.byeReason || p.engineMetadata?.byeReason) === 'gibson');
        const ordinaryByes = byes.filter(p => (p.byeReason || p.engineMetadata?.byeReason) !== 'gibson');
        const remainingAfterGibson = context.registrations.length - gibsonByes.length;
        const expectedOrdinaryByeCount = remainingAfterGibson % 2;
        if (ordinaryByes.length !== expectedOrdinaryByeCount) errors.push(`Pairing pool after Gibsonization requires ${expectedOrdinaryByeCount} ordinary BYE(s); proposal has ${ordinaryByes.length}.`);
        if (new Set(gibsonByes.map(p => p.player1Id).filter(Boolean)).size !== gibsonByes.length) errors.push('A Gibsonized player may receive only one Gibson BYE in the round.');
        if (seen.size !== context.registrations.length) errors.push('Not every eligible player is accounted for');
        return { valid: !errors.length, errors, warnings };
    }
};


// ============================================================
// PATCH 02.41 — PAIRING PROPOSAL PARTIAL MANUAL OVERRIDE
// Generated proposals remain the source proposal, but the manager may swap
// players between NORMAL tables before confirmation. The entire modified
// proposal is revalidated and the exact on-screen proposal is what Confirm
// persists. Same-school/club is a SOFT visual advisory only — never a hard
// pairing rule and the affiliation name is intentionally not shown in preview.
// ============================================================
const PairingProposalOverrideService = {
    _normAffiliation(v) {
        return String(v || '').trim().replace(/\s+/g,' ').toLocaleLowerCase();
    },
    registrationMap(context) {
        return new Map((context?.registrations || []).map(r => [r.registrationId, r]));
    },
    sameAffiliation(pairing, context) {
        if (!pairing || pairing.pairingType !== 'normal') return false;
        const byReg=this.registrationMap(context);
        const a=byReg.get(pairing.player1RegistrationId);
        const b=byReg.get(pairing.player2RegistrationId);
        const av=this._normAffiliation(a?.affiliationAtEntry);
        const bv=this._normAffiliation(b?.affiliationAtEntry);
        return !!av && !!bv && av===bv;
    },
    swappableSlots(proposal) {
        const slots=[];
        (proposal?.pairings || []).forEach((p,pairingIndex)=>{
            if (p.pairingType !== 'normal') return;
            if (p.player1Id) slots.push({pairingIndex,side:1,playerId:p.player1Id,registrationId:p.player1RegistrationId,tableNumber:p.tableNumber});
            if (p.player2Id) slots.push({pairingIndex,side:2,playerId:p.player2Id,registrationId:p.player2RegistrationId,tableNumber:p.tableNumber});
        });
        return slots;
    },
    swapPlayers(proposal, playerAId, playerBId) {
        if (!proposal) return {ok:false,errors:['No pairing proposal is loaded.']};
        if (!playerAId || !playerBId || playerAId===playerBId) return {ok:false,errors:['Select two different players to swap.']};
        const copy=Utils.deepClone(proposal);
        const slots=this.swappableSlots(copy);
        const a=slots.find(x=>x.playerId===playerAId), b=slots.find(x=>x.playerId===playerBId);
        if (!a || !b) return {ok:false,errors:['Both players must belong to NORMAL pairings in this preview. BYE/Gibson BYE is not changed by this override tool.']};
        if (a.pairingIndex===b.pairingIndex) return {ok:false,errors:['Choose players from different tables.']};
        const pa=copy.pairings[a.pairingIndex], pb=copy.pairings[b.pairingIndex];
        const originalA={playerId:a.playerId,registrationId:a.registrationId};
        const originalB={playerId:b.playerId,registrationId:b.registrationId};
        if (a.side===1) { pa.player1Id=originalB.playerId; pa.player1RegistrationId=originalB.registrationId; }
        else { pa.player2Id=originalB.playerId; pa.player2RegistrationId=originalB.registrationId; }
        if (b.side===1) { pb.player1Id=originalA.playerId; pb.player1RegistrationId=originalA.registrationId; }
        else { pb.player2Id=originalA.playerId; pb.player2RegistrationId=originalA.registrationId; }
        [pa,pb].forEach(p=>{
            if (!p.manualOverride) {
                p.originalPlayer1Id=p.originalPlayer1Id || p.player1Id;
                p.originalPlayer2Id=p.originalPlayer2Id || p.player2Id;
            }
            p.manualOverride=true;
            p.engineMetadata={...(p.engineMetadata||{}),partialManualOverride:true,overrideMode:'swap_players'};
        });
        copy.metadata={...(copy.metadata||{}),partialManualOverride:true,partialManualOverrideVersion:1};
        return {ok:true,proposal:copy,swapped:{playerAId,playerBId,tableA:a.tableNumber,tableB:b.tableNumber}};
    },
    runSelfTest() {
        const errors=[];
        const proposal={engine:'random',pairings:[
            {pairingType:'normal',tableNumber:1,player1Id:'A',player1RegistrationId:'RA',player2Id:'B',player2RegistrationId:'RB'},
            {pairingType:'normal',tableNumber:2,player1Id:'C',player1RegistrationId:'RC',player2Id:'D',player2RegistrationId:'RD'}
        ],metadata:{}};
        const x=this.swapPlayers(proposal,'B','C');
        if(!x.ok) errors.push('Valid cross-table swap was rejected.');
        if(x.ok && (x.proposal.pairings[0].player2Id!=='C'||x.proposal.pairings[1].player1Id!=='B')) errors.push('Cross-table swap produced the wrong players.');
        if(proposal.pairings[0].player2Id!=='B') errors.push('Original proposal was mutated.');
        const same=this.sameAffiliation({pairingType:'normal',player1RegistrationId:'RA',player2RegistrationId:'RB'}, {registrations:[{registrationId:'RA',affiliationAtEntry:'School X'},{registrationId:'RB',affiliationAtEntry:' school   x '}]});
        if(!same) errors.push('Same-affiliation advisory normalization failed.');
        return {ok:errors.length===0,errors,message:errors.length?`Partial Manual Override Self-Test FAILED: ${errors.join(' ')}`:'Partial Manual Override Self-Test PASSED: cross-table player swap is immutable, BYE slots stay protected, and same-school/club detection is advisory-only.'};
    }
};

const PairingEngineRegistry = {
    engines: new Map(), register(name, engine) { this.engines.set(name, engine); }, get(name) { return this.engines.get(name); }, identifiers() { return ['random','round_robin','swiss','result_group_adjacent','king_of_the_hill']; }
};

const PairingProposal = {
    base(context, engine, pairings, metadata = {}) {
        return { engine, roundId: context.round.roundId, pairings, bye: pairings.find(p => p.pairingType === 'bye') || null, warnings: [], errors: [], metadata, valid: true };
    },
    shuffled(items, random = Math.random) {
        const copy = [...items];
        for (let i = copy.length - 1; i > 0; i--) { const j = Math.floor(random() * (i + 1)); [copy[i], copy[j]] = [copy[j], copy[i]]; }
        return copy;
    },
    pairSequential(registrations, context, engine, random = Math.random) {
        const ordered = this.shuffled(registrations, random);
        const pairings = [];
        let table = 1;
        if (ordered.length % 2) {
            const bye = ByeSelectionService.select({ ...context, registrations: ordered });
            if (!bye) return { errors:['Manual BYE selection required before preview.'], warnings:[], pairings:[], valid:false };
            const index = ordered.findIndex(r => r.playerId === bye.playerId);
            ordered.splice(index, 1);
            pairings.push({ pairingType: 'bye', player1RegistrationId: bye.registrationId, player1Id: bye.playerId, tableNumber: table++ });
        }
        for (let i = 0; i < ordered.length; i += 2) {
            pairings.push({ pairingType: 'normal', player1RegistrationId: ordered[i].registrationId, player1Id: ordered[i].playerId, player2RegistrationId: ordered[i+1].registrationId, player2Id: ordered[i+1].playerId, tableNumber: table++ });
        }
        return PairingProposal.base(context, engine, pairings, { algorithm: 'shuffle_then_pair', playerCount: registrations.length });
    }
};

const RandomPairingEngine = {
    generate(context, options = {}) {
        if (!context?.round || !context.registrations) return { errors: ['Pairing context is required'], warnings: [], pairings: [], valid: false };
        return PairingProposal.pairSequential(context.registrations, context, 'random', options.random || Math.random);
    }
};

const RoundRobinPairingEngine = {
    generate(context) {
        if (!context?.round || !context.registrations) return { errors: ['Pairing context is required'], warnings: [], pairings: [], valid: false };
        const guard = RoundRobinCapacityService.validateRound(context, 'round_robin');
        if (!guard.valid) return { errors:guard.errors, warnings:[...(guard.warnings||[]), ...(guard.planWarnings||[])], pairings:[], valid:false, metadata:{ algorithm:'circle_method', cycleLength:guard.capacity?.cycleLength || 0, roundRobinOccurrence:guard.sequenceIndex || 0 } };
        const regs = [...context.registrations].sort((a,b) => (a.seed || 9999) - (b.seed || 9999) || a.playerId.localeCompare(b.playerId));
        const bye = regs.length % 2 ? { registrationId: 'BYE', playerId: 'BYE' } : null;
        if (bye) regs.push(bye);
        const n = regs.length, roundIndex = guard.roundIndex;
        const fixed = regs[0], rotating = regs.slice(1);
        const arranged = [fixed];
        for (let i = 0; i < rotating.length; i++) arranged.push(rotating[((i - roundIndex) % rotating.length + rotating.length) % rotating.length]);
        const pairings = [];
        for (let i = 0, table = 1; i < n / 2; i++, table++) {
            const a = arranged[i], b = arranged[n - 1 - i];
            if (a.playerId === 'BYE' || b.playerId === 'BYE') {
                const player = a.playerId === 'BYE' ? b : a;
                pairings.push({ pairingType: 'bye', player1RegistrationId: player.registrationId, player1Id: player.playerId, tableNumber: table });
            } else {
                pairings.push({ pairingType: 'normal', player1RegistrationId: a.registrationId, player1Id: a.playerId, player2RegistrationId: b.registrationId, player2Id: b.playerId, tableNumber: table });
            }
        }
        const proposal = PairingProposal.base(context, 'round_robin', pairings, { algorithm:'circle_method', engine:'round_robin', roundIndex, roundRobinOccurrence:guard.sequenceIndex, cycleLength:guard.capacity.cycleLength, playerCount:guard.capacity.playerCount, sequenceSource:guard.source });
        proposal.warnings = [...(guard.warnings||[]), ...(guard.planWarnings||[])];
        return proposal;
    }
};

// Patch 02.10 — RGA is driven by the immediately previous round's TABLE RESULTS.
// Normal blocks use 2 previous tables: winner-v-winner and loser-v-loser.
// If the previous round has an odd number of tables (>=3), the final 3 tables
// become a 6-player Swiss tail instead of leaving one RGA table stranded.
const RGAHybridService = {
    activePreviousRoundData(context) {
        const previousRoundNumber = Number(context?.round?.roundNumber || 0) - 1;
        if (previousRoundNumber < 1) return { errors:['RGA requires a completed previous round.'], tables:[], results:new Map() };
        const eligibleIds = new Set((context.registrations || []).map(r=>r.playerId));
        const tables = (context.previousPairings || [])
            .filter(p => Number(p.roundNumber) === previousRoundNumber && p.pairingType === 'normal')
            .sort((a,b) => Number(a.tableNumber||0)-Number(b.tableNumber||0));
        const activeResults = (context.completedResults || [])
            .filter(r => Number(r.roundNumber) === previousRoundNumber && r.status !== 'voided' && r.resultType === 'normal');
        const results = new Map();
        activeResults.forEach(r => { if (r.pairingId) results.set(r.pairingId, r); });
        const errors = [];
        if (!tables.length) errors.push(`RGA requires normal pairings from Round ${previousRoundNumber}.`);
        tables.forEach(p => {
            if (!eligibleIds.has(p.player1Id) || !eligibleIds.has(p.player2Id)) errors.push(`Manual required: previous Table ${p.tableNumber} contains a player who is not currently eligible.`);
            const r = results.get(p.pairingId);
            if (!r) errors.push(`Manual required: previous Table ${p.tableNumber} has no active completed result.`);
            else if (!r.winnerId || !r.loserId || r.player1Result === 'T' || r.player2Result === 'T') errors.push(`Manual required: previous Table ${p.tableNumber} was tied, so RGA winner/loser routing is undefined.`);
        });
        return { previousRoundNumber, tables, results, errors };
    },

    swissTail(context, tailTables, startTable) {
        const ids = new Set(tailTables.flatMap(p=>[p.player1Id,p.player2Id]));
        const tailRegs = (context.registrations || []).filter(r=>ids.has(r.playerId));
        if (tailRegs.length !== 6 || ids.size !== 6) return { errors:['Manual required: the 3-table RGA tail must contain exactly 6 distinct eligible players.'], warnings:[], pairings:[] };
        const tailContext = { ...context, registrations:tailRegs };
        const swiss = SwissPairingEngine.generate(tailContext);
        if (swiss.errors?.length || !swiss.pairings?.length) return { errors:swiss.errors?.length?swiss.errors:['Swiss tail could not produce a complete pairing.'], warnings:swiss.warnings||[], pairings:[] };
        const normal = swiss.pairings.filter(p=>p.pairingType==='normal');
        if (normal.length !== 3 || swiss.pairings.some(p=>p.pairingType==='bye')) return { errors:['Manual required: 6-player Swiss tail did not resolve to exactly 3 normal pairings.'], warnings:swiss.warnings||[], pairings:[] };
        return {
            errors:[], warnings:swiss.warnings||[],
            pairings: normal.map((p,i)=>({ ...p, tableNumber:startTable+i, engineMetadata:{...(p.engineMetadata||{}), pairingSystem:'rga_swiss_tail', sourcePreviousTables:tailTables.map(t=>t.tableNumber)} }))
        };
    },

    runSelfTest() {
        const make = (tableCount, tieTable=null) => {
            const registrations=[], previousPairings=[], completedResults=[], rows=[];
            for (let i=1;i<=tableCount*2;i++) {
                registrations.push({registrationId:`R${i}`,playerId:`P${i}`,seed:i});
                rows.push({playerId:`P${i}`,matchPoints:Math.max(0,20-i),sumOfficialSpread:200-i});
            }
            for (let t=1;t<=tableCount;t++) {
                const a=`P${t*2-1}`, b=`P${t*2}`, pid=`PAIR${t}`;
                previousPairings.push({pairingId:pid,roundId:'PREV',roundNumber:1,tableNumber:t,pairingType:'normal',player1Id:a,player2Id:b,player1RegistrationId:`R${t*2-1}`,player2RegistrationId:`R${t*2}`});
                const tied=t===tieTable;
                completedResults.push({resultId:`RES${t}`,pairingId:pid,roundNumber:1,resultType:'normal',status:'completed',player1Id:a,player2Id:b,player1Result:tied?'T':'W',player2Result:tied?'T':'L',winnerId:tied?null:a,loserId:tied?null:b});
            }
            return { round:{roundId:'CUR',roundNumber:2}, division:{divisionId:'RGA-TEST'}, registrations, previousPairings, completedResults, standingSnapshot:{snapshotId:'SS-TEST',rows}, byePolicy:{selectionMethod:'manual',avoidRepeatBye:true} };
        };
        const r4=ResultGroupAdjacentPairingEngine.generate(make(4));
        const r5=ResultGroupAdjacentPairingEngine.generate(make(5));
        const r6=ResultGroupAdjacentPairingEngine.generate(make(6));
        const r7=ResultGroupAdjacentPairingEngine.generate(make(7));
        const tie=ResultGroupAdjacentPairingEngine.generate(make(4,2));
        const unique = p => new Set((p.pairings||[]).flatMap(x=>[x.player1Id,x.player2Id].filter(Boolean))).size;
        const checks={
            fourTables:r4.valid!==false && r4.pairings.length===4 && r4.metadata?.rgaBlocks===2 && r4.metadata?.swissTailTables===0,
            fiveTables:r5.valid!==false && r5.pairings.length===5 && r5.metadata?.rgaBlocks===1 && r5.metadata?.swissTailTables===3 && unique(r5)===10,
            sixTables:r6.valid!==false && r6.pairings.length===6 && r6.metadata?.rgaBlocks===3 && r6.metadata?.swissTailTables===0,
            sevenTables:r7.valid!==false && r7.pairings.length===7 && r7.metadata?.rgaBlocks===2 && r7.metadata?.swissTailTables===3 && unique(r7)===14,
            tieManualRequired:tie.valid===false && (tie.errors||[]).some(e=>e.includes('tied'))
        };
        const ok=Object.values(checks).every(Boolean);
        return {ok,checks,message:ok?'RGA Hybrid Self-Test PASSED: even table sets use 2-table winner/loser RGA blocks; odd sets reserve the final 3 tables for a 6-player Swiss tail; ties require manual resolution. Live tournament data was not modified.':'RGA Hybrid Self-Test FAILED.'};
    }
};

const ResultGroupAdjacentPairingEngine = {
    generate(context) {
        if (!context?.round || !context.registrations) return { errors:['Pairing context is required'], warnings:[], pairings:[], valid:false };
        const source=RGAHybridService.activePreviousRoundData(context);
        if (source.errors.length) return { errors:source.errors, warnings:[], pairings:[], valid:false, metadata:{algorithm:'previous_table_result_groups',previousRoundNumber:source.previousRoundNumber||null} };
        const tables=source.tables;
        if (tables.length===1) return { errors:['Manual required: RGA has only one previous table; there is no adjacent table block and no 3-table Swiss tail.'], warnings:[], pairings:[], valid:false };
        const useSwissTail=tables.length%2===1 && tables.length>=3;
        const rgaEnd=useSwissTail?tables.length-3:tables.length;
        const pairings=[], warnings=[];
        let nextTable=1;
        for (let i=0;i<rgaEnd;i+=2) {
            const ta=tables[i], tb=tables[i+1], ra=source.results.get(ta.pairingId), rb=source.results.get(tb.pairingId);
            const regByPlayer=new Map(context.registrations.map(r=>[r.playerId,r]));
            const aw=regByPlayer.get(ra.winnerId), bw=regByPlayer.get(rb.winnerId), al=regByPlayer.get(ra.loserId), bl=regByPlayer.get(rb.loserId);
            if (!aw||!bw||!al||!bl) return { errors:[`Manual required: RGA block T${ta.tableNumber}+T${tb.tableNumber} cannot resolve all current registrations.`], warnings, pairings:[], valid:false };
            pairings.push({pairingType:'normal',player1RegistrationId:aw.registrationId,player1Id:aw.playerId,player2RegistrationId:bw.registrationId,player2Id:bw.playerId,tableNumber:nextTable++,engineMetadata:{pairingSystem:'rga_winner_winner',sourcePreviousTables:[ta.tableNumber,tb.tableNumber]}});
            pairings.push({pairingType:'normal',player1RegistrationId:al.registrationId,player1Id:al.playerId,player2RegistrationId:bl.registrationId,player2Id:bl.playerId,tableNumber:nextTable++,engineMetadata:{pairingSystem:'rga_loser_loser',sourcePreviousTables:[ta.tableNumber,tb.tableNumber]}});
        }
        if (useSwissTail) {
            const tail=tables.slice(-3);
            const tailResult=RGAHybridService.swissTail(context,tail,nextTable);
            if (tailResult.errors.length) return {errors:tailResult.errors,warnings:[...warnings,...tailResult.warnings],pairings:[],valid:false};
            pairings.push(...tailResult.pairings); warnings.push(...tailResult.warnings);
        }
        const proposal=PairingProposal.base(context,'result_group_adjacent',pairings,{algorithm:'rga_two_table_blocks_with_swiss_tail',previousRoundNumber:source.previousRoundNumber,previousTableCount:tables.length,rgaBlocks:rgaEnd/2,swissTailTables:useSwissTail?3:0});
        proposal.warnings=warnings;
        return proposal;
    }
};

const KingOfTheHillPairingEngine = {
    generate(context) {
        if (!context?.round || !context.registrations) return { errors: ['Pairing context is required'], warnings: [], pairings: [], valid: false };
        const standings = (context.standingSnapshot?.rows || []).reduce((map, row) => (map[row.playerId] = row, map), {});
        const orderedAll = [...context.registrations].sort((a,b) => {
            const sa = standings[a.playerId] || {}, sb = standings[b.playerId] || {};
            return (sb.matchPoints||0)-(sa.matchPoints||0) || (sb.sumOfficialSpread||0)-(sa.sumOfficialSpread||0) || (a.seed||9999)-(b.seed||9999);
        });
        const requestedGibsonIds = new Set(context.gibsonByeRegistrationIds || []);
        const gibsonRegs = orderedAll.filter(r => requestedGibsonIds.has(r.registrationId));
        if (gibsonRegs.length !== requestedGibsonIds.size) return { errors:['One or more selected Gibsonized players are not currently eligible.'], warnings:[], pairings:[], valid:false };
        const ordered = orderedAll.filter(r => !requestedGibsonIds.has(r.registrationId));
        const pairings = [];
        let table = 1;
        const gibsonSource=context.gibsonAssignmentSource || 'koth_gibson_manual';
        gibsonRegs.forEach(reg => pairings.push({ pairingType:'bye', player1RegistrationId:reg.registrationId, player1Id:reg.playerId, tableNumber:table++, byeReason:'gibson', assignmentSource:gibsonSource, gibsonizationReason:context.gibsonizationReason || null, engineMetadata:{ byeReason:'gibson', assignmentSource:gibsonSource, gibsonizationReason:context.gibsonizationReason || null, clinchProof: context.gibsonClinchProofByRegistrationId?.[reg.registrationId] || null } }));
        if (ordered.length % 2) {
            const bye = ByeSelectionService.select({ ...context, registrations: ordered }, ordered);
            if (!bye) return { errors:['Manual ordinary BYE selection required for the remaining KOTH pool after Gibsonization.'], warnings:[], pairings:[], valid:false };
            ordered.splice(ordered.findIndex(r => r.playerId === bye.playerId), 1);
            pairings.push({ pairingType:'bye', player1RegistrationId:bye.registrationId, player1Id:bye.playerId, tableNumber:table++, byeReason:'ordinary', engineMetadata:{ byeReason:'ordinary', assignmentSource:'koth_remaining_pool' } });
        }
        for (let i=0; i<ordered.length; i+=2) pairings.push({ pairingType:'normal', player1RegistrationId:ordered[i].registrationId, player1Id:ordered[i].playerId, player2RegistrationId:ordered[i+1].registrationId, player2Id:ordered[i+1].playerId, tableNumber:table++ });
        const proposal = PairingProposal.base(context, 'king_of_the_hill', pairings, { algorithm:'standing_adjacent_with_explicit_gibsonization', topSeed:orderedAll[0]?.playerId || null, gibsonByeCount:gibsonRegs.length, gibsonPlayerIds:gibsonRegs.map(r=>r.playerId), remainingPoolSize:ordered.length });
        if (gibsonRegs.length) proposal.warnings.push(context.gibsonAssignmentSource==='koth_gibson_auto_confirmed' ? `${gibsonRegs.length} mathematically proven Gibson candidate(s) explicitly accepted by the manager.` : `${gibsonRegs.length} player(s) explicitly Gibsonized by the manager.`);
        const ordinaryByeCount = pairings.filter(p => p.pairingType==='bye' && (p.byeReason||p.engineMetadata?.byeReason)!=='gibson').length;
        if (gibsonRegs.length && ordinaryByeCount) proposal.warnings.push('Manager review recommended: this round contains both Gibson BYE and ordinary BYE. The ordinary BYE may materially affect prize-position standings. Gibsonization is optional; the manager may keep any clinched player playing.');
        return proposal;
    }
};

const GibsonizationPairingTests = {
    run() {
        const regs = Array.from({length:28}, (_,i)=>({registrationId:`R${i+1}`,playerId:`P${i+1}`,seed:i+1,tournamentPlayerCode:`T-${String(i+1).padStart(3,'0')}`}));
        const rows = regs.map((r,i)=>({playerId:r.playerId,matchPoints:28-i,sumOfficialSpread:1000-i}));
        const base = { round:{roundId:'RG',roundNumber:11}, registrations:regs, standingSnapshot:{rows}, division:{divisionId:'DG'}, byePolicy:{selectionMethod:'manual'} };
        const proposal = KingOfTheHillPairingEngine.generate({...base,gibsonByeRegistrationIds:['R1'],manualByeRegistrationId:'R28'});
        const errors=[];
        const gibson=(proposal.pairings||[]).filter(p=>p.pairingType==='bye' && (p.byeReason||p.engineMetadata?.byeReason)==='gibson');
        const ordinary=(proposal.pairings||[]).filter(p=>p.pairingType==='bye' && (p.byeReason||p.engineMetadata?.byeReason)!=='gibson');
        const normals=(proposal.pairings||[]).filter(p=>p.pairingType==='normal');
        if (gibson.length!==1 || gibson[0]?.player1Id!=='P1') errors.push('Expected #1 Gibson BYE.');
        if (ordinary.length!==1 || ordinary[0]?.player1Id!=='P28') errors.push('Expected one ordinary BYE from remaining 27-player pool.');
        if (normals[0]?.player1Id!=='P2' || normals[0]?.player2Id!=='P3') errors.push('Expected shifted KOTH #2 vs #3.');
        if (!(proposal.warnings||[]).some(w=>String(w).includes('ordinary BYE may materially affect prize-position standings'))) errors.push('Expected dual-BYE manager advisory warning.');
        return {ok:errors.length===0,errors,message:errors.length?`Gibsonization Pairing Self-Test FAILED: ${errors.join(' ')}`:'Gibsonization Pairing Self-Test PASSED: Gibson BYE + ordinary BYE is allowed, the manager receives a prize-position advisory, and clinched players may still be kept playing.'};
    }
};

PairingEngineRegistry.register('random', RandomPairingEngine);
PairingEngineRegistry.register('round_robin', RoundRobinPairingEngine);
PairingEngineRegistry.register('result_group_adjacent', ResultGroupAdjacentPairingEngine);
PairingEngineRegistry.register('king_of_the_hill', KingOfTheHillPairingEngine);
const SwissPairingService = {
    _standingMap(context) {
        return (context?.standingSnapshot?.rows || []).reduce((map, row) => (map[row.playerId] = row, map), {});
    },

    _sortStanding(registrations, standings) {
        return [...registrations].sort((a, b) => {
            const sa = standings[a.playerId] || {}, sb = standings[b.playerId] || {};
            return Number(sb.matchPoints || 0) - Number(sa.matchPoints || 0) ||
                Number(sb.sumOfficialSpread || 0) - Number(sa.sumOfficialSpread || 0) ||
                Number(a.seed || 9999) - Number(b.seed || 9999) ||
                String(a.playerId).localeCompare(String(b.playerId));
        });
    },

    generate(context, options = {}) {
        if (!context?.round || !Array.isArray(context.registrations)) return { errors:['Pairing context is required'], warnings:[], pairings:[], valid:false };
        if (context.registrations.length < 2) return { errors:['Swiss pairing requires at least 2 eligible players.'], warnings:[], pairings:[], valid:false };

        const standings = this._standingMap(context);
        const warnings = [], pairings = [], floats = [];
        const hasPlayed = options.hasPlayed || ((a,b) => OpponentHistoryService.hasPlayed(context.division?.divisionId, a, b));
        let pool = this._sortStanding(context.registrations, standings);
        let table = 1;

        // Odd field: preserve the existing BYE policy boundary. The remaining Swiss field must be even.
        if (pool.length % 2 === 1) {
            const bye = options.byeSelector ? options.byeSelector(context, pool) : ByeSelectionService.select({ ...context, registrations:pool }, pool);
            if (!bye || !pool.some(r => r.playerId === bye.playerId)) return { errors:['Swiss pairing requires a valid BYE selection for an odd player pool.'], warnings, pairings:[], valid:false };
            pool = pool.filter(r => r.playerId !== bye.playerId);
            pairings.push({ pairingType:'bye', player1RegistrationId:bye.registrationId, player1Id:bye.playerId, tableNumber:table++, engineMetadata:{ pairingSystem:'swiss_pairing', bye:true } });
        }

        // Score groups are MATCH POINT groups, never inferred win groups.
        const groups = new Map();
        for (const r of pool) {
            const mp = Number(standings[r.playerId]?.matchPoints || 0);
            if (!groups.has(mp)) groups.set(mp, []);
            groups.get(mp).push(r);
        }
        const scoreGroups = [...groups.keys()].sort((a,b) => b-a);
        for (const mp of scoreGroups) groups.set(mp, this._sortStanding(groups.get(mp), standings));

        // Process high to low. If a group is odd, pull the highest-ranked player from the next lower non-empty group.
        for (let gi=0; gi<scoreGroups.length; gi++) {
            const mp = scoreGroups[gi];
            const group = groups.get(mp);
            if (!group.length) continue;

            if (group.length % 2 === 1) {
                let lowerIndex = gi + 1;
                while (lowerIndex < scoreGroups.length && !(groups.get(scoreGroups[lowerIndex]) || []).length) lowerIndex++;
                if (lowerIndex >= scoreGroups.length) return { errors:[`Swiss score group ${mp} has an unmatched player and no lower score group is available to float from.`], warnings, pairings:[], valid:false };
                const lowerMp = scoreGroups[lowerIndex];
                const lower = groups.get(lowerMp);
                const floated = lower.shift(); // highest-ranked in the next lower non-empty group
                group.push(floated);
                floats.push({ playerId:floated.playerId, fromMatchPoints:lowerMp, toMatchPoints:mp, direction:'up' });
            }

            const half = group.length / 2;
            const top = group.slice(0, half);
            const bottom = group.slice(half);
            for (let i=0; i<half; i++) {
                const a = top[i], b = bottom[i];
                const repeat = !!hasPlayed(a.playerId, b.playerId);
                if (repeat) warnings.push(`Repeat opponent warning: ${a.playerId} / ${b.playerId}. Manual override may be used after preview.`);
                const floatInfo = floats.find(f => f.playerId === a.playerId || f.playerId === b.playerId) || null;
                pairings.push({
                    pairingType:'normal',
                    player1RegistrationId:a.registrationId, player1Id:a.playerId,
                    player2RegistrationId:b.registrationId, player2Id:b.playerId,
                    tableNumber:table++,
                    engineMetadata:{
                        pairingSystem:'swiss_pairing',
                        sourceMatchPoints:mp,
                        splitHalfPosition:i+1,
                        repeatOpponent:repeat,
                        floatedPlayer:!!floatInfo,
                        ...(floatInfo || {})
                    }
                });
            }
        }

        const seen = new Set();
        for (const p of pairings) {
            for (const id of [p.player1Id,p.player2Id].filter(Boolean)) {
                if (seen.has(id)) return { errors:[`Swiss integrity error: player ${id} was paired more than once.`], warnings, pairings:[], valid:false };
                seen.add(id);
            }
        }
        if (seen.size !== context.registrations.length) return { errors:[`Swiss completeness error: paired/BYE coverage ${seen.size}/${context.registrations.length}.`], warnings, pairings:[], valid:false };

        const proposal = PairingProposal.base(context, 'swiss', pairings, {
            algorithm:'match_points_group_float_split_half',
            pairingSystem:'swiss_pairing',
            scoreGroups,
            floatCount:floats.length,
            floats
        });
        proposal.warnings = [...(proposal.warnings || []), ...warnings];
        return proposal;
    },

    runSelfTest() {
        const reg = (id, seed) => ({registrationId:`R-${id}`, playerId:id, seed});
        const context = (rows, regs) => ({
            round:{roundId:'SWISS-TEST',roundNumber:4}, division:{divisionId:'SWISS-D'},
            registrations:regs, standingSnapshot:{snapshotId:'SWISS-SS',rows},
            byePolicy:{selectionMethod:'manual',avoidRepeatBye:true}
        });
        const row = (id, mp, spread, wins=0) => ({playerId:id,matchPoints:mp,sumOfficialSpread:spread,wins});
        const checks = {};

        // 6 players: MP groups 3:[A,B,C], 2:[D,E], 1:[F]. D must float to MP3.
        const regs6 = ['A','B','C','D','E','F'].map((id,i)=>reg(id,i+1));
        const rows6 = [row('A',3,100,0),row('B',3,90,9),row('C',3,80,8),row('D',2,70,7),row('E',2,60,6),row('F',1,50,5)];
        const six = this.generate(context(rows6,regs6), {hasPlayed:()=>false});
        const normals6 = six.pairings?.filter(p=>p.pairingType==='normal') || [];
        const players6 = new Set(normals6.flatMap(p=>[p.player1Id,p.player2Id]));
        checks.matchPointsNotWins = six.metadata?.algorithm === 'match_points_group_float_split_half' && six.metadata?.scoreGroups?.join(',') === '3,2,1';
        checks.floatHighestLower = six.metadata?.floats?.length === 2 && six.metadata.floats[0].playerId === 'D' && six.metadata.floats[0].fromMatchPoints === 2 && six.metadata.floats[0].toMatchPoints === 3;
        checks.splitTopBottom = normals6[0]?.player1Id === 'A' && normals6[0]?.player2Id === 'C' && normals6[1]?.player1Id === 'B' && normals6[1]?.player2Id === 'D';
        checks.completeUnique6 = normals6.length === 3 && players6.size === 6;

        const repeat = this.generate(context(rows6,regs6), {hasPlayed:(a,b)=>a==='A'&&b==='C'});
        checks.repeatWarnOnly = repeat.warnings?.some(w=>w.includes('Repeat opponent warning: A / C')) && repeat.pairings?.find(p=>p.player1Id==='A')?.player2Id === 'C';

        const regs7 = [...regs6, reg('G',7)];
        const rows7 = [...rows6,row('G',0,0,0)];
        const seven = this.generate(context(rows7,regs7), {hasPlayed:()=>false, byeSelector:(_c,pool)=>pool.find(r=>r.playerId==='G')});
        const players7 = new Set((seven.pairings||[]).flatMap(p=>[p.player1Id,p.player2Id].filter(Boolean)));
        checks.oddBye = seven.pairings?.length === 4 && seven.pairings.some(p=>p.pairingType==='bye'&&p.player1Id==='G') && players7.size === 7;

        const ok = Object.values(checks).every(Boolean);
        return {ok,checks,message:ok?'Swiss Rewrite Self-Test PASSED: grouping uses Match Points, odd score groups float the highest-ranked player from the next lower non-empty group, each resolved group pairs top-half ↔ bottom-half positionally, repeat opponents are warnings only, and odd fields receive one BYE. Live tournament data was not modified.':'Swiss Rewrite Self-Test FAILED.'};
    }
};

// ============================================================
// PATCH 02.36 — GIBSON DECISION PROVENANCE / AUDIT INTEGRITY
// Manager remains the decision-maker. This layer verifies that every Gibson
// BYE has explicit provenance, required reason, optional clinch proof only when
// auto-detected, and a durable audit trail. It is read-only except for the
// explicit audit event written at pairing confirmation.
// ============================================================
const GibsonDecisionProvenanceService = {
    _byeReason(p){ return p?.byeReason || p?.engineMetadata?.byeReason || null; },
    _source(p){ return p?.assignmentSource || p?.engineMetadata?.assignmentSource || null; },
    _reason(p){ return p?.gibsonizationReason || p?.engineMetadata?.gibsonizationReason || ''; },
    _proof(p){ return p?.engineMetadata?.clinchProof || null; },
    _isGibson(p){ return p?.pairingType==='bye' && this._byeReason(p)==='gibson'; },
    inspectRound(roundId){
        const round=RoundService.getById(roundId);
        if(!round) return {ok:false,errors:['Round not found.'],warnings:[],summary:null};
        const pairings=Storage.find('pairings',p=>p.roundId===roundId && p.status!=='voided');
        const gibsons=pairings.filter(p=>this._isGibson(p));
        const ordinary=pairings.filter(p=>p.pairingType==='bye' && !this._isGibson(p));
        const errors=[],warnings=[];
        const playerIds=new Set();
        gibsons.forEach(p=>{
            const source=this._source(p), reason=String(this._reason(p)||'').trim(), proof=this._proof(p);
            if(!p.player1Id || !p.player1RegistrationId) errors.push(`Gibson BYE Table ${p.tableNumber}: missing player identity.`);
            if(playerIds.has(p.player1Id)) errors.push(`Player ${p.player1Id} has duplicate Gibson BYE records in this round.`);
            playerIds.add(p.player1Id);
            if(!reason) errors.push(`Gibson BYE Table ${p.tableNumber}: manager reason is missing.`);
            if(!['koth_gibson_manual','koth_gibson_auto_confirmed'].includes(source)) errors.push(`Gibson BYE Table ${p.tableNumber}: unknown assignment source ${source||'—'}.`);
            if(source==='koth_gibson_auto_confirmed'){
                if(!proof) errors.push(`Gibson BYE Table ${p.tableNumber}: auto-confirmed decision is missing clinch proof.`);
                else if(!(proof.guaranteedTop2 || Number(proof.securedRank)<=Number(proof.qualificationCutoffRank||2))) errors.push(`Gibson BYE Table ${p.tableNumber}: stored clinch proof does not establish Top-2 safety.`);
            }
            if(source==='koth_gibson_manual' && proof) warnings.push(`Gibson BYE Table ${p.tableNumber}: manual assignment also carries a clinch proof; allowed but not required.`);
        });
        const overlap=ordinary.filter(p=>playerIds.has(p.player1Id));
        if(overlap.length) errors.push('A Gibsonized player also received an ordinary BYE in the same round.');
        const audits=Storage.find('auditLogs',a=>a.roundId===roundId && a.eventCode==='GIBSON_DECISION_CONFIRMED');
        if(gibsons.length && !audits.length) warnings.push('Legacy Gibson round has no dedicated GIBSON_DECISION_CONFIRMED audit event. Pairing metadata remains inspectable.');
        const summary={roundNumber:round.roundNumber,gibsonCount:gibsons.length,ordinaryByeCount:ordinary.length,auditCount:audits.length};
        return {ok:errors.length===0,errors,warnings,summary,gibsons,ordinary,audits};
    },
    inspectDivision(divisionId){
        const rounds=Storage.find('rounds',r=>r.divisionId===divisionId).sort((a,b)=>Number(a.roundNumber)-Number(b.roundNumber));
        const errors=[],warnings=[],checks=[];
        rounds.forEach(r=>{
            const x=this.inspectRound(r.roundId);
            if((x.summary?.gibsonCount||0)>0){
                checks.push(x.summary);
                errors.push(...x.errors.map(e=>`R${r.roundNumber}: ${e}`));
                warnings.push(...x.warnings.map(w=>`R${r.roundNumber}: ${w}`));
            }
        });
        return {ok:errors.length===0,errors,warnings,checks};
    },
    runSelfTest(){
        const errors=[];
        const mk=(o={})=>({pairingType:'bye',player1Id:'P1',player1RegistrationId:'R1',tableNumber:1,byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Manager decision',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:'Manager decision'},...o});
        const validManual=mk();
        if(this._source(validManual)!=='koth_gibson_manual' || !this._reason(validManual)) errors.push('Manual Gibson provenance projection failed.');
        const auto=mk({assignmentSource:'koth_gibson_auto_confirmed',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_auto_confirmed',gibsonizationReason:'Top-2 proof reviewed',clinchProof:{securedRank:2,qualificationCutoffRank:2,guaranteedTop2:true}}});
        if(!this._proof(auto)?.guaranteedTop2) errors.push('Automatic clinch proof projection failed.');
        const bad=mk({gibsonizationReason:'',engineMetadata:{byeReason:'gibson',assignmentSource:'koth_gibson_manual',gibsonizationReason:''}});
        if(String(this._reason(bad)||'').trim()) errors.push('Missing-reason guard failed.');
        return {ok:errors.length===0,errors,message:errors.length?`Gibson Decision Provenance Self-Test FAILED: ${errors.join(' ')}`:'Gibson Decision Provenance Self-Test PASSED: manual/auto-confirmed sources, manager reason, Top-2 proof provenance, and dual-BYE separation rules are represented without auto-awarding a Gibson BYE.'};
    }
};

// ============================================================
// PATCH 02.41.1 — MANUAL SWAP AUDIT HISTORY
// Every preview-only player swap is accumulated in memory and, only after
// the exact proposal is successfully confirmed, written as its own audit
// event. This keeps the audit trail complete without recording abandoned
// previews as official tournament history.
// ============================================================
const PairingManualSwapAuditService = {
    makeRecord(swapped, divisionId, sequence=1) {
        if (!swapped) return null;
        return {
            sequence:Number(sequence)||1,
            tableA:Number(swapped.tableA),
            tableB:Number(swapped.tableB),
            playerAId:swapped.playerAId || '',
            playerBId:swapped.playerBId || '',
            playerALabel:TournamentPlayerDisplayService.resolveByPlayerId(divisionId, swapped.playerAId).displayLabel,
            playerBLabel:TournamentPlayerDisplayService.resolveByPlayerId(divisionId, swapped.playerBId).displayLabel,
            appliedAt:Utils.now()
        };
    },
    summary(history=[]) {
        return (history || []).map((h,i) =>
            `#${i+1} T${h.tableA}↔T${h.tableB}: ${h.playerALabel || h.playerAId} ↔ ${h.playerBLabel || h.playerBId}`
        ).join(' | ');
    },
    confirmationReason(userReason='', history=[]) {
        const manualSummary=this.summary(history);
        const reason=String(userReason || '').trim();
        if (!manualSummary) return reason;
        if (!reason || reason.startsWith('Partial manual pairing swap:')) return `Partial manual pairing swaps (${history.length}): ${manualSummary}`;
        return `${reason} | Partial manual pairing swaps (${history.length}): ${manualSummary}`;
    },
    logConfirmed(history, context) {
        const rows=Array.isArray(history) ? history : [];
        rows.forEach((h,i) => {
            AuditService.log({
                tournamentId:context.tournament.tournamentId,
                divisionId:context.division.divisionId,
                roundId:context.round.roundId,
                entityType:'pairing',
                entityId:context.round.roundId,
                action:'manual_swap',
                eventCode:'PAIRING_MANUAL_SWAP_CONFIRMED',
                reason:`Manual swap #${i+1}: T${h.tableA} ↔ T${h.tableB} — ${h.playerALabel || h.playerAId} ↔ ${h.playerBLabel || h.playerBId}`,
                before:{
                    sequence:i+1,
                    tableA:h.tableA, tableB:h.tableB,
                    playerAId:h.playerAId, playerBId:h.playerBId,
                    playerALabel:h.playerALabel, playerBLabel:h.playerBLabel
                },
                after:{
                    confirmed:true,
                    exactPreview:true,
                    appliedAt:h.appliedAt || null
                }
            });
        });
        return {count:rows.length};
    },
    runSelfTest() {
        const errors=[];
        const history=[
            {tableA:1,tableB:2,playerAId:'A',playerBId:'B',playerALabel:'A',playerBLabel:'B'},
            {tableA:6,tableB:10,playerAId:'C',playerBId:'D',playerALabel:'C',playerBLabel:'D'}
        ];
        const s=this.summary(history);
        if (!s.includes('#1 T1↔T2') || !s.includes('#2 T6↔T10')) errors.push('Multi-swap summary lost one or more swaps.');
        const r=this.confirmationReason('',history);
        if (!r.includes('swaps (2)') || !r.includes('T6↔T10')) errors.push('Confirmation reason did not preserve the complete swap history.');
        const custom=this.confirmationReason('Manager adjustment',history);
        if (!custom.startsWith('Manager adjustment | ') || !custom.includes('T1↔T2') || !custom.includes('T6↔T10')) errors.push('Custom reason was not preserved alongside swap history.');
        return {ok:errors.length===0,errors,message:errors.length?`Manual Swap Audit Self-Test FAILED: ${errors.join(' ')}`:'Manual Swap Audit Self-Test PASSED: multiple manual swaps are retained in order, combined into confirmation context, and are ready for one audit event per confirmed swap.'};
    }
};

const PairingConfirmationService = {
    confirm(proposal, context, overrideReason='') {
        const activeGuard = TournamentCompletionService.requireActive(context?.tournament?.tournamentId, 'Confirm Pairings');
        if (activeGuard.errors) return { errors:activeGuard.errors, warnings:[] };
        const checked = PairingValidationService.validate(proposal, context);
        if (!checked.valid) return { errors: checked.errors, warnings: checked.warnings };
        const saved = proposal.pairings.map((p,i) => PairingService.create({ ...p, tournamentId:context.tournament.tournamentId, divisionId:context.division.divisionId, roundId:context.round.roundId, roundNumber:context.round.roundNumber, tableNumber:p.tableNumber, generatedMethod:proposal.engine, generatedBy:'system', engineMetadata:{...(proposal.metadata||{}), ...(p.engineMetadata||{}), engine:proposal.engine, standingInputSnapshotId:context.standingSnapshot?.snapshotId || null}, notes:p.notes||'' }));
        const saveErrors = saved.filter(x=>x.errors).flatMap(x=>x.errors);
        if (saveErrors.length) return { errors: saveErrors };
        PairingService.confirmAll(context.round.roundId);
        AuditService.log({tournamentId:context.tournament.tournamentId,divisionId:context.division.divisionId,roundId:context.round.roundId,entityType:'pairing',entityId:context.round.roundId,action:'confirm',eventCode:'PAIRING_CONFIRMED',reason:overrideReason});
        const savedPairings=saved.map(x=>x.data).filter(Boolean);
        const gibsonPairings=savedPairings.filter(p=>GibsonDecisionProvenanceService._isGibson(p));
        if(gibsonPairings.length){
            const ordinaryByeCount=savedPairings.filter(p=>p.pairingType==='bye' && !GibsonDecisionProvenanceService._isGibson(p)).length;
            const after={
                gibsonPlayerIds:gibsonPairings.map(p=>p.player1Id),
                gibsonRegistrationIds:gibsonPairings.map(p=>p.player1RegistrationId),
                assignmentSources:gibsonPairings.map(p=>GibsonDecisionProvenanceService._source(p)),
                proofBackedCount:gibsonPairings.filter(p=>!!GibsonDecisionProvenanceService._proof(p)).length,
                ordinaryByeCount
            };
            AuditService.log({tournamentId:context.tournament.tournamentId,divisionId:context.division.divisionId,roundId:context.round.roundId,entityType:'pairing',entityId:context.round.roundId,action:'gibson_decision_confirmed',eventCode:'GIBSON_DECISION_CONFIRMED',after,reason:overrideReason||gibsonPairings.map(p=>GibsonDecisionProvenanceService._reason(p)).filter(Boolean).join(' | ')});
        }
        return { data:savedPairings, warnings:checked.warnings };
    }
};

const ExcelImportService = {
    fields: PLAYER_FIELDS,
    normalizeHeader(value) {
        return String(value || '')
            .normalize('NFKC')
            .replace(/[\u0009\u000B\u000C\u00A0\u200B\u200C\u200D\uFEFF]/g, ' ')
            .trim()
            .normalize('NFKC')
            .toLowerCase()
            .replace(/\s+/g, '')

    fieldForHeader(value) {
        const h = this.normalizeHeader(value);
        const map = {
            firstname:'firstName', lastname:'lastName', thainame:'thaiName',
            schoolclub:'schoolOrClub', school:'schoolOrClub', club:'schoolOrClub',
            province:'province', country:'country', rating:'currentRating',
            ชื่อ:'thaiName', โรงเรียน:'schoolOrClub', สังกัด:'schoolOrClub', โรงเรียนสังกัด:'schoolOrClub',
            จังหวัด:'province', ประเทศ:'country', เรตติ้ง:'currentRating'
        };
        return map[h] || '';
    },
    clean(value) { return value == null ? '' : String(value).trim(); },
    read(file, headerRow = 1, sheetName) {
        return file.arrayBuffer().then(buffer => {
            const workbook = XLSX.read(buffer, { type: 'array', cellDates: false });

                return { rowNumber: index + Math.max(1, headerRow) + 1, player };

            return { sheetNames: workbook.SheetNames, headers, rows: data };
