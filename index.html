    submitSpecialResult(pairingId, resultType) {
        const pairing=Storage.getById('pairings','pairingId',pairingId);
        if(!pairing) return this.showToast('Pairing not found.','error');
        const p1=TournamentPlayerDisplayService.label(pairing.player1RegistrationId,pairing.player1Id);
        const p2=TournamentPlayerDisplayService.label(pairing.player2RegistrationId,pairing.player2Id);

        if(resultType==='double_walkover') {
            const reason=prompt('Reason for DOUBLE WALKOVER:','Both players no-show after 15 minutes');
            if(reason===null) return;
            if(!reason.trim()) return this.showToast('Reason is required for DOUBLE WALKOVER.','error');
            const policy=ResultPolicyExecutionService.policyForDivision(pairing.divisionId);
            const w=policy.walkover || {scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100};
            const msg=`Record DOUBLE WALKOVER as an official administrative result?\n\n${p1}: GP1 / L1 / MP0 / SF${Number(w.scoreAgainst??0)} / SA${Number(w.scoreFor??100)} / OS -${Math.abs(Number(w.officialSpreadAwarded??100))}\n${p2}: GP1 / L1 / MP0 / SF${Number(w.scoreAgainst??0)} / SA${Number(w.scoreFor??100)} / OS -${Math.abs(Number(w.officialSpreadAwarded??100))}\n\nThis is NOT a 0–0 tie. The frozen result will remain in history.`;
            if(!confirm(msg)) return;
            const result=ResultService.submitSpecial({pairingId,resultType,winnerSide:null,reason:reason.trim()});
            if(result.errors) return this.showToast(result.errors[0],'error');
            this.showToast('DOUBLE WALKOVER result saved!','success');
            this.navigate('results');
            return;
        }

        const choice=prompt(`${resultType.toUpperCase()} — select winner\n1 = ${p1}\n2 = ${p2}`,'1');
        if(choice===null) return;
        const winnerSide=Number(choice);
        if(![1,2].includes(winnerSide)) return this.showToast('Winner must be 1 or 2.','error');
        const reason=prompt(`Reason for ${resultType.toUpperCase()}:`,resultType==='walkover'?'No show':'Forfeit / referee decision');
        if(reason===null) return;
        const data={pairingId,resultType,winnerSide,reason};
        if(resultType==='forfeit') {
            const ws=prompt('Final adjusted score — WINNER:',''); if(ws===null) return;
            const ls=prompt('Final adjusted score — LOSER:',''); if(ls===null) return;
            data.winnerScore=ws; data.loserScore=ls;
        }
        if(!confirm(`Record ${resultType.toUpperCase()} as an official result?\nWinner: ${winnerSide===1?p1:p2}\nThis result will be frozen into history.`)) return;
        const result=ResultService.submitSpecial(data);
        if(result.errors) return this.showToast(result.errors[0],'error');
        this.showToast(`${resultType.toUpperCase()} result saved!`,'success');
        this.navigate('results');
    },

    saveAllResults() {
        if (!this.currentTournamentId) {
            this.showToast(this.ui('Select a tournament first.','เลือกทัวร์นาเมนต์ก่อน'), 'error');
            return;
        }

        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d => d.divisionId === this.currentDivisionId) : divs[0];
        if (!targetDiv) {
            this.showToast(this.ui('No Division selected.','ยังไม่ได้เลือกดิวิชัน'), 'error');
            return;
        }

        const rounds = RoundService.getByDivision(targetDiv.divisionId);
        const activeRound = rounds.find(r => ['in_progress','pairing_confirmed','completed','results_pending'].includes(r.status)) || rounds[rounds.length - 1];
        if (!activeRound) {
            this.showToast(this.ui('No round is available for result entry.','ไม่มีรอบสำหรับกรอกผลการแข่งขัน'), 'error');
            return;
        }

        const guard = ResultEntryIntegrityService.canEditRound(activeRound);
        if (!guard.ok) {
            this.showToast(guard.errors?.[0] || this.ui('This round cannot accept results.','รอบนี้ไม่สามารถบันทึกผลได้'), 'error');
            return;
        }

        const pairings = PairingService.getByRound(activeRound.roundId)
            .filter(p => p.status !== 'cancelled' && p.pairingType === 'normal');
        const activeResults = Storage.find(
            'matchResults',
            r => r.roundId === activeRound.roundId && r.status !== 'voided' && r.resultType !== 'void'
        );
        const resultPairingIds = new Set(activeResults.map(r => r.pairingId));

        let saved = 0;
        let skipped = 0;
        const invalid = [];

        for (const pairing of pairings) {
            if (resultPairingIds.has(pairing.pairingId) || LateArrivalDoubleWalkoverService.isRestrictedPair(pairing)) {
                skipped++;
                continue;
            }

            const input1 = document.getElementById(`s1-${pairing.pairingId}`);
            const input2 = document.getElementById(`s2-${pairing.pairingId}`);
            if (!input1 || !input2) {
                skipped++;
                continue;
            }

            const raw1 = String(input1.value ?? '').trim();
            const raw2 = String(input2.value ?? '').trim();

            if (!raw1 && !raw2) {
                skipped++;
                continue;
            }

            if (!raw1 || !raw2 || !/^\d+$/.test(raw1) || !/^\d+$/.test(raw2)) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            const player1Score = Number(raw1);
            const player2Score = Number(raw2);
            const validationErrors = Validation.result({ player1Score, player2Score });
            if (validationErrors.length) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            const result = ResultService.submit({
                pairingId: pairing.pairingId,
                player1Score,
                player2Score
            });

            if (result.errors?.length) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            saved++;
            resultPairingIds.add(pairing.pairingId);
        }

        const summary = this.ui(
            `Save All: saved ${saved} · skipped ${skipped} · invalid ${invalid.length}${invalid.length ? ` (${invalid.join(', ')})` : ''}`,
            `บันทึกทั้งหมด: สำเร็จ ${saved} คู่ · ข้าม ${skipped} คู่ · ผิด/ไม่ครบ ${invalid.length} คู่${invalid.length ? ` (${invalid.join(', ')})` : ''}`
        );
        this.showToast(summary, invalid.length ? 'warning' : (saved ? 'success' : 'warning'));
        this.navigate('results');
    },

    buildStandingTable(rows, prevSnapshot) {
        let html = `<div class="table-container card rounded-lg bg-white dark:bg-gray-800">
            <table class="w-full text-sm"><thead><tr class="border-b dark:border-gray-700 text-left">
                <th class="p-2">#</th><th class="p-2">Δ</th><th class="p-2">Tournament Code</th><th class="p-2">Name</th><th class="p-2">Club</th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('GP = Games Played — total official games counted in Standing.','GP = Games Played — จำนวนเกมอย่างเป็นทางการที่นับในตารางอันดับ')}">GP</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('W = Wins — number of games won.','W = Wins — จำนวนเกมที่ชนะ')}">W</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('T = Ties — number of tied games.','T = Ties — จำนวนเกมที่เสมอ')}">T</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('L = Losses — number of games lost.','L = Losses — จำนวนเกมที่แพ้')}">L</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('MP = Match Points — competition points used in ranking according to the active ranking rule.','MP = Match Points — คะแนนการแข่งขันที่ใช้ในการจัดอันดับตามกติกาที่กำหนด')}">MP</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('SF = Score For — total points scored by the Player.','SF = Score For — คะแนนที่ผู้เล่นทำได้สะสม')}">SF</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('SA = Score Against — total points scored by opponents against the Player.','SA = Score Against — คะแนนที่คู่แข่งทำได้สะสมเมื่อพบผู้เล่นคนนี้')}">SA</span></th>
                <th class="p-2"><span tabindex="0" class="cursor-help border-b border-dotted border-gray-400" title="${this.ui('OS = Official Spread — official cumulative score difference after applying the tournament Maximum Spread rule.','OS = Official Spread — ผลต่างคะแนนสะสมอย่างเป็นทางการหลังใช้กติกา Maximum Spread')}">OS</span></th>
            </tr></thead><tbody>`;
        rows.forEach(r => {
            let prevRank = r.previousRank;
            if (!prevRank && prevSnapshot) {
                const prev = prevSnapshot.rows?.find(pr=>pr.playerId===r.playerId);
                prevRank = prev?.rank;
            }
            const delta = prevRank ? prevRank - r.rank : 0;
            const deltaStr = delta > 0 ? `<span class="rank-up">▲${delta}</span>` : delta < 0 ? `<span class="rank-down">▼${Math.abs(delta)}</span>` : '—';
            html += `<tr class="border-b dark:border-gray-700">
                <td class="p-2 font-bold">${r.rank}</td>
                <td class="p-2 text-xs">${deltaStr}</td>
                <td class="p-2 font-mono text-xs">${Utils.escHtml(TournamentPlayerCodeService.resolveCode(r.registrationId) || 'Not Assigned')}</td>
                <td class="p-2">
                    <button onclick="App.showPlayerResultHistory('${r.playerId}')" class="text-left font-medium text-blue-600 dark:text-blue-300 hover:underline" title="View player result history">${Utils.escHtml(r.playerName)}</button>
                    ${r.participationStatus === 'withdrawn_with_history'
                        ? '<span class="ml-2 px-2 py-0.5 rounded-full text-[10px] bg-amber-100 text-amber-700 dark:bg-amber-900/30 dark:text-amber-300">WITHDRAWN</span>'
                        : r.participationStatus === 'cancelled_with_history'
                            ? '<span class="ml-2 px-2 py-0.5 rounded-full text-[10px] bg-red-100 text-red-700 dark:bg-red-900/30 dark:text-red-300">HISTORY</span>'
                            : ''}
                </td>
                <td class="p-2 text-xs">${Utils.escHtml(r.schoolOrClub)}</td>
                <td class="p-2">${r.gamesPlayed}</td>
                <td class="p-2">${r.wins}</td>
                <td class="p-2">${r.ties}</td>
                <td class="p-2">${r.losses}</td>
                <td class="p-2 font-bold">${r.matchPoints}</td>
                <td class="p-2">${r.scoreFor}</td>
                <td class="p-2">${r.scoreAgainst}</td>
                <td class="p-2 font-medium ${r.sumOfficialSpread>=0?'text-green-600':'text-red-600'}">${r.sumOfficialSpread>=0?'+':''}${r.sumOfficialSpread}</td>
            </tr>`;
        });
        html += `</tbody></table></div>`;
        return html;
    },

    showPlayerResultHistory(playerId) {
        const divisionId = this.currentDivisionId || DivisionService.getByTournament(this.currentTournamentId || '')[0]?.divisionId;
        if (!divisionId) return this.showToast('Select a Division first.', 'error');
        const h = PlayerResultHistoryService.getHistory(divisionId, playerId);
        if (!h.ok) return this.showToast(h.errors[0] || 'Unable to load player history.', 'error');
        const live=h.liveStanding;
        const sign=n=>Number(n)>=0?`+${Number(n)}`:String(Number(n));
        const resultClass=code=>code==='W'?'text-green-600':code==='L'?'text-red-600':'text-amber-600';
        let body=`<div class="space-y-4">
            <div class="rounded-lg border dark:border-gray-700 p-3">
                <div class="font-semibold">${Utils.escHtml(h.playerDisplay)}</div>
                <div class="text-xs text-gray-500 mt-1">${Utils.escHtml(h.player?.schoolOrClub || h.registration?.affiliationAtEntry || '')}</div>
                ${live ? `<div class="grid grid-cols-4 md:grid-cols-8 gap-2 mt-3 text-center text-sm">
                    <div><div class="text-xs text-gray-500">Rank</div><b>#${live.rank}</b></div><div><div class="text-xs text-gray-500">GP</div><b>${live.gamesPlayed}</b></div><div><div class="text-xs text-gray-500">W-T-L</div><b>${live.wins}-${live.ties}-${live.losses}</b></div><div><div class="text-xs text-gray-500">MP</div><b>${live.matchPoints}</b></div><div><div class="text-xs text-gray-500">SF</div><b>${live.scoreFor}</b></div><div><div class="text-xs text-gray-500">SA</div><b>${live.scoreAgainst}</b></div><div><div class="text-xs text-gray-500">OS</div><b class="${live.sumOfficialSpread>=0?'text-green-600':'text-red-600'}">${sign(live.sumOfficialSpread)}</b></div><div><div class="text-xs text-gray-500">Games</div><b>${h.counts.results}</b></div>
                </div>`:''}
            </div>`;
        if (!h.rows.length) body += `<p class="text-gray-500 text-center py-6">No completed results yet.</p>`;
        else body += `<div class="overflow-x-auto"><table class="w-full text-sm min-w-[920px]"><thead><tr class="border-b dark:border-gray-700 text-left"><th class="p-2">R</th><th class="p-2">Table</th><th class="p-2">Opponent</th><th class="p-2">Score</th><th class="p-2">Result</th><th class="p-2">OS</th><th class="p-2">Cum GP</th><th class="p-2">Cum W-T-L</th><th class="p-2">Cum MP</th><th class="p-2">Cum SF-SA</th><th class="p-2">Cum OS</th><th class="p-2">Rank</th></tr></thead><tbody>${h.rows.map(r=>`<tr class="border-b dark:border-gray-700"><td class="p-2 font-bold">${r.roundNumber}</td><td class="p-2">${r.tableNumber || '—'}</td><td class="p-2">${Utils.escHtml(r.opponentDisplay || '—')}${r.byeReason==='gibson'?'<span class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-purple-100 text-purple-700 dark:bg-purple-900/30 dark:text-purple-300">GIBSON</span>':''}${['walkover','forfeit','double_walkover'].includes(r.resultType)?`<span class="ml-1 text-[10px] px-1.5 py-0.5 rounded ${r.resultType==='double_walkover'?'bg-orange-100 text-orange-700':(r.resultType==='walkover'?'bg-blue-100 text-blue-700':'bg-red-100 text-red-700')}">${r.resultType.toUpperCase()}</span>`:''}</td><td class="p-2 font-mono">${r.scoreFor}–${r.scoreAgainst}</td><td class="p-2 font-bold ${resultClass(r.resultCode)}">${r.resultCode || '—'}</td><td class="p-2 ${r.officialSpread>=0?'text-green-600':'text-red-600'}">${sign(r.officialSpread)}</td><td class="p-2">${r.cumulative?.gamesPlayed ?? '—'}</td><td class="p-2">${r.cumulative?`${r.cumulative.wins}-${r.cumulative.ties}-${r.cumulative.losses}`:'—'}</td><td class="p-2 font-bold">${r.cumulative?.matchPoints ?? '—'}</td><td class="p-2">${r.cumulative?`${r.cumulative.scoreFor}–${r.cumulative.scoreAgainst}`:'—'}</td><td class="p-2 ${Number(r.cumulative?.sumOfficialSpread)>=0?'text-green-600':'text-red-600'}">${r.cumulative?sign(r.cumulative.sumOfficialSpread):'—'}</td><td class="p-2 font-bold">${r.cumulative?.rank ? '#'+r.cumulative.rank : '—'}</td></tr>`).join('')}</tbody></table></div>`;
        body += `<p class="text-xs text-gray-500">Read-only view. Historical VOID results are excluded; active BYE/Gibson results are included from their frozen result records.</p></div>`;
        this.showModal('Player Result History', body, `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Close','ปิด')}</button>`);

    runClinchMathematicsSelfTest() {
        const selfTest=ClinchMathematicsService.runSelfTest();
        const divisionId=this.currentDivisionId || DivisionService.getByTournament(this.currentTournamentId || '')[0]?.divisionId;
        const live=divisionId?ClinchMathematicsService.analyzeDivision(divisionId):{ok:false,errors:['Select a Division first.'],players:[]};
        const ok=selfTest.ok && live.ok;
        const el=document.getElementById('clinch-mathematics-self-test-result');
        if(el){
            el.classList.remove('hidden','border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300','border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300');
            if(ok){
                el.classList.add('border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300');
                const clinched=(live.players||[]).filter(p=>p.clinchedFirst);
                const scope=`R${live.throughRound}/${live.totalRounds} · remaining ${live.remainingRounds?.length||0} · players ${live.players?.length||0}`;
                const proof=live.canProve?(clinched.length?` Proven clinched-first: ${clinched.map(p=>p.playerName||p.playerId).join(', ')}.`:' No player is mathematically proven clinched-first yet.'):' Live clinch proof is intentionally UNDETERMINED because the active ranking rules contain bounds this foundation will not guess.';
                el.textContent=`${selfTest.message} Live scope: ${scope}.${proof} Live tournament data was not modified.`;
            } else {
                el.classList.add('border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300');
                el.textContent=`Clinch Mathematics FAILED: ${[...(selfTest.errors||[]),...(live.errors||[])].join(' ')}`;
            }
        }
        this.showToast(ok?'Clinch Mathematics Foundation PASSED.':'Clinch Mathematics Foundation FAILED.',ok?'success':'error');
        return {ok,selfTest,live};
    },

    runPlayerResultHistorySelfTest() {
        const selfTest=PlayerResultHistoryService.runSelfTest();
        const divisionId=this.currentDivisionId || DivisionService.getByTournament(this.currentTournamentId || '')[0]?.divisionId;
        const live=divisionId?PlayerResultHistoryService.inspectDivision(divisionId):{ok:false,errors:['Select a Division first.'],histories:0,resultRows:0};
        const ok=selfTest.ok && live.ok;
        const el=document.getElementById('player-history-self-test-result');
        if (el) {
            el.classList.remove('hidden','border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300','border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300');
            if (ok) { el.classList.add('border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300'); el.textContent=`✓ PASS — ${selfTest.message} Live player histories checked: ${live.histories}; projected result rows: ${live.resultRows}.`; }
            else { el.classList.add('border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300'); el.textContent=`✗ FAIL — ${[...(selfTest.errors||[]),...(live.errors||[])].join(' ')}`; }

    // Read-only venue/public view backed by PublicResultDisplayService.

    renderPublicResults(el) {
        const tournamentId=this.currentTournamentId;
        const divisions=DivisionService.getByTournament(tournamentId || '');
        const targetDiv=this.currentDivisionId ? DivisionService.getById(this.currentDivisionId) : divisions[0];
        if (!targetDiv) {
            el.innerHTML='<div class="card rounded-lg p-6 bg-white dark:bg-gray-800 text-center text-gray-500">Select a Tournament and Division to display results.</div>';
            return;
        }
        if (!this.currentDivisionId) this.currentDivisionId=targetDiv.divisionId;
        const available=PublicResultDisplayService.availableRounds(targetDiv.divisionId);
        const validRoundNumbers=new Set(available.map(r=>Number(r.roundNumber)));
        const latestRoundNumber=PublicResultDisplayService.latestRoundNumber(targetDiv.divisionId);
        const sameDivision=this.publicResultRoundDivisionId===targetDiv.divisionId;
        const pinnedRoundIsValid=this.publicResultRoundPinned && sameDivision && validRoundNumbers.has(Number(this.publicResultRoundNumber));

        // PATCH 02.46.1 — Result Board really means “Last Game”.
        // Unless the manager explicitly pins a historical round from the dropdown,
        // always follow the latest available round. This also fixes the stale case
        // where Round 4 remained selected after Round 5 was finalized.
        if (!pinnedRoundIsValid) {
            this.publicResultRoundNumber=latestRoundNumber;
            this.publicResultRoundPinned=false;
        }
        this.publicResultRoundDivisionId=targetDiv.divisionId;

        const board=PublicResultDisplayService.getBoard(targetDiv.divisionId,this.publicResultRoundNumber);
        if (!board.ok) { el.innerHTML=`<div class="p-4 text-red-600">${Utils.escHtml(board.errors.join(' '))}</div>`; return; }

        const sign=n=>Number(n)>=0?`+${Number(n)}`:String(Number(n));
        const rc=c=>c==='W'?'text-green-600':c==='L'?'text-red-600':'text-amber-600';
        const statusLabel=round?String(round.status||'').toUpperCase():'NO ROUND';
        let html=`<div id="krutar-public-board" class="max-w-7xl mx-auto space-y-5">
            <div class="krutar-public-header card rounded-xl bg-white dark:bg-gray-800 p-5 border-2 border-amber-300 dark:border-amber-700">
                <div class="flex flex-col lg:flex-row lg:items-center gap-3">
                    <div class="flex-1">
                        <div class="text-xs uppercase tracking-[0.2em] text-amber-600 font-bold">Public Result Board · Last Game</div>
                        <h2 class="text-2xl font-bold mt-1">${Utils.escHtml(targetDiv.divisionName || targetDiv.divisionCode)}</h2>
                        <div class="text-sm text-gray-500 mt-1">${round?`Round ${round.roundNumber} · ${statusLabel} · Results ${board.counts.completed}/${board.counts.pairings}`:'No pairing round yet'}</div>
                    </div>
                    <div class="flex flex-wrap gap-2 items-center no-print">
                        <select onchange="App.publicResultRoundNumber=Number(this.value);App.publicResultRoundPinned=true;App.publicResultRoundDivisionId='${targetDiv.divisionId}';App.navigate('public-results')" class="px-3 py-2 border rounded-lg bg-white dark:bg-gray-700 dark:border-gray-600" ${available.length?'':'disabled'}>
                            ${available.map(r=>`<option value="${r.roundNumber}" ${Number(r.roundNumber)===Number(this.publicResultRoundNumber)?'selected':''}>Round ${r.roundNumber} — ${String(r.status||'').toUpperCase()}</option>`).join('') || '<option>No rounds</option>'}
                        </select>
                        <button onclick="App.publicResultRoundPinned=false;App.publicResultRoundNumber=null;App.navigate('public-results')" class="px-3 py-2 border rounded-lg">Refresh</button>
                        <button onclick="App.openPublicVenueMode()" class="px-3 py-2 border rounded-lg">Venue Mode</button>
                        <button onclick="window.print()" class="px-3 py-2 border rounded-lg">Print</button>
                    </div>
                </div>
            </div>

            <div class="card rounded-lg p-4 bg-white dark:bg-gray-800 border border-purple-300 dark:border-purple-800 no-print">
                <div class="font-semibold">Last Game / Public Display — Patch 02.46.2</div>
                <div class="text-sm text-gray-500 mt-1">Read-only display from stored Pairing + Result records. Administrative results use result-type-aware presentation; DOUBLE WALKOVER is never shown as a 0–0 tie. Current standing below reuses CalcEngine through the selected round.</div>
                <button onclick="App.runPublicResultDisplaySelfTest()" class="mt-3 px-3 py-2 border border-purple-400 text-purple-600 dark:text-purple-300 rounded-lg text-sm">Run Public Display Self-Test</button>
                <div id="public-display-self-test-result" class="hidden mt-3 p-3 border rounded-lg text-sm"></div>
            </div>`;
        if (!round) {
            html += `<div class="card rounded-lg p-8 bg-white dark:bg-gray-800 text-center text-gray-500">No pairings available yet.</div></div>`;
            el.innerHTML=html; return;
        }
        html += `<div class="krutar-public-games grid grid-cols-1 lg:grid-cols-2 gap-4">`;
        for (const row of board.rows) {
            if (row.pairingType==='bye') {
                html += `<div class="card rounded-xl bg-white dark:bg-gray-800 p-5 border-l-4 ${row.byeReason==='gibson'?'border-purple-500':'border-amber-500'}">
                    <div class="flex items-center justify-between"><div class="text-xl font-bold text-amber-600">Table ${row.tableNumber}</div><div class="text-xs px-2 py-1 rounded-full bg-amber-100 text-amber-700">${row.byeReason==='gibson'?'GIBSON BYE':'BYE'}</div></div>
                    <button onclick="App.showPlayerResultHistory('${row.player1.playerId}')" class="mt-5 text-left"><div class="font-mono text-xs text-gray-500">${Utils.escHtml(row.player1.code)}</div><div class="text-xl font-bold hover:underline">${Utils.escHtml(row.player1.name)}</div></button>
                    ${row.completed?`<div class="mt-4 flex items-end justify-between"><div><div class="text-4xl font-bold font-mono">${row.player1.score}</div><div class="font-bold ${rc(row.player1.resultCode)}">${row.player1.resultCode || '—'} · ${sign(row.player1.officialSpread)}</div></div><div class="text-2xl font-semibold text-gray-400">BYE</div></div>`:`<div class="mt-5 text-gray-500">Pending result</div>`}
                </div>`;
            } else {
                const presentation=row.presentation || PublicResultDisplayService.presentationForRow(row);
                const isAdministrative=presentation.centerMode==='administrative';
                const centerHtml = !row.completed
                    ? '<div class="text-gray-400 text-xl">VS</div>'
                    : isAdministrative
                        ? `<div class="min-w-[180px] rounded-lg border border-orange-400/60 bg-orange-50 dark:bg-orange-950/20 px-4 py-3"><div class="text-orange-600 dark:text-orange-300 text-xs font-bold tracking-wider">${Utils.escHtml(presentation.statusLabel)}</div><div class="text-xl lg:text-2xl font-bold mt-1 whitespace-nowrap">${Utils.escHtml(presentation.centerLabel)}</div><div class="text-[11px] text-gray-500 mt-1">${Utils.escHtml(presentation.detailLabel || '')}</div></div>`
                        : `<div class="font-mono text-3xl font-bold whitespace-nowrap">${row.player1.score}<span class="text-gray-400 px-2">–</span>${row.player2.score}</div>`;
                html += `<div class="card rounded-xl bg-white dark:bg-gray-800 p-5 ${isAdministrative?'border border-orange-400/40':''}">
                    <div class="flex items-center justify-between mb-4"><div class="text-xl font-bold text-amber-600">Table ${row.tableNumber}</div><div class="text-xs ${row.completed?(isAdministrative?'text-orange-500':'text-green-600'):'text-gray-500'}">${Utils.escHtml(presentation.statusLabel)}</div></div>
                    <div class="grid grid-cols-[1fr_auto_1fr] gap-3 items-center">
                        <button onclick="App.showPlayerResultHistory('${row.player1.playerId}')" class="krutar-public-player-slot text-left min-w-0"><div class="font-mono text-xs text-gray-500">${Utils.escHtml(row.player1.code)}</div><div class="krutar-public-player-name text-lg font-bold hover:underline truncate">${Utils.escHtml(row.player1.name)}</div>${row.completed?`<div class="krutar-public-spread text-sm font-bold ${rc(row.player1.resultCode)}">${row.player1.resultCode} ${sign(row.player1.officialSpread)}</div>`:''}</button>
                        <div class="krutar-public-center text-center">${centerHtml}</div>
                        <button onclick="App.showPlayerResultHistory('${row.player2.playerId}')" class="krutar-public-player-slot text-right min-w-0"><div class="font-mono text-xs text-gray-500">${Utils.escHtml(row.player2.code)}</div><div class="krutar-public-player-name text-lg font-bold hover:underline truncate">${Utils.escHtml(row.player2.name)}</div>${row.completed?`<div class="krutar-public-spread text-sm font-bold ${rc(row.player2.resultCode)}">${row.player2.resultCode} ${sign(row.player2.officialSpread)}</div>`:''}</button>
                    </div>
                </div>`;
            }
        }
        html += `</div>
            <div class="krutar-public-standing card rounded-xl bg-white dark:bg-gray-800 overflow-hidden">
                <div class="px-4 py-3 border-b dark:border-gray-700 flex justify-between"><div class="font-bold">Standing through Round ${round.roundNumber}</div><div class="text-xs text-gray-500">${board.counts.pending?'PROVISIONAL · partial results':'Current cumulative result'}</div></div>
                <div class="overflow-hidden"><table class="w-full text-sm"><thead><tr class="border-b dark:border-gray-700 text-left"><th class="p-2">#</th><th class="p-2">Player</th><th class="p-2 text-center">GP</th><th class="p-2"><span class="krutar-wtl-os"><span>W-T-L</span><span>OS</span></span></th><th class="p-2 krutar-manager-detail">MP</th><th class="p-2 krutar-manager-detail">SF</th><th class="p-2 krutar-manager-detail">SA</th></tr></thead><tbody>${board.standing.map(r=>`<tr class="border-b dark:border-gray-700"><td class="p-2 font-bold">${r.rank}</td><td class="p-2"><button onclick="App.showPlayerResultHistory('${r.playerId}')" class="font-medium text-blue-600 dark:text-blue-300 hover:underline">${Utils.escHtml(TournamentPlayerCodeService.resolveCode(r.registrationId) || '')} — ${Utils.escHtml(r.playerName)}</button></td><td class="p-2 text-center font-bold">${r.gamesPlayed}</td><td class="p-2 font-bold whitespace-nowrap"><span class="krutar-wtl-os"><span>${r.wins}-${r.ties}-${r.losses}</span><span class="${r.sumOfficialSpread>=0?'text-green-600':'text-red-600'}">${sign(r.sumOfficialSpread)}</span></span></td><td class="p-2 font-bold krutar-manager-detail">${r.matchPoints}</td><td class="p-2 krutar-manager-detail">${r.scoreFor}</td><td class="p-2 krutar-manager-detail">${r.scoreAgainst}</td></tr>`).join('')}</tbody></table></div>
            </div>
        </div>`;
        el.innerHTML=html;
        if (document.body.classList.contains('krutar-public-venue-mode')) requestAnimationFrame(()=>this.setupPublicVenuePagination());
    },

    // ========================================================
    // PATCH 02.37 — LAST GAME / PUBLIC DISPLAY VENUE MODE
    // Presentation-only shell: hides manager chrome while the public board
    // is displayed. It does not mutate Tournament/Division/Round/Result data.
    // ESC / Exit Venue Mode restores the normal manager UI.
    // ========================================================

    // ========================================================
    // PATCH 02.38.1 — RESPONSIVE FIT-TO-SCREEN
    // Computes presentation scale from the rendered public board only.
    // No competition data is read/written beyond already-rendered counts.
    // ========================================================
    fitPublicVenueToViewport() {
        if (!document.body.classList.contains('krutar-public-venue-mode')) return;
        const board=document.getElementById('krutar-public-board');
        const content=document.getElementById('content');
        if (!board || !content) return;

        board.style.setProperty('--krutar-venue-scale','1');
        board.style.width='100%';
        board.dataset.venueDensity='normal';

        const standingRows=[...board.querySelectorAll('.krutar-public-standing tbody tr')].filter(n=>!n.classList.contains('krutar-venue-page-hidden')).length;
        const gameCards=[...board.querySelectorAll('.krutar-public-games > div')].filter(n=>!n.classList.contains('krutar-venue-page-hidden')).length;
        const vw=Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh=Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);

        // Reduce padding before scaling when content pressure is high.
        const pressure=(standingRows/10)+(gameCards/6)+(vh<700?0.8:0)+(vw<900?0.6:0);
        board.dataset.venueDensity=pressure>3.4?'ultra':pressure>2.15?'compact':'normal';

        // Two-pass fit: first use natural width, then allow extra layout width when scaled down.
        const availableW=Math.max(240, content.clientWidth-2);
        const availableH=Math.max(240, content.clientHeight-2);
        let naturalH=Math.max(board.scrollHeight, board.getBoundingClientRect().height);
        let naturalW=Math.max(board.scrollWidth, board.getBoundingClientRect().width);
        let scale=Math.min(availableW/naturalW, availableH/naturalH);

        // Few-player boards may grow modestly; large boards shrink only as needed.
        const maxScale=(standingRows<=6 && gameCards<=4)?1.12:1;
        scale=Math.min(maxScale, scale);
        scale=Math.max(0.34, scale);

        board.style.setProperty('--krutar-venue-scale', String(scale));
        board.style.width=(100/scale)+'%';

        // Re-measure after wider layout because cards/text can wrap differently.
        requestAnimationFrame(()=>{
            if (!document.body.classList.contains('krutar-public-venue-mode')) return;
            const h=Math.max(board.scrollHeight, board.getBoundingClientRect().height/scale);
            const w=Math.max(board.scrollWidth, board.getBoundingClientRect().width/scale);
            let second=Math.min(availableW/w, availableH/h);
            second=Math.min(maxScale, second);
            second=Math.max(0.34, second);
            const finalScale=Math.min(scale, second);
            board.style.setProperty('--krutar-venue-scale', String(finalScale));
            board.style.width=(100/finalScale)+'%';
            board.dataset.venueScale=finalScale.toFixed(3);
            board.dataset.venueRows=String(standingRows);
            board.dataset.venueGames=String(gameCards);
        });
    },

    // ========================================================
    // PATCH 02.38.2 — PUBLIC DISPLAY PAGINATION / AUTO ROTATION
    // Pure presentation state. No Tournament/Division/Round/Result writes.
    // ========================================================
    _clearPublicVenueRotationTimer() {
        if (this._publicVenueRotationTimer) {
            clearInterval(this._publicVenueRotationTimer);
            this._publicVenueRotationTimer=null;
        }
    },

    _publicVenueCapacity() {
        const vw=Math.max(document.documentElement.clientWidth || 0, window.innerWidth || 0);
        const vh=Math.max(document.documentElement.clientHeight || 0, window.innerHeight || 0);
        const board=document.getElementById('krutar-public-board');
        const totalGames=board ? board.querySelectorAll('.krutar-public-games > div').length : 0;
        const totalRows=board ? board.querySelectorAll('.krutar-public-standing tbody tr').length : 0;

        // Adaptive Venue table grid:
        // 1–2 tables => 2 across; 3–4 => 2x2; 5+ => up to 3x2 on wide screens.
        let gridColumns=2;
        let gamesPerPage=4;
        if (vw < 760) {
            gridColumns=1;
            gamesPerPage=2;
        } else if (totalGames <= 2) {
            gridColumns=2;
            gamesPerPage=2;
        } else if (totalGames <= 4 || vw < 1180) {
            gridColumns=2;
            gamesPerPage=4;
        } else {
            gridColumns=3;
            gamesPerPage=6;
        }

        // Standing capacity is matched to large-table pages so 18 players normally
        // rotate in two balanced slides (9 + 9) instead of 8 + 8 + 2.
        let standingsPerPage = vw < 760 ? 5 : (vw < 1050 ? 7 : 9);
        if (vh >= 950 && vw >= 1200) standingsPerPage=10;
        if (vh < 700) standingsPerPage=Math.min(standingsPerPage,7);
        if (totalRows > 0 && totalRows <= standingsPerPage+1) standingsPerPage=totalRows;

        return {gamesPerPage,standingsPerPage,gridColumns};
    },

    _ensurePublicVenuePager() {
        let pager=document.getElementById('krutar-public-venue-pager');
        if (pager) return pager;
        pager=document.createElement('div');
        pager.id='krutar-public-venue-pager';
        pager.innerHTML=`
            <button type="button" title="Previous page" onclick="App.publicVenuePreviousPage()">‹</button>
            <button type="button" id="krutar-public-venue-auto" title="Pause / resume auto rotation" onclick="App.togglePublicVenueAutoRotation()">Pause</button>
            <div class="krutar-pager-status" id="krutar-public-venue-page-status">Page 1 / 1</div>
            <button type="button" title="Next page" onclick="App.publicVenueNextPage()">›</button>`;
        document.body.appendChild(pager);
        return pager;
    },

    setupPublicVenuePagination(options={}) {
        if (!document.body.classList.contains('krutar-public-venue-mode')) return {pages:1};
        const board=document.getElementById('krutar-public-board');
        if (!board) return {pages:1};
        const cards=[...board.querySelectorAll('.krutar-public-games > div')];
        const rows=[...board.querySelectorAll('.krutar-public-standing tbody tr')];
        const {gamesPerPage,standingsPerPage,gridColumns}=this._publicVenueCapacity();
        const gamePages=Math.max(1,Math.ceil(cards.length/Math.max(1,gamesPerPage)));
        const standingPages=Math.max(1,Math.ceil(rows.length/Math.max(1,standingsPerPage)));
        const pageCount=Math.max(gamePages,standingPages);

        if (options.reset || !Number.isFinite(this._publicVenuePage)) this._publicVenuePage=0;
        this._publicVenuePage=((this._publicVenuePage||0)%pageCount+pageCount)%pageCount;
        this._publicVenuePageCount=pageCount;
        this._publicVenuePagination={gamesPerPage,standingsPerPage,gridColumns,gamePages,standingPages,pageCount};
        if (typeof this._publicVenueAutoRotate !== 'boolean') this._publicVenueAutoRotate=true;
        if (!Number.isFinite(this._publicVenueRotationMs)) this._publicVenueRotationMs=10000;

        const pager=this._ensurePublicVenuePager();
        pager.dataset.singlePage=pageCount<=1?'true':'false';
        this.applyPublicVenuePage(this._publicVenuePage,{refit:false});
        this._restartPublicVenueRotationTimer();
        requestAnimationFrame(()=>this.fitPublicVenueToViewport());
        return this._publicVenuePagination;
    },

    applyPublicVenuePage(pageIndex,options={}) {
        const board=document.getElementById('krutar-public-board');
        if (!board || !document.body.classList.contains('krutar-public-venue-mode')) return;
        const cards=[...board.querySelectorAll('.krutar-public-games > div')];
        const rows=[...board.querySelectorAll('.krutar-public-standing tbody tr')];
        const meta=this._publicVenuePagination || this.setupPublicVenuePagination();
        const pageCount=Math.max(1,meta.pageCount||1);
        const page=((Number(pageIndex)||0)%pageCount+pageCount)%pageCount;
        this._publicVenuePage=page;

        const gamePage=(meta.gamePages||1)<=1?0:(page%(meta.gamePages||1));
        const standingPage=(meta.standingPages||1)<=1?0:(page%(meta.standingPages||1));
        const gStart=gamePage*(meta.gamesPerPage||cards.length||1), gEnd=gStart+(meta.gamesPerPage||cards.length||1);
        const sStart=standingPage*(meta.standingsPerPage||rows.length||1), sEnd=sStart+(meta.standingsPerPage||rows.length||1);

        const visibleGameCount=Math.max(0,Math.min(cards.length,gEnd)-gStart);
        let gridColumns=meta.gridColumns||2;
        if (visibleGameCount<=2 && window.innerWidth>=760) gridColumns=2;
        if (visibleGameCount>=5 && window.innerWidth>=1180) gridColumns=3;
        if (window.innerWidth<760) gridColumns=1;
        const gridRows=Math.max(1,Math.ceil(Math.max(1,visibleGameCount)/Math.max(1,gridColumns)));
        board.dataset.venueGridColumns=String(gridColumns);
        board.dataset.venueGridRows=String(Math.min(2,gridRows));

        cards.forEach((node,i)=>node.classList.toggle('krutar-venue-page-hidden',(meta.gamePages||1)>1 && !(i>=gStart && i<gEnd)));
        rows.forEach((node,i)=>node.classList.toggle('krutar-venue-page-hidden',(meta.standingPages||1)>1 && !(i>=sStart && i<sEnd)));

        const status=document.getElementById('krutar-public-venue-page-status');
        if (status) status.textContent=`Page ${page+1} / ${pageCount}`;
        const auto=document.getElementById('krutar-public-venue-auto');
        if (auto) auto.textContent=this._publicVenueAutoRotate?'Pause':'Play';
        if (options.refit!==false) requestAnimationFrame(()=>this.fitPublicVenueToViewport());
    },

    _restartPublicVenueRotationTimer() {
        this._clearPublicVenueRotationTimer();
        if (!document.body.classList.contains('krutar-public-venue-mode')) return;
        if (!this._publicVenueAutoRotate || (this._publicVenuePageCount||1)<=1) return;
        const ms=Math.max(3000,Number(this._publicVenueRotationMs)||10000);
        this._publicVenueRotationTimer=setInterval(()=>{
            if (!document.body.classList.contains('krutar-public-venue-mode')) { this._clearPublicVenueRotationTimer(); return; }
            this.publicVenueNextPage({fromTimer:true});
        },ms);
    },

    togglePublicVenueAutoRotation() {
        this._publicVenueAutoRotate=!this._publicVenueAutoRotate;
        const auto=document.getElementById('krutar-public-venue-auto');
        if (auto) auto.textContent=this._publicVenueAutoRotate?'Pause':'Play';
        this._restartPublicVenueRotationTimer();
    },

    publicVenueNextPage(options={}) {
        const count=Math.max(1,this._publicVenuePageCount||1);
        this.applyPublicVenuePage(((this._publicVenuePage||0)+1)%count);
        if (!options.fromTimer) this._restartPublicVenueRotationTimer();
    },

    publicVenuePreviousPage() {
        const count=Math.max(1,this._publicVenuePageCount||1);
        this.applyPublicVenuePage(((this._publicVenuePage||0)-1+count)%count);
        this._restartPublicVenueRotationTimer();
    },

    openPublicFullscreen() {
        const el=document.documentElement;
        if (!document.fullscreenElement && el.requestFullscreen) el.requestFullscreen().catch(()=>this.showToast('Browser blocked full-screen mode.','warning'));
        else if (document.exitFullscreen) document.exitFullscreen();
    },

    openPublicVenueMode() {
        if (this.currentPage !== 'public-results') this.navigate('public-results');
        document.body.classList.add('krutar-public-venue-mode');
        document.documentElement.style.overflow='hidden';
        let exit=document.getElementById('krutar-public-venue-exit');
        if (!exit) {
            exit=document.createElement('button');
            exit.id='krutar-public-venue-exit';
            exit.type='button';
            exit.textContent='Exit Venue Mode';
            exit.onclick=()=>this.closePublicVenueMode();
            document.body.appendChild(exit);
        }
        if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(()=>{});
        }
        this._publicVenuePage=0;
        this._publicVenueAutoRotate=true;
        requestAnimationFrame(()=>this.setupPublicVenuePagination({reset:true}));
    },

    closePublicVenueMode() {
        document.body.classList.remove('krutar-public-venue-mode');
        document.documentElement.style.overflow='';
        this._clearPublicVenueRotationTimer();
        const board=document.getElementById('krutar-public-board');
        if (board) {
            board.style.removeProperty('--krutar-venue-scale'); board.style.width=''; delete board.dataset.venueDensity; delete board.dataset.venueGridColumns; delete board.dataset.venueGridRows;
            board.querySelectorAll('.krutar-venue-page-hidden').forEach(n=>n.classList.remove('krutar-venue-page-hidden'));
        }
        document.getElementById('krutar-public-venue-pager')?.remove();
        document.getElementById('krutar-public-venue-exit')?.remove();
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(()=>{});
    },

    runPublicResultDisplaySelfTest() {
        const selfTest=PublicResultDisplayService.runSelfTest();
        const divisionId=this.currentDivisionId || DivisionService.getByTournament(this.currentTournamentId || '')[0]?.divisionId;
        const live=divisionId?PublicResultDisplayService.inspectDivision(divisionId):{ok:false,errors:['Select a Division first.'],roundsChecked:0};
        const ok=selfTest.ok && live.ok;
        const el=document.getElementById('public-display-self-test-result');
        if (el) {
            el.classList.remove('hidden','border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300','border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300');
            if (ok) { el.classList.add('border-green-300','bg-green-50','text-green-700','dark:border-green-800','dark:bg-green-950/30','dark:text-green-300'); el.textContent=`✓ PASS — ${selfTest.message} Live rounds checked: ${live.roundsChecked}.`; }
            else { el.classList.add('border-red-300','bg-red-50','text-red-700','dark:border-red-800','dark:bg-red-950/30','dark:text-red-300'); el.textContent=`✗ FAIL — ${[...(selfTest.errors||[]),...(live.errors||[])].join(' ')}`; }
        }
        this.showToast(ok?'Public Result Display PASSED.':'Public Result Display FAILED.',ok?'success':'error');
        return {ok,selfTest,live};
    },

    normalizeLegacySnapshots() {
        const scan = LegacySnapshotVersionNormalizer.inspect();
        if (!scan.needed) {
            this.showToast('No legacy snapshot normalization is required.', 'success');
            this.navigate('standings');
            return;
        }

        const ok = confirm(
            `Normalize legacy official snapshot metadata for ${scan.affectedCount} round group(s)?\n\n` +
            `This will NOT recalculate standings and will NOT change results, pairings, or rounds.\n` +
            `A full recovery copy will be saved first.`

    restorePreviousDatabase() {
        const info = BackupService.getPreRestoreRecoveryInfo();
        if (!info) { this.showToast('No pre-restore recovery copy available.', 'error'); return; }
        if (!info.valid) { this.showToast('Recovery copy is invalid and was not restored.', 'error'); return; }
        this.showModal('Restore Previous Database?',
            `<p class="text-sm">Replace the current database with the automatic copy saved immediately before the last full restore?</p><p class="text-sm text-amber-600 mt-3">The recovery copy has already passed KTM integrity validation.</p>`,

    confirmRestorePreviousDatabase() {
        const result = BackupService.restorePreRestoreRecovery();
        if (result.errors) { this.showToast(result.errors.join(' | '), 'error'); return; }
        this.closeModal();
        this.currentTournamentId = null; this.currentDivisionId = null;
        this.showToast('Previous database restored safely.', 'success');
        this.navigate('dashboard');

        const current = BackupService.validateFullBackup(Storage.exportAll());
        if (!current.ok) {
            this.showToast(`Clear blocked: current database failed integrity validation. ${current.errors.slice(0,4).join(' | ')}`, 'error');
            return;
        }
        const c = current.counts;
        const meaningfulCount = BackupService._requiredCollections.filter(x => x !== 'auditLogs').reduce((sum,x)=>sum+(c[x]||0),0);
        if (meaningfulCount === 0) {
            this.showToast('Database is already empty. Existing pre-clear recovery was preserved.', 'error');
            return;
        }
        const previousRecovery = BackupService.getPreClearRecoveryInfo();
        const recoveryNote = previousRecovery?.valid
            ? `<p class="text-xs text-amber-600 mt-2">A previous pre-clear recovery exists and will be replaced by a fresh verified copy of the CURRENT database only if Clear succeeds.</p>`
            : '';
        this.showModal('Clear ALL Tournament Data?',
            `<div class="space-y-3 text-sm">
                <p class="text-red-600 font-semibold">This removes all live tournament data from this browser.</p>
                <div class="rounded-lg border p-3 text-xs space-y-1">
                    <div>Tournaments: <b>${c.tournaments||0}</b></div>
                    <div>Divisions: <b>${c.divisions||0}</b></div>
                    <div>Players: <b>${c.players||0}</b></div>
                    <div>Registrations: <b>${c.registrations||0}</b></div>
                    <div>Rounds: <b>${c.rounds||0}</b></div>
                    <div>Pairings: <b>${c.pairings||0}</b></div>
                    <div>Results: <b>${c.matchResults||0}</b></div>
                    <div>Standing Snapshots: <b>${c.standingSnapshots||0}</b></div>
                </div>
                <p>KTM will first create and verify a Pre-Clear Recovery copy. If that copy cannot be verified, Clear will be cancelled.</p>
                ${recoveryNote}
                <label class="block font-medium">Type <span class="font-mono text-red-600">CLEAR</span> to continue</label>
                <input id="clear-confirm-text" autocomplete="off" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-900" placeholder="CLEAR">
            </div>`,
            `<button onclick="App.closeModal()" class="px-3 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmClearAllData()" class="px-3 py-2 bg-red-600 text-white rounded-lg">Clear All Data</button>`);
    },

    confirmClearAllData() {
        const typed = document.getElementById('clear-confirm-text')?.value || '';
        if (typed !== 'CLEAR') {
            this.showToast('Type CLEAR exactly to confirm.', 'error');
            return;
        }
        const result = BackupService.clearAllSafely();
        if (result.errors) { this.showToast(result.errors.join(' | '), 'error'); return; }
        this.closeModal();
        this.currentTournamentId = null; this.currentDivisionId = null; this.currentRoundId = null;
        this.showToast('All live data cleared. A verified recovery copy was saved.', 'success');
        this.navigate('dashboard');
    },

    restoreDatabaseBeforeClear() {
        const info = BackupService.getPreClearRecoveryInfo();
        if (!info) { this.showToast('No pre-clear recovery copy available.', 'error'); return; }
        if (!info.valid) { this.showToast('Pre-clear recovery copy is invalid and was not restored.', 'error'); return; }
        this.showModal('Restore Database Before Clear?',
            `<p class="text-sm">Replace the current database with the automatic copy saved immediately before the last successful Clear All Data?</p><p class="text-sm text-amber-600 mt-3">The recovery copy has already passed KTM integrity validation.</p>`,
            `<button onclick="App.closeModal()" class="px-3 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmRestoreDatabaseBeforeClear()" class="px-3 py-2 bg-amber-600 text-white rounded-lg">Restore Database Before Clear</button>`);
    },

    confirmRestoreDatabaseBeforeClear() {
        const result = BackupService.restorePreClearRecovery();
        if (result.errors) { this.showToast(result.errors.join(' | '), 'error'); return; }
        this.closeModal();
        this.currentTournamentId = null; this.currentDivisionId = null; this.currentRoundId = null;
        this.showToast('Pre-clear database restored safely.', 'success');
        this.navigate('dashboard');
    }
};

<script id="patch-02-37-public-venue-escape">
document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && document.body.classList.contains('krutar-public-venue-mode')) {
        setTimeout(function(){
            if (window.App && typeof App.closePublicVenueMode === 'function') App.closePublicVenueMode();
        }, 0);
    }
});
document.addEventListener('fullscreenchange', function(){
    if (!document.fullscreenElement && document.body.classList.contains('krutar-public-venue-mode')) {
        document.body.classList.remove('krutar-public-venue-mode');
        document.documentElement.style.overflow='';
        if (window.App?._clearPublicVenueRotationTimer) App._clearPublicVenueRotationTimer();
        document.getElementById('krutar-public-venue-pager')?.remove();
        document.getElementById('krutar-public-venue-exit')?.remove();
    } else if (document.fullscreenElement && document.body.classList.contains('krutar-public-venue-mode')) {
        setTimeout(function(){ if (window.App?.setupPublicVenuePagination) App.setupPublicVenuePagination(); else if (window.App?.fitPublicVenueToViewport) App.fitPublicVenueToViewport(); }, 60);
    }
});
let krutarVenueResizeTimer=null;
function krutarVenueRefit(){
    if (!document.body.classList.contains('krutar-public-venue-mode')) return;
    clearTimeout(krutarVenueResizeTimer);
    krutarVenueResizeTimer=setTimeout(function(){ if (window.App?.setupPublicVenuePagination) App.setupPublicVenuePagination(); else if (window.App?.fitPublicVenueToViewport) App.fitPublicVenueToViewport(); }, 90);
}
window.addEventListener('resize', krutarVenueRefit, {passive:true});
window.addEventListener('orientationchange', krutarVenueRefit, {passive:true});
</script>
