    filterRegistrationRows(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.registration-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.registrationSearch || '').includes(query));
        });
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = false;
        this.updateRegistrationSelectionCount();
    },

    toggleAllRegistrationRows(master) {
        document.querySelectorAll('.registration-row:not(.hidden) .registration-select').forEach(cb => cb.checked = !!master.checked);
        this.updateRegistrationSelectionCount();
    },

    selectVisibleRegistrations() {
        document.querySelectorAll('.registration-row:not(.hidden) .registration-select').forEach(cb => cb.checked = true);
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = true;
        this.updateRegistrationSelectionCount();
    },

    clearRegistrationSelection() {
        document.querySelectorAll('.registration-select').forEach(cb => cb.checked = false);
        const master = document.getElementById('registration-select-all');
        if (master) master.checked = false;
        this.updateRegistrationSelectionCount();
    },

    selectedRegistrationIds() {
        return Array.from(document.querySelectorAll('.registration-select:checked')).map(cb => cb.value);
    },

    updateRegistrationSelectionCount() {
        const count = this.selectedRegistrationIds().length;
        const el = document.getElementById('registration-selection-count');
        if (el) el.textContent = count ? this.ui(`${count} selected`, `เลือก ${count} คน`) : '';
    },

    bulkCheckInSelected() {
        const ids = this.selectedRegistrationIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one registration.','เลือกรายชื่ออย่างน้อย 1 คน'), 'warning');
        let saved = 0, skipped = 0, invalid = 0;
        const errors = [];
        ids.forEach(id => {
            const r = Storage.getById('registrations', 'registrationId', id);
            if (!r) { invalid++; return; }
            if (r.checkInStatus === 'checked_in') { skipped++; return; }
            if (['cancelled','withdrawn'].includes(r.entryStatus)) { invalid++; errors.push(r.tournamentPlayerCode || r.playerId); return; }
            const result = RegistrationService.checkIn(id);
            if (result.errors) { invalid++; errors.push(r.tournamentPlayerCode || r.playerId); }
            else saved++;
        });
        this.showToast(
            this.ui(
                `Bulk Check-in: ${saved} checked in · ${skipped} already checked in · ${invalid} skipped/invalid${errors.length ? ` (${errors.slice(0,5).join(', ')})` : ''}`,
                `เช็กอินแบบกลุ่ม: สำเร็จ ${saved} คน · เช็กอินแล้ว ${skipped} คน · ข้าม/มีปัญหา ${invalid} คน${errors.length ? ` (${errors.slice(0,5).join(', ')})` : ''}`
            ),
            invalid ? 'warning' : 'success'
        );
        this.navigate('registration');
    },

    bulkUndoCheckInSelected() {
        const ids = this.selectedRegistrationIds();
        if (!ids.length) return this.showToast(this.ui('Select at least one registration.','เลือกรายชื่ออย่างน้อย 1 คน'), 'warning');
        if (!confirm(this.ui('Undo check-in for selected Players only when they have no competition history? Assigned Tournament Player Codes will be preserved.','ยกเลิกเช็กอินผู้เล่นที่เลือกเฉพาะคนที่ยังไม่มีประวัติการแข่งขันใช่หรือไม่? รหัสผู้เล่นรายการเดิมจะยังคงไว้'))) return;
        let reversed = 0, skipped = 0, protectedCount = 0;
        ids.forEach(id => {
            const r = Storage.getById('registrations', 'registrationId', id);
            if (!r || r.checkInStatus !== 'checked_in') { skipped++; return; }
            const result = RegistrationService.uncheckIn(id);
            if (result.errors) protectedCount++;
            else reversed++;
        });
        this.showToast(
            this.ui(
                `Undo Check-in: ${reversed} reversed · ${skipped} not checked in · ${protectedCount} protected by history.`,
                `ยกเลิกเช็กอิน: สำเร็จ ${reversed} คน · ยังไม่ได้เช็กอิน ${skipped} คน · ป้องกันจากประวัติการแข่งขัน ${protectedCount} คน`
            ),
            protectedCount ? 'warning' : 'success'
        );
        this.navigate('registration');
    },

    showBulkRegForm(divisionId) {
        const div = DivisionService.getById(divisionId);
        if (!div) return this.showToast(this.ui('Division not found.','ไม่พบดิวิชัน'), 'error');

        const players = PlayerService.getAll();
        const existingRegs = RegistrationService.getByDivision(divisionId);
        const registeredIds = new Set(existingRegs.flatMap(r => CompetitionEntryService.memberIds(r)));

        const groupMap = new Map();
        players.filter(p=>!registeredIds.has(p.playerId)).forEach(p=>{
            const key = p.entryGroupId ? `G:${p.entryGroupId}` : `P:${p.playerId}`;
            if (!groupMap.has(key)) groupMap.set(key,[]);
            groupMap.get(key).push(p);
        });
        const available = [...groupMap.entries()].map(([key,members])=>({
            key,
            members:members.sort((a,b)=>(a.entryGroupMemberIndex||99)-(b.entryGroupMemberIndex||99))
        })).filter(entry => {
            if ((div.entryMode||'individual_only')==='individual_only') return entry.members.length===1;
            return entry.members.length <= Number(div.maxEntryMembers||2);
        }).sort((a,b)=>PlayerDisplayService.primary(a.members[0]).localeCompare(PlayerDisplayService.primary(b.members[0]),undefined,{numeric:true,sensitivity:'base'}));

        const maxSeed = existingRegs.reduce((m, r) => Math.max(m, Number(r.seed) || 0), 0);
        const startSeed = maxSeed + 1;

        if (!available.length) {
            return this.showToast(this.ui('No available Player/Entry remains for this Division.','ไม่มีผู้เล่น/Entry ที่พร้อมลงทะเบียนในดิวิชันนี้'), 'warning');
        }

        const playerRows = available.map(entry => {
            const members = entry.members;
            const names = members.map(p=>PlayerDisplayService.short(p)).join(' / ');
            const fullNames = members.map(p=>PlayerDisplayService.primary(p)).join(' / ');
            const schools = [...new Set(members.map(p=>p.schoolOrClub).filter(Boolean))].join(' / ');
            const intentMatch = members.some(p=>PlayerIntentService.matchesDivision(p,div));
            const search = [names,fullNames,schools,...members.flatMap(p=>[p.playerId,p.province,p.country,PlayerIntentService.tagsText(p),PlayerIntentService.note(p)])].filter(Boolean).join(' ').toLowerCase();
            const typeLabel = members.length>1 ? this.ui('PAIR','คู่') : this.ui('SINGLE','เดี่ยว');
            return `<label class="bulk-reg-row flex items-start gap-3 p-2 border-b dark:border-gray-700 hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer" data-bulk-reg-search="${Utils.escHtml(search)}" data-intent-match="${intentMatch?'1':'0'}">
                <input type="checkbox" class="bulk-reg-player mt-1" value="${Utils.escHtml(entry.key)}" onchange="App.updateBulkRegCount()">
                <div class="min-w-0 flex-1">
                    <div class="font-medium flex items-center gap-2 flex-wrap"><span>${Utils.escHtml(names)}</span><span class="px-1.5 py-0.5 rounded-full text-[10px] bg-purple-100 text-purple-700">${typeLabel}</span>${intentMatch?`<span class="px-1.5 py-0.5 rounded-full text-[10px] bg-emerald-100 text-emerald-700">${this.ui('Suggested','แนะนำ')}</span>`:''}</div>
                    <div class="text-xs text-gray-500">${Utils.escHtml(fullNames)}${schools?` · ${Utils.escHtml(schools)}`:''}</div>
                </div>
            </label>`;
        }).join('');

        const body = `<div class="space-y-3">
            <div class="rounded-lg border border-emerald-200 dark:border-emerald-900 p-3 bg-emerald-50/60 dark:bg-emerald-950/20">
                <p class="font-medium">${this.ui(`Bulk Register to ${div.divisionCode}`,`ลงทะเบียนหลายคนเข้า ${div.divisionCode}`)}</p>
                <p class="text-xs text-gray-500 mt-1">${this.ui(`${available.length} active Player(s) are available. Existing registrations are automatically excluded.`,`มีผู้เล่นที่ใช้งานและยังไม่ได้ลงทะเบียน ${available.length} คน รายชื่อที่ลงทะเบียนแล้วจะถูกตัดออกอัตโนมัติ`)}</p>
            </div>

            <div class="flex gap-2 flex-wrap items-center">
                <input id="bulk-reg-search" type="search" oninput="App.filterBulkRegPlayers(this.value)"
                    placeholder="${this.ui('Search name, Player ID, school/club, province...','ค้นหาชื่อ รหัสผู้เล่น โรงเรียน/คลับ จังหวัด...')}"
                    class="flex-1 min-w-[220px] px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600 text-sm">
                <button type="button" onclick="App.filterSuggestedBulkRegPlayers()" class="px-3 py-2 border border-violet-400 text-violet-700 dark:text-violet-300 rounded-lg text-xs">${this.ui(`Suggested for ${div.divisionCode}`,'แนะนำสำหรับ '+div.divisionCode)}</button>
                <button type="button" onclick="App.showAllBulkRegPlayers()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Show All','แสดงทั้งหมด')}</button>
                <button type="button" onclick="App.selectVisibleBulkRegPlayers()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Select Visible','เลือกที่แสดง')}</button>
                <button type="button" onclick="App.selectAllBulkRegPlayers()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Select All','เลือกทั้งหมด')}</button>
                <button type="button" onclick="App.clearBulkRegSelection()" class="px-3 py-2 border rounded-lg text-xs">${this.ui('Clear','ล้าง')}</button>
            </div>

            <div class="flex items-center justify-between gap-3 flex-wrap">
                <span id="bulk-reg-count" class="text-sm font-medium text-emerald-700 dark:text-emerald-300">${this.ui('0 selected','เลือก 0 คน')}</span>
                <label class="text-sm flex items-center gap-2">
                    <span>${this.ui('Starting seed','Seed เริ่มต้น')}</span>
                    <input id="bulk-reg-start-seed" type="number" min="1" value="${startSeed}" class="w-24 px-2 py-1.5 border rounded-lg dark:bg-gray-700 dark:border-gray-600">
                </label>
            </div>

            <div class="border rounded-lg max-h-[48vh] overflow-y-auto dark:border-gray-700">
                ${playerRows}
            </div>

            <p class="text-xs text-gray-500">${this.ui('Seeds are assigned sequentially in the order shown. Registration does not check players in automatically; use Check-in Selected afterward.','ระบบจะกำหนด Seed ต่อเนื่องตามลำดับรายชื่อที่แสดง การลงทะเบียนจะยังไม่เช็กอินอัตโนมัติ จากนั้นใช้ Check-in Selected ได้ตามปกติ')}</p>
        </div>`;

        const actions = `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button>
            <button onclick="App.saveBulkRegistrations('${divisionId}')" class="px-4 py-2 bg-emerald-600 text-white rounded-lg font-medium">${this.ui('Register Selected','ลงทะเบียนที่เลือก')}</button>`;

        this.showModal(this.ui(`Register Many — ${div.divisionCode}`,`ลงทะเบียนหลายคน — ${div.divisionCode}`), body, actions);
    },

    filterBulkRegPlayers(q) {
        const query = String(q || '').trim().toLowerCase();
        document.querySelectorAll('.bulk-reg-row').forEach(row => {
            row.classList.toggle('hidden', !!query && !String(row.dataset.bulkRegSearch || '').includes(query));
        });
        this.updateBulkRegCount();
    },

    filterSuggestedBulkRegPlayers() {
        const searchInput = document.getElementById('bulk-reg-search');
        if (searchInput) searchInput.value = '';
        document.querySelectorAll('.bulk-reg-row').forEach(row => {
            row.classList.toggle('hidden', row.dataset.intentMatch !== '1');
        });
        this.updateBulkRegCount();
    },

    showAllBulkRegPlayers() {
        const searchInput = document.getElementById('bulk-reg-search');
        if (searchInput) searchInput.value = '';
        document.querySelectorAll('.bulk-reg-row').forEach(row => row.classList.remove('hidden'));
        this.updateBulkRegCount();
    },

    selectVisibleBulkRegPlayers() {
        document.querySelectorAll('.bulk-reg-row:not(.hidden) .bulk-reg-player').forEach(cb => cb.checked = true);
        this.updateBulkRegCount();
    },

    selectAllBulkRegPlayers() {
        document.querySelectorAll('.bulk-reg-player').forEach(cb => cb.checked = true);
        this.updateBulkRegCount();
    },

    clearBulkRegSelection() {
        document.querySelectorAll('.bulk-reg-player').forEach(cb => cb.checked = false);
        this.updateBulkRegCount();
    },

    updateBulkRegCount() {
        const count = document.querySelectorAll('.bulk-reg-player:checked').length;
        const el = document.getElementById('bulk-reg-count');
        if (el) el.textContent = this.ui(`${count} Entry selected`, `เลือก ${count} Entry`);
    },

    saveBulkRegistrations(divisionId) {
        const div=DivisionService.getById(divisionId);
        if(!div) return this.showToast(this.ui('Division not found.','ไม่พบดิวิชัน'),'error');
        const orderedSelected=Array.from(document.querySelectorAll('.bulk-reg-player')).filter(cb=>cb.checked).map(cb=>cb.value);
        if(!orderedSelected.length) return this.showToast(this.ui('Select at least one Entry.','เลือกอย่างน้อย 1 Entry'),'warning');
        const startSeed=Number(document.getElementById('bulk-reg-start-seed')?.value);
        if(!Number.isInteger(startSeed)||startSeed<1) return this.showToast(this.ui('Starting seed must be a positive integer.','Seed เริ่มต้นต้องเป็นจำนวนเต็มบวก'),'error');

        const players=PlayerService.getAll();
        let registered=0,skipped=0; const errors=[];
        orderedSelected.forEach(key=>{
            let memberIds=[];
            if(key.startsWith('G:')) {
                const gid=key.slice(2);
                memberIds=players.filter(p=>p.entryGroupId===gid).sort((a,b)=>(a.entryGroupMemberIndex||99)-(b.entryGroupMemberIndex||99)).map(p=>p.playerId);
            } else memberIds=[key.replace(/^P:/,'')];
            const result=RegistrationService.create({
                tournamentId:div.tournamentId,divisionId,
                playerId:memberIds[0],memberPlayerIds:memberIds,
                seed:startSeed+registered
            });
            if(result.errors){errors.push(`${key}: ${result.errors[0]}`);skipped++;} else registered++;
        });
        this.closeModal();
        this.showToast(this.ui(`Bulk Entry registration: ${registered} registered · ${skipped} skipped`,`ลงทะเบียน Entry แบบกลุ่ม: สำเร็จ ${registered} · ข้าม ${skipped}`),errors.length?'warning':'success');
        this.navigate('registration');
    },

    showRegForm(divisionId) {
        const div=DivisionService.getById(divisionId);
        const players=PlayerService.getAll();
        const existingRegs=RegistrationService.getByDivision(divisionId);
        const registeredIds=new Set(existingRegs.flatMap(r=>CompetitionEntryService.memberIds(r)));
        const available=players.filter(p=>!registeredIds.has(p.playerId));
        const options=available.map(p=>`<option value="${p.playerId}">${Utils.escHtml(PlayerDisplayService.primary(p))}${p.schoolOrClub?` · ${Utils.escHtml(p.schoolOrClub)}`:''}</option>`).join('');
        const pairAllowed=(div.entryMode||'individual_only')==='individual_or_pair';
        const body=`<form id="reg-form" class="space-y-3">
            <div><label class="text-sm font-medium block mb-1">${this.ui('Member 1 *','สมาชิกคนที่ 1 *')}</label><select id="rf-player" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600"><option value="">-- ${this.ui('Select Player','เลือกผู้เล่น')} --</option>${options}</select></div>
            ${pairAllowed?`<div><label class="text-sm font-medium block mb-1">${this.ui('Member 2 (optional)','สมาชิกคนที่ 2 (ไม่บังคับ)')}</label><select id="rf-player2" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600"><option value="">-- ${this.ui('Single Entry / no second member','เดี่ยว / ไม่มีสมาชิกคนที่ 2')} --</option>${options}</select><p class="text-xs text-gray-500 mt-1">${this.ui('Each member keeps their own School / Institution record.','สมาชิกแต่ละคนยังเก็บโรงเรียน / สถาบันของตนเอง')}</p></div>`:''}
            <div><label class="text-sm font-medium block mb-1" for="rf-seed">Seed</label><input id="rf-seed" type="number" min="1" class="w-full px-3 py-2 border rounded-lg dark:bg-gray-700 dark:border-gray-600" value="${existingRegs.length+1}"></div>
        </form>`;
        const actions=`<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.saveRegistration('${divisionId}')" class="px-4 py-2 bg-amber-500 text-white rounded-lg font-medium">${this.ui('Register Entry','ลงทะเบียน Entry')}</button>`;
        this.showModal(`${this.ui('Register to','ลงทะเบียนเข้า')} ${div.divisionCode}`,body,actions);
    },

    removeRegistration(id) {
        const d = RegistrationService.dependencies(id);
        if (!d) return;
        const p = PlayerService.getById(d.registration.playerId);
        const t = TournamentService.getById(d.registration.tournamentId);
        const div = DivisionService.getById(d.registration.divisionId);
        if (d.pairings.length || d.results.length || d.snapshots.length || d.locked) { this.showToast('This registration has competition history and cannot be permanently deleted. Use Withdraw instead.', 'error'); return; }
        const body = `<p class="font-semibold">Remove this player from this Division?</p><div class="mt-3 text-sm space-y-1"><p><strong>Player ID:</strong> ${Utils.escHtml(d.registration.playerId)}</p><p><strong>Player:</strong> ${Utils.escHtml(p?.displayName || `${p?.firstName||''} ${p?.lastName||''}`.trim())}</p><p><strong>Tournament:</strong> ${Utils.escHtml(t?.tournamentName||'')}</p><p><strong>Division:</strong> ${Utils.escHtml(div?.divisionName||div?.divisionCode||'')}</p></div><p class="mt-3 text-xs text-gray-500">This removes the registration only. The global Player record will not be deleted.</p>`;
        this.showModal('Remove Registration?', body, `<button onclick="App.closeModal()" class="px-4 py-2 border rounded-lg">${this.ui('Cancel','ยกเลิก')}</button><button onclick="App.confirmRemoveRegistration('${id}')" class="px-4 py-2 bg-red-600 text-white rounded-lg">Remove Registration</button>`);
    },
    confirmRemoveRegistration(id) {
        const result = RegistrationService.permanentDelete(id);
        if (result.errors) { this.showToast(result.errors[0], 'error'); return; }
        this.closeModal(); this.showToast('Registration removed; Player record preserved.', 'success'); this.navigate('registration');
    },

    saveRegistration(divisionId) {
        const div = DivisionService.getById(divisionId);
        const member1=document.getElementById('rf-player').value;
        const member2=document.getElementById('rf-player2')?.value || '';
        if (!member1) return this.showToast(this.ui('Select Member 1.','เลือกสมาชิกคนที่ 1'),'error');
        if (member2 && member2===member1) return this.showToast(this.ui('Member 1 and Member 2 must be different Players.','สมาชิกคนที่ 1 และ 2 ต้องเป็นคนละคน'),'error');
        const result = RegistrationService.create({
            tournamentId: div.tournamentId, divisionId,
            playerId: member1,
            memberPlayerIds:[member1,member2].filter(Boolean),
            seed: document.getElementById('rf-seed').value
        });
        if (result.errors) { this.showToast(result.errors[0], 'error'); return; }
        this.closeModal();
        this.showToast('Registered!', 'success');
        this.navigate('registration');
    },

    // ========== ROUNDS ==========
    renderRounds(el) {
        if (!this.currentTournamentId) { el.innerHTML = `<p class="text-gray-500 text-center py-8">${this.ui('Select a tournament first','กรุณาเลือกทัวร์นาเมนต์ก่อน')}</p>`; return; }
        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d=>d.divisionId===this.currentDivisionId) : divs[0];
        if (!targetDiv) { el.innerHTML = `<p class="text-gray-500 py-8">${this.ui('No divisions','ยังไม่มีดิวิชัน')}</p>`; return; }
        const rounds = RoundService.getByDivision(targetDiv.divisionId);

        let html = `<div class="space-y-4">
            <div class="flex justify-between items-center flex-wrap gap-2">
                <h3 class="font-semibold">${targetDiv.divisionCode} — Rounds (${rounds.length}/${targetDiv.totalRounds})</h3>
                <button onclick="App.createRound('${targetDiv.divisionId}')" class="px-3 py-2 bg-amber-500 text-white rounded-lg text-sm font-medium">${this.ui('+ New Round','+ รอบใหม่')}</button>
            </div>
            <div class="card rounded-lg p-4 border border-cyan-700 bg-cyan-950/10">
                <h4 class="font-semibold">Round Lifecycle Centralization</h4>
                <p class="text-sm text-gray-500 mt-1">All Round status changes now pass through one lifecycle transition graph. Illegal jumps are blocked before status mutation.</p>
                <button onclick="App.runRoundLifecycleSelfTest()" class="mt-3 px-3 py-2 border border-cyan-600 text-cyan-500 rounded-lg text-sm">Run Round Lifecycle Self-Test</button>
                <div id="round-lifecycle-self-test-result" class="hidden"></div>
            </div>`;
        rounds.forEach(r => {
            const pairings = PairingService.getByRound(r.roundId);
            const results = ResultService.getByRound(r.roundId);
            // Patch 02.15.1 — BYE is an official result and must count toward round completeness.
            // Use all non-cancelled pairings/results here; do not compare against normal pairings only.
            const activePairings = pairings.filter(p=>p.status !== 'cancelled');
            const activeResults = results.filter(m=>m.status !== 'voided' && m.resultType !== 'void');
            const roundResultIntegrity = PairingResultIntegrityService.inspectRound(r.roundId);
            const allPairingResultsComplete = activePairings.length > 0 &&
                activeResults.length === activePairings.length &&
                activePairings.every(p => PairingResultIntegrityService.hasExactlyOneActiveResult(
                    p.pairingId,
                    p.pairingType === 'bye' ? 'bye' : 'normal'
                ));
            html += `<div class="card rounded-lg p-4 bg-white dark:bg-gray-800">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div>
                        <h4 class="font-bold">${r.roundLabel}</h4>
                        <p class="text-xs text-gray-500">Status: <span class="status-badge ${r.status==='locked'?'bg-purple-100 text-purple-800':r.status==='in_progress'?'bg-blue-100 text-blue-800':'bg-gray-100 text-gray-600'}">${r.status}</span>
                        · Maximum Spread: ±${SpreadLimitResolver.getSpreadLimit(targetDiv.divisionId, r.roundNumber)} ${SpreadLimitResolver.getRule(targetDiv.divisionId, r.roundNumber).overridden ? '<span class="status-badge bg-amber-100 text-amber-800">ROUND OVERRIDE</span>' : ''} · Pairings: ${activePairings.length} · Results: ${activeResults.length}/${activePairings.length}</p>
                    </div>
                    <div class="flex gap-1 flex-wrap">
                        <button onclick="App.openRoundPairings('${r.roundId}','${targetDiv.divisionId}')" class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">${this.ui('Pairings','คู่แข่งขัน')}</button>
                        ${r.status==='pairing_confirmed' && results.length===0?`<button onclick="App.reopenPairings('${r.roundId}')" class="text-xs px-2 py-1 bg-amber-100 text-amber-800 rounded">${this.ui('Reopen Pairings','เปิดแก้ไขคู่แข่งขัน')}</button>`:''}
                        ${r.status==='pairing_confirmed'?`<button onclick="App.startRound('${r.roundId}')" class="text-xs px-2 py-1 bg-green-100 text-green-700 rounded">Start</button>`:''}
                        ${r.status==='draft'?`<button onclick="App.deleteRound('${r.roundId}')" class="text-xs px-2 py-1 bg-red-100 text-red-700 rounded">${this.ui('Delete Round','ลบรอบ')}</button>`:''}
                        ${r.status==='in_progress'||r.status==='results_pending'||r.status==='completed'?`<button onclick="App.currentDivisionId='${targetDiv.divisionId}';App.navigate('results')" class="text-xs px-2 py-1 bg-blue-100 text-blue-700 rounded">${this.ui('Results','ผลการแข่งขัน')}</button>`:''}
                        ${(r.status==='completed'||r.status==='in_progress')&&allPairingResultsComplete&&roundResultIntegrity.ok?`<button onclick="App.lockRound('${r.roundId}')" class="text-xs px-2 py-1 bg-purple-100 text-purple-700 rounded">Lock</button>`:''}
                        ${r.status==='locked'?`<button onclick="App.unlockRound('${r.roundId}')" class="text-xs px-2 py-1 bg-red-100 text-red-700 rounded">${this.ui('Unlock','ปลดล็อก')}</button>`:''}
                    </div>
                </div>
            </div>`;
        });
        if ((targetDiv.finalStageFormat || 'none') !== 'none') {
            const finalCfg = FinalStageService.configForDivision(targetDiv.divisionId);
            const finalState = FinalStageService.stateForDivision(targetDiv.divisionId);
            const stage = finalState.stage;
            let finalLabel = this.ui('Waiting for Main Rounds','รอรอบหลักจบ');
            let badgeClass = 'bg-gray-100 text-gray-700 dark:bg-gray-700 dark:text-gray-200';

        const validation = PairingService.validateRound(roundId);
        if (validation.errors.length) { this.showToast(`Cannot start: ${validation.errors.join('; ')}`, 'error'); return; }
        const started = RoundService.startRound(roundId);
        if (started.errors) { this.showToast(started.errors.join('; '), 'error'); return; }
        this.showToast('Round started', 'success');
        this.navigate('rounds');

    pairingWarningText(warning, divisionId) {
        const w = String(warning || '');
        if (this.lang !== 'th') return w;

        let m = w.match(/^KOTH automatic BYE:\s*(.+?)\s+is the bottom-ranked eligible player(?:\s*\(#(\d+)\))?\s+because the remaining KOTH pool is odd\.$/i);
        if (m) {
            const code = m[1].trim();
            const rank = m[2] ? ` (#${m[2]})` : '';
            return `BYE อัตโนมัติแบบ KOTH: ${code}${rank} เนื่องจากเป็นผู้เล่นอันดับต่ำสุดที่มีสิทธิ์แข่งขัน และจำนวนผู้เล่นที่เหลือเป็นเลขคี่`;
        }

        m = w.match(/^Repeat opponent:\s*(.+?)\s*\/\s*(.+)$/i);
        if (m) {
            const label = (playerId) => {
                const resolved = TournamentPlayerDisplayService.resolveByPlayerId(divisionId, playerId.trim());
                return resolved?.displayLabel || playerId.trim();
            };
            return `คู่แข่งซ้ำ: ${label(m[1])} พบ ${label(m[2])}`;
        }

        m = w.match(/^Repeat opponent warning:\s*(.+?)\s*\/\s*(.+?)\.\s*Manual override may be used after preview\.$/i);
        if (m) {
            const label = (playerId) => {
                const resolved = TournamentPlayerDisplayService.resolveByPlayerId(divisionId, playerId.trim());
                return resolved?.displayLabel || playerId.trim();
            };
            return `คู่แข่งซ้ำ: ${label(m[1])} พบ ${label(m[2])} — สามารถปรับคู่ด้วยตนเองหลังดูตัวอย่าง`;
        }

        return w;
    },

    // ========== PAIRINGS ==========
    renderPairings(el) {
        if (!this.currentTournamentId) { el.innerHTML = `<p class="text-gray-500 text-center py-8">${this.ui('Select a tournament first','กรุณาเลือกทัวร์นาเมนต์ก่อน')}</p>`; return; }
        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d=>d.divisionId===this.currentDivisionId) : divs[0];
        if (!targetDiv) { el.innerHTML = `<p class="text-gray-500 py-8">${this.ui('No divisions','ยังไม่มีดิวิชัน')}</p>`; return; }
        const rounds = RoundService.getByDivision(targetDiv.divisionId);
        if (!rounds.length) { el.innerHTML = `<p class="text-gray-500 py-8">${this.ui('No rounds yet. Create a round first.','ยังไม่มีรอบการแข่งขัน กรุณาสร้างรอบก่อน')}</p>`; return; }
        let selectedRound = this.currentRoundId ? rounds.find(r => r.roundId === this.currentRoundId) : null;
        if (!selectedRound) selectedRound = rounds[rounds.length - 1];
        this.currentRoundId = selectedRound.roundId;
        const pairings = PairingService.getByRound(selectedRound.roundId);
        const eligible = RegistrationService.getEligible(targetDiv.divisionId);
        const rrPlanReport = RoundRobinCapacityService.analyzePlan(targetDiv.divisionId, eligible.length);

    assignExplicitBye(roundId, divisionId, registrationId) {
        const round = RoundService.getById(roundId);
        if (!round || round.divisionId !== divisionId) { this.showToast('Round or Division not found.', 'error'); return; }
        if (!['draft','pairing_generated'].includes(round.status)) { this.showToast('BYE can only be assigned while pairings are editable.', 'error'); return; }
        if (ResultService.getByRound(roundId).length) { this.showToast('Cannot assign BYE after results exist.', 'error'); return; }
        const eligible = RegistrationService.getEligible(divisionId);
        const pairings = PairingService.getByRound(roundId);
        const pairedIds = new Set(pairings.flatMap(p=>[p.player1Id,p.player2Id].filter(Boolean)));
        const unpaired = eligible.filter(r=>!pairedIds.has(r.playerId));
        if (eligible.length % 2 === 0) { this.showToast('Even player pool must not receive a BYE.', 'error'); return; }
        if (pairings.some(p=>p.pairingType==='bye')) { this.showToast('This round already has a BYE.', 'error'); return; }
        if (unpaired.length !== 1 || unpaired[0].registrationId !== registrationId) { this.showToast('Assign BYE is allowed only for the sole remaining eligible player.', 'error'); return; }
        const reg = unpaired[0];
        const nextTable = TableAssignmentService.nextAvailable(roundId, divisionId);
        const result = PairingService.create({
            tournamentId: round.tournamentId, divisionId, roundId,
            roundNumber: round.roundNumber, tableNumber: nextTable,
            player1RegistrationId: reg.registrationId, player1Id: reg.playerId,
            pairingType: 'bye', generatedMethod: 'manual', manualOverride: true,
            engineMetadata: { assignmentMode:'explicit_manual_bye' }
        });
        if (result.errors) { this.showToast(result.errors.join('; '), 'error'); return; }
        AuditService.log({ tournamentId:round.tournamentId, divisionId, roundId, entityType:'pairing', entityId:result.data.pairingId, action:'assign_bye', eventCode:'MANUAL_BYE_ASSIGNED', after:{ pairingId:result.data.pairingId, registrationId:reg.registrationId, playerId:reg.playerId, tableNumber:nextTable } });
        this.currentPairingProposal = null;
        this.showToast('BYE assigned to the remaining player.', 'success');
        this.navigate('pairings');
    },

    syncPairingPlanByeUI(roundId, divisionId) {
        const context = PairingContextBuilder.build(divisionId, roundId);
        const engineName = document.getElementById('plan-engine')?.value;
        const byeWrap = document.getElementById('plan-bye-wrap');
        const byeSelect = document.getElementById('plan-bye');
        const rrInfo = document.getElementById('plan-rr-bye-info');
        const gibsonWrap = document.getElementById('plan-gibson-wrap');
        const gibsonSelect = document.getElementById('plan-gibson');
        const dualByeAdvisory = document.getElementById('plan-dual-bye-advisory');
        const kothByeInfo = document.getElementById('plan-koth-bye-info');
        if (!byeWrap || !byeSelect || !rrInfo || !gibsonWrap || !gibsonSelect || !kothByeInfo || context.errors) return;
        const previousBye = byeSelect.value;
        byeWrap.classList.add('hidden'); rrInfo.classList.add('hidden'); gibsonWrap.classList.add('hidden'); kothByeInfo.classList.add('hidden'); kothByeInfo.innerHTML=''; if (dualByeAdvisory) dualByeAdvisory.classList.add('hidden');
        if (engineName === 'round_robin') { if (context.registrations.length % 2 === 1) rrInfo.classList.remove('hidden'); return; }
        let excludedGibson = new Set();
        if (engineName === 'king_of_the_hill') {
            gibsonWrap.classList.remove('hidden');
            if (!gibsonSelect.options.length) gibsonSelect.innerHTML = context.registrations.map(r => `<option value="${r.registrationId}">${Utils.escHtml(TournamentPlayerDisplayService.label(r.registrationId,r.playerId))}</option>`).join('');
            excludedGibson = new Set([...gibsonSelect.selectedOptions].map(o => o.value));
        }
        const activePool = context.registrations.filter(r => !excludedGibson.has(r.registrationId));
        if (engineName === 'king_of_the_hill' && activePool.length % 2 === 1) {
            const autoBye = KothOrdinaryByeService.selectBottom(context, activePool);
            const rank = KothOrdinaryByeService.rank(context, autoBye);
            byeSelect.innerHTML = `<option value="">— ${this.ui('KOTH automatic BYE','KOTH กำหนด BYE อัตโนมัติ')} —</option>`;
            byeSelect.value = '';
            if (autoBye) {
                const label = this.pairingParticipantOptionText(autoBye.registrationId,autoBye.playerId,divisionId);
                kothByeInfo.innerHTML = `<strong>${this.ui('Automatic KOTH BYE','KOTH BYE อัตโนมัติ')}:</strong> ${Utils.escHtml(label)}${rank ? ` <span class="text-gray-500">(#${rank})</span>` : ''}<br><span class="text-xs text-gray-500">${this.ui('Odd KOTH pool: KTM assigns BYE to the bottom-ranked eligible player automatically. No manager selection or random draw is needed.','KOTH pool เป็นเลขคี่ ระบบกำหนด BYE ให้ผู้เล่นอันดับล่างสุดอัตโนมัติ ไม่ต้องให้ Manager เลือกหรือสุ่ม')}</span>`;
                kothByeInfo.classList.remove('hidden');
            }
            if (dualByeAdvisory && excludedGibson.size) dualByeAdvisory.classList.remove('hidden');
        } else if (activePool.length % 2 === 1 && context.byePolicy?.selectionMethod === 'manual') {
            byeWrap.classList.remove('hidden');
            byeSelect.innerHTML = `<option value="">— ${this.ui('Select player who receives BYE','เลือกผู้เล่นที่ได้รับ BYE')} —</option>` + activePool.map(r => `<option value="${r.registrationId}">${Utils.escHtml(this.pairingParticipantOptionText(r.registrationId,r.playerId,divisionId))}</option>`).join('');
            if ([...byeSelect.options].some(o => o.value === previousBye)) byeSelect.value = previousBye;
        } else { byeSelect.innerHTML = `<option value="">— ${this.ui('No ordinary BYE required','ไม่ต้องมี Ordinary BYE')} —</option>`; byeSelect.value = ''; }
    },

    detectAutomaticGibsonClinch(roundId, divisionId) {
        const engineName=document.getElementById('plan-engine')?.value;
        if(engineName!=='king_of_the_hill'){ this.showToast('Automatic Gibson detection applies to KOTH only.','error'); return; }
        const status=document.getElementById('plan-gibson-auto-status');
        const detection=AutomaticGibsonClinchDetectionService.detectForRound(divisionId,roundId);
        if(!detection.ok){ if(status) status.textContent=(detection.errors||[]).join(' '); this.showToast((detection.errors||['Detection failed.']).join(' '),'error'); return; }
        if(!detection.candidates.length){ this.currentAutomaticGibsonAcceptance=null; if(status) status.textContent=detection.status==='UNDETERMINED'?'UNDETERMINED — no automatic Gibson proposal.':'No player is mathematically proven clinched for this round.'; this.showToast(status?.textContent||'No proven Gibson candidate.','info'); return; }
        const labels=detection.candidates.map((c,i)=>`${i+1}. ${TournamentPlayerDisplayService.resolveByPlayerId(divisionId,c.playerId).displayLabel} | current #${c.currentRank} | worst bounded rank #${c.securedRank} | guaranteed Top ${c.qualificationCutoffRank}`).join('\n');
        const ok=confirm(`Gibson Qualification Preview — Patch 02.35.1\n\nThe following player(s) are mathematically guaranteed to remain inside the Final Top ${detection.qualificationCutoffRank}, even under conservative remaining-round bounds:\n\n${labels}\n\nThis is ONLY a preview. Manager may Gibsonize none, one, or several candidates.\n\nPress OK to mark these proven candidates in the selector for review. You may freely unselect any player to KEEP PLAYING before Preview + Confirm.`);
        if(!ok){ if(status) status.textContent='Qualified candidate(s) detected. Manager chose Keep Playing / no selection change.'; return; }
        const select=document.getElementById('plan-gibson');
        const ids=detection.candidates.map(c=>c.registrationId);
        [...select.options].forEach(o=>{ if(ids.includes(o.value)) o.selected=true; });
        const proofByRegistrationId={}; detection.candidates.forEach(c=>proofByRegistrationId[c.registrationId]=c);
        this.currentAutomaticGibsonAcceptance={roundId,divisionId,registrationIds:ids,proofByRegistrationId,acceptedAt:Utils.now()};
        const reason=document.getElementById('plan-reason');
        if(reason && !reason.value.trim()) reason.value=`Top-2 qualification proof reviewed by manager before Round ${RoundService.getById(roundId)?.roundNumber} (Patch 02.35.1)`;
        this.currentPairingProposal=null;
        this.syncPairingPlanByeUI(roundId,divisionId);
        if(status) status.textContent=`Detected ${ids.length} guaranteed Top-2 candidate(s). Manager may keep playing by unselecting any/all before Preview.`;
        this.showToast('Top-2 Gibson candidates marked for manager review. Unselect any player who should keep playing, then Preview.','success');
    },

    runAutomaticGibsonDetectionSelfTest() {
        const t=AutomaticGibsonClinchDetectionService.runSelfTest();
        this.showToast(t.ok?'Automatic Gibson Detection PASSED.':t.message,t.ok?'success':'error');
        return t;
    },

    previewPairingPlan(roundId, divisionId) {
        const round = RoundService.getById(roundId);
        const context = PairingContextBuilder.build(divisionId, roundId);
        const engineName = document.getElementById('plan-engine').value;
        const byeSelect = document.getElementById('plan-bye');
        if (byeSelect?.value) context.manualByeRegistrationId = byeSelect.value;
        const gibsonSelect = document.getElementById('plan-gibson');
        if (engineName === 'king_of_the_hill' && gibsonSelect) context.gibsonByeRegistrationIds = [...gibsonSelect.selectedOptions].map(o => o.value);
        if (engineName === 'king_of_the_hill' && this.currentAutomaticGibsonAcceptance?.roundId===roundId && this.currentAutomaticGibsonAcceptance?.divisionId===divisionId) { const accepted=new Set(this.currentAutomaticGibsonAcceptance.registrationIds||[]); const selected=new Set(context.gibsonByeRegistrationIds||[]); if ([...accepted].every(id=>selected.has(id))) { context.gibsonAssignmentSource='koth_gibson_auto_confirmed'; context.gibsonClinchProofByRegistrationId=this.currentAutomaticGibsonAcceptance.proofByRegistrationId||{}; } }
        const planReason = (document.getElementById('plan-reason')?.value || '').trim();
        context.gibsonizationReason = planReason;
        if (context.gibsonByeRegistrationIds?.length && !planReason) {
            const preview = document.getElementById('pairing-preview');
            preview.innerHTML = '<span class="text-red-600">Gibsonization reason is required when awarding a Gibson BYE.</span>';
            this.currentPairingProposal = null;
            return { errors:['Gibsonization reason is required.'], pairings:[], valid:false };
        }
        const engine = PairingEngineRegistry.get(engineName);
        const rawProposal = engine ? engine.generate(context) : { errors: ['Unknown pairing engine'], pairings: [], valid:false };
        const proposal = (rawProposal.errors || []).length ? rawProposal : TableAssignmentService.assignProposal(rawProposal, context);
        const engineErrors = proposal.errors || [];
        const validation = engineErrors.length ? { valid:false, errors:engineErrors, warnings:proposal.warnings || [] } : PairingValidationService.validate(proposal, context);
        const preview = document.getElementById('pairing-preview');
        const playerLabel = (registrationId,playerId) => this.pairingParticipantHtml(registrationId,playerId,divisionId);
        const liveFingerprint = PairingLiveContextService.fingerprint(context);
        this.currentPairingProposal = validation.valid ? { roundId, divisionId, engineName, proposal, generatedAt: Utils.now(), liveFingerprint } : null;
        if (this.currentPairingProposal) this.renderCurrentPairingProposalPreview(roundId, divisionId);
        else {
            const allWarnings = [...new Set([...(proposal.warnings||[]), ...(validation.warnings||[])])];
            preview.innerHTML = `<strong>${Utils.escHtml(this.pairingEngineLabel(engineName))}</strong> — ${proposal.pairings?.length||0} ${this.ui('pairings','คู่')}<br>${(proposal.pairings||[]).map(p=>`Table ${p.tableNumber}: ${playerLabel(p.player1RegistrationId,p.player1Id)} ${p.pairingType==='bye'?`— ${(p.byeReason||p.engineMetadata?.byeReason)==='gibson'?'GIBSON BYE':'BYE'}`:'vs '+playerLabel(p.player2RegistrationId,p.player2Id)}`).join('<br>')}<br>${allWarnings.length?`<span class="text-amber-600">${allWarnings.map(w=>'⚠ '+Utils.escHtml(this.pairingWarningText(w,divisionId))).join('<br>')}</span><br>`:''}<span class="text-red-600">${this.ui('Validation failed:','ตรวจสอบไม่ผ่าน:')} ${validation.errors.map(e=>Utils.escHtml(e)).join('; ')}</span>`;
        }
        return proposal;
    },

    renderCurrentPairingProposalPreview(roundId, divisionId) {
        const frozen=this.currentPairingProposal;
        const preview=document.getElementById('pairing-preview');
        if(!preview || !frozen || frozen.roundId!==roundId || frozen.divisionId!==divisionId) return;
        const context=PairingContextBuilder.build(divisionId,roundId);
        const currentFingerprint=PairingLiveContextService.fingerprint(context);
        if(frozen.liveFingerprint && frozen.liveFingerprint!==currentFingerprint){
            this.currentPairingProposal=null;
            preview.innerHTML=`<span class="text-amber-600 font-medium">${this.ui('Player information changed after this preview was created. Please generate a new preview before confirming.','ข้อมูลผู้เล่น/โรงเรียนมีการเปลี่ยนแปลงหลังสร้างตัวอย่าง กรุณาสร้างตัวอย่างการจับคู่ใหม่ก่อนยืนยัน')}</span>`;
            return {valid:false,errors:['Live participant data changed'],warnings:[]};
        }
        const proposal=frozen.proposal;
        const validation=PairingValidationService.validate(proposal,context);
        const playerLabel=(registrationId,playerId)=>this.pairingParticipantHtml(registrationId,playerId,divisionId);
        const rows=(proposal.pairings||[]).map(p=>{
            const same=PairingProposalOverrideService.sameAffiliation(p,context);
            const advisory=same?'border-l-4 border-orange-500 bg-orange-500/10':'';
            const tag=same?`<span class="ml-2 inline-block w-2.5 h-2.5 rounded-full bg-orange-500" title="${this.ui('Same school / club — advisory only','โรงเรียน/ชมรมเดียวกัน — เป็นคำเตือน ไม่บล็อกการยืนยัน')}"></span>`:'';
            const detail=p.pairingType==='bye'
                ? `${playerLabel(p.player1RegistrationId,p.player1Id)} — ${(p.byeReason||p.engineMetadata?.byeReason)==='gibson'?'GIBSON BYE':'BYE'}`
                : `${playerLabel(p.player1RegistrationId,p.player1Id)} <span class="text-gray-400">vs</span> ${playerLabel(p.player2RegistrationId,p.player2Id)}`;
            return `<div class="px-2 py-1.5 rounded ${advisory}"><span class="font-mono text-xs text-gray-500">T${p.tableNumber}</span> · ${detail}${tag}${p.manualOverride?'<span class="ml-2 text-xs text-fuchsia-500">MANUAL SWAP</span>':''}</div>`;
        }).join('');
        const slots=PairingProposalOverrideService.swappableSlots(proposal);
        const options=slots.map(x=>`<option value="${Utils.escHtml(x.playerId)}">T${x.tableNumber} · ${Utils.escHtml(this.pairingParticipantOptionText(x.registrationId,x.playerId,divisionId))}</option>`).join('');
        const sameCount=(proposal.pairings||[]).filter(p=>PairingProposalOverrideService.sameAffiliation(p,context)).length;
        const allWarnings=[...new Set([...(proposal.warnings||[]),...(validation.warnings||[])])];
        const schoolAvoidanceNote=frozen.engineName==='random' && proposal.metadata ? `<div class="mt-2 text-xs text-cyan-600">${this.ui(`School/club avoidance: ${proposal.metadata.schoolConflictsBefore??0} → ${proposal.metadata.schoolConflictsAfter??0} same-affiliation pair(s).`,`การหลีกเลี่ยงโรงเรียน/ชมรมเดียวกัน: จาก ${proposal.metadata.schoolConflictsBefore??0} เหลือ ${proposal.metadata.schoolConflictsAfter??0} คู่`)}</div>` : '';
        preview.innerHTML=`
            <div class="flex flex-wrap items-center justify-between gap-2 mb-2"><strong>${Utils.escHtml(this.pairingEngineLabel(frozen.engineName))} — ${proposal.pairings?.length||0} ${this.ui('pairings','คู่')}</strong><span class="text-xs text-gray-500">${this.ui('Exact preview — Confirm saves exactly what is shown','ตัวอย่างนี้จะถูกบันทึกตามที่เห็นเมื่อกดยืนยัน')}</span></div>
            <div class="space-y-1">${rows}</div>
            ${schoolAvoidanceNote}

            ${slots.length>=4?`<div class="mt-3 p-3 rounded-lg border border-fuchsia-500/40 bg-fuchsia-500/5"><div class="font-medium text-sm mb-2">${this.ui('Manual adjustment — swap two players between normal tables','ปรับคู่ด้วยตนเอง — สลับผู้เล่น 2 คนระหว่างโต๊ะปกติ')}</div><p class="text-xs text-gray-500 mb-2">${this.ui('Each option shows the latest school/club so you can reduce same-school matches.','ตัวเลือกจะแสดงโรงเรียน/ชมรมล่าสุด ช่วยให้เลือกสลับเพื่อลดการเจอโรงเรียนเดียวกันได้ง่าย')}</p><div class="grid md:grid-cols-2 gap-2"><select id="override-player-a" class="px-2 py-2 border rounded dark:bg-gray-800 dark:border-gray-600"><option value="">${this.ui('Player A…','ผู้เล่น A…')}</option>${options}</select><select id="override-player-b" class="px-2 py-2 border rounded dark:bg-gray-800 dark:border-gray-600"><option value="">${this.ui('Player B…','ผู้เล่น B…')}</option>${options}</select></div><button type="button" onclick="App.swapPreviewPlayers('${roundId}','${divisionId}')" class="mt-2 px-3 py-2 border border-fuchsia-500 text-fuchsia-500 rounded-lg text-sm">${this.ui('Swap selected players','สลับผู้เล่นที่เลือก')}</button><p class="mt-1 text-xs text-gray-500">${this.ui('BYE/Gibson BYE is protected. KTM rechecks the entire proposal after every swap.','ไม่สามารถสลับช่อง BYE/Gibson BYE ได้ และ KTM จะตรวจสอบคู่ทั้งหมดใหม่หลังการสลับทุกครั้ง')}</p></div>`:''}
            ${allWarnings.length?`<div class="mt-2 text-amber-600">${allWarnings.map(w=>'⚠ '+Utils.escHtml(this.pairingWarningText(w,divisionId))).join('<br>')}</div>`:''}
            <div class="mt-2 ${validation.valid?'text-green-600':'text-red-600'}">${validation.valid?this.ui('Ready to confirm — this exact preview will be saved','พร้อมยืนยัน — ระบบจะบันทึกคู่ตามตัวอย่างนี้'):this.ui('Validation failed: ','ตรวจสอบไม่ผ่าน: ')+validation.errors.map(e=>Utils.escHtml(e)).join('; ')}</div>`;
        frozen.validation=validation;
        return validation;
    },

    swapPreviewPlayers(roundId, divisionId) {
        const frozen=this.currentPairingProposal;
        if(!frozen || frozen.roundId!==roundId || frozen.divisionId!==divisionId){ this.showToast('Generate a valid preview first.','error'); return; }
        const a=document.getElementById('override-player-a')?.value || '';
        const b=document.getElementById('override-player-b')?.value || '';
        const swapped=PairingProposalOverrideService.swapPlayers(frozen.proposal,a,b);
        if(!swapped.ok){ this.showToast(swapped.errors.join('; '),'error'); return; }
        frozen.proposal=swapped.proposal;
        frozen.manualOverrideApplied=true;
        frozen.manualSwapHistory=Array.isArray(frozen.manualSwapHistory) ? frozen.manualSwapHistory : [];
        const swapRecord=PairingManualSwapAuditService.makeRecord(swapped.swapped,divisionId,frozen.manualSwapHistory.length+1);
        if (swapRecord) frozen.manualSwapHistory.push(swapRecord);
        const reason=document.getElementById('plan-reason');
        const previousAutoReason=frozen.autoSwapReason || '';
        const nextAutoReason=`Partial manual pairing swap: ${PairingManualSwapAuditService.summary(frozen.manualSwapHistory)}`;
        if(reason && (!reason.value.trim() || reason.value.trim()===previousAutoReason)) reason.value=nextAutoReason;
        frozen.autoSwapReason=nextAutoReason;
        const validation=this.renderCurrentPairingProposalPreview(roundId,divisionId);
        this.showToast(validation?.valid?'Players swapped. Whole proposal revalidated.':'Swap applied but proposal is not valid yet.',validation?.valid?'success':'error');
    },

    runPairingProposalOverrideSelfTest() {
        const r=PairingProposalOverrideService.runSelfTest();
        this.showToast(r.message,r.ok?'success':'error');
        return r;
    },

    confirmPairingPlan(roundId, divisionId) {
        const frozen = this.currentPairingProposal;
        const engineName = document.getElementById('plan-engine').value;
        if (!frozen || frozen.roundId !== roundId || frozen.divisionId !== divisionId || frozen.engineName !== engineName) {
            this.showToast('Preview this pairing plan first. Confirm will save only the exact valid preview.', 'error');
            return;
        }
        const context = PairingContextBuilder.build(divisionId, roundId);
        const currentFingerprint = PairingLiveContextService.fingerprint(context);
        if (frozen.liveFingerprint && frozen.liveFingerprint !== currentFingerprint) { this.currentPairingProposal=null; this.showToast(this.ui('Player information changed. Generate a new pairing preview before confirming.','ข้อมูลผู้เล่น/โรงเรียนมีการเปลี่ยนแปลง กรุณาสร้างตัวอย่างการจับคู่ใหม่ก่อนยืนยัน'),'warning'); return; }
        const validation = PairingValidationService.validate(frozen.proposal, context);
        if (!validation.valid) { this.currentPairingProposal = null; this.showToast(this.ui('Pairing context changed. Generate a new preview.','ข้อมูลการจับคู่เปลี่ยนแปลง กรุณาสร้างตัวอย่างใหม่'), 'error'); return; }
        // PATCH 02.41: frozen.proposal may contain manager swaps. Confirm persists this exact
        // revalidated proposal; it never calls the pairing engine again.
        const swapHistory=Array.isArray(frozen.manualSwapHistory) ? frozen.manualSwapHistory : [];
        const auditReason=PairingManualSwapAuditService.confirmationReason(document.getElementById('plan-reason').value,swapHistory);
        const result = PairingConfirmationService.confirm(frozen.proposal, context, auditReason);
        if (result.errors) { this.showToast(result.errors.join('; '), 'error'); return; }
        PairingManualSwapAuditService.logConfirmed(swapHistory,context);
        this.currentPairingProposal = null;
        this.closeModal();
        this.showToast('Exact preview confirmed and saved!', 'success');
        this.navigate('pairings');
    },

    runTableAssignmentSelfTest() {
        const result = TableAssignmentTests.run();
        const el = document.getElementById('table-assignment-self-test-result');
        if (el) {
            el.classList.remove('hidden');
            el.className = `text-sm rounded-lg p-3 border mt-3 ${result.ok?'border-green-600 text-green-400':'border-red-600 text-red-400'}`;
            el.textContent = `${result.ok?'✓ PASS':'✗ FAIL'} — ${result.message}`;
        }
        this.showToast(result.ok?'Table Assignment self-test PASSED.':'Table Assignment self-test FAILED.', result.ok?'success':'error');
        return result;
    },

    runByePolicySelfTest() {
        const result = ByePolicyTests.run();
        const el = document.getElementById('bye-policy-self-test-result');
        if (el) { el.classList.remove('hidden'); el.className = `text-sm rounded-lg p-3 border mt-3 ${result.ok?'border-green-600 text-green-400':'border-red-600 text-red-400'}`; el.textContent = `${result.ok?'✓ PASS':'✗ FAIL'} — ${result.message}`; }
        this.showToast(result.ok?'Bye Policy self-test PASSED.':'Bye Policy self-test FAILED.', result.ok?'success':'error');
        return result;
    },

    runGibsonDecisionProvenanceSelfTest() {
        const unit=GibsonDecisionProvenanceService.runSelfTest();
        if(!unit.ok){ this.showToast(unit.message,'error'); return unit; }
        const divisionId=this.currentDivisionId || document.getElementById('global-division-select')?.value || null;
        if(!divisionId){ this.showToast('Gibson Decision Provenance Self-Test PASSED. Select a Division for live audit.','success'); return unit; }
        const live=GibsonDecisionProvenanceService.inspectDivision(divisionId);
        const gibsonRounds=live.checks?.length||0;
        if(!live.ok){ this.showToast(`Gibson Decision Provenance FAILED: ${live.errors.join(' ')}`,'error'); return {...unit,live,ok:false}; }
        const warning=live.warnings?.length?` Warnings: ${live.warnings.join(' ')}`:'';
        this.showToast(`Gibson Decision Provenance PASSED. Gibson rounds checked: ${gibsonRounds}.${warning}`,'success');
        return {...unit,live,ok:true};
    },

    runGibsonizationPairingSelfTest() {
        const result = GibsonizationPairingTests.run();
        this.showToast(result.ok?'Gibsonization Pairing self-test PASSED.':result.message, result.ok?'success':'error');
        return result;
    },

    validatePairings(roundId) {
        const result = PairingService.validateRound(roundId);
        if (result.errors.length) this.showToast(`ERROR: ${result.errors.join('; ')}`, 'error');
        else if (result.warnings.length) this.showToast(`WARNING: ${result.warnings.join('; ')}`, 'warning');
        else this.showToast(`Pairings valid — ${result.pairedCount}/${result.eligibleCount} players paired`, 'success');
        return result;
    },

    confirmPairings(roundId) {
        const validation = PairingService.validateRound(roundId);
        if (validation.errors.length) { this.showToast(`Cannot confirm: ${validation.errors.join('; ')}`, 'error'); return; }
        if (validation.warnings.length) this.showToast(`Confirming with warnings: ${validation.warnings.join('; ')}`, 'warning');
        const result = PairingService.confirmAll(roundId);
        if (result?.errors?.length) { this.showToast(result.errors.join('; '), 'error'); return; }
        AuditService.log({ roundId, entityType:'pairing', entityId:roundId, action:'confirm', eventCode:'PAIRING_CONFIRMED_MANUAL', after:PairingService.getByRound(roundId) });
        this.showToast('Pairings confirmed!', 'success');
        this.navigate('pairings');
    },

                    <button onclick="App.startFinalStage('${targetDiv.divisionId}')" class="mt-4 px-4 py-2 bg-purple-600 text-white rounded-lg">${this.ui('Start Final Stage','เริ่ม Final Stage')}</button>
                </div>

        }

        const stage = state.stage;
        const p1 = PlayerService.getById(stage.player1Id), p2 = PlayerService.getById(stage.player2Id);
        const finalReg1 = Storage.getById('registrations','registrationId',stage.player1RegistrationId);
        const finalReg2 = Storage.getById('registrations','registrationId',stage.player2RegistrationId);
        const finalName1 = finalReg1 ? CompetitionEntryService.compactName(finalReg1) : PlayerDisplayService.short(p1);
        const finalName2 = finalReg2 ? CompetitionEntryService.compactName(finalReg2) : PlayerDisplayService.short(p2);
        const gamesHtml = state.games.length ? state.games.map(g => `
            <div class="grid grid-cols-[70px_1fr_auto_1fr] gap-3 items-center p-3 border rounded-lg dark:border-gray-700">

                <div class="mt-3 flex items-center gap-3">

                    <span class="text-xs text-gray-500">${this.ui('No Maximum Spread cap is applied.','ไม่ใช้ Maximum Spread จำกัดผลต่าง')}</span>

        if (cfg.type === 'aggregate') {

                    <div><span class="text-sm">${this.ui('Champion','แชมป์')}: </span><b>${Utils.escHtml(PlayerDisplayService.primary(winner))}</b></div>

    startFinalStage(divisionId) {

        const r2 = document.getElementById('final-r2')?.value || '';
        const defaults = FinalStageService.defaultQualifierRegistrations(divisionId).map(r=>r.registrationId);

        if (result.errors) return this.showToast(result.errors[0],'error');
        this.showToast(this.ui('Final Stage started.','เริ่ม Final Stage แล้ว'),'success');
        this.resultsMode='final';
        this.navigate('results');

    submitFinalGame(finalStageId) {
        const s1 = document.getElementById('final-score-1')?.value;
        const s2 = document.getElementById('final-score-2')?.value;
        const result = FinalStageService.submitGame(finalStageId,s1,s2);
        if (result.errors) return this.showToast(result.errors[0],'error');
        this.showToast(result.stage?.status==='completed'?this.ui('Final Stage completed!','Final Stage เสร็จสิ้น!'):this.ui('Final game saved.','บันทึกเกม Final แล้ว'),'success');

        this.navigate('results');
    },

    renderResults(el) {
        if (!this.currentTournamentId) { el.innerHTML = `<p class="text-gray-500 text-center py-8">${this.ui('Select a tournament first','กรุณาเลือกทัวร์นาเมนต์ก่อน')}</p>`; return; }
        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d=>d.divisionId===this.currentDivisionId) : divs[0];
        if (!targetDiv) { el.innerHTML = `<p class="text-gray-500 py-8">${this.ui('No divisions','ยังไม่มีดิวิชัน')}</p>`; return; }
        if ((targetDiv.finalStageFormat || 'none') !== 'none' && this.resultsMode === 'final') {
            el.innerHTML = this.buildFinalStagePage(targetDiv);
            return;
        }
        const rounds = RoundService.getByDivision(targetDiv.divisionId);
        // Find active round (in_progress or pairing_confirmed)
        const activeRound = rounds.find(r => ['in_progress','pairing_confirmed','completed','results_pending'].includes(r.status)) || rounds[rounds.length-1];
        if (!activeRound) { el.innerHTML = '<p class="text-gray-500 py-8">No rounds with pairings</p>'; return; }

        // PATCH 02.14.1 — Result Entry must render EVERY official pairing, including BYE.
        // Compatibility recovery: rounds that were already IN_PROGRESS before Patch 02.14
        // may have a confirmed BYE pairing but no auto-generated BYE result yet. Backfill it
        // idempotently when the results page is opened.
        if (['in_progress','results_pending','completed'].includes(activeRound.status)) {
            const byeRecovery = ByeResultService.ensureForRound(activeRound.roundId);
            if (byeRecovery.errors?.length) {
                this.showToast(byeRecovery.errors.join(' '), 'error');
            }
        }

    requestVoidResult(resultId) {
        const result = Storage.getById('matchResults', 'resultId', resultId);
        if (!result) {
            this.showToast('Result not found.', 'error');
            return;
        }
        const round = RoundService.getById(result.roundId);
        if (round?.status === 'locked') {
            this.showToast(`Round ${round.roundNumber} is LOCKED. Unlock the round first.`, 'error');
            return;
        }

        const reason = prompt(
            'Void this result for historical correction?\n\nA reason is required. The original result will be preserved as VOIDED and a replacement result can be entered afterward.',
            ''
        );
        if (reason === null) return;
        if (!reason.trim()) {
            this.showToast('Reason is required to void a result.', 'error');
            return;
        }

        const confirmed = confirm(
            `Void result ${result.player1Score}–${result.player2Score}?\n\nReason: ${reason.trim()}\n\nThe historical record will NOT be deleted.`
        );
        if (!confirmed) return;

        const response = ResultService.voidResult(resultId, reason.trim());
        if (response.errors?.length) {
            this.showToast(response.errors.join(' '), 'error');
            return;
        }
        this.showToast('Result voided safely. Enter the replacement result before locking the round.', 'success');
        this.navigate('results');
    },

    submitSpecialResult(pairingId, resultType) {
        const pairing=Storage.getById('pairings','pairingId',pairingId);
        if(!pairing) return this.showToast('Pairing not found.','error');
        const p1=TournamentPlayerDisplayService.label(pairing.player1RegistrationId,pairing.player1Id);
        const p2=TournamentPlayerDisplayService.label(pairing.player2RegistrationId,pairing.player2Id);

        if(resultType==='double_walkover') {
            const reason=prompt('Reason for DOUBLE WALKOVER:','Both players no-show after 15 minutes');
            if(reason===null) return;
            if(!reason.trim()) return this.showToast('Reason is required for DOUBLE WALKOVER.','error');
            const policy=ResultPolicyExecutionService.policyForDivision(pairing.divisionId);
            const w=policy.walkover || {scoreFor:100,scoreAgainst:0,officialSpreadAwarded:100};
            const msg=`Record DOUBLE WALKOVER as an official administrative result?\n\n${p1}: GP1 / L1 / MP0 / SF${Number(w.scoreAgainst??0)} / SA${Number(w.scoreFor??100)} / OS -${Math.abs(Number(w.officialSpreadAwarded??100))}\n${p2}: GP1 / L1 / MP0 / SF${Number(w.scoreAgainst??0)} / SA${Number(w.scoreFor??100)} / OS -${Math.abs(Number(w.officialSpreadAwarded??100))}\n\nThis is NOT a 0–0 tie. The frozen result will remain in history.`;
            if(!confirm(msg)) return;
            const result=ResultService.submitSpecial({pairingId,resultType,winnerSide:null,reason:reason.trim()});
            if(result.errors) return this.showToast(result.errors[0],'error');
            this.showToast('DOUBLE WALKOVER result saved!','success');
            this.navigate('results');
            return;
        }

        const choice=prompt(`${resultType.toUpperCase()} — select winner\n1 = ${p1}\n2 = ${p2}`,'1');
        if(choice===null) return;
        const winnerSide=Number(choice);
        if(![1,2].includes(winnerSide)) return this.showToast('Winner must be 1 or 2.','error');
        const reason=prompt(`Reason for ${resultType.toUpperCase()}:`,resultType==='walkover'?'No show':'Forfeit / referee decision');
        if(reason===null) return;
        const data={pairingId,resultType,winnerSide,reason};
        if(resultType==='forfeit') {
            const ws=prompt('Final adjusted score — WINNER:',''); if(ws===null) return;
            const ls=prompt('Final adjusted score — LOSER:',''); if(ls===null) return;
            data.winnerScore=ws; data.loserScore=ls;
        }
        if(!confirm(`Record ${resultType.toUpperCase()} as an official result?\nWinner: ${winnerSide===1?p1:p2}\nThis result will be frozen into history.`)) return;
        const result=ResultService.submitSpecial(data);
        if(result.errors) return this.showToast(result.errors[0],'error');
        this.showToast(`${resultType.toUpperCase()} result saved!`,'success');
        this.navigate('results');
    },

    filterResultPairs(query) {
        this.resultSearchQuery = String(query || '');
        const q = this.resultSearchQuery.trim().toLowerCase();
        const cards = Array.from(document.querySelectorAll('.result-pair-card'));
        let visible = 0;

        cards.forEach(card => {
            const haystack = String(card.dataset.resultSearch || '').toLowerCase();
            const show = !q || haystack.includes(q);
            card.classList.toggle('hidden', !show);
            if (show) visible++;

        const countEl = document.getElementById('result-search-count');
        if (countEl) {
            countEl.textContent = q
                ? this.ui(`${visible} pair(s) found`, `พบ ${visible} คู่`)
                : '';
        }
    },

    saveAllResults() {
        if (!this.currentTournamentId) {
            this.showToast(this.ui('Select a tournament first.','เลือกทัวร์นาเมนต์ก่อน'), 'error');
            return;
        }

        const divs = DivisionService.getByTournament(this.currentTournamentId);
        const targetDiv = this.currentDivisionId ? divs.find(d => d.divisionId === this.currentDivisionId) : divs[0];
        if (!targetDiv) {
            this.showToast(this.ui('No Division selected.','ยังไม่ได้เลือกดิวิชัน'), 'error');
            return;
        }

        const rounds = RoundService.getByDivision(targetDiv.divisionId);
        const activeRound = rounds.find(r => ['in_progress','pairing_confirmed','completed','results_pending'].includes(r.status)) || rounds[rounds.length - 1];
        if (!activeRound) {
            this.showToast(this.ui('No round is available for result entry.','ไม่มีรอบสำหรับกรอกผลการแข่งขัน'), 'error');
            return;
        }

        const guard = ResultEntryIntegrityService.canEditRound(activeRound);
        if (!guard.ok) {
            this.showToast(guard.errors?.[0] || this.ui('This round cannot accept results.','รอบนี้ไม่สามารถบันทึกผลได้'), 'error');
            return;
        }

        const pairings = PairingService.getByRound(activeRound.roundId)
            .filter(p => p.status !== 'cancelled' && p.pairingType === 'normal');
        const activeResults = Storage.find(
            'matchResults',
            r => r.roundId === activeRound.roundId && r.status !== 'voided' && r.resultType !== 'void'
        );
        const resultPairingIds = new Set(activeResults.map(r => r.pairingId));

        let saved = 0;
        let skipped = 0;
        const invalid = [];

        for (const pairing of pairings) {
            if (resultPairingIds.has(pairing.pairingId) || LateArrivalDoubleWalkoverService.isRestrictedPair(pairing)) {
                skipped++;
                continue;
            }

            const input1 = document.getElementById(`s1-${pairing.pairingId}`);
            const input2 = document.getElementById(`s2-${pairing.pairingId}`);
            if (!input1 || !input2) {
                skipped++;
                continue;
            }

            const raw1 = String(input1.value ?? '').trim();
            const raw2 = String(input2.value ?? '').trim();

            if (!raw1 && !raw2) {
                skipped++;
                continue;
            }

            if (!raw1 || !raw2 || !/^\d+$/.test(raw1) || !/^\d+$/.test(raw2)) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            const player1Score = Number(raw1);
            const player2Score = Number(raw2);
            const validationErrors = Validation.result({ player1Score, player2Score });
            if (validationErrors.length) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            const result = ResultService.submit({
                pairingId: pairing.pairingId,
                player1Score,
                player2Score
            });

            if (result.errors?.length) {
                invalid.push(`T${pairing.tableNumber}`);
                continue;
            }

            saved++;
            resultPairingIds.add(pairing.pairingId);
        }

        const summary = this.ui(
            `Save All: saved ${saved} · skipped ${skipped} · invalid ${invalid.length}${invalid.length ? ` (${invalid.join(', ')})` : ''}`,
            `บันทึกทั้งหมด: สำเร็จ ${saved} คู่ · ข้าม ${skipped} คู่ · ผิด/ไม่ครบ ${invalid.length} คู่${invalid.length ? ` (${invalid.join(', ')})` : ''}`
        );
        this.showToast(summary, invalid.length ? 'warning' : (saved ? 'success' : 'warning'));
        this.navigate('results');
    },

        const s1 = parseInt(document.getElementById(`s1-${pairingId}`).value);
