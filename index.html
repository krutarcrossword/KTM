            if (liveErrors.length) throw new Error(liveErrors.join(' '));

            auditItems.forEach(item => {
                AuditService.log({
                    tournamentId: item.tournamentId,
                    divisionId: item.divisionId,
                    entityType: 'standingSnapshot',
                    entityId: item.currentSnapshotId,
                    action: 'normalize_legacy_versions',
                    eventCode: 'LEGACY_STANDING_SNAPSHOTS_NORMALIZED',
                    reason: `Legacy official snapshots for Round ${item.throughRound} normalized into an immutable version chain.`,
                    after: {
                        throughRound: item.throughRound,
                        snapshotCount: item.snapshotCount,
                        currentSnapshotId: item.currentSnapshotId
                    }
                });
            });

            return {
                ok: true,
                changed: true,
                affectedCount: auditItems.length,
                message: `Legacy snapshot normalization completed for ${auditItems.length} round group(s).`
            };
        } catch (e) {
            // Transactional rollback to the exact database captured before normalization.
            try {
                Storage.replaceAll(before);
            } catch (rollbackError) {
                throw new Error(
                    `CRITICAL: snapshot normalization failed and automatic rollback also failed. ` +
                    `Do not continue using this tab. Recovery copy remains in ${this._recoveryKey}.`
                );
            }
            throw new Error(`Legacy snapshot normalization failed and was rolled back safely: ${e.message || e}`);
        }
    }
};


// ============================================================
// PATCH 02.32.1 — LEGACY SNAPSHOT LINK CHAIN REPAIR
// Repairs ONLY version-link metadata for already-existing snapshot groups.
// It does NOT recalculate standings, change rows, results, pairings, rounds,
// snapshotVersion, or CURRENT/INVALIDATED/SUPERSEDED status.
// A full recovery copy is saved before mutation.
// ============================================================
const LegacySnapshotLinkChainRepairService = {
    _recoveryKey: STORAGE_KEY + '_pre_snapshot_link_chain_repair',

    _sort(items) {
        return items.slice().sort((a,b) => {
            const va = Number(a.snapshotVersion || 1);
            const vb = Number(b.snapshotVersion || 1);
            if (va !== vb) return va - vb;
            const ta = Date.parse(a.calculatedAt || a.createdAt || a.updatedAt || '') || 0;
            const tb = Date.parse(b.calculatedAt || b.createdAt || b.updatedAt || '') || 0;
            return ta - tb;
        });
    },

    _groupKey(s) {
        return `${s.divisionId}::${Number(s.throughRound)}`;
    },

    _scanItems(items) {
        const sorted = this._sort(items);
        const issues = [];

        for (let i = 0; i < sorted.length; i++) {
            const cur = sorted[i];
            const prev = i > 0 ? sorted[i-1] : null;
            const next = i < sorted.length-1 ? sorted[i+1] : null;
            const expectedPrev = prev?.snapshotId || null;
            const expectedNext = next?.snapshotId || null;

            if ((cur.supersedesSnapshotId || null) !== expectedPrev) {
                issues.push({
                    snapshotId: cur.snapshotId,
                    field: 'supersedesSnapshotId',
                    actual: cur.supersedesSnapshotId || null,
                    expected: expectedPrev
                });
            }
            if ((cur.supersededBySnapshotId || null) !== expectedNext) {
                issues.push({
                    snapshotId: cur.snapshotId,
                    field: 'supersededBySnapshotId',
                    actual: cur.supersededBySnapshotId || null,
                    expected: expectedNext
                });
            }
        }
        return { sorted, issues };
    },

    inspect(divisionId = null) {
        const snapshots = Storage.find('standingSnapshots', s => !divisionId || s.divisionId === divisionId);
        const groups = new Map();
        snapshots.forEach(s => {
            const key = this._groupKey(s);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(s);
        });

        const affectedGroups = [];
        let issueCount = 0;

        groups.forEach((items,key) => {
            if (items.length < 2) return;
            const scan = this._scanItems(items);
            if (!scan.issues.length) return;

            issueCount += scan.issues.length;
            affectedGroups.push({
                key,
                divisionId: items[0]?.divisionId || null,
                tournamentId: items[0]?.tournamentId || null,
                throughRound: Number(items[0]?.throughRound),
                snapshotCount: items.length,
                issueCount: scan.issues.length,
                issues: scan.issues
            });
        });

        return {
            needed: affectedGroups.length > 0,
            affectedGroups,
            affectedCount: affectedGroups.length,
            issueCount
        };
    },

    _validateCandidate(data, affectedKeys) {
        const errors = [];
        const groups = new Map();
        (data.standingSnapshots || []).forEach(s => {
            const key = this._groupKey(s);
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(s);
        });

        affectedKeys.forEach(key => {
            const items = groups.get(key) || [];
            const scan = this._scanItems(items);
            if (scan.issues.length) {
                errors.push(`${key}: ${scan.issues.length} link issue(s) remain after candidate repair.`);
            }
        });

        return { ok: errors.length === 0, errors };
    },

    repairAll(divisionId = null) {
        const scan = this.inspect(divisionId);
        if (!scan.needed) {
            return {
                ok:true,
                changed:false,
                affectedCount:0,
                issueCount:0,
                message:'No legacy snapshot link-chain repair is required.'
            };
        }

        const before = Storage.exportAll();

        try {
            localStorage.setItem(this._recoveryKey, JSON.stringify({
                createdAt: Utils.now(),
                source: 'PRE_LEGACY_SNAPSHOT_LINK_CHAIN_REPAIR',
                scopeDivisionId: divisionId || null,
                data: before
            }));
        } catch (e) {
            throw new Error('Snapshot link-chain repair cancelled: recovery copy could not be saved. Live data was not changed.');
        }

        const working = Utils.deepClone(before);
        const affectedKeys = new Set(scan.affectedGroups.map(g => g.key));
        const groups = new Map();

        (working.standingSnapshots || []).forEach(s => {
            const key = this._groupKey(s);
            if (!affectedKeys.has(key)) return;
            if (!groups.has(key)) groups.set(key, []);
            groups.get(key).push(s);
        });

        const auditItems = [];

        groups.forEach((items,key) => {
            const sorted = this._sort(items);

            // IMPORTANT: link metadata only.
            // Do not change snapshotVersion, status, rows, scores, source revision,
            // calculatedAt, results, pairings, or rounds.
            sorted.forEach((cur,i) => {
                const prev = i > 0 ? sorted[i-1] : null;
                const next = i < sorted.length-1 ? sorted[i+1] : null;

                cur.supersedesSnapshotId = prev?.snapshotId || null;
                cur.supersededBySnapshotId = next?.snapshotId || null;

                // Keep old supersededAt if present. If missing and there is a next
                // version, fill only this relationship timestamp metadata.
                if (next && !cur.supersededAt) {
                    cur.supersededAt = next.calculatedAt || next.createdAt || next.updatedAt || Utils.now();
                }
                if (!next && cur.status === 'current') {
                    delete cur.supersededAt;
                }
            });

            const newest = sorted[sorted.length-1];
            auditItems.push({
                key,
                tournamentId: newest?.tournamentId || null,
                divisionId: newest?.divisionId || null,
                throughRound: Number(newest?.throughRound),
                newestSnapshotId: newest?.snapshotId || null,
                snapshotCount: sorted.length
            });
        });

        const candidateCheck = this._validateCandidate(working, affectedKeys);
        if (!candidateCheck.ok) {
            throw new Error(`Snapshot link-chain repair cancelled during candidate validation: ${candidateCheck.errors.join(' ')}`);
        }

        try {
            Storage.replaceAll(working);

            // Re-scan persisted/live data, then also ensure ordinary version integrity still holds.
            const post = this.inspect(divisionId);
            if (post.needed) {
                throw new Error(`Persisted snapshot link-chain validation still reports ${post.issueCount} issue(s).`);
            }

            const divisions = [...new Set(auditItems.map(x => x.divisionId).filter(Boolean))];
            const integrityErrors = [];
            divisions.forEach(id => {
                const ordinary = StandingSnapshotIntegrityService.inspect(id);
                if (!ordinary.ok) integrityErrors.push(...ordinary.errors.map(e => `${id}: ${e}`));
            });
            if (integrityErrors.length) {
                throw new Error(`Ordinary snapshot version integrity failed after link repair: ${integrityErrors.join(' ')}`);
            }

            auditItems.forEach(item => {
                AuditService.log({
                    tournamentId:item.tournamentId,
                    divisionId:item.divisionId,
                    entityType:'standingSnapshot',
                    entityId:item.newestSnapshotId,
                    action:'repair_legacy_snapshot_links',
                    eventCode:'LEGACY_STANDING_SNAPSHOT_LINKS_REPAIRED',
                    reason:`Legacy snapshot version links repaired for Round ${item.throughRound}. Standing rows and snapshot versions/statuses were not changed.`,
                    after:{
                        throughRound:item.throughRound,
                        snapshotCount:item.snapshotCount,
                        newestSnapshotId:item.newestSnapshotId
                    }
                });
            });

            return {
                ok:true,
                changed:true,
                affectedCount:auditItems.length,
                issueCount:scan.issueCount,
                message:`Snapshot link-chain repair completed for ${auditItems.length} round group(s), fixing ${scan.issueCount} link field(s).`
            };
        } catch (e) {
            try {
                Storage.replaceAll(before);
            } catch (rollbackError) {
                throw new Error(
                    `CRITICAL: snapshot link-chain repair failed and rollback also failed. ` +
                    `Do not continue using this tab. Recovery copy remains in ${this._recoveryKey}.`
                );
            }
            throw new Error(`Snapshot link-chain repair failed and was rolled back safely: ${e.message || e}`);
        }
    },

    runSelfTest() {
        const errors = [];
        const sample = [
            {snapshotId:'S1',snapshotVersion:1,status:'invalidated'},
            {snapshotId:'S2',snapshotVersion:2,status:'superseded'},
            {snapshotId:'S3',snapshotVersion:3,status:'current'}
        ];

        const scanBefore = this._scanItems(sample);
        if (scanBefore.issues.length !== 4) {
            errors.push(`Expected 4 missing/broken links in synthetic legacy chain, found ${scanBefore.issues.length}.`);
        }

        const repaired = Utils.deepClone(sample);
        repaired.forEach((cur,i) => {
            cur.supersedesSnapshotId = i ? repaired[i-1].snapshotId : null;
            cur.supersededBySnapshotId = i < repaired.length-1 ? repaired[i+1].snapshotId : null;
        });

        if (this._scanItems(repaired).issues.length) {
            errors.push('Synthetic link chain still fails after repair.');
        }
        if (repaired[0].status !== 'invalidated' || repaired[1].status !== 'superseded' || repaired[2].status !== 'current') {
            errors.push('Repair changed snapshot statuses.');
        }
        if (repaired.some((x,i)=>x.snapshotVersion !== i+1)) {
            errors.push('Repair changed snapshot versions.');
        }

        return {
            ok:errors.length===0,
            errors,
            message:errors.length
                ? `Snapshot Link Chain Repair Self-Test FAILED: ${errors.join(' ')}`
                : 'Snapshot Link Chain Repair Self-Test PASSED: broken predecessor/forward links are detected and repair changes link metadata only.'
        };
    }
};

// ============================================================
// PATCH 02.32 — ROUND RE-LOCK / SNAPSHOT CORRECTION PROPAGATION INTEGRITY
// Historical correction must rebuild the official standing chain from the
// corrected round forward. Old snapshots remain immutable history; each rebuilt
// round gets one newest CURRENT version and links back to the prior version.
// ============================================================
const SnapshotCorrectionPropagationIntegrityService = {
    _roundGroups(divisionId, fromRound = 1) {
        const groups = new Map();
        Storage.find('standingSnapshots', x => x.divisionId === divisionId && Number(x.throughRound) >= Number(fromRound))
            .forEach(x => {
                const r = Number(x.throughRound);
                if (!groups.has(r)) groups.set(r, []);
                groups.get(r).push(x);
            });
        return groups;
    },

    inspect(divisionId, fromRound = 1, options = {}) {
        fromRound = Number(fromRound);
        const errors = [], warnings = [];
        const groups = this._roundGroups(divisionId, fromRound);
        const lockedRounds = RoundService.getByDivision(divisionId)
            .filter(r => Number(r.roundNumber) >= fromRound && r.status === 'locked')
            .sort((a,b)=>Number(a.roundNumber)-Number(b.roundNumber));

        lockedRounds.forEach(round => {
            const n = Number(round.roundNumber);
            const items = (groups.get(n) || []).slice().sort((a,b)=>Number(a.snapshotVersion||1)-Number(b.snapshotVersion||1));
            const current = items.filter(x => x.status === 'current');
            if (current.length !== 1) {
                errors.push(`Round ${n}: expected exactly one CURRENT official snapshot after re-lock; found ${current.length}.`);
                return;
            }
            const newest = current[0];
            const maxVersion = Math.max(...items.map(x=>Number(x.snapshotVersion||1)));
            if (Number(newest.snapshotVersion||1) !== maxVersion) errors.push(`Round ${n}: CURRENT snapshot is not the newest version.`);

            // Recalculate independently from active historical result facts through this round.
            const expected = CalcEngine.calculateStanding(divisionId, { throughRound:n });
            const actualRows = Array.isArray(newest.rows) ? newest.rows : [];
            const fields = ['rank','gamesPlayed','wins','ties','losses','matchPoints','scoreFor','scoreAgainst','officialSpread'];
            const byPlayer = new Map(actualRows.map(x=>[x.playerId,x]));
            expected.forEach(row => {
                const got = byPlayer.get(row.playerId);
                if (!got) { errors.push(`Round ${n}: CURRENT snapshot missing player ${row.playerId}.`); return; }
                fields.forEach(f => {
                    if (Number(got[f] ?? 0) !== Number(row[f] ?? 0)) errors.push(`Round ${n}: snapshot mismatch for ${row.playerId} ${f}.`);
                });
            });
            if (actualRows.length !== expected.length) errors.push(`Round ${n}: snapshot row count does not match recalculated standing.`);

            if (items.length > 1) {
                const prior = items[items.length-2];
                if (newest.supersedesSnapshotId !== prior.snapshotId) errors.push(`Round ${n}: newest snapshot does not link to the immediately prior version.`);
                if (prior.supersededBySnapshotId !== newest.snapshotId) errors.push(`Round ${n}: prior snapshot does not link forward to the newest version.`);
                if (prior.status === 'current') errors.push(`Round ${n}: prior snapshot incorrectly remains CURRENT.`);
            }
        });

        // Patch 02.37.1 — Earlier-round boundary integrity is transactional, not historical.
        // A snapshot below fromRound may legitimately carry invalidatedByRoundId from an
        // OLD correction. That metadata is immutable history and must not be interpreted
        // as evidence that THIS lock/re-lock touched the earlier round.
        //
        // When the caller supplies the exact pre-transaction DB, compare every earlier
        // snapshot byte-for-byte. This proves the current transaction did not mutate,
        // add, or remove any official snapshot below the correction/lock boundary.
        if (fromRound > 1 && options?.baselineDb?.standingSnapshots) {
            const before = options.baselineDb.standingSnapshots
                .filter(x => x.divisionId===divisionId && Number(x.throughRound)<fromRound)
                .slice().sort((a,b)=>String(a.snapshotId).localeCompare(String(b.snapshotId)));
            const after = Storage.find('standingSnapshots', x =>
                x.divisionId===divisionId && Number(x.throughRound)<fromRound
            ).slice().sort((a,b)=>String(a.snapshotId).localeCompare(String(b.snapshotId)));

            const beforeIds = before.map(x=>x.snapshotId).join('|');
            const afterIds = after.map(x=>x.snapshotId).join('|');
            if (beforeIds !== afterIds) {
                errors.push(`Snapshot boundary violation: official snapshot membership below Round ${fromRound} changed during this transaction.`);
            } else {
                for (let i=0;i<before.length;i++) {
                    if (JSON.stringify(before[i]) !== JSON.stringify(after[i])) {
                        errors.push(`Round ${before[i].throughRound}: earlier snapshot ${before[i].snapshotId} was modified by a Round ${fromRound}+ transaction.`);
                    }
                }
            }
        } else if (fromRound > 1) {
            // Read-only diagnostics without a transaction baseline cannot prove whether
            // an old invalidatedByRoundId belongs to the current operation. Do not raise
            // a false failure; the live lock path always supplies baselineDb.
            warnings.push(`Earlier-round mutation boundary was not transaction-verified because no baseline DB was supplied.`);
        }

        return { ok:errors.length===0, errors, warnings, fromRound, lockedRoundsChecked:lockedRounds.length };
    },

    runSelfTest() {
        const errors=[];
        const chain=[
            {snapshotId:'R2V1',throughRound:2,snapshotVersion:1,status:'invalidated',supersededBySnapshotId:'R2V2'},
            {snapshotId:'R2V2',throughRound:2,snapshotVersion:2,status:'current',supersedesSnapshotId:'R2V1'},
            {snapshotId:'R3V1',throughRound:3,snapshotVersion:1,status:'invalidated',supersededBySnapshotId:'R3V2'},
            {snapshotId:'R3V2',throughRound:3,snapshotVersion:2,status:'current',supersedesSnapshotId:'R3V1'}
        ];
        [2,3].forEach(r=>{
            const a=chain.filter(x=>x.throughRound===r).sort((x,y)=>x.snapshotVersion-y.snapshotVersion);
            if (a.filter(x=>x.status==='current').length!==1) errors.push(`R${r} current-count rule failed.`);
            if (a[1].supersedesSnapshotId!==a[0].snapshotId || a[0].supersededBySnapshotId!==a[1].snapshotId) errors.push(`R${r} version-link rule failed.`);
        });
        const oldFrozen={snapshotId:'R2V1',score:399};
        const copy=JSON.stringify(oldFrozen);
        const replacement={snapshotId:'R2V2',score:200,supersedesSnapshotId:'R2V1'};
        if (JSON.stringify(oldFrozen)!==copy || replacement.supersedesSnapshotId!==oldFrozen.snapshotId) errors.push('Immutable historical snapshot rule failed.');

        // Patch 02.37.1 regression proof: historical invalidation metadata below a later
        // boundary is valid history. Only a change made by the CURRENT transaction is a
        // boundary violation.
        const beforeEarlier=[
            {snapshotId:'R1V1',throughRound:1,status:'invalidated',invalidatedByRoundId:'OLD-R1-CORRECTION'},
            {snapshotId:'R1V2',throughRound:1,status:'current',supersedesSnapshotId:'R1V1'}
        ];
        const unchangedEarlier=JSON.parse(JSON.stringify(beforeEarlier));
        if (JSON.stringify(beforeEarlier)!==JSON.stringify(unchangedEarlier)) errors.push('Historical earlier-round invalidation metadata was incorrectly rejected.');
        const mutatedEarlier=JSON.parse(JSON.stringify(beforeEarlier));
        mutatedEarlier[1].status='invalidated';
        if (JSON.stringify(beforeEarlier)===JSON.stringify(mutatedEarlier)) errors.push('Earlier-round transaction mutation was not detectable.');

        return {ok:!errors.length,errors,message:errors.length?`Snapshot Correction Propagation Self-Test FAILED: ${errors.join(' ')}`:'Snapshot Correction Propagation Self-Test PASSED: corrected/downstream rounds create linked new official versions; historical earlier-round invalidation metadata is accepted, while current-transaction boundary mutations remain detectable.'};
    }
};


// ============================================================
// FINAL STANDING / CLINCH MATHEMATICS FOUNDATION — Patch 02.34
// Conservative proof engine only. It NEVER Gibsonizes a player.
// A position is reported SECURED only when the configured ranking rules and
// remaining-round bounds prove that no rival can overtake it.
// ============================================================
const ClinchMathematicsService = {
    _supportedFields: new Set(['matchPoints','sumOfficialSpread','seed']),

    _remainingRoundNumbers(division, throughRound) {
        const total = Number(division?.totalRounds || 0);
        const done = Math.max(0, Number(throughRound || 0));
        const out=[];
        for (let r=done+1;r<=total;r++) out.push(r);
        return out;
    },

    _spreadFutureBound(divisionId, roundNumbers) {
        let total=0;
        for (const r of roundNumbers) {
            const lim=Number(SpreadLimitResolver.getSpreadLimit(divisionId,r));
            if (!Number.isFinite(lim) || lim < 0) return null;
            total += lim;
        }
        return total;
    },

    _rankingSupport(ruleSet) {
        const rules=[...(ruleSet?.rules||[])].sort((a,b)=>Number(a.priority)-Number(b.priority));
        const unsupported=rules.filter(r=>!this._supportedFields.has(r.field)).map(r=>r.field);
        const mpIndex=rules.findIndex(r=>r.field==='matchPoints');
        if (mpIndex !== 0 || String(rules[0]?.direction||'').toLowerCase()!=='desc') {
            return {ok:false,reason:'Clinch proof currently requires Match Points DESC as the first ranking criterion.',unsupported};
        }
        return {ok:unsupported.length===0,reason:unsupported.length?`Unsupported future-bound ranking field(s): ${[...new Set(unsupported)].join(', ')}.`:null,unsupported};
    },

    _compareBestPossible(a,b,ruleSet) {
        // Negative => a ranks ahead of b, same convention as comparator.
        return RankingRuleService.comparator(ruleSet)(a,b);
    },

    analyzeDivision(divisionId, options={}) {
        const division=DivisionService.getById(divisionId);
        if (!division) return {ok:false,errors:['Division not found.'],players:[]};
        const rounds=Storage.find('rounds',r=>r.divisionId===divisionId);
        const completedRound=Math.max(0,...rounds.filter(r=>['completed','locked'].includes(r.status)).map(r=>Number(r.roundNumber)||0));
        const throughRound=options.throughRound==null?completedRound:Number(options.throughRound);
        if (!Number.isInteger(throughRound) || throughRound<0 || throughRound>Number(division.totalRounds||0)) return {ok:false,errors:['throughRound is outside the Division schedule.'],players:[]};

        const rankingResolution=RankingRuleService.getForDivision(divisionId);
        const ruleSet=rankingResolution.ruleSet;
        const support=this._rankingSupport(ruleSet);
        const rows=CalcEngine.calculateStanding(divisionId,{throughRound:throughRound||null});
        const remainingRounds=this._remainingRoundNumbers(division,throughRound);
        const spreadSwing=this._spreadFutureBound(divisionId,remainingRounds);
        const mp=ruleSet.matchPoints||{};
        const perGameMax=Math.max(Number(mp.win),Number(mp.tie),Number(mp.loss));
        const perGameMin=Math.min(Number(mp.win),Number(mp.tie),Number(mp.loss));
        const boundsSafe=Number.isFinite(perGameMax)&&Number.isFinite(perGameMin)&&spreadSwing!==null;
        const canProve=support.ok&&boundsSafe;

        const projected=rows.map(row=>{
            const rem=remainingRounds.length;
            return {
                ...row,
                currentRank:Number(row.rank),
                remainingRounds:rem,
                minMatchPoints:Number(row.matchPoints)+rem*perGameMin,
                maxMatchPoints:Number(row.matchPoints)+rem*perGameMax,
                minOfficialSpread:Number(row.sumOfficialSpread)-Number(spreadSwing||0),
                maxOfficialSpread:Number(row.sumOfficialSpread)+Number(spreadSwing||0)
            };
        });

        const byId=new Map(projected.map(x=>[x.playerId,x]));
        const results=projected.map(p=>{
            if (!canProve) return {...p,securedRank:null,clinchedFirst:false,status:'UNDETERMINED',reason:support.reason||'Future ranking bounds are not safely computable.'};
            // Worst possible final row for p; best possible final row for every rival.
            const worst={...p,matchPoints:p.minMatchPoints,sumOfficialSpread:p.minOfficialSpread};
            let rivalsDefinitelyBehind=0;
            let threatCount=0;
            for (const q of projected) {
                if (q.playerId===p.playerId) continue;
                const best={...q,matchPoints:q.maxMatchPoints,sumOfficialSpread:q.maxOfficialSpread};
                const cmp=this._compareBestPossible(worst,best,ruleSet);
                if (cmp<0) rivalsDefinitelyBehind++; else threatCount++;
            }
            const securedRank=projected.length-rivalsDefinitelyBehind;
            const clinchedFirst=securedRank===1;
            return {...p,securedRank,clinchedFirst,status:clinchedFirst?'CLINCHED_FIRST':'NOT_PROVEN',threatCount,
                reason:clinchedFirst?'Even this player’s worst bounded finish ranks ahead of every rival’s best bounded finish.':'At least one rival still has a bounded path that could tie or overtake this player.'};
        });

        return {ok:true,errors:[],warnings:[...(rankingResolution.warnings||[]),...(support.reason?[support.reason]:[])],divisionId,throughRound,totalRounds:Number(division.totalRounds||0),remainingRounds,spreadSwing,ruleSet,support,canProve,players:results};
    },

    runSelfTest() {
        const errors=[];
        const rule={matchPoints:{win:1,tie:0.5,loss:0},rules:[{priority:1,field:'matchPoints',direction:'desc'},{priority:2,field:'sumOfficialSpread',direction:'desc'},{priority:3,field:'seed',direction:'asc'}]};
        const support=this._rankingSupport(rule);
        if(!support.ok) errors.push('Supported MP/OS/seed rule was rejected.');
        const cmp=RankingRuleService.comparator(rule);
        const leaderWorst={playerId:'A',matchPoints:5,sumOfficialSpread:0,seed:1};
        const rivalBest={playerId:'B',matchPoints:4,sumOfficialSpread:999,seed:2};
        if(!(cmp(leaderWorst,rivalBest)<0)) errors.push('Strict Match Point clinch proof failed.');
        const tiedA={playerId:'A',matchPoints:5,sumOfficialSpread:101,seed:2};
        const tiedB={playerId:'B',matchPoints:5,sumOfficialSpread:100,seed:1};
        if(!(cmp(tiedA,tiedB)<0)) errors.push('Official Spread tie-break proof failed.');
        const unsupported=this._rankingSupport({matchPoints:rule.matchPoints,rules:[{priority:1,field:'matchPoints',direction:'desc'},{priority:2,field:'scoreFor',direction:'desc'}]});
        if(unsupported.ok) errors.push('Unsupported unbounded ranking field was allowed to prove a clinch.');
        return {ok:errors.length===0,errors,message:errors.length?'Clinch Mathematics Self-Test FAILED.':'Clinch Mathematics Self-Test PASSED: conservative MP/Official-Spread bounds, configured ranking order, and unsupported-rule safety guard are correct. No Gibsonization was performed.'};
    }
};


// ============================================================
// AUTOMATIC GIBSON CLINCH DETECTION — Patch 02.35
// Detection is automatic; Gibsonization is NEVER automatic.
// A manager must explicitly accept the proven candidate(s), then Preview and
// Confirm the exact KOTH proposal through the existing validation pipeline.
// ============================================================
const AutomaticGibsonClinchDetectionService = {
    qualificationCutoffRank: 2,
    detectForRound(divisionId, roundId) {
        const round=RoundService.getById(roundId);
        if(!round || round.divisionId!==divisionId) return {ok:false,errors:['Round not found in this Division.'],candidates:[]};
        if(!['draft','pairing_generated'].includes(round.status)) return {ok:false,errors:['Automatic Gibson detection is available only while the round pairing plan is editable.'],candidates:[]};
        const throughRound=Math.max(0,Number(round.roundNumber||1)-1);
        const proof=ClinchMathematicsService.analyzeDivision(divisionId,{throughRound});
        if(!proof.ok) return {ok:false,errors:proof.errors||['Clinch mathematics failed.'],candidates:[],proof};
        if(!proof.canProve) return {ok:true,errors:[],warnings:['Clinch status is UNDETERMINED. The active ranking rules cannot be safely bounded; no Gibson candidate will be proposed.'],candidates:[],proof,status:'UNDETERMINED'};
        const cutoff=this.qualificationCutoffRank;
        const eligible=RegistrationService.getEligible(divisionId);
        const byPlayer=new Map(eligible.map(r=>[r.playerId,r]));
        // Patch 02.35.1: Gibson proof is qualification proof, not championship proof.
        // A player is a candidate when even the conservative worst-case bound cannot
        // push that player below the Final qualification cutoff (Top 2 by default).
        const candidates=(proof.players||[]).filter(p=>Number(p.securedRank)<=cutoff && byPlayer.has(p.playerId)).map(p=>({
            playerId:p.playerId, registrationId:byPlayer.get(p.playerId).registrationId,
            playerName:p.playerName||TournamentPlayerDisplayService.resolveByPlayerId(divisionId,p.playerId).playerName||p.playerId,
            currentRank:p.currentRank, securedRank:p.securedRank, qualificationCutoffRank:cutoff,
            currentMatchPoints:p.matchPoints, minMatchPoints:p.minMatchPoints, minOfficialSpread:p.minOfficialSpread,
            throughRound, remainingRounds:[...(proof.remainingRounds||[])],
            proofReason:`Worst bounded final rank #${p.securedRank} remains inside Top ${cutoff}.`, proofVersion:2
        }));
        return {ok:true,errors:[],warnings:proof.warnings||[],candidates,proof,qualificationCutoffRank:cutoff,status:candidates.length?'PROVEN_CANDIDATE':'NO_CLINCH'};
    },
    runSelfTest(){
        const errors=[];
        const cutoff=2;
        const leader={currentRank:1,securedRank:2};
        const second={currentRank:2,securedRank:2};
        const unsafe={currentRank:1,securedRank:3};
        if(!(leader.securedRank<=cutoff)) errors.push('#1 falling to #2 should still be Final-qualified.');
        if(!(second.securedRank<=cutoff)) errors.push('Independently secured #2 should be eligible for Gibson proposal.');
        if(unsafe.securedRank<=cutoff) errors.push('A player who can fall to #3 was incorrectly proven qualified.');
        const acceptance={managerConfirmed:false};
        if(acceptance.managerConfirmed) errors.push('Detection silently confirmed Gibsonization.');
        return {ok:!errors.length,errors,message:errors.length?`Automatic Gibson Detection Self-Test FAILED: ${errors.join(' ')}`:'Automatic Gibson Detection Self-Test PASSED: Top-2 qualification is proven per player; #1 may fall to #2, multiple players may independently qualify with rounds remaining, and manager confirmation remains mandatory. Detection never awards a Gibson BYE automatically.'};
    }
};

const StandingService = {
    getProvisional(divisionId) {
        return CalcEngine.calculateStanding(divisionId, { throughRound: null });
    },

    createSnapshot(divisionId, throughRound) {
        throughRound = Number(throughRound);
        const division = DivisionService.getById(divisionId);
        if (!division) throw new Error('Division not found for standing snapshot.');
        if (!Number.isInteger(throughRound) || throughRound < 1) {
            throw new Error('Standing snapshot throughRound must be a positive integer.');
        }

        const sameRoundSnapshots = Storage.find(
            'standingSnapshots',
            s => s.divisionId === divisionId && Number(s.throughRound) === throughRound
        );
        const currentSnapshots = sameRoundSnapshots.filter(s => s.status === 'current');

        if (currentSnapshots.length > 1) {
            throw new Error(`Standing snapshot integrity error: Round ${throughRound} has multiple CURRENT snapshots.`);
        }

        const current = currentSnapshots[0] || null;
        // Patch 02.32: after correction invalidation there is intentionally no CURRENT
        // snapshot. The newest historical version is still the predecessor of the
        // rebuilt official version and must remain linked in the immutable chain.
        const predecessor = sameRoundSnapshots.slice().sort((a,b)=>
            Number(b.snapshotVersion || 1) - Number(a.snapshotVersion || 1)
        )[0] || null;
        const currentRule = RankingRuleService.getForDivision(divisionId).ruleSet;
        const sourceRevision = Number(division.resultRevision || 0);
        const ruleId = currentRule.rankingRuleSetId || division.rankingRuleSetId || null;
        const ruleVersion = Number(currentRule.version || 1);

        // Idempotency: re-locking without any result/ranking-rule change reuses the
        // existing official snapshot instead of creating a meaningless new version.
        if (
            current &&
            Number(current.sourceResultRevision || 0) === sourceRevision &&
            (current.rankingRuleSetId || null) === ruleId &&
            Number(current.rankingRuleVersion || 1) === ruleVersion
        ) {
            AuditService.log({
                tournamentId: division.tournamentId,
                divisionId,
                entityType: 'standingSnapshot',
                entityId: current.snapshotId,
                action: 'reuse',
                eventCode: 'STANDING_SNAPSHOT_REUSED',
                snapshotVersion: Number(current.snapshotVersion || 1),
                throughRound,
                sourceResultRevision: sourceRevision
            });
            return current;
        }

        const rows = CalcEngine.calculateStanding(divisionId, { throughRound });

        const prevSnapshot = Storage.find('standingSnapshots', s =>
            s.divisionId === divisionId &&
            Number(s.throughRound) === throughRound - 1 &&
            s.status === 'current'
        ).sort((a,b) => Number(b.snapshotVersion || 1) - Number(a.snapshotVersion || 1))[0] || null;

        if (prevSnapshot) {
            rows.forEach(r => {
                const prev = prevSnapshot.rows?.find(pr => pr.playerId === r.playerId);
                r.previousRank = prev ? prev.rank : null;
            });
        }

        const maxVersion = sameRoundSnapshots.reduce(
            (max, s) => Math.max(max, Number(s.snapshotVersion || 1)),
            0
        );
        const nextVersion = maxVersion + 1;

        const snapshot = {
            snapshotId: Utils.generateId('SS'),
            tournamentId: division.tournamentId,
            divisionId,
            throughRound,
            snapshotVersion: nextVersion,
            standingType: 'official',
            rankingRuleSetId: rows._rankingMeta?.rankingRuleSetId || ruleId,
            rankingRuleVersion: rows._rankingMeta?.rankingRuleVersion || ruleVersion,
            scopedResultCount: rows._rankingMeta?.scopedResultCount ?? null,
            sourceResultRevision: sourceRevision,
            rows,
            status: 'current',
            calculatedAt: Utils.now(),
            calculatedBy: 'system',
            supersedesSnapshotId: predecessor?.snapshotId || null
        };

        // Insert the new immutable version first. Only after successful persistence
        // do we supersede the previous CURRENT version.
        Storage.insert('standingSnapshots', snapshot);

        // Link the immediately prior version forward even when it was INVALIDATED by
        // Unlock. Its historical status is preserved; only the chain pointer is added.
        if (predecessor && !current) {
            Storage.update('standingSnapshots', 'snapshotId', predecessor.snapshotId, {
                supersededBySnapshotId: snapshot.snapshotId,
                supersededAt: Utils.now()
            });
        }

        if (current) {
            Storage.update('standingSnapshots', 'snapshotId', current.snapshotId, {
                status: 'superseded',
                supersededAt: Utils.now(),
                supersededBySnapshotId: snapshot.snapshotId
            });
            AuditService.log({
                tournamentId: division.tournamentId,
                divisionId,
                entityType: 'standingSnapshot',
                entityId: current.snapshotId,
                action: 'supersede',
                eventCode: 'STANDING_SNAPSHOT_SUPERSEDED',
                throughRound,
                snapshotVersion: Number(current.snapshotVersion || 1),
                supersededBySnapshotId: snapshot.snapshotId
            });
        }

        const integrity = StandingSnapshotIntegrityService.inspect(divisionId);
        if (!integrity.ok) {
            // Roll back only the snapshot-state changes made by this call.
            Storage.delete('standingSnapshots', 'snapshotId', snapshot.snapshotId);
            if (current) {
                Storage.update('standingSnapshots', 'snapshotId', current.snapshotId, {
                    status: 'current',
                    supersededAt: null,
                    supersededBySnapshotId: null
                });
            } else if (predecessor) {
                Storage.update('standingSnapshots', 'snapshotId', predecessor.snapshotId, {
                    supersededAt: predecessor.supersededAt || null,
                    supersededBySnapshotId: predecessor.supersededBySnapshotId || null
                });
            }
            throw new Error(`Standing snapshot integrity check failed: ${integrity.errors.join(' ')}`);
        }

        AuditService.log({
            tournamentId: division.tournamentId,
            divisionId,
            entityType: 'standingSnapshot',
            entityId: snapshot.snapshotId,
            action: 'create',
            eventCode: 'STANDING_SNAPSHOT_CREATED',
            throughRound,
            snapshotVersion: nextVersion,
            sourceResultRevision: sourceRevision,
            supersedesSnapshotId: predecessor?.snapshotId || null
        });
        return snapshot;
    },

    invalidateFromRound(divisionId, fromRound, context = {}) {
        fromRound = Number(fromRound);
        if (!Number.isInteger(fromRound) || fromRound < 1) throw new Error('Invalid correction round for snapshot invalidation.');
        const affected = Storage.find('standingSnapshots', s =>
            s.divisionId === divisionId &&
            Number(s.throughRound) >= fromRound &&
            s.status === 'current'
        ).sort((a,b) => Number(a.throughRound) - Number(b.throughRound));

        affected.forEach(s => {
            Storage.update('standingSnapshots','snapshotId',s.snapshotId,{
                status:'invalidated',
                invalidatedAt:Utils.now(),
                invalidatedReason:context.reason || 'Historical round correction',
                invalidatedByRoundId:context.roundId || null
            });
            AuditService.log({
                tournamentId:s.tournamentId,
                divisionId:s.divisionId,
                roundId:context.roundId || null,
                entityType:'standingSnapshot',
                entityId:s.snapshotId,
                action:'invalidate',
                eventCode:'STANDING_SNAPSHOT_INVALIDATED_FOR_CORRECTION',
                reason:context.reason || 'Historical round correction',
                before:{ status:'current', throughRound:Number(s.throughRound), snapshotVersion:Number(s.snapshotVersion || 1) },
                after:{ status:'invalidated', correctionFromRound:fromRound }
            });
        });
        return { count:affected.length, snapshotIds:affected.map(s=>s.snapshotId), throughRounds:affected.map(s=>Number(s.throughRound)) };
    },

    rebuildLockedDownstream(divisionId, afterRound) {
        afterRound = Number(afterRound);
        const rounds = RoundService.getByDivision(divisionId)
            .filter(r => Number(r.roundNumber) > afterRound && r.status === 'locked')
            .sort((a,b) => Number(a.roundNumber) - Number(b.roundNumber));
        const rebuilt = [];
        rounds.forEach(r => rebuilt.push(this.createSnapshot(divisionId, Number(r.roundNumber))));
        return rebuilt;
    },

    runCorrectionInvalidationSelfTest() {
        const sample = [
            {throughRound:1,status:'current'},
            {throughRound:2,status:'current'},
            {throughRound:3,status:'current'},
            {throughRound:4,status:'current'},
            {throughRound:5,status:'current'},
            {throughRound:6,status:'current'}
        ];
        const fromRound = 3;
        const changed = sample.map(x => ({...x, status:Number(x.throughRound)>=fromRound && x.status==='current' ? 'invalidated' : x.status}));
        const errors = [];
        if (changed.filter(x=>x.status==='invalidated').map(x=>x.throughRound).join(',') !== '3,4,5,6') errors.push('Downstream invalidation scope is incorrect.');
        if (changed.find(x=>x.throughRound===2)?.status !== 'current') errors.push('Earlier official snapshot was incorrectly invalidated.');
        const lifecycle = { tournament:'approved', division:'approved' };
        if (['completed_pending_approval','approved'].includes(lifecycle.tournament)) lifecycle.tournament='active';
        if (['completed','approved'].includes(lifecycle.division)) lifecycle.division='active';
        if (lifecycle.tournament!=='active' || lifecycle.division!=='active') errors.push('Lifecycle rollback did not return competition to ACTIVE.');
        return { ok:errors.length===0, errors, message:errors.length ? `Correction invalidation self-test FAILED: ${errors.join(' ')}` : 'Correction invalidation self-test PASSED: snapshots from the corrected round forward are invalidated, earlier snapshots remain official, and completed/approved lifecycle rolls back to ACTIVE.' };
    },

    getSnapshots(divisionId) {
        return Storage.find('standingSnapshots', s => s.divisionId === divisionId)
            .sort((a,b) =>
                Number(b.throughRound) - Number(a.throughRound) ||
                Number(b.snapshotVersion || 1) - Number(a.snapshotVersion || 1)
            );
    }
};



// ============================================================
// PATCH 02.24 — PLAYER RESULT HISTORY / CUMULATIVE STANDING VIEW
// Read-only projection for one competitor: per-round opponent/result/score/
// spread plus the accumulated standing immediately after that round.
// Active result records are authoritative; historical VOID records are ignored.
// ============================================================
const PlayerResultHistoryService = {
    _activeResults(divisionId, playerId) {
        return Storage.find('matchResults', r =>
            r.divisionId === divisionId &&
            r.status !== 'voided' && r.resultType !== 'void' &&
            (r.player1Id === playerId || r.player2Id === playerId)
        ).sort((a,b) => Number(a.roundNumber)-Number(b.roundNumber) || Number(a.tableNumber)-Number(b.tableNumber));
    },

    _perspective(result, playerId) {
        const isP1 = result.player1Id === playerId;
        const isBye = result.resultType === 'bye' || result.pairingType === 'bye';
        if (!isP1 && result.player2Id !== playerId) return null;
        const opponentId = isBye ? null : (isP1 ? result.player2Id : result.player1Id);
        const opponentRegistrationId = isBye ? null : (isP1 ? result.player2RegistrationId : result.player1RegistrationId);
        return {
            resultId: result.resultId,
            pairingId: result.pairingId,
            roundId: result.roundId,
            roundNumber: Number(result.roundNumber),
            tableNumber: Number(result.tableNumber),
            resultType: isBye ? 'bye' : (result.resultType || 'normal'),
            byeReason: isBye ? (result.byeReason || 'ordinary') : null,
            opponentId,
            opponentRegistrationId,
            opponentDisplay: isBye
                ? ((result.byeReason === 'gibson') ? 'GIBSON BYE' : 'BYE')
                : TournamentPlayerDisplayService.label(opponentRegistrationId, opponentId),
            scoreFor: Number(result.resultType==='double_walkover' ? (isP1 ? result.standingScoreForPlayer1 : result.standingScoreForPlayer2) : (isP1 ? result.player1Score : result.player2Score)),
            scoreAgainst: Number(result.resultType==='double_walkover' ? (isP1 ? result.standingScoreAgainstPlayer1 : result.standingScoreAgainstPlayer2) : (isP1 ? result.player2Score : result.player1Score)),
            resultCode: isP1 ? result.player1Result : result.player2Result,
            rawSpread: Number(isP1 ? result.rawSpreadPlayer1 : result.rawSpreadPlayer2),
            officialSpread: Number(isP1 ? result.officialSpreadPlayer1 : result.officialSpreadPlayer2),
            status: result.status,
            submittedAt: result.submittedAt || null
        };
    },

    getHistory(divisionId, playerId) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { ok:false, errors:['Division not found'], rows:[] };
        const registration = Storage.findOne('registrations', r => r.divisionId===divisionId && r.playerId===playerId);
        if (!registration) return { ok:false, errors:['Player is not registered in this Division.'], rows:[] };
        const player = PlayerService.getById(playerId);
        const results = this._activeResults(divisionId, playerId);
        const rows = [];
        for (const result of results) {
            const view = this._perspective(result, playerId);
            if (!view) continue;
            const standing = CalcEngine.calculateStanding(divisionId, { throughRound:view.roundNumber });
            const cumulative = standing.find(r => r.playerId === playerId) || null;
            rows.push({
                ...view,
                cumulative: cumulative ? {
                    rank:cumulative.rank,
                    gamesPlayed:cumulative.gamesPlayed,
                    wins:cumulative.wins,
                    ties:cumulative.ties,
                    losses:cumulative.losses,
                    matchPoints:cumulative.matchPoints,
                    scoreFor:cumulative.scoreFor,
                    scoreAgainst:cumulative.scoreAgainst,
                    sumOfficialSpread:cumulative.sumOfficialSpread
                } : null
            });
        }
        const live = CalcEngine.calculateStanding(divisionId, { throughRound:null }).find(r => r.playerId===playerId) || null;
        return {
            ok:true, errors:[], division, registration, player,
            playerDisplay:TournamentPlayerDisplayService.label(registration.registrationId, playerId),
            rows,
            liveStanding: live,
            counts:{results:rows.length, bye:rows.filter(r=>r.resultType==='bye').length}
        };
    },

    inspectDivision(divisionId) {
        const errors=[];
        const participants=StandingParticipantResolver.resolve(divisionId).included;
        let histories=0, resultRows=0;
        for (const item of participants) {
            const h=this.getHistory(divisionId,item.playerId);
            if (!h.ok) { errors.push(...h.errors.map(e=>`${item.playerId}: ${e}`)); continue; }
            histories++; resultRows += h.rows.length;
            let prevGP=0;
            for (const row of h.rows) {
                if (!row.cumulative) errors.push(`${item.playerId} R${row.roundNumber}: cumulative standing missing.`);
                else if (row.cumulative.gamesPlayed < prevGP) errors.push(`${item.playerId} R${row.roundNumber}: cumulative GP moved backwards.`);
                else prevGP=row.cumulative.gamesPlayed;
                if (!['W','T','L',null,undefined].includes(row.resultCode)) errors.push(`${item.playerId} R${row.roundNumber}: invalid result code.`);
            }
            if (h.liveStanding && h.rows.length && h.liveStanding.gamesPlayed < h.rows[h.rows.length-1].cumulative.gamesPlayed) {
                errors.push(`${item.playerId}: live standing GP is below the latest history row.`);
            }
        }
        return {ok:errors.length===0,errors,histories,resultRows};
    },

    runSelfTest() {
        const errors=[];
        const normal={resultId:'R1',pairingId:'P1',roundId:'RD1',roundNumber:1,tableNumber:2,resultType:'normal',pairingType:'normal',player1Id:'A',player2Id:'B',player1RegistrationId:'RA',player2RegistrationId:'RB',player1Score:500,player2Score:300,player1Result:'W',player2Result:'L',rawSpreadPlayer1:200,rawSpreadPlayer2:-200,officialSpreadPlayer1:200,officialSpreadPlayer2:-200};
        const a=this._perspective(normal,'A'); const b=this._perspective(normal,'B');
        if (!a || a.scoreFor!==500 || a.scoreAgainst!==300 || a.resultCode!=='W' || a.officialSpread!==200 || a.opponentId!=='B') errors.push('Player-1 perspective failed.');
        if (!b || b.scoreFor!==300 || b.scoreAgainst!==500 || b.resultCode!=='L' || b.officialSpread!==-200 || b.opponentId!=='A') errors.push('Player-2 perspective failed.');
        const bye=this._perspective({resultId:'RB',pairingId:'PB',roundId:'RD2',roundNumber:2,tableNumber:3,resultType:'bye',pairingType:'bye',byeReason:'gibson',player1Id:'A',player1Score:100,player2Score:0,player1Result:'W',rawSpreadPlayer1:100,officialSpreadPlayer1:100},'A');
        if (!bye || bye.opponentId!==null || bye.opponentDisplay!=='GIBSON BYE' || bye.scoreFor!==100 || bye.officialSpread!==100) errors.push('BYE/Gibson perspective failed.');
        return {ok:errors.length===0,errors,message:errors.length?`Player Result History Self-Test FAILED: ${errors.join(' ')}`:'Player Result History Self-Test PASSED: player-1/player-2 score perspective, opponent identity, spread sign, and BYE/Gibson history projection are correct. Live tournament data was not modified.'};
    }
};

// ============================================================
// PATCH 02.25 — LAST GAME / PUBLIC RESULT DISPLAY
// Read-only presentation projection. It reuses authoritative Pairing + Result
// records and CalcEngine standings; no score/ranking arithmetic is reimplemented.
// The newest existing round is the default display, including partially entered
// in-progress rounds so a venue display can reflect the latest available result.
// ============================================================
// PATCH 02.40 — Public/Venue special-result rendering (presentation only).
const PublicResultDisplayService = {
    _activeResultForPairing(pairingId) {
        return Storage.find('matchResults', r =>
            r.pairingId === pairingId && r.status !== 'voided' && r.resultType !== 'void'
        )[0] || null;
    },

    availableRounds(divisionId) {
        return RoundService.getByDivision(divisionId)
            .filter(r => PairingService.getByRound(r.roundId).length > 0)
            .sort((a,b) => Number(b.roundNumber)-Number(a.roundNumber));
    },

    latestRoundNumber(divisionId) {
        return this.availableRounds(divisionId)[0]?.roundNumber || null;
    },

    _playerView(registrationId, playerId, result, side) {
        const display = TournamentPlayerDisplayService.resolve(registrationId, playerId);
        if (!result) return {
            registrationId, playerId,
            code: display.tournamentPlayerCode || '—',
            name: display.playerName || '—',
            score: null, resultCode: null, officialSpread: null
        };
        const p1 = side === 1;
        return {
            registrationId, playerId,
            code: display.tournamentPlayerCode || '—',
            name: display.playerName || '—',
            score: Number(result.resultType==='double_walkover' ? (p1 ? result.standingScoreForPlayer1 : result.standingScoreForPlayer2) : (p1 ? result.player1Score : result.player2Score)),
            scoreAgainst: Number(result.resultType==='double_walkover' ? (p1 ? result.standingScoreAgainstPlayer1 : result.standingScoreAgainstPlayer2) : (p1 ? result.player2Score : result.player1Score)),
            resultCode: p1 ? result.player1Result : result.player2Result,
            officialSpread: Number(p1 ? result.officialSpreadPlayer1 : result.officialSpreadPlayer2)
        };
    },

    // ========================================================
    // PATCH 02.40 — PUBLIC DISPLAY SPECIAL RESULT PRESENTATION
    // Presentation-only. Administrative results must never be rendered as if
    // they were ordinary played scores. In particular, DOUBLE WALKOVER is
    // two independent administrative losses, not a 0–0 tie.
    // ========================================================
    presentationForRow(row) {
        if (!row?.completed) return { kind:'pending', statusLabel:'PENDING', centerMode:'vs', centerLabel:'VS' };
        const type=String(row.resultType || 'normal');
        if (type==='double_walkover') {
            return {
                kind:'double_walkover',
                statusLabel:'DOUBLE WALKOVER',
                centerMode:'administrative',
                centerLabel:'DOUBLE NO-SHOW',
                detailLabel:'Both players lose by walkover'
            };
        }
        if (type==='walkover') return { kind:'walkover', statusLabel:'WALKOVER', centerMode:'score', centerLabel:null };
        if (type==='forfeit') return { kind:'forfeit', statusLabel:'FORFEIT', centerMode:'score', centerLabel:null };
        if (type==='bye') return { kind:'bye', statusLabel:row.byeReason==='gibson'?'GIBSON BYE':'BYE', centerMode:'bye', centerLabel:'BYE' };
        return { kind:'normal', statusLabel:'COMPLETED', centerMode:'score', centerLabel:null };
    },

    getBoard(divisionId, roundNumber = null) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { ok:false, errors:['Division not found'] };
        const available = this.availableRounds(divisionId);
        if (!available.length) return { ok:true, division, round:null, rows:[], standing:[], counts:{pairings:0,completed:0,pending:0,bye:0} };
        const targetNumber = roundNumber == null ? Number(available[0].roundNumber) : Number(roundNumber);
        const round = RoundService.getByDivision(divisionId).find(r => Number(r.roundNumber) === targetNumber);
        if (!round) return { ok:false, errors:[`Round ${targetNumber} not found`] };
        const pairings = PairingService.getByRound(round.roundId).filter(p => p.status !== 'cancelled');
        const rows = pairings.map(p => {
            const result = this._activeResultForPairing(p.pairingId);
            const isBye = p.pairingType === 'bye';
            const p1 = this._playerView(p.player1RegistrationId, p.player1Id, result, 1);
            const p2 = isBye ? null : this._playerView(p.player2RegistrationId, p.player2Id, result, 2);
            const row = {
                pairingId:p.pairingId,
                tableNumber:Number(p.tableNumber),
                pairingType:p.pairingType || 'normal',
                byeReason:isBye ? (p.byeReason || result?.byeReason || 'ordinary') : null,
                completed:!!result,
                resultId:result?.resultId || null,
                resultType:result?.resultType || null,
                player1:p1,
                player2:p2
            };
            row.presentation=this.presentationForRow(row);
            return row;
        }).sort((a,b)=>a.tableNumber-b.tableNumber);
        const standing = CalcEngine.calculateStanding(divisionId, { throughRound:targetNumber });
        return {
            ok:true, errors:[], division, round, availableRounds:available, rows, standing,
            counts:{
                pairings:rows.length,
                completed:rows.filter(x=>x.completed).length,
                pending:rows.filter(x=>!x.completed).length,
                bye:rows.filter(x=>x.pairingType==='bye').length
            }
        };
    },

    inspectDivision(divisionId) {
        const errors=[];
        const rounds=this.availableRounds(divisionId);
        for (const round of rounds) {
            const board=this.getBoard(divisionId, round.roundNumber);
            if (!board.ok) { errors.push(...board.errors); continue; }
            if (board.rows.length !== board.counts.pairings) errors.push(`R${round.roundNumber}: pairing count mismatch.`);
            if (board.counts.completed + board.counts.pending !== board.counts.pairings) errors.push(`R${round.roundNumber}: completed/pending count mismatch.`);
            const seen=new Set();
            for (const row of board.rows) {
                for (const id of [row.player1?.playerId,row.player2?.playerId].filter(Boolean)) {
                    if (seen.has(id)) errors.push(`R${round.roundNumber}: player ${id} appears more than once.`);
                    seen.add(id);
                }
                if (row.completed && row.pairingType==='normal') {
                    if (!['W','T','L'].includes(row.player1.resultCode) || !['W','T','L'].includes(row.player2.resultCode)) errors.push(`R${round.roundNumber} T${row.tableNumber}: completed normal result lacks W/T/L.`);
                    if (row.resultType==='double_walkover') {
                        if (row.player1.resultCode!=='L' || row.player2.resultCode!=='L' || Number(row.player1.officialSpread)>=0 || Number(row.player2.officialSpread)>=0) errors.push(`R${round.roundNumber} T${row.tableNumber}: DOUBLE WALKOVER projection is invalid.`);
                    } else if (Number(row.player1.officialSpread) !== -Number(row.player2.officialSpread)) errors.push(`R${round.roundNumber} T${row.tableNumber}: official spreads are not opposite.`);
                }
                if (row.pairingType==='bye' && row.player2) errors.push(`R${round.roundNumber} T${row.tableNumber}: BYE has a phantom opponent.`);
            }
        }
        return {ok:errors.length===0,errors,roundsChecked:rounds.length};
    },

    runSelfTest() {
        const errors=[];
        const samplePairings=[
            {pairingId:'P1',tableNumber:1,pairingType:'normal',player1Id:'A',player2Id:'B'},
            {pairingId:'P2',tableNumber:2,pairingType:'bye',player1Id:'C',player2Id:null,byeReason:'ordinary'},
            {pairingId:'P3',tableNumber:3,pairingType:'normal',player1Id:'D',player2Id:'E'}
        ];
        const sampleResults={
            P1:{player1Score:500,player2Score:300,player1Result:'W',player2Result:'L',officialSpreadPlayer1:200,officialSpreadPlayer2:-200},
            P2:{player1Score:100,player2Score:0,player1Result:'W',officialSpreadPlayer1:100}
        };
        const projected=samplePairings.map(p=>({
            tableNumber:p.tableNumber,pairingType:p.pairingType,
            completed:!!sampleResults[p.pairingId],
            p1Result:sampleResults[p.pairingId]?.player1Result || null,
            p2Result:sampleResults[p.pairingId]?.player2Result || null,
            p1Spread:sampleResults[p.pairingId]?.officialSpreadPlayer1 ?? null,
            p2Spread:sampleResults[p.pairingId]?.officialSpreadPlayer2 ?? null,
            hasP2:!!p.player2Id
        }));
        if (!projected[0].completed || projected[0].p1Result!=='W' || projected[0].p2Result!=='L' || projected[0].p1Spread!==200 || projected[0].p2Spread!==-200) errors.push('Completed normal result projection failed.');
        if (!projected[1].completed || projected[1].hasP2) errors.push('BYE public projection created a phantom opponent.');
        if (projected[2].completed) errors.push('Pending pairing was incorrectly shown as completed.');
        const doubleWo=this.presentationForRow({completed:true,resultType:'double_walkover',pairingType:'normal'});
        if (doubleWo.centerMode!=='administrative' || doubleWo.centerLabel!=='DOUBLE NO-SHOW' || doubleWo.statusLabel!=='DOUBLE WALKOVER') {
            errors.push('DOUBLE WALKOVER public presentation did not suppress score-style rendering.');
        }
        return {ok:errors.length===0,errors,message:errors.length?`Public Result Display Self-Test FAILED: ${errors.join(' ')}`:'Public Result Display Self-Test PASSED: completed, pending, normal, BYE, and DOUBLE WALKOVER rows project safely; DOUBLE WALKOVER is rendered as an administrative result, never as a 0–0 tie. Live tournament data was not modified.'};
    }
};

// ============================================================
// BACKUP SERVICE
// ============================================================
const BackupService = {
    _requiredCollections: ['tournaments','divisions','players','registrations','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','rounds','pairings','matchResults','standingSnapshots','auditLogs'],

    _idSpec: {
        tournaments: 'tournamentId', divisions: 'divisionId', players: 'playerId', registrations: 'registrationId',
        pairingPlans: 'pairingPlanId', rankingRuleSets: 'rankingRuleSetId', byePolicies: 'byePolicyId',
        resultPolicies: 'resultPolicyId', rounds: 'roundId', pairings: 'pairingId', matchResults: 'resultId',
        standingSnapshots: 'snapshotId', auditLogs: 'auditId'
    },

    _normalizeBackupPayload(raw) {
        if (!raw || typeof raw !== 'object' || Array.isArray(raw)) throw new Error('Backup root must be a JSON object.');
        const data = raw.data && typeof raw.data === 'object' && !Array.isArray(raw.data) ? raw.data : raw;
        return data;
    },

    prepareBackupForCurrentSchema(raw) {
        const data=this._normalizeBackupPayload(raw);
        if (!Number.isInteger(data.schemaVersion)) throw new Error('Backup has no valid schemaVersion.');
        if (data.schemaVersion>SCHEMA_VERSION) throw new Error(`Backup schema ${data.schemaVersion} is newer than supported schema ${SCHEMA_VERSION}. Use a compatible KTM version.`);
        if (data.schemaVersion<SCHEMA_VERSION) { const migrated=SchemaMigrationService.migrateInMemory(data,SCHEMA_VERSION); return {data:migrated.data,migrated:true,appliedMigrations:migrated.applied,originalSchemaVersion:data.schemaVersion}; }
        return {data:Utils.deepClone(data),migrated:false,appliedMigrations:[],originalSchemaVersion:data.schemaVersion};
    },

    validateFullBackup(raw) {
        const errors = [], warnings = [];
        let data, preparation=null;
        try { preparation=this.prepareBackupForCurrentSchema(raw); data=preparation.data; }
        catch (e) { return { ok:false, errors:[e.message], warnings, data:null, counts:{}, migration:null }; }

        if (!Number.isInteger(data.schemaVersion)) errors.push('Backup has no valid schemaVersion.');
        else if (data.schemaVersion !== SCHEMA_VERSION) errors.push(`Backup schema ${data.schemaVersion} is not compatible with supported schema ${SCHEMA_VERSION}.`);
        if (preparation.migrated) warnings.push(`Backup was migrated in memory from schema ${preparation.originalSchemaVersion} to ${SCHEMA_VERSION} before validation.`);

        for (const c of this._requiredCollections) {
            if (!Array.isArray(data[c])) errors.push(`Missing or invalid collection: ${c}`);
        }
        if (errors.length) return { ok:false, errors, warnings, data, counts:{} };

        const counts = Object.fromEntries(this._requiredCollections.map(c => [c, data[c].length]));
        const ids = {};
        for (const c of this._requiredCollections) {
            const idField = this._idSpec[c];
            ids[c] = new Set();
            for (const rec of data[c]) {
                if (!rec || typeof rec !== 'object' || Array.isArray(rec)) { errors.push(`${c} contains a non-object record.`); continue; }
                if (!idField) continue;
                const id = rec[idField];
                if (!id) { errors.push(`${c} contains a record without ${idField}.`); continue; }
                if (ids[c].has(id)) errors.push(`${c} contains duplicate ${idField}: ${id}`);
                ids[c].add(id);
            }
        }

        const need = (cond, msg) => { if (!cond) errors.push(msg); };
        const has = (c,id) => !id || ids[c]?.has(id);

        for (const d of data.divisions) {
            need(has('tournaments', d.tournamentId), `Division ${d.divisionId} references missing tournament ${d.tournamentId}.`);
            if (d.pairingPlanId) need(has('pairingPlans', d.pairingPlanId), `Division ${d.divisionId} references missing pairing plan ${d.pairingPlanId}.`);
            if (d.rankingRuleSetId) need(has('rankingRuleSets', d.rankingRuleSetId), `Division ${d.divisionId} references missing ranking rule set ${d.rankingRuleSetId}.`);
            if (d.byePolicyId) need(has('byePolicies', d.byePolicyId), `Division ${d.divisionId} references missing bye policy ${d.byePolicyId}.`);
            if (d.resultPolicyId) need(has('resultPolicies', d.resultPolicyId), `Division ${d.divisionId} references missing result policy ${d.resultPolicyId}.`);
        }
        for (const r of data.registrations) {
            need(has('tournaments', r.tournamentId), `Registration ${r.registrationId} references missing tournament ${r.tournamentId}.`);
            need(has('divisions', r.divisionId), `Registration ${r.registrationId} references missing division ${r.divisionId}.`);
            need(has('players', r.playerId), `Registration ${r.registrationId} references missing player ${r.playerId}.`);
        }
        for (const c of ['pairingPlans','rankingRuleSets','byePolicies','resultPolicies']) {
            for (const rec of data[c]) {
                if (rec.tournamentId) need(has('tournaments', rec.tournamentId), `${c} record ${rec[this._idSpec[c]]} references missing tournament ${rec.tournamentId}.`);
                if (rec.divisionId) need(has('divisions', rec.divisionId), `${c} record ${rec[this._idSpec[c]]} references missing division ${rec.divisionId}.`);
            }
        }
        for (const r of data.rounds) {
            need(has('tournaments', r.tournamentId), `Round ${r.roundId} references missing tournament ${r.tournamentId}.`);
            need(has('divisions', r.divisionId), `Round ${r.roundId} references missing division ${r.divisionId}.`);
        }
        for (const p of data.pairings) {
            need(has('tournaments', p.tournamentId), `Pairing ${p.pairingId} references missing tournament ${p.tournamentId}.`);
            need(has('divisions', p.divisionId), `Pairing ${p.pairingId} references missing division ${p.divisionId}.`);
            need(has('rounds', p.roundId), `Pairing ${p.pairingId} references missing round ${p.roundId}.`);
            if (p.player1Id) need(has('players', p.player1Id), `Pairing ${p.pairingId} references missing player1 ${p.player1Id}.`);
            if (p.player2Id) need(has('players', p.player2Id), `Pairing ${p.pairingId} references missing player2 ${p.player2Id}.`);
            if (p.player1RegistrationId) need(has('registrations', p.player1RegistrationId), `Pairing ${p.pairingId} references missing registration ${p.player1RegistrationId}.`);
            if (p.player2RegistrationId) need(has('registrations', p.player2RegistrationId), `Pairing ${p.pairingId} references missing registration ${p.player2RegistrationId}.`);
        }
        for (const m of data.matchResults) {
            need(has('tournaments', m.tournamentId), `Result ${m.resultId} references missing tournament ${m.tournamentId}.`);
            need(has('divisions', m.divisionId), `Result ${m.resultId} references missing division ${m.divisionId}.`);
            need(has('rounds', m.roundId), `Result ${m.resultId} references missing round ${m.roundId}.`);
            need(has('pairings', m.pairingId), `Result ${m.resultId} references missing pairing ${m.pairingId}.`);
            if (m.player1Id) need(has('players', m.player1Id), `Result ${m.resultId} references missing player1 ${m.player1Id}.`);
            if (m.player2Id) need(has('players', m.player2Id), `Result ${m.resultId} references missing player2 ${m.player2Id}.`);
        }
        for (const ss of data.standingSnapshots) {
            need(has('tournaments', ss.tournamentId), `Standing snapshot ${ss.snapshotId} references missing tournament ${ss.tournamentId}.`);
            need(has('divisions', ss.divisionId), `Standing snapshot ${ss.snapshotId} references missing division ${ss.divisionId}.`);
            if (ss.roundId) need(has('rounds', ss.roundId), `Standing snapshot ${ss.snapshotId} references missing round ${ss.roundId}.`);
        }

        // Cross-entity consistency checks where both records are present.
        const divisionById = new Map(data.divisions.map(x => [x.divisionId, x]));
        const roundById = new Map(data.rounds.map(x => [x.roundId, x]));
        const pairingById = new Map(data.pairings.map(x => [x.pairingId, x]));
        for (const r of data.rounds) {
            const d = divisionById.get(r.divisionId);
            if (d && r.tournamentId && d.tournamentId && r.tournamentId !== d.tournamentId) errors.push(`Round ${r.roundId} tournamentId does not match its division.`);
        }
        for (const p of data.pairings) {
            const rd = roundById.get(p.roundId);
            if (rd && p.divisionId && rd.divisionId && p.divisionId !== rd.divisionId) errors.push(`Pairing ${p.pairingId} divisionId does not match its round.`);
            if (rd && p.tournamentId && rd.tournamentId && p.tournamentId !== rd.tournamentId) errors.push(`Pairing ${p.pairingId} tournamentId does not match its round.`);
        }
        for (const m of data.matchResults) {
            const p = pairingById.get(m.pairingId), rd = roundById.get(m.roundId);
            if (p && m.roundId && p.roundId && m.roundId !== p.roundId) errors.push(`Result ${m.resultId} roundId does not match its pairing.`);
            if (rd && m.divisionId && rd.divisionId && m.divisionId !== rd.divisionId) errors.push(`Result ${m.resultId} divisionId does not match its round.`);

            if (p) {
                const exactFields = ['tournamentId','divisionId','roundId','roundNumber','tableNumber','player1Id','player2Id','player1RegistrationId','player2RegistrationId'];
                for (const field of exactFields) {
                    if (String(m[field] ?? '') !== String(p[field] ?? '')) {
                        errors.push(`Result ${m.resultId} ${field} does not match pairing ${p.pairingId}.`);
                    }
                }
                const isVoid = m.status === 'voided' || m.resultType === 'void';
                if (!isVoid) {
                    const allowedTypes = p.pairingType === 'bye' ? ['bye'] : ['normal','walkover','forfeit','double_walkover'];
                    if (!allowedTypes.includes(m.resultType)) errors.push(`Active result ${m.resultId} resultType does not match pairing ${p.pairingId}.`);
                }
            }
        }

        const activeResultsByPairing = new Map();
        for (const m of data.matchResults) {
            if (m.status === 'voided' || m.resultType === 'void') continue;
            const list = activeResultsByPairing.get(m.pairingId) || [];
            list.push(m);
            activeResultsByPairing.set(m.pairingId, list);
        }
        for (const [pairingId, list] of activeResultsByPairing.entries()) {
            if (list.length > 1) errors.push(`Pairing ${pairingId} has ${list.length} active results in backup; exactly one active result is allowed.`);
        }

        if (!data.tournaments.length) warnings.push('Backup contains no tournaments.');
        return { ok: errors.length === 0, errors, warnings, data, counts, migration:preparation ? {migrated:preparation.migrated,originalSchemaVersion:preparation.originalSchemaVersion,appliedMigrations:preparation.appliedMigrations} : null };
    },

    exportFull() {
        const data = Storage.exportAll();
        data.exportedAt = Utils.now();
        Utils.downloadJson(data, `krutar_backup_${new Date().toISOString().slice(0,10)}.json`);
        AuditService.log({ entityType: 'system', entityId: 'backup', action: 'export', eventCode: 'BACKUP_CREATED' });
    },

    async importFull(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject('Unable to read backup file. Current database was not changed.');
            reader.onload = (e) => {
                let raw, report, currentBackup = null, replaced = false;
                try {
                    raw = JSON.parse(e.target.result);
                    report = this.validateFullBackup(raw);
                    if (!report.ok) {
                        reject(`Backup validation failed. Current database was not changed. ${report.errors.slice(0,8).join(' | ')}${report.errors.length>8?` | +${report.errors.length-8} more error(s)`:''}`);
                        return;
                    }

                    // Recovery copy must be safely persisted BEFORE replacing the live database.
                    currentBackup = Storage.exportAll();
                    try {
                        localStorage.setItem(STORAGE_KEY + '_pre_restore', JSON.stringify({
                            createdAt: Utils.now(),
                            source: 'PRE_RESTORE_RECOVERY',
                            data: currentBackup
                        }));
                    } catch (backupErr) {
                        reject(`Restore cancelled: unable to create pre-restore recovery copy (${backupErr.message || backupErr}). Current database was not changed.`);
                        return;
                    }

                    Storage.replaceAll(report.data);
                    replaced = true;

                    // Validate the database exactly as persisted, not merely the parsed input object.
                    const postReport = this.validateFullBackup(Storage.exportAll());
                    if (!postReport.ok) throw new Error(`Post-restore integrity check failed: ${postReport.errors.slice(0,8).join(' | ')}`);

                    AuditService.log({
                        entityType: 'system', entityId: 'restore', action: 'restore', eventCode: 'BACKUP_RESTORED',
                        after: { schemaVersion: report.data.schemaVersion, collectionCounts: report.counts },
                        reason: report.warnings.join(' | ')
                    });
                    resolve({ ok:true, report:postReport });
                } catch(err) {
                    if (replaced && currentBackup) {
                        try {
                            Storage.replaceAll(currentBackup);
                            // Keep an audit only when rollback itself is successful; this is written to the recovered original database.
                            AuditService.log({ entityType:'system', entityId:'restore', action:'rollback', eventCode:'BACKUP_RESTORE_ROLLED_BACK', reason: err.message || String(err) });
                            reject(`Restore failed after replacement, so KTM rolled back to the previous database. ${err.message || err}`);
                        } catch (rollbackErr) {
                            reject(`CRITICAL: restore failed and automatic rollback also failed. Do not continue using this browser tab. Recovery copy remains at ${STORAGE_KEY}_pre_restore. Restore error: ${err.message || err}; rollback error: ${rollbackErr.message || rollbackErr}`);
                        }
                    } else {
                        reject(err.message || 'Invalid JSON backup. Current database was not changed.');
                    }
                }
            };
            reader.readAsText(file);
        });
    },

    getPreRestoreRecoveryInfo() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY + '_pre_restore');
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            const data = parsed?.data || parsed;
            const report = this.validateFullBackup(data);
            return { exists:true, createdAt: parsed?.createdAt || null, valid:report.ok, report };
        } catch (e) {
            return { exists:true, createdAt:null, valid:false, report:{ errors:[e.message || String(e)], warnings:[] } };
        }
    },

    restorePreRestoreRecovery() {
        const raw = localStorage.getItem(STORAGE_KEY + '_pre_restore');
        if (!raw) return { errors:['No pre-restore recovery copy is available.'] };
        let parsed, data, report;
        try {
            parsed = JSON.parse(raw);
            data = parsed?.data || parsed;
            report = this.validateFullBackup(data);
            if (!report.ok) return { errors:[`Recovery copy failed validation: ${report.errors.slice(0,8).join(' | ')}`] };
            const before = Storage.exportAll();
            Storage.replaceAll(data);
            const post = this.validateFullBackup(Storage.exportAll());
            if (!post.ok) { Storage.replaceAll(before); return { errors:[`Recovery integrity check failed; current database was restored. ${post.errors.slice(0,8).join(' | ')}`] }; }
            AuditService.log({ entityType:'system', entityId:'restore', action:'recover', eventCode:'PRE_RESTORE_RECOVERY_RESTORED', after:{ collectionCounts:post.counts } });
            return { data:true, report:post };
        } catch(e) { return { errors:[e.message || String(e)] }; }
    },

    getPreClearRecoveryInfo() {
        try {
            const raw = localStorage.getItem(STORAGE_KEY + '_pre_clear');
            if (!raw) return null;
            const parsed = JSON.parse(raw);
            const data = parsed?.data || parsed;
            const report = this.validateFullBackup(data);
            return { exists:true, createdAt: parsed?.createdAt || null, valid:report.ok, report };
        } catch (e) {
            return { exists:true, createdAt:null, valid:false, report:{ errors:[e.message || String(e)], warnings:[] } };
        }
    },

    clearAllSafely() {
