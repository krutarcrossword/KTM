/* RC2 — Test Mode visibility only.
   Test helpers remain in the file; OFF only hides their presentation blocks. */
.krutar-test-ui-hidden { display:none !important; }

/* RC2.2 — Global application footer.
   Presentation-only. Visible on normal manager pages, subdued in both themes.
   Hidden only in Venue Mode so the public board keeps its full-screen layout. */
#krutar-global-footer {
    flex:0 0 auto;
    text-align:center;
    padding:10px 16px 12px;
    font-size:11px;
    line-height:1.45;
    color:rgba(75,85,99,.52);
    border-top:1px solid rgba(148,163,184,.10);
    user-select:none;
}

    color:rgba(203,213,225,.46);
    border-top-color:rgba(148,163,184,.08);
}
#krutar-global-footer .krutar-footer-line { display:block; }
body.krutar-public-venue-mode #krutar-global-footer { display:none !important; }

    
/* PATCH 02.38.2 — Public Display Pagination / Auto Rotation.
   Presentation-only. Large public boards are paged in Venue Mode so each slide
   stays readable without scrollbars. Tournament data is never mutated. */
body.krutar-public-venue-mode #krutar-public-board .krutar-venue-page-hidden {
    display:none !important;
}
#krutar-public-venue-pager {
    position:fixed;
    right:14px;
    bottom:12px;
    z-index:2147483646;
    display:flex;
    align-items:center;
    gap:6px;
    padding:6px 8px;
    border:1px solid rgba(148,163,184,.35);
    border-radius:10px;
    background:rgba(15,23,42,.80);
    color:#e5e7eb;
    backdrop-filter:blur(8px);
    box-shadow:0 6px 24px rgba(0,0,0,.22);
    font-size:12px;
    user-select:none;
}
#krutar-public-venue-pager button {
    min-width:30px;
    height:28px;
    padding:0 8px;

    color:#e5e7eb;
    background:rgba(30,41,59,.92);
    cursor:pointer;
}
#krutar-public-venue-pager button:hover { background:rgba(51,65,85,.96); }
#krutar-public-venue-pager .krutar-pager-status { min-width:92px; text-align:center; white-space:nowrap; }

  #krutar-public-venue-pager .krutar-pager-status { min-width:78px; }
}

</style>
  
  
 
<style id="patch-02-37-public-venue-mode">
/* PATCH 02.37 — public presentation shell only. No competition data logic. */
#krutar-public-venue-exit {
    display:none;
    position:fixed;
    top:12px;
    right:12px;
    z-index:99999;
    padding:8px 12px;
    border:1px solid rgba(255,255,255,.35);
    border-radius:10px;
    background:rgba(17,24,39,.78);
    color:white;
    font-size:12px;
    cursor:pointer;
}
body.krutar-public-venue-mode #krutar-public-venue-exit { display:block; opacity:.28; }
body.krutar-public-venue-mode #krutar-public-venue-exit:hover { opacity:1; }

/* The app uses a fixed left manager sidebar plus the main workspace.
   In venue mode remove the manager chrome and give the board the full viewport. */
body.krutar-public-venue-mode aside,
body.krutar-public-venue-mode nav,
body.krutar-public-venue-mode header {
    display:none !important;
}
body.krutar-public-venue-mode main {
    margin-left:0 !important;
    width:100% !important;
    max-width:none !important;
}
body.krutar-public-venue-mode .no-print {
    display:none !important;
}
body.krutar-public-venue-mode {
    overflow:auto;
}
body.krutar-public-venue-mode #content,
body.krutar-public-venue-mode main > div {
    max-width:none !important;
}

/* PATCH 02.38 — Venue Display: compact standing + viewport-first presentation. */
body.krutar-public-venue-mode {
    overflow:hidden !important;
}
body.krutar-public-venue-mode #content {
    height:100vh !important;
    overflow:hidden !important;
    padding:12px !important;
}
body.krutar-public-venue-mode #krutar-public-board {
    height:calc(100vh - 24px);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    gap:12px;
}
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-header { flex:0 0 auto; padding:14px 18px !important; }
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games { flex:0 1 auto; gap:10px !important; }
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games > div { padding:14px 18px !important; }
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-standing { flex:1 1 auto; min-height:0; }
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing table { min-width:0 !important; }
body.krutar-public-venue-mode #krutar-public-board .krutar-manager-detail { display:none !important; }
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th,
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td { padding:6px 10px !important; }

/* PATCH 02.38.1 — Responsive fit-to-screen for public Venue Mode.
   Presentation only: no Tournament/Division/Round/Result mutation. */
body.krutar-public-venue-mode #krutar-public-board {
    --krutar-venue-scale: 1;
    width: calc(100% / var(--krutar-venue-scale));
    height: auto !important;
    min-height: 0 !important;
    transform: scale(var(--krutar-venue-scale));
    transform-origin: top left;
    gap: clamp(6px, 1vh, 12px);
}
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games {
    display:grid !important;
    grid-template-columns: repeat(2, minmax(0,1fr));
    align-content:start;
}
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-standing {
    flex:0 0 auto !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-header h2 {
    font-size:clamp(20px, 2.2vw, 34px) !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .text-xl {
    font-size:clamp(15px, 1.45vw, 22px) !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .text-lg {
    font-size:clamp(14px, 1.25vw, 20px) !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .text-4xl {
    font-size:clamp(28px, 3.4vw, 48px) !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .text-3xl {
    font-size:clamp(24px, 2.8vw, 42px) !important;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing {
    font-size:clamp(11px, 1.05vw, 16px);
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="compact"] .krutar-public-header { padding:8px 12px !important; }
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="compact"] .krutar-public-games > div { padding:9px 12px !important; }
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="compact"] .krutar-public-standing th,
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="compact"] .krutar-public-standing td { padding:4px 7px !important; }
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="ultra"] .krutar-public-header { padding:6px 10px !important; }
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="ultra"] .krutar-public-games > div { padding:7px 9px !important; }
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="ultra"] .krutar-public-standing th,
body.krutar-public-venue-mode #krutar-public-board[data-venue-density="ultra"] .krutar-public-standing td { padding:3px 5px !important; }
@media (min-width:1500px){
  body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games { grid-template-columns:repeat(3,minmax(0,1fr)); }
}
@media (max-width:760px){
  body.krutar-public-venue-mode #content { padding:6px !important; }
  body.krutar-public-venue-mode #krutar-public-board { gap:6px; }
  body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games { grid-template-columns:1fr; gap:6px !important; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-header { padding:8px 10px !important; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-games > div { padding:8px 10px !important; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th,
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td { padding:4px 6px !important; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing { font-size:11px; }
}

/* PATCH 02.38.2.1 — Venue Responsive Table Grid.
   Presentation-only adaptive table zone: 1–2 tables = large 2-column row,
   3–4 tables = 2x2, 5–6 tables = 3x2. Large divisions paginate at six tables
   per Venue page when the viewport can support it. No competition data mutation. */
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games {
    flex:none !important;
    width:100%;
    max-height:35vh;
    min-height:0;
    overflow:hidden;
    align-items:stretch;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] > .krutar-public-games {
    grid-template-columns:repeat(3,minmax(0,1fr)) !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="2"] > .krutar-public-games {
    grid-template-columns:repeat(2,minmax(0,1fr)) !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="1"] > .krutar-public-games {
    grid-template-columns:1fr !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-rows="1"] > .krutar-public-games {
    height:clamp(130px,24vh,250px);
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-rows="2"] > .krutar-public-games {
    height:clamp(220px,34vh,360px);
    grid-template-rows:repeat(2,minmax(0,1fr));
}
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games > div {
    min-width:0;
    min-height:0;
    height:100%;
    overflow:hidden;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] > .krutar-public-games > div {
    padding:10px 12px !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .text-4xl {
    font-size:clamp(24px,2.55vw,40px) !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .text-3xl {
    font-size:clamp(22px,2.25vw,36px) !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .text-xl {
    font-size:clamp(14px,1.15vw,19px) !important;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .text-lg {
    font-size:clamp(13px,1.05vw,17px) !important;
}
/* Keep the standing zone dominant; pager sits over unused lower-right space. */
body.krutar-public-venue-mode #krutar-public-board > .krutar-public-standing {
    min-height:0 !important;
    max-height:52vh;
    overflow:hidden;
}
@media (max-width:1179px){
  body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] > .krutar-public-games {
      grid-template-columns:repeat(2,minmax(0,1fr)) !important;
  }
}
@media (max-width:760px){
  body.krutar-public-venue-mode #krutar-public-board > .krutar-public-games {
      max-height:none;
      height:auto !important;
      grid-template-rows:none !important;
  }
  body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns] > .krutar-public-games {
      grid-template-columns:1fr !important;
  }
}


/* PATCH 02.38.2.2 — Venue standing breathing room + pager safe zone.
   Presentation-only: shifts compact W-T-L/OS left, gives the two facts visual
   separation, and reserves a bottom strip so rotation controls never cover
   the lowest visible standing rows. */
body.krutar-public-venue-mode #krutar-public-board {
    padding-bottom:46px;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(1),
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(1) { width:7%; }
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(2),
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(2) { width:55%; }
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(3),
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(3) { width:8%; }
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(4),
body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(4) { width:30%; }
body.krutar-public-venue-mode #krutar-public-board .krutar-wtl-os {
    display:inline-flex;
    align-items:baseline;
    gap:clamp(14px,1.35vw,24px);
    white-space:nowrap;
}
@media (max-width:760px){
  body.krutar-public-venue-mode #krutar-public-board { padding-bottom:40px; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(2),
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(2) { width:50%; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing th:nth-child(4),
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-standing td:nth-child(4) { width:35%; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-wtl-os { gap:10px; }
}

/* PATCH 02.46.2 — Venue game-card spread breathing room.
   Presentation-only CSS: prevent W/L/T spread labels on Last Game cards from
   sitting on the bottom edge in Venue Mode, especially in fullscreen on a
   3-table board. No Tournament/Division/Round/Result data mutation. */
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-player-slot {
    display:flex;
    flex-direction:column;
    justify-content:center;
    min-height:100%;
    padding-top:2px;
    padding-bottom:6px;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-player-name {
    line-height:1.15;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-spread {
    margin-top:6px;
    line-height:1.2;
    padding-bottom:2px;
}
body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-center {
    align-self:center;
    padding-bottom:2px;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .krutar-public-player-slot {
    padding-bottom:8px;
}
body.krutar-public-venue-mode #krutar-public-board[data-venue-grid-columns="3"] .krutar-public-games .krutar-public-spread {
    margin-top:5px;
}
@media (max-width:760px){
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-player-slot { padding-bottom:4px; }
  body.krutar-public-venue-mode #krutar-public-board .krutar-public-games .krutar-public-spread { margin-top:4px; }
}

/* Shared-link mobile view (outside Venue Mode): preserve scrollability but keep public standing narrow. */
@media (max-width:640px){
  #krutar-public-board .krutar-public-standing .krutar-manager-detail { display:none !important; }
  #krutar-public-board .krutar-public-standing table { min-width:0 !important; }
  #krutar-public-board .krutar-public-standing th,
  #krutar-public-board .krutar-public-standing td { padding:6px 7px !important; }
  #krutar-public-board .krutar-public-games { grid-template-columns:1fr !important; }
}

</style>

// ============================================================
// UTILITY LAYER
// ============================================================
const Utils = {
    generateId(prefix) {
        const ts = Date.now().toString(36);
        const rnd = Math.random().toString(36).substr(2, 5);
        return `${prefix}-${ts}-${rnd}`.toUpperCase();
    },
    now() { return new Date().toISOString(); },
    dateStr(iso) { if (!iso) return '—'; const d = new Date(iso); return d.toLocaleDateString('th-TH', {year:'numeric',month:'short',day:'numeric'}); },
    escHtml(s) { const d = document.createElement('div'); d.textContent = s||''; return d.innerHTML; },
    debounce(fn, ms=300) { let t; return (...a) => { clearTimeout(t); t = setTimeout(()=>fn(...a), ms); }; },
    deepClone(o) { return JSON.parse(JSON.stringify(o)); },
    downloadJson(data, filename) {
        const blob = new Blob([JSON.stringify(data, null, 2)], {type:'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    },
    downloadCsv(csv, filename) {
        const bom = '\uFEFF';
        const blob = new Blob([bom + csv], {type:'text/csv;charset=utf-8'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
    },
    parseCsv(text) {
        const lines = text.split(/\r?\n/).filter(l=>l.trim());
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
        return lines.slice(1).map(line => {
            const vals = line.split(',').map(v=>v.trim().replace(/^"|"$/g,''));
            const obj = {};
            headers.forEach((h,i) => obj[h] = vals[i]||'');
            return obj;
        });
    }
};

// ============================================================
// STORAGE LAYER
// ============================================================
const STORAGE_KEY = 'krutar_tournament_v1';
const SCHEMA_VERSION = 1;

// ============================================================
// PATCH 01.6 — SCHEMA MIGRATION FRAMEWORK / UPGRADE SAFETY
// ============================================================
// Framework only: live schema remains v1. Production migrations must be
// registered explicitly, one version at a time (vN -> vN+1).
const SchemaMigrationService = {
    _migrations: Object.create(null),
    register(fromVersion, toVersion, migrateFn, options = {}) {
        if (!Number.isInteger(fromVersion) || !Number.isInteger(toVersion) || toVersion !== fromVersion + 1) throw new Error('Migration steps must be sequential integer versions (vN -> vN+1).');
        if (typeof migrateFn !== 'function') throw new Error('Migration step requires a migrate function.');
        if (this._migrations[fromVersion]) throw new Error(`Migration from schema ${fromVersion} is already registered.`);
        this._migrations[fromVersion] = { fromVersion, toVersion, migrateFn, name:options.name || `Schema ${fromVersion} -> ${toVersion}`, validate:typeof options.validate === 'function' ? options.validate : null };
    },
    getPlan(fromVersion, targetVersion = SCHEMA_VERSION) {
        if (!Number.isInteger(fromVersion) || !Number.isInteger(targetVersion)) return { ok:false, steps:[], error:'Schema versions must be integers.' };
        if (fromVersion > targetVersion) return { ok:false, steps:[], error:`Schema ${fromVersion} is newer than supported schema ${targetVersion}.` };
        const steps=[]; let v=fromVersion;
        while (v < targetVersion) {
            const step=this._migrations[v];
            if (!step || step.toVersion !== v+1) return { ok:false, steps, error:`No registered migration path from schema ${v} to ${v+1}.` };
            steps.push(step); v=step.toVersion;
        }
        return { ok:true, steps, fromVersion, targetVersion };
    },
    migrateInMemory(sourceData, targetVersion = SCHEMA_VERSION) {
        if (!sourceData || typeof sourceData !== 'object' || Array.isArray(sourceData)) throw new Error('Migration source must be a database object.');
        if (!Number.isInteger(sourceData.schemaVersion)) throw new Error('Migration source has no valid schemaVersion.');
        const plan=this.getPlan(sourceData.schemaVersion,targetVersion); if (!plan.ok) throw new Error(plan.error);
        let working=Utils.deepClone(sourceData); const applied=[];
        for (const step of plan.steps) {
            if (working.schemaVersion !== step.fromVersion) throw new Error(`Migration precondition failed: expected schema ${step.fromVersion}.`);
            const before=Utils.deepClone(working); let next;
            try { next=step.migrateFn(Utils.deepClone(working)); } catch(e) { throw new Error(`Migration ${step.name} failed: ${e.message || e}`); }
            if (!next || typeof next !== 'object' || Array.isArray(next)) throw new Error(`Migration ${step.name} returned an invalid database object.`);
            if (next.schemaVersion !== step.toVersion) throw new Error(`Migration ${step.name} must explicitly set schemaVersion to ${step.toVersion}.`);
            if (step.validate) { const result=step.validate(next,before); if (result===false) throw new Error(`Migration ${step.name} failed its validation.`); if (typeof result==='string' && result) throw new Error(`Migration ${step.name} validation failed: ${result}`); }
            working=Utils.deepClone(next); applied.push({fromVersion:step.fromVersion,toVersion:step.toVersion,name:step.name});
        }
        return {data:working,applied,fromVersion:sourceData.schemaVersion,toVersion:targetVersion};
    },
    migrateStoredDatabase(sourceData) {
        const migration=this.migrateInMemory(sourceData,SCHEMA_VERSION); if (!migration.applied.length) return migration;
        const recoveryPayload={createdAt:Utils.now(),source:'PRE_MIGRATION_RECOVERY',fromSchemaVersion:sourceData.schemaVersion,toSchemaVersion:SCHEMA_VERSION,data:Utils.deepClone(sourceData)};
        localStorage.setItem(STORAGE_KEY+'_pre_migration',JSON.stringify(recoveryPayload));
        const verifyRaw=localStorage.getItem(STORAGE_KEY+'_pre_migration'); if (!verifyRaw) throw new Error('Pre-migration recovery copy could not be verified. Migration cancelled.');
        const verify=JSON.parse(verifyRaw); if (!verify || !verify.data || verify.data.schemaVersion!==sourceData.schemaVersion) throw new Error('Pre-migration recovery copy failed verification. Migration cancelled.');
        return migration;
    },
    status() { return {currentSchemaVersion:SCHEMA_VERSION,registered:Object.values(this._migrations).sort((a,b)=>a.fromVersion-b.fromVersion).map(x=>({fromVersion:x.fromVersion,toVersion:x.toVersion,name:x.name}))}; },
    runSafetySelfTest() {
        // Pure in-memory test. It never touches live Storage or localStorage.
        const original=this._migrations;
        try {
            this._migrations=Object.create(null);
            this.register(900,901,d=>({...d,schemaVersion:901,marker:'step1'}),{name:'SELFTEST 900 -> 901'});
            this.register(901,902,d=>({...d,schemaVersion:902,marker2:'step2'}),{name:'SELFTEST 901 -> 902'});
            const source={schemaVersion:900,payload:{value:7}}; const result=this.migrateInMemory(source,902);
            if (source.schemaVersion!==900 || source.marker || source.marker2) throw new Error('Source object was mutated.');
            if (result.data.schemaVersion!==902 || result.data.marker!=='step1' || result.data.marker2!=='step2') throw new Error('Sequential migration failed.');
            delete this._migrations[901]; if (this.getPlan(900,902).ok) throw new Error('Missing migration path was not blocked.');
            let newerBlocked=false; try { this.migrateInMemory({schemaVersion:903},902); } catch(_) { newerBlocked=true; }
            if (!newerBlocked) throw new Error('Newer schema was not blocked.');
            return {ok:true,message:'Migration safety self-test PASSED: sequential steps, immutable source, missing-path guard, newer-schema guard.'};
        } catch(e) { return {ok:false,message:e.message || String(e)}; }
        finally { this._migrations=original; }
    }
};

const Storage = {
    _data: null,
    _lastError: null,
    _collections: ['tournaments','divisions','players','registrations','pairingPlans','rankingRuleSets','byePolicies','resultPolicies','rounds','pairings','matchResults','standingSnapshots','auditLogs'],

    _startupFailure(code, message, error = null) {
        this._lastError = { code, message, error: error ? String(error.message || error) : null, at: Utils.now() };
        return { ok: false, state: 'RECOVERY_REQUIRED', code, message, recoveryRequired: true };
    },

    _validateBasicStructure(data) {
        if (!data || typeof data !== 'object' || Array.isArray(data)) {
            return { ok: false, message: 'Stored KRUTAR data is not a valid database object.' };
        }
        if (!Number.isInteger(data.schemaVersion)) {
            return { ok: false, message: 'Stored KRUTAR data has no valid schemaVersion.' };
        }
        const invalidCollections = this._collections.filter(c => !Array.isArray(data[c]));
        if (invalidCollections.length) {
            return { ok: false, message: `Invalid or missing collections: ${invalidCollections.join(', ')}` };
        }
        return { ok: true };
    },

    init() {
        this._lastError = null;
        let raw;
        try {
            raw = localStorage.getItem(STORAGE_KEY);
        } catch (e) {
            this._data = null;
            return this._startupFailure('STORAGE_READ_ERROR', 'Unable to read the existing KRUTAR database safely.', e);
        }

        // The ONLY safe condition for creating a new empty database is a genuinely absent storage key.
        if (raw === null) {
            this._data = { schemaVersion: SCHEMA_VERSION };
            this._collections.forEach(c => this._data[c] = []);
            try {
                this._save();
                return { ok: true, state: 'FRESH_DATABASE_CREATED' };
            } catch (e) {
                return this._startupFailure('STORAGE_WRITE_ERROR', 'A new KRUTAR database could not be saved.', e);
            }
        }

        let parsed;
        try {
            parsed = JSON.parse(raw);
        } catch (e) {
            this._data = null;
            return this._startupFailure('STORAGE_PARSE_ERROR', 'Existing KRUTAR Tournament data contains invalid JSON and was not overwritten.', e);
        }

        if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed) || !Number.isInteger(parsed.schemaVersion)) {
            this._data = null;
            return this._startupFailure('STORAGE_STRUCTURE_ERROR', 'Existing KRUTAR Tournament data has an invalid basic structure and was not overwritten.');
        }

        if (parsed.schemaVersion < SCHEMA_VERSION) {
            const originalVersion = parsed.schemaVersion;
            let migration;
            try { migration = SchemaMigrationService.migrateStoredDatabase(parsed); }
            catch (e) { this._data=null; return this._startupFailure('STORAGE_MIGRATION_BLOCKED', `Stored schema version ${originalVersion} cannot be migrated safely to version ${SCHEMA_VERSION}. ${e.message || e} Live data was not changed.`, e); }
            const migratedStructure=this._validateBasicStructure(migration.data);
            if (!migratedStructure.ok || migration.data.schemaVersion!==SCHEMA_VERSION) { this._data=null; return this._startupFailure('STORAGE_MIGRATION_VALIDATION_ERROR', `Migrated data failed structural validation. ${migratedStructure.message || ''} Live data was not changed.`); }
            this._data=migration.data;
            try { this._save(); }
            catch(e) { this._data=null; return this._startupFailure('STORAGE_MIGRATION_WRITE_ERROR','Migration was prepared but the upgraded database could not be saved. The pre-migration recovery copy is preserved.',e); }
            return {ok:true,state:'MIGRATED',fromSchemaVersion:originalVersion,toSchemaVersion:SCHEMA_VERSION,appliedMigrations:migration.applied};
        }
        if (parsed.schemaVersion > SCHEMA_VERSION) {
            this._data = null;
            return this._startupFailure('STORAGE_SCHEMA_NEWER', `Stored schema version ${parsed.schemaVersion} is newer than supported version ${SCHEMA_VERSION}. Data was not changed.`);
        }

        const structure = this._validateBasicStructure(parsed);
        if (!structure.ok) {
            this._data = null;
            return this._startupFailure('STORAGE_STRUCTURE_ERROR', `${structure.message} Existing data was not overwritten.`);
        }

        this._data = parsed;
        return { ok: true, state: 'READY' };
    },

    _save() {
        try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this._data));
            this._lastError = null;
            return true;
        } catch (e) {
            const error = new Error(`KRUTAR persistence failed: ${e && e.message ? e.message : e}`);
            error.code = 'STORAGE_WRITE_ERROR';
            error.cause = e;
            this._lastError = { code: error.code, message: error.message, at: Utils.now() };
            console.error(error);
            throw error;
        }
    },

    getAll(collection) { return this._data[collection] || []; },
    getById(collection, idField, id) { return this._data[collection]?.find(x => x[idField] === id) || null; },
    find(collection, predicate) { return (this._data[collection] || []).filter(predicate); },
    findOne(collection, predicate) { return (this._data[collection] || []).find(predicate) || null; },

    insert(collection, record) {
        if (!this._data[collection]) this._data[collection] = [];
        this._data[collection].push(record);
        this._save();
        return record;
    },

    update(collection, idField, id, updates) {
        const arr = this._data[collection] || [];
        const idx = arr.findIndex(x => x[idField] === id);
        if (idx === -1) return null;
        Object.assign(arr[idx], updates, { updatedAt: Utils.now() });
        this._save();
        return arr[idx];
    },

    remove(collection, idField, id) {
        const arr = this._data[collection] || [];
        const idx = arr.findIndex(x => x[idField] === id);
        if (idx === -1) return false;
        arr.splice(idx, 1);
        this._save();
        return true;
    },

    replaceAll(data) {
        this._data = { ...data, schemaVersion: SCHEMA_VERSION };
        this._save();
    },

    exportAll() { return Utils.deepClone(this._data); },

    clear() {
        this._collections.forEach(c => this._data[c] = []);
        ['finalStages','finalGames','finalPlacementSnapshots'].forEach(c => this._data[c] = []);
        this._save();
    }
};

            before: params.before || null,
            after: params.after || null,
            userChangedFields: params.userChangedFields || [],
            systemRecalculatedFields: params.systemRecalculatedFields || [],
            reason: params.reason || '',
            resultRevisionBefore: params.resultRevisionBefore ?? null,
            resultRevisionAfter: params.resultRevisionAfter ?? null,
            relatedSnapshotId: params.relatedSnapshotId || null,
            relatedAuditId: params.relatedAuditId || null,
            performedBy: 'admin',
            performedAt: Utils.now(),
            source: 'ui'
        };
        Storage.insert('auditLogs', entry);
        return entry;
    }
};

const SpreadLimitResolver = {
    getSpreadLimit(divisionId, roundNumber) {
        const division = DivisionService.getById(divisionId);
        if (!division) return null;
        const override = (division.roundSpreadOverrides || []).find(o => Number(o.roundNumber) === Number(roundNumber));
        return Number(override?.maximumSpread ?? division.maximumSpread);
    },
    getRule(divisionId, roundNumber) {
        const division = DivisionService.getById(divisionId);
        const override = (division?.roundSpreadOverrides || []).find(o => Number(o.roundNumber) === Number(roundNumber));
        return { limit: this.getSpreadLimit(divisionId, roundNumber), overridden: !!override };
    }
};

const Validation = {
    tournament(t) {
        const errors = [];
        if (!t.tournamentName?.trim()) errors.push('Tournament name is required');
        if (t.startDate && t.endDate && t.endDate < t.startDate) errors.push('End date must be >= start date');
        if (t.defaultMaximumSpread != null && t.defaultMaximumSpread <= 0) errors.push('Maximum spread must be > 0');
        return errors;
    },
    division(d) {
        const errors = [];
        if (!d.divisionCode?.trim()) errors.push('Division code is required');
        if (!d.divisionName?.trim()) errors.push('Division name is required');
        if (!d.totalRounds || d.totalRounds < 1) errors.push('Total rounds must be > 0');
        if (!Number.isInteger(Number(d.maximumSpread)) || Number(d.maximumSpread) <= 0) errors.push('Maximum spread must be a positive integer');
        const overrides = d.roundSpreadOverrides || [];
        const overrideRounds = new Set();
        overrides.forEach(o => {
            if (!Number.isInteger(Number(o.roundNumber)) || Number(o.roundNumber) < 1 || Number(o.roundNumber) > Number(d.totalRounds)) errors.push('Override round must be within total rounds');
            if (!Number.isInteger(Number(o.maximumSpread)) || Number(o.maximumSpread) <= 0) errors.push('Override maximum spread must be a positive integer');
            if (overrideRounds.has(Number(o.roundNumber))) errors.push('Duplicate round spread override');
            overrideRounds.add(Number(o.roundNumber));
        });
        // Check unique code within tournament
        const existing = Storage.find('divisions', x => x.tournamentId === d.tournamentId && x.divisionCode === d.divisionCode && x.divisionId !== d.divisionId);
        if (existing.length > 0) errors.push('Division code already exists in this tournament');
        return errors;
    },
    player(p) {
        const errors = [];
        const thaiName = String(p.thaiName || [p.firstNameTh, p.lastNameTh].filter(Boolean).join(' ')).trim();
        if (!thaiName) errors.push('Thai Name is required');
        if (!String(p.province || '').trim()) errors.push('Province is required');
        if (!String(p.country || '').trim()) errors.push('Country is required');
        if (!PlayerIntentService.normalizeTags(p.intendedDivisions || p.preferredDivisions || p.eligibleDivisions || '').length) errors.push('Game / Division is required');
        if (p.currentRating != null && p.currentRating !== '' && !Number.isFinite(Number(p.currentRating))) errors.push('Rating must be a valid number or blank.');
        return errors;
    },
    registration(r) {
        const errors = [];
        if (!r.playerId) errors.push('Player is required');
        if (!r.divisionId) errors.push('Division is required');
        const dup = Storage.findOne('registrations', x => x.tournamentId === r.tournamentId && x.divisionId === r.divisionId && x.playerId === r.playerId && x.registrationId !== r.registrationId);
        if (dup) errors.push('Player already registered in this division');
        return errors;
    },
    pairing(p, roundId) {
        const errors = [];
        if (p.pairingType === 'normal') {
            if (!p.player1Id || !p.player2Id) errors.push('Normal pairing needs 2 players');
            if (p.player1Id === p.player2Id) errors.push('Player cannot be paired with themselves');
        }
        if (p.pairingType === 'bye' && !p.player1Id) errors.push('Bye pairing needs 1 player');
        // Check duplicate player in round
        const roundPairings = Storage.find('pairings', x => x.roundId === roundId && x.pairingId !== p.pairingId);
        const playersInRound = new Set();
        roundPairings.forEach(rp => { if (rp.player1Id) playersInRound.add(rp.player1Id); if (rp.player2Id) playersInRound.add(rp.player2Id); });
        if (p.player1Id && playersInRound.has(p.player1Id)) errors.push(`Player ${p.player1Id} already paired in this round`);
        if (p.player2Id && playersInRound.has(p.player2Id)) errors.push(`Player ${p.player2Id} already paired in this round`);
        // Check duplicate table
        if (p.tableNumber) {
            const tableConflict = roundPairings.find(rp => rp.tableNumber === p.tableNumber);
            if (tableConflict) errors.push(`Table ${p.tableNumber} already used in this round`);
        }
        return errors;
    },
    result(r) {
        const errors = [];
        if (r.player1Score == null || r.player1Score < 0) errors.push('Player 1 score must be >= 0');
        if (r.player2Score == null || r.player2Score < 0) errors.push('Player 2 score must be >= 0');
        if (!Number.isInteger(r.player1Score)) errors.push('Player 1 score must be integer');
        if (!Number.isInteger(r.player2Score)) errors.push('Player 2 score must be integer');
        return errors;
    }
};

// ============================================================
// RANKING RULE SERVICE — Patch 02.1
// RankingRuleSet is now executable, not decorative.
// ============================================================
const RankingRuleService = {
    _canonicalRules() {
        return [
            { priority: 1, field: 'wins', direction: 'desc' },
            { priority: 2, field: 'matchPoints', direction: 'desc' },
            { priority: 3, field: 'sumOfficialSpread', direction: 'desc' },
            { priority: 4, field: 'scoreFor', direction: 'desc' },
            { priority: 5, field: 'sumRawSpread', direction: 'desc' },
            { priority: 6, field: 'tournamentPlayerCode', direction: 'asc' }
        ];
    },

    _defaultRuleSet() {
        return {
            rankingRuleSetId: 'SYSTEM-DEFAULT-RANKING',
            name: 'KRUTAR Crossword Ranking — RC3',
            matchPoints: { win: 1, tie: 0.5, loss: 0 },
            rules: this._canonicalRules(),
            version: 3,
            status: 'active',
            _fallback: true
        };
    },

    getForDivision(divisionId) {
        const division = DivisionService.getById(divisionId);
        if (!division) return { ruleSet: this._defaultRuleSet(), warnings: ['Division not found; using fallback ranking rule set.'] };

        const ruleSet = division.rankingRuleSetId
            ? Storage.getById('rankingRuleSets', 'rankingRuleSetId', division.rankingRuleSetId)
            : null;

        if (!ruleSet) {
            return { ruleSet: this._defaultRuleSet(), warnings: ['RankingRuleSet is missing; using fallback ranking rule set.'] };
        }

        const validation = this.validate(ruleSet);
        if (!validation.ok) {
            return {
                ruleSet: this._defaultRuleSet(),
                warnings: validation.errors.map(e => `Invalid RankingRuleSet: ${e}`).concat(['Fallback ranking rule set is being used.'])
            };
        }

        const effectiveRuleSet = {
            ...ruleSet,
            name: ruleSet.name || 'KRUTAR Crossword Ranking',
            rules: this._canonicalRules(),
            version: Math.max(3, Number(ruleSet.version || 1)),
            _rc3CanonicalStanding: true
        };
        return { ruleSet: effectiveRuleSet, warnings: validation.warnings };
    },

    validate(ruleSet) {
        const errors = [];
        const warnings = [];
        if (!ruleSet || typeof ruleSet !== 'object') return { ok: false, errors: ['Rule set must be an object.'], warnings };

        const mp = ruleSet.matchPoints || {};
        for (const key of ['win', 'tie', 'loss']) {
            if (!Number.isFinite(Number(mp[key]))) errors.push(`matchPoints.${key} must be numeric.`);
        }

        if (!Array.isArray(ruleSet.rules) || !ruleSet.rules.length) {
            errors.push('rules must contain at least one ranking criterion.');
        } else {
            const seenPriority = new Set();
            ruleSet.rules.forEach((r, idx) => {
                if (!r || typeof r !== 'object') {
                    errors.push(`Rule #${idx + 1} is invalid.`);
                    return;
                }
                const priority = Number(r.priority);
                if (!Number.isFinite(priority)) errors.push(`Rule #${idx + 1} priority must be numeric.`);
                else if (seenPriority.has(priority)) errors.push(`Duplicate ranking priority ${priority}.`);
                else seenPriority.add(priority);

                if (!r.field || typeof r.field !== 'string') errors.push(`Rule #${idx + 1} field is required.`);
                if (!['asc', 'desc'].includes(String(r.direction || '').toLowerCase())) {
                    errors.push(`Rule #${idx + 1} direction must be asc or desc.`);
                }
            });

            const fields = ruleSet.rules.map(r => r?.field).filter(Boolean);
            if (!fields.includes('matchPoints')) warnings.push('Ranking rules do not include matchPoints.');
        }

        return { ok: errors.length === 0, errors, warnings };
    },

    matchPointsFor(resultCode, ruleSet) {
        const mp = ruleSet?.matchPoints || this._defaultRuleSet().matchPoints;
        if (resultCode === 'W') return Number(mp.win);
        if (resultCode === 'T') return Number(mp.tie);
        if (resultCode === 'L') return Number(mp.loss);
        return 0;
    },

    _compareValues(a, b, direction) {
        const dir = String(direction || 'desc').toLowerCase() === 'asc' ? 1 : -1;

        const aMissing = a === null || a === undefined || a === '';
        const bMissing = b === null || b === undefined || b === '';
        if (aMissing && bMissing) return 0;
        if (aMissing) return 1;
        if (bMissing) return -1;

        const aNum = Number(a);
        const bNum = Number(b);
        const bothNumeric = Number.isFinite(aNum) && Number.isFinite(bNum);

        if (bothNumeric) {
            if (aNum === bNum) return 0;
            return aNum < bNum ? -1 * dir : 1 * dir;
        }

        const cmp = String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
        return cmp * dir;
    },

    comparator(ruleSet) {
        const orderedRules = [...(ruleSet?.rules || [])]
            .sort((a, b) => Number(a.priority) - Number(b.priority));

        return (a, b) => {
            for (const rule of orderedRules) {
                const cmp = this._compareValues(a?.[rule.field], b?.[rule.field], rule.direction);
                if (cmp !== 0) return cmp;
            }
            // Deterministic final tie-break only; not a competition ranking rule.
            return String(a?.playerId || '').localeCompare(String(b?.playerId || ''));
        };
    },

    sortRows(rows, ruleSet) {
        return [...rows].sort(this.comparator(ruleSet));
    },

    describe(ruleSet) {
        const label = {
            matchPoints: 'Match Points',
            sumOfficialSpread: 'Official Spread',
            sumRawSpread: 'Raw Spread',
            wins: 'Wins',
            ties: 'Ties',
            losses: 'Losses',
            gamesPlayed: 'Games Played',
            scoreFor: 'Score For',
            scoreAgainst: 'Score Against',
            seed: 'Seed',
            tournamentPlayerCode: 'Tournament Code',
            playerName: 'Player Name',
            playerId: 'Player ID'
        };
        return [...(ruleSet?.rules || [])]
            .sort((a, b) => Number(a.priority) - Number(b.priority))
            .map(r => `${label[r.field] || r.field} ${String(r.direction).toLowerCase() === 'asc' ? '↑' : '↓'}`)
            .join(' → ');
    },

    runSelfTest() {
        const errors = [];

        const custom = {
            matchPoints: { win: 2, tie: 1, loss: 0 },
            rules: [
                { priority: 1, field: 'sumOfficialSpread', direction: 'desc' },
                { priority: 2, field: 'matchPoints', direction: 'desc' },
                { priority: 3, field: 'seed', direction: 'asc' }
            ]
        };

        if (this.matchPointsFor('W', custom) !== 2) errors.push('Custom win match points were not applied.');
        if (this.matchPointsFor('T', custom) !== 1) errors.push('Custom tie match points were not applied.');
        if (this.matchPointsFor('L', custom) !== 0) errors.push('Custom loss match points were not applied.');

        const sample = [
            { playerId: 'P-A', matchPoints: 9, sumOfficialSpread: 100, seed: 3 },
            { playerId: 'P-B', matchPoints: 8, sumOfficialSpread: 300, seed: 2 },
            { playerId: 'P-C', matchPoints: 9, sumOfficialSpread: 100, seed: 1 }
        ];
        const sorted = this.sortRows(sample, custom).map(r => r.playerId).join(',');
        if (sorted !== 'P-B,P-C,P-A') {
            errors.push(`Configured ranking order was not executed. Got ${sorted}.`);
        }

        const defaultRules = this._defaultRuleSet();
        const defaultSample = [
            { playerId:'P-1', tournamentPlayerCode:'CWO-003', wins:3, matchPoints:3, sumOfficialSpread:100, scoreFor:1500, sumRawSpread:120 },
            { playerId:'P-2', tournamentPlayerCode:'CWO-002', wins:4, matchPoints:4, sumOfficialSpread:20, scoreFor:1200, sumRawSpread:20 },
            { playerId:'P-3', tournamentPlayerCode:'CWO-004', wins:4, matchPoints:4, sumOfficialSpread:100, scoreFor:1400, sumRawSpread:90 },
            { playerId:'P-4', tournamentPlayerCode:'CWO-005', wins:4, matchPoints:4, sumOfficialSpread:100, scoreFor:1600, sumRawSpread:80 },
            { playerId:'P-5', tournamentPlayerCode:'CWO-006', wins:4, matchPoints:4, sumOfficialSpread:100, scoreFor:1600, sumRawSpread:130 },
            { playerId:'P-6', tournamentPlayerCode:'CWO-001', wins:4, matchPoints:4, sumOfficialSpread:100, scoreFor:1600, sumRawSpread:130 }
        ];
        const defaultSorted = this.sortRows(defaultSample, defaultRules).map(r => r.playerId).join(',');
        if (defaultSorted !== 'P-6,P-5,P-4,P-3,P-2,P-1') {
            errors.push(`RC3 default ranking order failed. Got ${defaultSorted}.`);
        }

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Ranking Rule Self-Test FAILED: ${errors.join(' ')}`
                : 'Ranking Rule Self-Test PASSED: RC3 Standing order W → MP → OS → SF → Raw Spread → Tournament Code executes in priority order.'
        };
    }
};

// ============================================================
// STANDING PARTICIPANT RESOLVER — Patch 02.2
// Separates "who belongs in standings" from "who is eligible to pair".
// ============================================================
const StandingParticipantResolver = {
    _hasStandingHistoryForRegistration(registration, results) {
        if (!registration) return false;
        return results.some(r =>
            r.status !== 'voided' &&
            r.resultType !== 'void' &&
            (
                r.player1RegistrationId === registration.registrationId ||
                r.player2RegistrationId === registration.registrationId ||
                r.player1Id === registration.playerId ||
                r.player2Id === registration.playerId
            )
        );
    },

    _classify(registration, hasHistory) {
        const entryStatus = registration?.entryStatus || 'unknown';
        const checkedIn = registration?.checkInStatus === 'checked_in';

        if (hasHistory) {
            if (entryStatus === 'withdrawn') return 'withdrawn_with_history';
            if (entryStatus === 'cancelled') return 'cancelled_with_history';
            if (entryStatus === 'completed') return 'completed_with_history';
            return 'active_with_history';
        }

        if (['active', 'completed'].includes(entryStatus) && checkedIn) return 'checked_in_no_history';
        if (entryStatus === 'withdrawn') return 'withdrawn_no_history';
        if (entryStatus === 'cancelled') return 'cancelled_no_history';
        if (entryStatus === 'registered' && !checkedIn) return 'registered_not_checked_in';
        if (entryStatus === 'active' && !checkedIn) return 'active_not_checked_in';
        return 'not_participating';
    },

    _shouldInclude(classification) {
        return [
            'active_with_history',
            'withdrawn_with_history',
            'cancelled_with_history',
            'completed_with_history',
            'checked_in_no_history'
        ].includes(classification);
    },

    resolveFromData(registrations, results) {
        const included = [];
        const excluded = [];
        const warnings = [];

        (registrations || []).forEach(registration => {
            const hasHistory = this._hasStandingHistoryForRegistration(registration, results || []);
            const classification = this._classify(registration, hasHistory);
            const item = {
                registration,
                registrationId: registration.registrationId,
                playerId: registration.playerId,
                hasStandingHistory: hasHistory,
                classification,
                entryStatus: registration.entryStatus,
                checkInStatus: registration.checkInStatus,
                eligibleForPairing: RegistrationEligibilityResolver.isEligible(registration)
            };

            if (this._shouldInclude(classification)) included.push(item);
            else excluded.push(item);

            if (classification === 'cancelled_with_history') {
                warnings.push(`Registration ${registration.registrationId} is cancelled but has competition history; it remains in standings for historical integrity.`);
            }
        });

        return {
            included,
            excluded,
            warnings,
            counts: {
                included: included.length,
                excluded: excluded.length,
                withdrawnWithHistory: included.filter(x => x.classification === 'withdrawn_with_history').length,
                activeEligibleForPairing: included.filter(x => x.eligibleForPairing).length
            }
        };
    },

    resolve(divisionId) {
        const registrations = RegistrationService.getByDivision(divisionId);
        const results = Storage.find('matchResults', r => r.divisionId === divisionId);
        return this.resolveFromData(registrations, results);
    },

    describePolicy() {
        return 'Standing keeps checked-in participants and anyone with competition history. Withdrawn players with history remain ranked; registered/not-checked-in and no-history withdrawals are excluded. Pairing eligibility is evaluated separately.';
    },

    runSelfTest() {
        const regs = [
            { registrationId:'R-A', playerId:'P-A', entryStatus:'active', checkInStatus:'checked_in', eligibleForPairing:true, tournamentPlayerCode:'T-001' },
            { registrationId:'R-B', playerId:'P-B', entryStatus:'withdrawn', checkInStatus:'checked_in', eligibleForPairing:false, tournamentPlayerCode:'T-002' },
            { registrationId:'R-C', playerId:'P-C', entryStatus:'registered', checkInStatus:'not_checked_in', eligibleForPairing:true, tournamentPlayerCode:null },
            { registrationId:'R-D', playerId:'P-D', entryStatus:'withdrawn', checkInStatus:'checked_in', eligibleForPairing:false, tournamentPlayerCode:'T-004' },
            { registrationId:'R-E', playerId:'P-E', entryStatus:'active', checkInStatus:'not_checked_in', eligibleForPairing:true, tournamentPlayerCode:null }
        ];
        const results = [
            { resultId:'RES-1', status:'locked', resultType:'normal', player1RegistrationId:'R-A', player1Id:'P-A', player2RegistrationId:'R-B', player2Id:'P-B' }
        ];

        const resolved = this.resolveFromData(regs, results);
        const includedIds = resolved.included.map(x => x.registrationId).sort().join(',');
        const excludedIds = resolved.excluded.map(x => x.registrationId).sort().join(',');
        const errors = [];

        if (includedIds !== 'R-A,R-B') errors.push(`Expected active historical + withdrawn historical participants. Got ${includedIds}.`);
        if (excludedIds !== 'R-C,R-D,R-E') errors.push(`Expected nonparticipants to be excluded. Got ${excludedIds}.`);

        const withdrawnHistorical = resolved.included.find(x => x.registrationId === 'R-B');
        if (!withdrawnHistorical || withdrawnHistorical.classification !== 'withdrawn_with_history') {
            errors.push('Withdrawn player with history did not remain in standing pool.');
        }
        if (withdrawnHistorical?.eligibleForPairing) {
            errors.push('Withdrawn historical player incorrectly remained pairing-eligible.');
        }

        return {
            ok: errors.length === 0,
            errors,
            message: errors.length
                ? `Standing Participant Self-Test FAILED: ${errors.join(' ')}`
                : 'Standing Participant Self-Test PASSED: withdrawn historical players stay in standings while nonparticipants stay out and pairing eligibility remains separate.'
        };
    }
};

// ============================================================
// PATCH 02.20 — BYE RESULT / STANDING EXECUTION CENTRALIZATION
// BYE arithmetic is executed from the immutable historical result record,
// never from the Division's CURRENT ByePolicy. This prevents later policy
// edits from rewriting old standings. Ordinary BYE and Gibson BYE share the
// same scoring execution; their identity/history metadata remains distinct.
// ============================================================
const ByeStandingExecutionService = {
    resolve(result) {
        if (!result || (result.resultType !== 'bye' && result.pairingType !== 'bye')) {
            return { ok:false, errors:['Result is not a BYE result.'] };
        }
        const scoreFor = Number(result.player1Score ?? 0);
        const scoreAgainst = Number(result.player2Score ?? 0);
        const officialSpread = Number(result.officialSpreadPlayer1 ?? result.byeOfficialSpreadAwarded ?? (scoreFor - scoreAgainst));
        const countsAsGame = result.byeCountsAsGame !== false;
        const countsAsWin = result.byeCountsAsWin !== false;
        const matchPointsAwarded = Number.isFinite(Number(result.byeMatchPointsAwarded))
            ? Number(result.byeMatchPointsAwarded)
            : null;
        const byeReason = result.byeReason === 'gibson' ? 'gibson' : 'ordinary';
        const errors = [];
        if (!Number.isFinite(scoreFor) || scoreFor < 0) errors.push('BYE Score For is invalid.');
        if (!Number.isFinite(scoreAgainst) || scoreAgainst < 0) errors.push('BYE Score Against is invalid.');
        if (!Number.isFinite(officialSpread)) errors.push('BYE Official Spread is invalid.');
        if (result.player2Id || result.player2RegistrationId) errors.push('BYE result must not contain a real opponent.');
        if (result.player1Result && !['W','T','L'].includes(result.player1Result)) errors.push('BYE player result code is invalid.');
        if (Number.isFinite(Number(result.byeOfficialSpreadAwarded)) && Number(result.byeOfficialSpreadAwarded) !== officialSpread) {
            errors.push('Frozen BYE Official Spread does not match the applied official spread.');
        }
        return {
            ok: errors.length === 0,
            errors,
            data: {
                scoreFor,
                scoreAgainst,
                rawSpread: Number(result.rawSpreadPlayer1 ?? (scoreFor - scoreAgainst)),
                officialSpread,
                countsAsGame,
                countsAsWin,
                matchPointsAwarded,
                playerResult: result.player1Result || (countsAsWin ? 'W' : null),
                byeReason,
                isGibson: byeReason === 'gibson'
            }
        };
    },

    applyToStats(stats, result, rankingRuleSet) {
        const resolved = this.resolve(result);
        if (!resolved.ok) return resolved;
        const x = resolved.data;
        if (x.countsAsGame) stats.gamesPlayed++;
        stats.scoreFor += x.scoreFor;
        stats.scoreAgainst += x.scoreAgainst;
        stats.sumRawSpread += x.rawSpread;
        stats.sumOfficialSpread += x.officialSpread;
        if (x.playerResult === 'W' && x.countsAsWin) stats.wins++;
        else if (x.playerResult === 'T') stats.ties++;
        else if (x.playerResult === 'L') stats.losses++;
        stats.matchPoints += x.matchPointsAwarded !== null
            ? x.matchPointsAwarded
            : RankingRuleService.matchPointsFor(x.playerResult, rankingRuleSet);
        return { ok:true, data:stats, execution:x };
    },

    inspectDivision(divisionId, options = {}) {
        const throughRound = options.throughRound == null ? null : Number(options.throughRound);
        const allowedRoundIds = Number.isFinite(throughRound)
            ? new Set(Storage.find('rounds', r => r.divisionId === divisionId && Number(r.roundNumber) <= throughRound).map(r => r.roundId))
            : null;
        const results = Storage.find('matchResults', r =>
            r.divisionId === divisionId &&
            r.status !== 'voided' && r.resultType !== 'void' &&
            (r.resultType === 'bye' || r.pairingType === 'bye') &&
            (!allowedRoundIds || allowedRoundIds.has(r.roundId))
        );
        const errors = [];
        results.forEach(r => {
            const check = this.resolve(r);
            if (!check.ok) errors.push(...check.errors.map(e => `${r.resultId}: ${e}`));
        });
        return { ok:errors.length===0, errors, byeResultCount:results.length };
    },

    runSelfTest() {
        const errors = [];
        const rule = { matchPoints:{ win:1, tie:0.5, loss:0 } };
        const fresh = () => ({ gamesPlayed:0,wins:0,ties:0,losses:0,matchPoints:0,scoreFor:0,scoreAgainst:0,sumRawSpread:0,sumOfficialSpread:0 });
        const apply = (r) => { const st=fresh(); const x=this.applyToStats(st,r,rule); return { st, x }; };

        let t = apply({ resultType:'bye', pairingType:'bye', player1Score:100, player2Score:0, player1Result:'W', rawSpreadPlayer1:100, officialSpreadPlayer1:100, byeOfficialSpreadAwarded:100, byeCountsAsGame:true, byeCountsAsWin:true, byeMatchPointsAwarded:1, player2Id:null, player2RegistrationId:null, byeReason:'ordinary' });
        if (!t.x.ok || t.st.gamesPlayed!==1 || t.st.wins!==1 || t.st.matchPoints!==1 || t.st.scoreFor!==100 || t.st.scoreAgainst!==0 || t.st.sumOfficialSpread!==100) errors.push('Default 100–0 / +100 BYE execution failed.');

        t = apply({ resultType:'bye', pairingType:'bye', player1Score:80, player2Score:0, player1Result:'W', rawSpreadPlayer1:80, officialSpreadPlayer1:80, byeOfficialSpreadAwarded:80, byeCountsAsGame:true, byeCountsAsWin:true, byeMatchPointsAwarded:1, player2Id:null, player2RegistrationId:null, byeReason:'ordinary' });
        if (!t.x.ok || t.st.scoreFor!==80 || t.st.sumOfficialSpread!==80 || t.st.matchPoints!==1) errors.push('Custom +80 BYE execution failed.');

        t = apply({ resultType:'bye', pairingType:'bye', player1Score:200, player2Score:100, player1Result:'W', rawSpreadPlayer1:100, officialSpreadPlayer1:100, byeOfficialSpreadAwarded:100, byeCountsAsGame:true, byeCountsAsWin:true, byeMatchPointsAwarded:1, player2Id:null, player2RegistrationId:null, byeReason:'ordinary' });
        if (!t.x.ok || t.st.scoreFor!==200 || t.st.scoreAgainst!==100 || t.st.sumOfficialSpread!==100) errors.push('200–100 / +100 BYE execution failed.');

        t = apply({ resultType:'bye', pairingType:'bye', player1Score:100, player2Score:0, player1Result:'W', rawSpreadPlayer1:100, officialSpreadPlayer1:100, byeOfficialSpreadAwarded:100, byeCountsAsGame:true, byeCountsAsWin:true, byeMatchPointsAwarded:1, player2Id:null, player2RegistrationId:null, byeReason:'gibson', gibsonizationReason:'Clinched position' });
        if (!t.x.ok || !t.x.execution.isGibson || t.st.wins!==1 || t.st.sumOfficialSpread!==100) errors.push('Gibson BYE did not use normal BYE standing arithmetic while preserving Gibson identity.');

        const frozen = { resultType:'bye', pairingType:'bye', player1Score:50, player2Score:0, player1Result:'W', rawSpreadPlayer1:50, officialSpreadPlayer1:50, byeOfficialSpreadAwarded:50, byeCountsAsGame:true, byeCountsAsWin:true, byeMatchPointsAwarded:1, player2Id:null, player2RegistrationId:null, byeReason:'ordinary', byePolicyVersion:1 };
        t = apply(frozen);
        if (!t.x.ok || t.st.sumOfficialSpread!==50 || t.st.scoreFor!==50) errors.push('Historical BYE result did not remain frozen to its stored execution values.');

        return {
            ok: errors.length===0,
            errors,
            message: errors.length
                ? `BYE Result / Standing Execution Self-Test FAILED: ${errors.join(' ')}`
                : 'BYE Result / Standing Execution Self-Test PASSED: default, custom, 200–100, Gibson, and frozen historical BYE records execute exactly once from stored result metadata without creating a phantom opponent.'
        };
    }
};

// ============================================================
// PATCH 02.22 — RESULT → STANDING INTEGRATION VERIFICATION
// Read-only verifier. It independently replays stored official result facts and
// compares them with CalcEngine standings and CURRENT locked-round snapshots.
// It never mutates tournament data.
// ============================================================
const ResultStandingIntegrationVerifier = {
    _num(v) { const n = Number(v); return Number.isFinite(n) ? n : 0; },
    _rowCore(row) {
        return {
            gamesPlayed:this._num(row?.gamesPlayed), wins:this._num(row?.wins), ties:this._num(row?.ties), losses:this._num(row?.losses),
            matchPoints:this._num(row?.matchPoints), scoreFor:this._num(row?.scoreFor), scoreAgainst:this._num(row?.scoreAgainst),
            sumRawSpread:this._num(row?.sumRawSpread), sumOfficialSpread:this._num(row?.sumOfficialSpread)
        };
    },
    _same(a,b) {
        return ['gamesPlayed','wins','ties','losses','matchPoints','scoreFor','scoreAgainst','sumRawSpread','sumOfficialSpread']
            .every(k => Math.abs(this._num(a[k]) - this._num(b[k])) < 1e-9);
    },
    _expectedFromResults(divisionId, throughRound=null) {
        const rule = RankingRuleService.getForDivision(divisionId).ruleSet;
        const roundIds = new Set(Storage.find('rounds', r => r.divisionId===divisionId && (throughRound==null || Number(r.roundNumber)<=Number(throughRound))).map(r=>r.roundId));
        const results = Storage.find('matchResults', r => r.divisionId===divisionId && r.status!=='voided' && r.resultType!=='void' && roundIds.has(r.roundId));
        const stats = new Map();
        const ensure = id => { if (!id) return null; if (!stats.has(id)) stats.set(id,{gamesPlayed:0,wins:0,ties:0,losses:0,matchPoints:0,scoreFor:0,scoreAgainst:0,sumRawSpread:0,sumOfficialSpread:0}); return stats.get(id); };
        const errors=[];
        results.forEach(r => {
            const isBye = r.resultType==='bye' || r.pairingType==='bye';
            if (isBye) {
                const st=ensure(r.player1Id); if (!st) { errors.push(`BYE result ${r.resultId} has no player1.`); return; }
                if (r.player2Id || r.player2RegistrationId) errors.push(`BYE result ${r.resultId} has a phantom opponent.`);
                if (r.byeCountsAsGame !== false) st.gamesPlayed++;
                st.scoreFor += this._num(r.player1Score); st.scoreAgainst += this._num(r.player2Score);
                st.sumRawSpread += this._num(r.rawSpreadPlayer1);
                st.sumOfficialSpread += this._num(r.byeOfficialSpreadAwarded ?? r.officialSpreadPlayer1);
                if (r.byeCountsAsWin !== false) st.wins++;
                else if (r.player1Result==='T') st.ties++; else if (r.player1Result==='L') st.losses++;
                st.matchPoints += Number.isFinite(Number(r.byeMatchPointsAwarded)) ? Number(r.byeMatchPointsAwarded) : RankingRuleService.matchPointsFor(r.player1Result, rule);
                return;
            }
            const a=ensure(r.player1Id), b=ensure(r.player2Id);
            if (!a || !b) { errors.push(`Normal result ${r.resultId} is missing a real opponent.`); return; }
            if (r.resultType==='double_walkover') {
                const resolved=DoubleWalkoverStandingExecutionService.resolve(r);
                if(!resolved.ok){ errors.push(...resolved.errors.map(e=>`Result ${r.resultId}: ${e}`)); return; }
                [[a,1],[b,2]].forEach(([st,n])=>{
                    const x=n===1?resolved.data.player1:resolved.data.player2;
                    if(resolved.data.countsAsGame) st.gamesPlayed++;
                    st.losses++; st.matchPoints += x.matchPoints;
                    st.scoreFor += x.scoreFor; st.scoreAgainst += x.scoreAgainst;
                    st.sumRawSpread += x.rawSpread; st.sumOfficialSpread += x.officialSpread;
                });
                return;
            }
            const calc=CalcEngine.calculateResult(this._num(r.player1Score),this._num(r.player2Score),this._num(r.spreadLimitUsed)||350,true);
            if (!calc.error) {
                if (calc.p1Result!==r.player1Result || calc.p2Result!==r.player2Result) errors.push(`Result ${r.resultId}: stored W/L/T disagrees with entered scores.`);
                if (calc.rawSpread1!==this._num(r.rawSpreadPlayer1) || calc.rawSpread2!==this._num(r.rawSpreadPlayer2)) errors.push(`Result ${r.resultId}: stored raw spread disagrees with entered scores.`);
                if (calc.officialSpread1!==this._num(r.officialSpreadPlayer1) || calc.officialSpread2!==this._num(r.officialSpreadPlayer2)) errors.push(`Result ${r.resultId}: stored official spread disagrees with score/spread limit.`);
            }
            [[a,1],[b,2]].forEach(([st,n])=>{
                st.gamesPlayed++;
                st.scoreFor += this._num(r[`player${n}Score`]); st.scoreAgainst += this._num(r[`player${n===1?2:1}Score`]);
                st.sumRawSpread += this._num(r[`rawSpreadPlayer${n}`]); st.sumOfficialSpread += this._num(r[`officialSpreadPlayer${n}`]);
                const res=r[`player${n}Result`]; if(res==='W')st.wins++; else if(res==='T')st.ties++; else if(res==='L')st.losses++;
                st.matchPoints += RankingRuleService.matchPointsFor(res,rule);
            });
        });
        return {stats,results,errors};
    },
    inspectDivision(divisionId) {
        const errors=[]; const checks=[];
        const div=DivisionService.getById(divisionId); if(!div) return {ok:false,errors:['Division not found.'],checks:[]};
        const compareScope=(throughRound,label)=>{
            const exp=this._expectedFromResults(divisionId,throughRound); errors.push(...exp.errors.map(e=>`${label}: ${e}`));
            const actual=CalcEngine.calculateStanding(divisionId,{throughRound}); const byId=new Map(actual.map(r=>[r.playerId,r]));
            exp.stats.forEach((st,id)=>{ const row=byId.get(id); if(!row) errors.push(`${label}: player ${id} has result history but is missing from standing.`); else if(!this._same(st,this._rowCore(row))) errors.push(`${label}: ${row.playerName||id} standing totals disagree with stored results.`); });
            checks.push(`${label}: ${exp.results.length} active result(s), ${actual.length} standing row(s)`);
            return actual;
        };
        compareScope(null,'PROVISIONAL');
        const locked=Storage.find('rounds',r=>r.divisionId===divisionId && r.status==='locked').sort((a,b)=>Number(a.roundNumber)-Number(b.roundNumber));
        locked.forEach(round=>{
            const rows=compareScope(Number(round.roundNumber),`R${round.roundNumber}`);
            const currents=Storage.find('standingSnapshots',x=>x.divisionId===divisionId && Number(x.throughRound)===Number(round.roundNumber) && x.status==='current');
            if(currents.length!==1) errors.push(`R${round.roundNumber}: expected exactly one CURRENT official snapshot, found ${currents.length}.`);
            else {
                const snap=currents[0], liveById=new Map(rows.map(r=>[r.playerId,r]));
                (snap.rows||[]).forEach(sr=>{ const lr=liveById.get(sr.playerId); if(!lr || !this._same(this._rowCore(sr),this._rowCore(lr))) errors.push(`R${round.roundNumber}: snapshot totals disagree for ${sr.playerName||sr.playerId}.`); });
                if ((snap.rows||[]).length!==rows.length) errors.push(`R${round.roundNumber}: snapshot row count disagrees with through-round standing.`);
            }
        });
        return {ok:errors.length===0,errors,checks,lockedRoundCount:locked.length};
    },
    runSelfTest() {
        const errors=[];
        const a={gamesPlayed:2,wins:1,ties:0,losses:1,matchPoints:1,scoreFor:754,scoreAgainst:852,sumRawSpread:-98,sumOfficialSpread:-98};
        const b={...a}; if(!this._same(a,b)) errors.push('Equal standing totals were rejected.');
        b.sumOfficialSpread=-97; if(this._same(a,b)) errors.push('Standing mismatch was not detected.');
        const calc=CalcEngine.calculateResult(410,409,350,true); if(calc.p1Result!=='W'||calc.officialSpread1!==1||calc.officialSpread2!==-1) errors.push('Score → result/spread arithmetic failed.');
        return {ok:errors.length===0,errors,message:errors.length?errors.join(' '):'Result → Standing verifier arithmetic and mismatch detection PASSED.'};
    }
};

// ============================================================
// CALCULATION ENGINE
// ============================================================
const CalcEngine = {
    calculateResult(p1Score, p2Score, spreadLimit, allowTies) {
        const rawSpread1 = p1Score - p2Score;
        const rawSpread2 = -rawSpread1;
        const officialSpread1 = Math.max(-spreadLimit, Math.min(spreadLimit, rawSpread1));
        const officialSpread2 = -officialSpread1;

        let p1Result, p2Result, winnerId = null, loserId = null;
        if (p1Score > p2Score) { p1Result = 'W'; p2Result = 'L'; }
        else if (p1Score < p2Score) { p1Result = 'L'; p2Result = 'W'; }
        else {
            if (!allowTies) return { error: 'Tied scores are not permitted in this Division.' };
            p1Result = 'T'; p2Result = 'T';
        }
        return { rawSpread1, rawSpread2, officialSpread1, officialSpread2, p1Result, p2Result, spreadLimit };
    },

    calculateStanding(divisionId, options = {}) {
        const throughRound = options.throughRound === null || options.throughRound === undefined
            ? null
            : Number(options.throughRound);

        const allDivisionResults = Storage.find('matchResults', r => r.divisionId === divisionId);

        let scopedResults = allDivisionResults;
        if (Number.isFinite(throughRound)) {
            const allowedRoundIds = new Set(
                Storage.find('rounds', r =>
                    r.divisionId === divisionId &&
                    Number(r.roundNumber) <= throughRound
                ).map(r => r.roundId)
            );
            scopedResults = allDivisionResults.filter(r => allowedRoundIds.has(r.roundId));
        }

        const participantResolution = StandingParticipantResolver.resolveFromData(
            RegistrationService.getByDivision(divisionId),
            scopedResults
        );
        const regs = participantResolution.included.map(x => x.registration);
        const participantMetaByRegistrationId = new Map(
            participantResolution.included.map(x => [x.registrationId, x])
        );
        const results = scopedResults.filter(r => r.status !== 'voided');

        const rankingResolution = RankingRuleService.getForDivision(divisionId);
        const rankingRuleSet = rankingResolution.ruleSet;

        const playerStats = {};
        regs.forEach(reg => {
            const player = Storage.getById('players', 'playerId', reg.playerId);
            playerStats[reg.playerId] = {
                playerId: reg.playerId,
                registrationId: reg.registrationId,
                tournamentPlayerCode: reg.tournamentPlayerCode || '',
                playerName: CompetitionEntryService.compactName(reg),
                schoolOrClub: reg.affiliationAtEntry || '',
                seed: reg.seed || 9999,
                participationStatus: participantMetaByRegistrationId.get(reg.registrationId)?.classification || 'not_participating',
                entryStatus: reg.entryStatus || '',
                checkInStatus: reg.checkInStatus || '',
                pairingEligibleNow: participantMetaByRegistrationId.get(reg.registrationId)?.eligibleForPairing || false,
                gamesPlayed: 0, wins: 0, ties: 0, losses: 0, matchPoints: 0,
                scoreFor: 0, scoreAgainst: 0, sumRawSpread: 0, sumOfficialSpread: 0
            };
        });

        results.forEach(r => {
            if (r.resultType === 'void') return;
            const s1 = playerStats[r.player1Id];
            const s2 = playerStats[r.player2Id];
            if (r.resultType === 'double_walkover') {
                if (s1) {
                    const x=DoubleWalkoverStandingExecutionService.applyToStats(s1,r,1);
                    if(!x.ok) console.error('DOUBLE WALKOVER standing execution blocked:',r.resultId,x.errors);
                }
                if (s2) {
                    const x=DoubleWalkoverStandingExecutionService.applyToStats(s2,r,2);
                    if(!x.ok) console.error('DOUBLE WALKOVER standing execution blocked:',r.resultId,x.errors);
                }
                return;
            }
            if (s1) {
                const isBye = r.resultType === 'bye' || r.pairingType === 'bye';
                if (isBye) {
                    const byeExec = ByeStandingExecutionService.applyToStats(s1, r, rankingRuleSet);
                    if (!byeExec.ok) {
                        console.error('BYE standing execution blocked:', r.resultId, byeExec.errors);
                    }
                } else {
                    s1.gamesPlayed++;
                    s1.scoreFor += (r.player1Score || 0);
                    s1.scoreAgainst += (r.player2Score || 0);
                    s1.sumRawSpread += (r.rawSpreadPlayer1 || 0);
                    s1.sumOfficialSpread += (r.officialSpreadPlayer1 || 0);
                    if (r.player1Result === 'W') s1.wins++;
                    else if (r.player1Result === 'T') s1.ties++;
                    else if (r.player1Result === 'L') s1.losses++;
                    s1.matchPoints += RankingRuleService.matchPointsFor(r.player1Result, rankingRuleSet);
                }
            }
            if (s2 && r.pairingType !== 'bye' && r.resultType !== 'bye') {
                s2.gamesPlayed++;
                s2.scoreFor += (r.player2Score || 0);
                s2.scoreAgainst += (r.player1Score || 0);
                s2.sumRawSpread += (r.rawSpreadPlayer2 || 0);
                s2.sumOfficialSpread += (r.officialSpreadPlayer2 || 0);
                if (r.player2Result === 'W') s2.wins++;
                else if (r.player2Result === 'T') s2.ties++;
                else if (r.player2Result === 'L') s2.losses++;
                s2.matchPoints += RankingRuleService.matchPointsFor(r.player2Result, rankingRuleSet);
            }
        });

        const rows = RankingRuleService.sortRows(Object.values(playerStats), rankingRuleSet);
        rows.forEach((r, i) => {
            r.rank = i + 1;
            r.rankingRuleSetId = rankingRuleSet.rankingRuleSetId || null;
            r.rankingRuleVersion = Number(rankingRuleSet.version || 1);
        });

        Object.defineProperty(rows, '_rankingMeta', {
            value: {
                rankingRuleSetId: rankingRuleSet.rankingRuleSetId || null,
                rankingRuleVersion: Number(rankingRuleSet.version || 1),
                rankingRuleName: rankingRuleSet.name || '',
                fallbackUsed: Boolean(rankingRuleSet._fallback),
                warnings: (rankingResolution.warnings || []).concat(participantResolution.warnings || []),
                participantCounts: participantResolution.counts,
                throughRound: Number.isFinite(throughRound) ? throughRound : null,
                scopedResultCount: results.length
            },
            enumerable: false
        });

        return rows;
    },

    integrityCheck(divisionId, roundNumber) {
        const results = Storage.find('matchResults', r => r.divisionId === divisionId && r.roundNumber === roundNumber && r.status !== 'voided' && ['normal','walkover','forfeit','double_walkover'].includes(r.resultType));
        const errors = [];
        let totalWins = 0, totalLosses = 0, totalSpread = 0, totalRawSpread = 0;
        results.forEach(r => {
            if (r.resultType==='double_walkover') {
                const d=DoubleWalkoverStandingExecutionService.resolve(r);
                if(!d.ok) errors.push(...d.errors.map(e=>`Result ${r.resultId}: ${e}`));
                return;
            }
            if (r.player1Result === 'W') totalWins++;
            if (r.player2Result === 'W') totalWins++;
            if (r.player1Result === 'L') totalLosses++;
            if (r.player2Result === 'L') totalLosses++;
            totalSpread += (r.officialSpreadPlayer1 || 0) + (r.officialSpreadPlayer2 || 0);
            totalRawSpread += (r.rawSpreadPlayer1 || 0) + (r.rawSpreadPlayer2 || 0);
            if ((r.rawSpreadPlayer1||0) + (r.rawSpreadPlayer2||0) !== 0) errors.push(`Result ${r.resultId}: raw spread does not sum to 0`);
            if ((r.officialSpreadPlayer1||0) + (r.officialSpreadPlayer2||0) !== 0) errors.push(`Result ${r.resultId}: official spread does not sum to 0`);
            if (Math.abs(r.officialSpreadPlayer1||0) > (r.spreadLimitUsed||350)) errors.push(`Result ${r.resultId}: spread exceeds limit`);
        });
        if (totalWins !== totalLosses) errors.push(`Wins (${totalWins}) ≠ Losses (${totalLosses})`);
        if (totalSpread !== 0) errors.push(`Total official spread ≠ 0 (${totalSpread})`);
        return errors;
    }
};
